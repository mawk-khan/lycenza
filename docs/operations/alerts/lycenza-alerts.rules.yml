# Lycenza production alert rules -- GENERATED by `php artisan platform:alerts-export`
# from App\Support\Observability\Alerts\AlertCatalog (ADR 0051 section 14). Do not edit by hand.
# Provider-neutral Prometheus rule format; notification routing is a deployment decision.
groups:
  - name: lycenza-obs
    rules:
      - alert: LycenzaOBS01Critical
        expr: 'absent(lycenza_readiness_status) or min(lycenza_readiness_status) == 0'
        for: 120s
        labels:
          severity: critical
          sev: SEV-1
          obs_id: OBS-01
          threshold_source: 'C'
        annotations:
          summary: 'Web readiness failing: the application cannot serve traffic.'
          runbook: 'docs/operations/MAINTENANCE-WINDOW-RELEASE.md'
      - alert: LycenzaOBS02Critical
        expr: 'lycenza_readiness_status{dependency="postgresql"} == 0'
        for: 120s
        labels:
          severity: critical
          sev: SEV-1
          obs_id: OBS-02
          threshold_source: 'C'
        annotations:
          summary: 'PostgreSQL unavailable to the application.'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      - alert: LycenzaOBS03Critical
        expr: 'lycenza_readiness_status{dependency="redis"} == 0'
        for: 120s
        labels:
          severity: critical
          sev: SEV-1
          obs_id: OBS-03
          threshold_source: 'C'
        annotations:
          summary: 'Redis unavailable to the application.'
          runbook: 'docs/operations/REDIS-LOSS-RECOVERY.md'
      - alert: LycenzaOBS04Warning
        expr: 'lycenza_ai_gateway_ready == 0'
        for: 600s
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-04
          threshold_source: 'C'
        annotations:
          summary: 'AI Gateway not ready (optional subsystem; never pages).'
          runbook: 'docs/operations/PRODUCTION-IMAGES-AND-PROCESSES.md'
      - alert: LycenzaOBS05High
        expr: 'min by () (time() - lycenza_scheduler_task_last_success_timestamp_seconds{scheduled_task=~"outbox-dispatch|webhook-deliveries-redispatch|communication-deliveries-redispatch|communications-publish-scheduled|automation-executions-redispatch|expire-school-elevations|worker-canaries|domains-check|email-messages-redispatch"}) > 300 or absent(lycenza_scheduler_task_last_success_timestamp_seconds{scheduled_task=~"outbox-dispatch|webhook-deliveries-redispatch|communication-deliveries-redispatch|communications-publish-scheduled|automation-executions-redispatch|expire-school-elevations|worker-canaries|domains-check|email-messages-redispatch"})'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-05
          threshold_source: 'B'
        annotations:
          summary: 'Scheduler stopped: every minute-cadence task heartbeat is stale.'
          runbook: 'docs/operations/MAINTENANCE-WINDOW-RELEASE.md'
      - alert: LycenzaOBS05Critical
        expr: 'min by () (time() - lycenza_scheduler_task_last_success_timestamp_seconds{scheduled_task=~"outbox-dispatch|webhook-deliveries-redispatch|communication-deliveries-redispatch|communications-publish-scheduled|automation-executions-redispatch|expire-school-elevations|worker-canaries|domains-check|email-messages-redispatch"}) > 1800'
        labels:
          severity: critical
          sev: SEV-1
          obs_id: OBS-05
          threshold_source: 'B'
        annotations:
          summary: 'Scheduler stopped: every minute-cadence task heartbeat is stale.'
          runbook: 'docs/operations/MAINTENANCE-WINDOW-RELEASE.md'
      - alert: LycenzaOBS06Warning
        expr: '(time() - lycenza_scheduler_task_last_success_timestamp_seconds{scheduled_task=~"outbox-dispatch|webhook-deliveries-redispatch|communication-deliveries-redispatch|communications-publish-scheduled|automation-executions-redispatch|expire-school-elevations|worker-canaries|domains-check|email-messages-redispatch"}) > 300 or (time() - lycenza_scheduler_task_last_success_timestamp_seconds{scheduled_task=~"idempotency-prune|webhook-deliveries-prune|email-prune|account-recovery-prune|staff-account-credentials-prune|outbox-prune|failed-jobs-prune"}) > 93600'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-06
          threshold_source: 'B'
        annotations:
          summary: 'A scheduled task is stale while the scheduler runs.'
          runbook: 'docs/operations/PRODUCTION-IMAGES-AND-PROCESSES.md'
      - alert: LycenzaOBS07Warning
        expr: 'max by (scheduled_task) (rate(lycenza_scheduler_task_runs_total{outcome="success",scheduled_task=~"outbox-dispatch|webhook-deliveries-redispatch|communication-deliveries-redispatch|communications-publish-scheduled|automation-executions-redispatch|expire-school-elevations|worker-canaries|domains-check|email-messages-redispatch"}[10m])) * 60 > 1.5'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-07
          threshold_source: 'B'
        annotations:
          summary: 'Duplicate scheduler suspected: minute tasks run more than ~1.5x per minute.'
          runbook: 'docs/operations/PRODUCTION-IMAGES-AND-PROCESSES.md'
      - alert: LycenzaOBS08High
        expr: '(time() - lycenza_queue_heartbeat_last_success_timestamp_seconds) > 300 or absent(lycenza_queue_heartbeat_last_success_timestamp_seconds{queue="default"}) or absent(lycenza_queue_heartbeat_last_success_timestamp_seconds{queue="integrations"}) or absent(lycenza_queue_heartbeat_last_success_timestamp_seconds{queue="notifications"})'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-08
          threshold_source: 'B'
        annotations:
          summary: 'A required worker class is not processing (canary heartbeat stale).'
          runbook: 'docs/operations/PRODUCTION-IMAGES-AND-PROCESSES.md'
      - alert: LycenzaOBS09Warning
        expr: 'max(lycenza_queue_oldest_pending_age_seconds) > 300'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-09
          threshold_source: 'B'
        annotations:
          summary: 'Oldest queued job is too old.'
          runbook: 'docs/operations/FAILED-JOBS.md'
      - alert: LycenzaOBS09High
        expr: 'max(lycenza_queue_oldest_pending_age_seconds) > 1800'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-09
          threshold_source: 'B'
        annotations:
          summary: 'Oldest queued job is too old.'
          runbook: 'docs/operations/FAILED-JOBS.md'
      - alert: LycenzaOBS10Warning
        expr: 'sum(increase(lycenza_queue_jobs_failed_total[15m])) > 0'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-10
          threshold_source: 'B'
        annotations:
          summary: 'Jobs failed permanently.'
          runbook: 'docs/operations/FAILED-JOBS.md'
      - alert: LycenzaOBS11Warning
        expr: 'lycenza_outbox_oldest_pending_age_seconds > 300'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-11
          threshold_source: 'B'
        annotations:
          summary: 'Outbox dispatch backlog.'
          runbook: 'docs/operations/REDIS-LOSS-RECOVERY.md'
      - alert: LycenzaOBS11High
        expr: 'lycenza_outbox_oldest_pending_age_seconds > 1800'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-11
          threshold_source: 'B'
        annotations:
          summary: 'Outbox dispatch backlog.'
          runbook: 'docs/operations/REDIS-LOSS-RECOVERY.md'
      - alert: LycenzaOBS12High
        expr: '(time() - lycenza_reconciliation_last_success_timestamp_seconds{recovery_source="outbox"}) > 300 or absent(lycenza_reconciliation_last_success_timestamp_seconds{recovery_source="outbox"}) or increase(lycenza_reconciliation_runs_total{recovery_source="outbox",outcome="failure"}[5m]) > 0'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-12
          threshold_source: 'B'
        annotations:
          summary: 'Outbox reconciliation not succeeding.'
          runbook: 'docs/operations/REDIS-LOSS-RECOVERY.md'
      - alert: LycenzaOBS13Warning
        expr: 'lycenza_outbox_stale_events > 0'
        for: 1800s
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-13
          threshold_source: 'B'
        annotations:
          summary: 'Stale unacknowledged outbox events persist beyond reconciliation.'
          runbook: 'docs/operations/REDIS-LOSS-RECOVERY.md'
      - alert: LycenzaOBS14High
        expr: 'delta(lycenza_outbox_failed_events[1h]) > 0'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-14
          threshold_source: 'B'
        annotations:
          summary: 'Outbox events exhausted (failed, terminal).'
          runbook: 'docs/operations/REDIS-LOSS-RECOVERY.md'
      - alert: LycenzaOBS15Warning
        expr: 'lycenza_webhook_oldest_overdue_age_seconds > 300'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-15
          threshold_source: 'B'
        annotations:
          summary: 'Webhook deliveries overdue (eligible, not picked up).'
          runbook: 'docs/operations/WEBHOOK-FAILURES.md'
      - alert: LycenzaOBS15High
        expr: 'lycenza_webhook_oldest_overdue_age_seconds > 1800'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-15
          threshold_source: 'B'
        annotations:
          summary: 'Webhook deliveries overdue (eligible, not picked up).'
          runbook: 'docs/operations/WEBHOOK-FAILURES.md'
      # OBS-16 DISABLED: operator value ALERT_WEBHOOK_FINAL_FAILURES_PER_HOUR not set
      - alert: LycenzaOBS17Warning
        expr: 'lycenza_communication_oldest_overdue_age_seconds > 300'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-17
          threshold_source: 'B'
        annotations:
          summary: 'Communication deliveries overdue (eligible, not picked up).'
          runbook: 'docs/operations/COMMUNICATION-FAILURES.md'
      - alert: LycenzaOBS17High
        expr: 'lycenza_communication_oldest_overdue_age_seconds > 1800'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-17
          threshold_source: 'B'
        annotations:
          summary: 'Communication deliveries overdue (eligible, not picked up).'
          runbook: 'docs/operations/COMMUNICATION-FAILURES.md'
      # OBS-18 DISABLED: operator value ALERT_COMMUNICATION_FAILURE_RATIO_PER_HOUR not set
      - alert: LycenzaOBS19Warning
        expr: '(time() - lycenza_reconciliation_last_success_timestamp_seconds{recovery_source="automation"}) > 300 or lycenza_automation_oldest_overdue_age_seconds > 300'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-19
          threshold_source: 'B'
        annotations:
          summary: 'Automation recovery not running or executions overdue.'
          runbook: 'docs/operations/../modules/AUTOMATION.md'
      - alert: LycenzaOBS19High
        expr: 'lycenza_automation_oldest_overdue_age_seconds > 1800'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-19
          threshold_source: 'B'
        annotations:
          summary: 'Automation recovery not running or executions overdue.'
          runbook: 'docs/operations/../modules/AUTOMATION.md'
      - alert: LycenzaOBS20High
        expr: '(time() - lycenza_backup_recovery_point_timestamp_seconds{backup_store="postgresql"}) > 600 or absent(lycenza_backup_recovery_point_timestamp_seconds{backup_store="postgresql"})'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-20
          threshold_source: 'A'
        annotations:
          summary: 'PostgreSQL recovery point too old (protects RPO <= 15 min).'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      - alert: LycenzaOBS20Critical
        expr: '(time() - lycenza_backup_recovery_point_timestamp_seconds{backup_store="postgresql"}) > 900'
        labels:
          severity: critical
          sev: SEV-1
          obs_id: OBS-20
          threshold_source: 'A'
        annotations:
          summary: 'PostgreSQL recovery point too old (protects RPO <= 15 min).'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      - alert: LycenzaOBS21High
        expr: '(time() - lycenza_backup_last_success_timestamp_seconds{backup_store="postgresql"}) > 93600 or absent(lycenza_backup_last_success_timestamp_seconds{backup_store="postgresql"}) or lycenza_backup_last_failure_timestamp_seconds{backup_store="postgresql"} > lycenza_backup_last_success_timestamp_seconds{backup_store="postgresql"}'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-21
          threshold_source: 'A/C'
        annotations:
          summary: 'PostgreSQL base backup stale or failed.'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      - alert: LycenzaOBS21Critical
        expr: '(time() - lycenza_backup_last_success_timestamp_seconds{backup_store="postgresql"}) > 180000'
        labels:
          severity: critical
          sev: SEV-1
          obs_id: OBS-21
          threshold_source: 'A/C'
        annotations:
          summary: 'PostgreSQL base backup stale or failed.'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      - alert: LycenzaOBS22High
        expr: '(time() - lycenza_backup_last_success_timestamp_seconds{backup_store="objects"}) > 72000 or absent(lycenza_backup_last_success_timestamp_seconds{backup_store="objects"}) or lycenza_backup_last_failure_timestamp_seconds{backup_store="objects"} > lycenza_backup_last_success_timestamp_seconds{backup_store="objects"}'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-22
          threshold_source: 'A'
        annotations:
          summary: 'Independent object-storage copy stale or failed (protects RPO <= 24 h).'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      - alert: LycenzaOBS22Critical
        expr: '(time() - lycenza_backup_last_success_timestamp_seconds{backup_store="objects"}) > 86400'
        labels:
          severity: critical
          sev: SEV-1
          obs_id: OBS-22
          threshold_source: 'A'
        annotations:
          summary: 'Independent object-storage copy stale or failed (protects RPO <= 24 h).'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      - alert: LycenzaOBS23Warning
        expr: '(time() - lycenza_restore_drill_last_success_timestamp_seconds) > 7948800 or absent(lycenza_restore_drill_last_success_timestamp_seconds)'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-23
          threshold_source: 'A'
        annotations:
          summary: 'Restore drill overdue or failed (quarterly contract).'
          runbook: 'docs/operations/RESTORE-DRILL-RECORD.md'
      - alert: LycenzaOBS23High
        expr: '(time() - lycenza_restore_drill_last_success_timestamp_seconds) > 10368000 or lycenza_restore_drill_last_result == 0'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-23
          threshold_source: 'A'
        annotations:
          summary: 'Restore drill overdue or failed (quarterly contract).'
          runbook: 'docs/operations/RESTORE-DRILL-RECORD.md'
      - alert: LycenzaOBS24High
        expr: 'lycenza_verification_last_result{check="verify_storage"} == 0'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-24
          threshold_source: 'B'
        annotations:
          summary: 'Object-storage validation failing.'
          runbook: 'docs/operations/BACKUP-AND-RESTORE.md'
      # OBS-25 DISABLED: operator value ALERT_SECURITY_REJECTIONS_PER_15M not set
      - alert: LycenzaOBS26High
        expr: 'up{job="lycenza-metrics"} == 0 or increase(lycenza_metrics_collection_errors_total[15m]) > 0'
        for: 300s
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-26
          threshold_source: 'C'
        annotations:
          summary: 'Telemetry collection failing.'
          runbook: 'docs/operations/TELEMETRY-COLLECTION.md'
      - alert: LycenzaOBS27Warning
        expr: 'sum(increase(lycenza_service_auth_total{outcome=~"unknown_kid|bad_signature|key_expired|rejected_by_receiver"}[15m])) > 0'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-27
          threshold_source: 'A'
        annotations:
          summary: 'Service-to-service authentication failing, or a service key near its 90-day limit.'
          runbook: 'docs/operations/SERVICE-KEY-ROTATION.md'
      - alert: LycenzaOBS27WarningKeyAge
        expr: 'max(lycenza_service_signing_key_age_days) >= 76 or max(lycenza_service_verification_key_max_age_days) >= 76'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-27
          threshold_source: 'A'
        annotations:
          summary: 'Service-to-service authentication failing, or a service key near its 90-day limit.'
          runbook: 'docs/operations/SERVICE-KEY-ROTATION.md'
      - alert: LycenzaOBS28Warning
        expr: 'sum(increase(lycenza_domain_transitions_total{to="suspended"}[1h])) > 0'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-28
          threshold_source: 'A'
        annotations:
          summary: 'A custom School domain was suspended (ownership, routing or TLS drift confirmed).'
          runbook: 'docs/operations/CUSTOM-DOMAINS.md'
      - alert: LycenzaOBS29Warning
        expr: 'min(lycenza_domain_certificate_min_days_remaining) <= 21'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-29
          threshold_source: 'A'
        annotations:
          summary: 'An active custom domain''s certificate is close to expiry (edge renewal not happening).'
          runbook: 'docs/operations/CUSTOM-DOMAINS.md'
      - alert: LycenzaOBS29High
        expr: 'min(lycenza_domain_certificate_min_days_remaining) <= 7'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-29
          threshold_source: 'A'
        annotations:
          summary: 'An active custom domain''s certificate is close to expiry (edge renewal not happening).'
          runbook: 'docs/operations/CUSTOM-DOMAINS.md'
      - alert: LycenzaOBS30Warning
        expr: 'max(lycenza_domain_indeterminate_max_age_seconds) >= 259200'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-30
          threshold_source: 'A'
        annotations:
          summary: 'Custom-domain checks indeterminate for 3 days (resolver or network trouble; never suspends).'
          runbook: 'docs/operations/CUSTOM-DOMAINS.md'
      - alert: LycenzaOBS31High
        expr: 'max(lycenza_email_oldest_pending_age_seconds{message_class=~"account_invitation|account_recovery|security_notice|staff_account_invitation"}) > 1800'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-31
          threshold_source: 'B'
        annotations:
          summary: 'Critical email (account invitations) waiting too long to reach the provider.'
          runbook: 'docs/operations/EMAIL-DELIVERABILITY.md'
      - alert: LycenzaOBS32Warning
        expr: 'max(lycenza_email_oldest_pending_age_seconds{message_class="school_communication"}) > 1800'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-32
          threshold_source: 'B'
        annotations:
          summary: 'Standard email (School communications) backlog too old.'
          runbook: 'docs/operations/EMAIL-DELIVERABILITY.md'
      # OBS-33 DISABLED: operator value ALERT_EMAIL_FAILURE_RATIO_PER_HOUR not set
      - alert: LycenzaOBS34High
        expr: 'sum(increase(lycenza_email_submission_attempts_total{outcome="auth_failure"}[15m])) > 0'
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-34
          threshold_source: 'A'
        annotations:
          summary: 'Email provider refusing the configured credentials or TLS (sending paused).'
          runbook: 'docs/operations/EMAIL-DELIVERABILITY.md'
      - alert: LycenzaOBS35Warning
        expr: '(time() - max(lycenza_email_last_event_timestamp_seconds)) > 86400 and sum(increase(lycenza_email_messages_total{outcome="submitted"}[1h])) > 0'
        labels:
          severity: warning
          sev: SEV-3
          obs_id: OBS-35
          threshold_source: 'A'
        annotations:
          summary: 'No provider email events while email is being submitted (event feed stale).'
          runbook: 'docs/operations/EMAIL-DELIVERABILITY.md'
      # OBS-36 DISABLED: operator value ALERT_EMAIL_HARD_BOUNCES_PER_HOUR not set
      # OBS-37 DISABLED: operator value ALERT_EMAIL_COMPLAINTS_PER_HOUR not set
      # OBS-38 DISABLED: operator value ALERT_EMAIL_WEBHOOK_AUTH_FAILURES_PER_15M not set
      # OBS-39 DISABLED: operator value ALERT_ACCOUNT_RECOVERY_REQUESTS_PER_HOUR not set
      # OBS-40 DISABLED: operator value ALERT_ACCOUNT_RECOVERY_INVALID_RESETS_PER_HOUR not set
      - alert: LycenzaOBS41High
        expr: 'max(lycenza_account_recovery_enabled{state="enabled"}) == 1 and max(lycenza_account_recovery_enabled{state="available"}) == 0'
        for: 300s
        labels:
          severity: high
          sev: SEV-2
          obs_id: OBS-41
          threshold_source: 'A'
        annotations:
          summary: 'Account recovery is enabled but critical email is unavailable (no recovery email can be sent).'
          runbook: 'docs/operations/ACCOUNT-RECOVERY.md'
