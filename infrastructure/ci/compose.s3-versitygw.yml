# E03.1 (ADR 0072 section 11): the S3-compatible test server for environments
# that cannot pull MinIO. MinIO's public images were withdrawn in 2026-09
# (verify-images.sh already moved to versitygw for the same reason), so a fresh
# CI runner cannot start docker-compose.yml's `minio` service. This override
# keeps the service NAMES (`minio`, `minio-init`) so every consumer --
# docker-compose.yml's `AWS_ENDPOINT: http://minio:9000`, bin/safe-test's
# `compose up -d postgres redis minio platform` -- is unchanged, and swaps only
# the server: versitygw (Apache-2.0, digest-pinned, POSIX backend) on port
# 9000 with the same local-only credentials and region as
# apps/platform/.env.example (ADR 0016: inert, never a real provider; a
# region mismatch makes every signed request fail with HTTP 400). A
# POSIX-backend bucket is a top-level directory, so `minio-init` creates
# `school-os-local` with mkdir.
#
# Used by CI's backend lane through SAFE_TEST_COMPOSE_OVERRIDE (bin/safe-test);
# a developer whose cached MinIO image is gone can use it the same way.
services:
  minio:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    command: ["--port", ":9000", "--region", "ap-south-1", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: school_os
      ROOT_SECRET_KEY: school_os_secret
    healthcheck:
      test: ["CMD", "busybox", "nc", "-z", "127.0.0.1", "9000"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio-init:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["busybox", "mkdir", "-p", "/data/school-os-local"]
    command: !reset []
    volumes:
      - minio_data:/data
