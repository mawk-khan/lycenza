condition = "AND"
paths = ['''^/image/var/www/app/vendor/aws/aws-sdk-php/src/data/s3/2006-03-01/api-2\.json\.php$''']
regexTarget = "secret"
regexes = ['''^v4-unsigned-body$''']

[[rules.allowlists]]
