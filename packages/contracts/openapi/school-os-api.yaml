      properties:
        employment_record_id: { type: string, format: uuid }
        leave_type_id: { type: string, format: uuid }
        leave_year_id: { type: string, format: uuid }
        units: { type: integer, minimum: 1, description: "Integer half-day units (2 = one full day)." }
    LeaveAllocationRunInput:
