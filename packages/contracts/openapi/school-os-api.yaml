      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SalaryStructureDetail" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School id.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/salary-structures/{salaryStructureId}/components:
    post:
      operationId: addSalaryStructureComponent
      summary: >
        Adds one formula line (fixed_amount or percentage_of_base) to a
        DRAFT structure -- frozen once the structure is activated.
        Requires payroll.structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/SalaryStructureId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalaryStructureComponentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SalaryStructureComponent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School salary structure id.
        "422":
          description: Validation failure (structure not draft, invalid shape, cycle).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/salary-structures/{salaryStructureId}/activate:
    post:
      operationId: activateSalaryStructure
      summary: >
        Activates a draft structure, superseding whatever was
        previously active for the same code (ADR 0034). Requires
        payroll.structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/SalaryStructureId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SalaryStructureSummary" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School id.
        "409":
          description: Concurrent activation conflict, or the structure is not in draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employment-records/{employmentRecordId}/compensation-assignments:
    get:
      operationId: listCompensationAssignments
      summary: >
        Lists an EmploymentRecord's compensation assignment history --
        identity and effective dates ONLY, never an amount (ADR 0034
        "Sensitive values"). Requires payroll.compensation.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmploymentRecordId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/CompensationAssignmentSummary" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.compensation.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: assignCompensation
      summary: >
        Assigns compensation for an EmploymentRecord against an ACTIVE
        salary structure -- Highly Sensitive (writes actual per-component
        amounts). Requires payroll.compensation.sensitive.manage
        (granted to no default role).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmploymentRecordId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompensationAssignmentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CompensationAssignmentSummary" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.compensation.sensitive.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School EmploymentRecord/salary structure id.
        "409":
          description: Overlapping assignment for this EmploymentRecord.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure (structure not active, missing/extra fixed values, wrong component type).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/compensation-assignments/{compensationAssignmentId}/values:
    get:
      operationId: getCompensationAssignmentValues
      summary: >
        Fetch one compensation assignment's actual per-component fixed
        amounts -- Highly Sensitive. Requires
        payroll.compensation.sensitive.view (granted to no default
        role). Audited exactly once per successful call; a denied
        attempt leaves no audit trail.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CompensationAssignmentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/CompensationAssignmentValue" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.compensation.sensitive.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: PAYROLL_COMPENSATION_ASSIGNMENT_NOT_FOUND -- nonexistent or belongs to a different School (identical response either way).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-periods:
    post:
      operationId: createPayrollPeriod
      summary: >
        Creates a monthly payroll period (identity is period_month;
        starts_on/ends_on derived). Requires payroll.periods.manage.
