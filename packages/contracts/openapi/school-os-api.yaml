    post:
      operationId: createSyllabusUnit
      summary: >
        Adds one SyllabusUnit to a SubjectOffering. `code` is
        normalized to uppercase before validation and is
        case-insensitively unique WITHIN that Offering -- the same
        normalized code may legitimately exist under a different
        Offering. Requires syllabus.manage. No Idempotency-Key is
        needed: duplicate semantic creation is already prevented by the
        database's own unique index.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subjectOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyllabusUnitCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SyllabusUnit" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking syllabus.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SubjectOffering in this School.
        "422":
          description: >
            Validation failure -- missing/oversized code or title, a
            negative sequence, an out-of-vocabulary status, or a
            case-insensitive duplicate code within this Offering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/syllabus-units/{syllabusUnitId}:
    get:
      operationId: getSyllabusUnit
      summary: One SyllabusUnit. Requires syllabus.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: syllabusUnitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SyllabusUnit" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking syllabus.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SyllabusUnit in this School.
    patch:
      operationId: updateSyllabusUnit
      summary: >
        Updates a SyllabusUnit's code, title, sequence and/or status.
        This is ALSO how a unit is retired or reinstated -- `status` is
        an ordinary field here, and there is deliberately no separate
        activate/deactivate operation. A syntactically valid no-op
        returns the current representation. Requires syllabus.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: syllabusUnitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyllabusUnitUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SyllabusUnit" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking syllabus.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SyllabusUnit in this School.
        "422":
          description: >
            Validation failure -- oversized code/title, negative
            sequence, out-of-vocabulary status, or a case-insensitive
            duplicate code within this unit's Offering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  # Phase 0I.2 (Learning Content Foundation -- the first concrete LMS
  # fact, ADR 0039). Exactly SIX operations: list/create nested under
  # the owning SubjectOffering, show/update flat, publish/archive as
  # dedicated action routes -- `status` moves ONLY through those two,
  # never through the ordinary PATCH (the CurriculumDelivery-style
  # split, not SyllabusUnit's plain-status-field one).
  #
  # No delete, no Assignment or Submission operation of any kind --
  # those remain future, separately-gated checkpoints.
  #
  # Capabilities are rooted at `lms.content.*`, NOT `academics.*` -- see
  # docs/modules/LMS.md for the module boundary.
  #
  # LearningContent was Confidential at Phase 0I and is Sensitive since
  # TCH.5B (docs/security/DATA-CLASSIFICATION.md): a teacher-owned row
  # stores an owner Employee and a Section audience. No Student or Guardian
  # identity appears in any schema below, the owner Employee is never
  # serialized, and no grading, marks, assignment or submission field
  # exists anywhere.
  /schools/{schoolId}/subject-offerings/{subjectOfferingId}/learning-content:
    get:
      operationId: listLearningContent
      summary: >
        Lists a SubjectOffering's Learning Content in display order
        (sequence, then creation order). Requires lms.content.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subjectOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LearningContent" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SubjectOffering in this School.
    post:
      operationId: createLearningContent
      summary: >
        Adds one Learning Content resource to a SubjectOffering. Always
        created `draft`. Requires lms.content.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subjectOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningContentCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/LearningContent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SubjectOffering in this School.
        "422":
          description: Validation failure -- missing/oversized title, oversized description, or a negative sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/learning-content/{learningContentId}:
    get:
      operationId: getLearningContent
      summary: One LearningContent resource. Requires lms.content.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: learningContentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/LearningContent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such LearningContent in this School.
    patch:
      operationId: updateLearningContent
      summary: >
        Updates title, description and/or sequence -- ordinary field
        edits ONLY, at any status. This is NOT how content is published
        or archived; see the dedicated publish/archive operations
        below. Requires lms.content.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: learningContentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningContentUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/LearningContent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such LearningContent in this School.
        "422":
          description: Validation failure -- oversized title/description or a negative sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/learning-content/{learningContentId}/publish:
    post:
      operationId: publishLearningContent
      summary: >
        Makes this content the live/current one. Legal from `draft`
        (first publication) or `archived` (reinstatement) only -- both
        land on `published`. Requires lms.content.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: learningContentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/LearningContent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such LearningContent in this School.
        "422":
          description: Illegal transition -- already `published`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/learning-content/{learningContentId}/archive:
    post:
      operationId: archiveLearningContent
      summary: >
        Retires this content. Legal from `published` only -- the row is
        never deleted and can be published again later. Requires
        lms.content.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: learningContentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/LearningContent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such LearningContent in this School.
        "422":
          description: Illegal transition -- not currently `published`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/learning-content/{learningContentId}/documents:
    post:
      operationId: uploadLearningContentDocument
      summary: >
        Attaches a file to a LearningContent resource, via the shared
        Documents module's `learning_content` owner arm (ADR 0039
        decision 8). `classification_tier` is fixed to `internal`
        server-side and is not an accepted field -- a LearningContent
        Document has exactly one valid tier. Requires lms.content.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: learningContentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Document" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such LearningContent in this School.
        "422":
          description: Missing file, disallowed type, or oversized file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listLearningContentDocuments
      summary: >
        Lists Documents owned by one LearningContent resource. Requires
        lms.content.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: learningContentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Document" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking lms.content.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such LearningContent in this School.
  # Phase 0I.3 (Assignments -- the second concrete LMS fact, ADR 0039).
  # Exactly SIX operations, structurally identical to Learning Content's
  # own shape: list/create nested under the owning SubjectOffering,
  # show/update flat, publish/close as dedicated action routes --
  # `status` moves ONLY through those two, never through the ordinary
  # PATCH.
  #
  # No delete, no Submission operation of any kind -- Submission remains
  # a future, separately legal-review-gated checkpoint (ADR 0039 §4).
  #
  # Capabilities are rooted at `lms.assignments.*`, NOT `academics.*` --
  # see docs/modules/LMS.md for the module boundary.
  #
  # Assignment was Confidential at Phase 0I and is Sensitive since TCH.5B
  # (docs/security/DATA-CLASSIFICATION.md): a teacher-owned row stores an
  # owner Employee and a Section audience (never serialized). It holds NO
  # Student data and NO mark/score/grade field of any kind.
  # --- TCH.5C (ADR 0063 sections 34, 36): the OWNED teacher Learning
  # Content surface. Every operation requires lms.content.teacher AND a
  # verified ActingEmployee (today, School-local) AND the row's owner/audience
  # rule AND today's TeachingAssignment coverage:
  # - create: the owner is always the ActingEmployee (never input); every
  #   audience Section must be one the teacher teaches for the Offering;
  # - writes: owner-only, while the owner teaches EVERY audience Section;
  # - reads: own rows while teaching every audience Section; published
  #   teacher rows for ANY taught audience Section; published Offering-wide
  #   rows of a taught Offering.
  # Unreadable, unknown and other-School ids are the same 404. The audience
  # is immutable. Attachments use the Documents operations above, which
  # apply the same parent rule. The School-wide operations above are
  # unchanged. (Assignments gained their own owned surface in TCH.5D,
  # below.)
  /schools/{schoolId}/my/learning-content-contexts:
    get:
      operationId: listMyLearningContentContexts
      summary: >
        The Subject Offerings the teacher teaches today, each with only the
        Sections they teach (the audience picker).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MyLearningContentContext" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Lacking lms.content.teacher, or not an eligible Employee of this School today (HR_ACTING_EMPLOYEE_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /schools/{schoolId}/my/learning-content:
    get:
      operationId: listMyLearningContent
      summary: >
        Every Learning Content row the teacher may read, filtered on the
        server; optionally one Subject Offering. Fixed page size of 50.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subject_offering_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MyLearningContent" } }
                  meta: { $ref: "#/components/schemas/TimetablePaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Lacking lms.content.teacher, or not an eligible Employee of this School today (HR_ACTING_EMPLOYEE_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid query parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createMyLearningContent
      summary: >
        Creates a teacher-owned draft for one or more Sections the teacher
        teaches today in that Subject Offering. The owner is the teacher's
        own Employee record, set by the server.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MyLearningContentCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
