    StaffAttendanceRecordDetail:
      allOf:
        - { $ref: "#/components/schemas/StaffAttendanceRecord" }
        - type: object
          required: [corrections]
          properties:
            corrections: { type: array, items: { $ref: "#/components/schemas/StaffAttendanceCorrection" } }
    StaffAttendanceHalfView:
      type: object
      description: >
        HRX.3 -- one half's derived state. `state` is leave (approved leave covers it), else the recorded present/absent, else holiday / off_day from today's staff calendar, else unrecorded. `recorded` is the stored evidence underneath (kept even under leave); `calendar` is today's classification (null while the calendar is unconfigured). `leave` carries the request id and leave-type name only for a reader also holding hr.leave.view.
      required: [state, recorded, calendar, onLeave, leave]
      properties:
        state: { type: string, enum: [present, absent, leave, holiday, off_day, unrecorded] }
        recorded: { $ref: "#/components/schemas/StaffAttendanceHalfStatus" }
        calendar: { type: string, nullable: true, enum: [working, holiday, "off", null] }
        onLeave: { type: boolean }
        leave:
          type: object
          nullable: true
          required: [leaveRequestId, leaveTypeName]
          properties:
            leaveRequestId: { type: string, format: uuid }
            leaveTypeName: { type: string }
    StaffAttendanceDay:
      type: object
      required: [date, record, firstHalf, secondHalf, summary]
      properties:
        date: { type: string, format: date }
        record:
          type: object
          nullable: true
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
        firstHalf: { $ref: "#/components/schemas/StaffAttendanceHalfView" }
        secondHalf: { $ref: "#/components/schemas/StaffAttendanceHalfView" }
        summary: { type: string, enum: [present, absent, half_day_absent, on_leave, holiday, off_day, unrecorded, partially_recorded, mixed] }
    StaffAttendanceEmployment:
      type: object
      description: HRX.3 -- directory-tier labels only (no contact, HR profile, compensation or account field). `recordable` is true when initial recording is allowed today (active/notice_period of an active Employee).
      required: [employmentRecordId, employeeId, employeeNumber, fullName, status, recordable]
      properties:
        employmentRecordId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string, nullable: true }
        fullName: { type: string, nullable: true }
        status: { type: string }
        recordable: { type: boolean }
    StaffAttendanceRegister:
      type: object
      required: [date, calendarConfigured, calendar, rows]
      properties:
        date: { type: string, format: date }
        calendarConfigured: { type: boolean }
        calendar:
          type: object
          nullable: true
          required: [firstHalf, secondHalf]
          properties:
            firstHalf: { type: string, enum: [working, holiday, "off"] }
            secondHalf: { type: string, enum: [working, holiday, "off"] }
        rows:
          type: array
          items:
            type: object
            required: [employment, day]
            properties:
              employment: { $ref: "#/components/schemas/StaffAttendanceEmployment" }
              day: { $ref: "#/components/schemas/StaffAttendanceDay" }
    StaffAttendanceHistory:
      type: object
      required: [employment, from, to, calendarConfigured, days]
      properties:
        employment: { $ref: "#/components/schemas/StaffAttendanceEmployment" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        calendarConfigured: { type: boolean }
        days: { type: array, items: { $ref: "#/components/schemas/StaffAttendanceDay" } }
    StaffAttendanceRecordInput:
      type: object
      required: [employment_record_id, date, first_half, second_half]
      properties:
        employment_record_id: { type: string, format: uuid }
        date: { type: string, format: date }
        first_half: { $ref: "#/components/schemas/StaffAttendanceHalfStatus" }
        second_half: { $ref: "#/components/schemas/StaffAttendanceHalfStatus" }
    StaffAttendanceRegisterInput:
      type: object
      required: [date, items]
      properties:
        date: { type: string, format: date }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [employment_record_id, first_half, second_half]
            properties:
              employment_record_id: { type: string, format: uuid }
              first_half: { $ref: "#/components/schemas/StaffAttendanceHalfStatus" }
              second_half: { $ref: "#/components/schemas/StaffAttendanceHalfStatus" }
    StaffAttendanceCorrectionInput:
      type: object
      required: [expected_version, first_half, second_half, reason_code]
      properties:
        expected_version: { type: integer, minimum: 1 }
        first_half: { $ref: "#/components/schemas/StaffAttendanceHalfStatus" }
        second_half: { $ref: "#/components/schemas/StaffAttendanceHalfStatus" }
        reason_code: { type: string, enum: [entered_in_error, late_information, administrative_review, other] }
    TeachingAssignment:
      type: object
      description: >
        TCH.2 -- one authoritative teaching-ownership period. Directory-tier
        labels only (no HR profile, contact or account field, no user ids).
        `state` is derived from the School-local date; the dates are
        authoritative and inclusive, and `endsOn` null means open-ended.
      required: [id, employee, section, subjectOffering, academicYearId, startsOn, endsOn, state, endedAt, endReason]
      properties:
        id: { type: string, format: uuid }
        employee:
          type: object
          required: [id, employeeNumber, fullName]
          properties:
            id: { type: string, format: uuid }
            employeeNumber: { type: string, nullable: true }
            fullName: { type: string, nullable: true }
        section:
          type: object
          required: [id, name, code]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            code: { type: string, nullable: true }
        subjectOffering:
          type: object
          required: [id, subjectName, subjectCode]
          properties:
            id: { type: string, format: uuid }
            subjectName: { type: string, nullable: true }
            subjectCode: { type: string, nullable: true }
        academicYearId: { type: string, format: uuid }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, nullable: true }
        state: { type: string, enum: [upcoming, current, past] }
        endedAt: { type: string, format: date-time, nullable: true }
        endReason: { type: string, enum: [completed, reassigned, employment_ended], nullable: true }

    TeachingAssignmentCreateInput:
      type: object
      required: [employee_id, section_id, subject_offering_id, starts_on]
      properties:
        employee_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        subject_offering_id: { type: string, format: uuid }
        starts_on: { type: string, format: date, description: "School-local, inclusive." }
        ends_on: { type: string, format: date, nullable: true, description: "School-local, inclusive; omit or null for open-ended." }

    TeachingAssignmentEndInput:
      type: object
      required: [ends_on, reason]
      properties:
        ends_on: { type: string, format: date, description: "The last effective day (inclusive)." }
        reason: { type: string, enum: [completed, reassigned, employment_ended] }

    EmployeeCoreRecord:
      type: object
      description: >
        TCH.1 -- the Employee core record returned by the HR mutation
        transport (App\Domain\HR\Http\Controllers\EmployeeController::present()).
        camelCase, exactly as that controller already serializes it.
      required: [id, employeeNumber, fullName, workEmail, workPhone, userId, recordStatus]
      properties:
        id: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        workEmail: { type: string, nullable: true }
        workPhone: { type: string, nullable: true }
        userId: { type: string, format: uuid, nullable: true }
        recordStatus: { type: string, enum: [active, archived] }

    EmployeeDirectoryEntry:
      type: object
      description: Directory-tier only (docs/modules/HR.md "Employee Directory (8A.8)") -- no personal/Restricted/Highly Sensitive field exists on this schema.
      required: [employee_id, employee_number, display_name, position_id, position_name, department_id, department_name, campus_id, campus_name, manager_employee_id, manager_employee_number, manager_display_name]
      properties:
        employee_id: { type: string, format: uuid }
        employee_number: { type: string }
        display_name: { type: string }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }
        manager_employee_id: { type: string, format: uuid, nullable: true }
        manager_employee_number: { type: string, nullable: true }
        manager_display_name: { type: string, nullable: true }

    EmployeeProfileSummary:
      type: object
      required: [employee_id, employee_number, display_name, employee_record_status, user_linked, current_employment_status, position_id, position_name, department_id, department_name, campus_id, campus_name, manager_employee_id, manager_employee_number, manager_display_name]
      properties:
        employee_id: { type: string, format: uuid }
        employee_number: { type: string }
        display_name: { type: string }
        employee_record_status: { type: string, enum: [active, archived] }
        user_linked: { type: boolean }
        current_employment_status: { type: string, nullable: true, enum: [draft, pre_joining, active, notice_period, separated, terminated, retired, deceased] }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }
        manager_employee_id: { type: string, format: uuid, nullable: true }
        manager_employee_number: { type: string, nullable: true }
        manager_display_name: { type: string, nullable: true }

    EmployeeProfilePersonalDetails:
      type: object
      nullable: true
      description: null when the Employee has no EmployeePersonalDetail row -- never an empty object.
      required: [date_of_birth, nationality, marital_status, preferred_language]
      properties:
        date_of_birth: { type: string, format: date, nullable: true }
        nationality: { type: string, nullable: true }
        marital_status: { type: string, nullable: true }
        preferred_language: { type: string, nullable: true }

    EmployeeProfileContact:
      type: object
      nullable: true
      required: [personal_email, personal_phone, alternate_phone]
      properties:
        personal_email: { type: string, nullable: true }
        personal_phone: { type: string, nullable: true }
        alternate_phone: { type: string, nullable: true }

    EmployeeProfileAddress:
      type: object
      required: [id, address_type, address_line1, address_line2, city, state_region, postal_code, country_code]
      properties:
        id: { type: string, format: uuid }
        address_type: { type: string }
        address_line1: { type: string, nullable: true }
        address_line2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state_region: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        country_code: { type: string, nullable: true }

    EmployeeProfileEmergencyContact:
      type: object
      required: [id, name, relationship, phone, alternate_phone, email, is_primary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        relationship: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        alternate_phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        is_primary: { type: boolean }

    EmployeeProfileEmployment:
      type: object
      required: [id, employment_type, starts_on, ends_on, probation_ends_on, status, is_current]
      properties:
        id: { type: string, format: uuid }
        employment_type: { type: string, enum: [permanent, probationary, fixed_term, part_time, temporary, contract, consultant] }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        probation_ends_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draft, pre_joining, active, notice_period, separated, terminated, retired, deceased] }
        is_current: { type: boolean }

    EmployeeProfileAssignment:
      type: object
      required: [id, employment_record_id, is_primary, starts_on, ends_on, is_current, position_id, position_name, department_id, department_name, campus_id, campus_name]
      properties:
        id: { type: string, format: uuid }
        employment_record_id: { type: string, format: uuid }
        is_primary: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        is_current: { type: boolean }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }

    EmployeeProfileQualification:
      type: object
      required: [id, qualification_type, qualification_name, specialization, institution, awarding_body, country_code, starts_on, completed_on, grade_or_result, verification_status, verified_at]
      properties:
        id: { type: string, format: uuid }
        qualification_type: { type: string }
        qualification_name: { type: string }
        specialization: { type: string, nullable: true }
        institution: { type: string, nullable: true }
        awarding_body: { type: string, nullable: true }
        country_code: { type: string, nullable: true }
        starts_on: { type: string, format: date, nullable: true }
        completed_on: { type: string, format: date, nullable: true }
        grade_or_result: { type: string, nullable: true }
        verification_status: { type: string, enum: [unverified, verified, rejected] }
        verified_at: { type: string, format: date-time, nullable: true }

    EmployeeProfileExperience:
      type: object
      required: [id, organization, job_title, starts_on, ends_on, description, location, country_code]
      properties:
        id: { type: string, format: uuid }
        organization: { type: string }
        job_title: { type: string, nullable: true }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        country_code: { type: string, nullable: true }

    EmployeeProfileCertification:
      type: object
      required: [id, name, issuer, credential_number, issued_on, expires_on, verification_status, verified_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        issuer: { type: string, nullable: true }
        credential_number: { type: string, nullable: true }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        verification_status: { type: string, enum: [unverified, verified, rejected] }
        verified_at: { type: string, format: date-time, nullable: true }

    EmployeeProfileDocument:
      type: object
      description: >
        Restricted-tier only -- classification_tier is always
        "restricted" on this schema; highly_sensitive documents never
        appear here (see the dedicated sensitive-documents endpoint).
        Deliberately excludes original_filename/mime_type/size_bytes/
        storage_disk/storage_path/uploaded_by_user_id permanently.
      required: [id, category, classification_tier, issued_on, expires_on, status]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        classification_tier: { type: string, enum: [restricted] }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, archived] }

    EmployeeSensitiveDocument:
      type: object
      description: Identical safe shape to EmployeeProfileDocument, but classification_tier is always "highly_sensitive" -- reachable only through the dedicated sensitive-documents endpoint.
      required: [id, category, classification_tier, issued_on, expires_on, status]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        classification_tier: { type: string, enum: [highly_sensitive] }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, archived] }

    EmployeeProfile:
      type: object
      description: >
        The complete Employee Profile Workspace (docs/modules/HR.md
        "Employee Profile Workspace (8A.9)"). Section-level 8A.10
        authorization is enforced server-side before this response is
        built -- an unauthorized section is [] (repeatable) or the
        section is simply not populated beyond what the actor's
        capabilities allow; this schema itself describes the maximal
        shape, not a per-actor guarantee that every field is present.
      required: [summary, personal_details, contact, addresses, emergency_contacts, employment_history, assignments, qualifications, experience, certifications, documents]
      properties:
        summary: { $ref: "#/components/schemas/EmployeeProfileSummary" }
        personal_details: { $ref: "#/components/schemas/EmployeeProfilePersonalDetails" }
        contact: { $ref: "#/components/schemas/EmployeeProfileContact" }
        addresses: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileAddress" } }
        emergency_contacts: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileEmergencyContact" } }
        employment_history: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileEmployment" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileAssignment" } }
        qualifications: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileQualification" } }
        experience: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileExperience" } }
        certifications: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileCertification" } }
        documents: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileDocument" } }

    EmployeeActivityEntry:
      type: object
      description: A disclosure projection over SchoolAuditEvent (docs/modules/HR.md "Audit & Activity Timeline (8A.11)") -- raw audit metadata never appears here.
      required: [id, event_type, category, occurred_at, actor_user_id, actor_display_name, changed_fields]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        category: { type: string, enum: [employee, personal, employment, professional, document, sensitive_access] }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_display_name: { type: string, nullable: true }
        changed_fields: { type: array, items: { type: string } }

    RolloverPlanSummary:
      type: object
      required: [id, sourceAcademicYear, targetAcademicYear, status, configurationVersion, createdAt]
      description: >
        Phase 1B.7E. Directory-row shape -- deliberately omits mappings
        and executionSummary (only present on RolloverPlan detail) to
        keep the directory listing cheap regardless of Plan count.
      properties:
        id: { type: string, format: uuid }
        sourceAcademicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        targetAcademicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        status: { type: string, enum: [draft, validated, executing, completed, completed_with_errors, cancelled] }
        configurationVersion: { type: integer }
        validatedConfigurationVersion: { type: integer, nullable: true }
        createdBy: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time, nullable: true }
        executionStartedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    RolloverMapping:
      type: object
      required: [id, sourceGradeLevel, targetGradeLevel, isRepeat]
      properties:
        id: { type: string, format: uuid }
        sourceGradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        sourceSection: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        targetGradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        targetSection: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        isRepeat: { type: boolean }

    RolloverSubjectOfferingRef:
      type: object
      required: [id, status]
      description: >
        Phase 1G.4. A minimal, PII-free SubjectOffering reference for
        the subject-mapping workspace -- Subject name/code and academic
        dimensions (GradeLevel/Campus/ElectiveGroup) are non-PII School
        reference/configuration data. `status` is always present so a
        durable mapping's target can be displayed (with an inactive
        warning) even after the Offering itself later became inactive
        (docs/students/PHASE-1G-4-SUBJECT-ROLLOVER-API-UI.md).
      properties:
        id: { type: string, format: uuid }
        subject: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        gradeLevel: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        campus: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        status: { type: string, enum: [active, inactive] }
        electiveGroup: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }

    RolloverSubjectMapping:
      type: object
      required: [id, sourceSubjectOffering, state]
      description: >
        Phase 1G.4/1G.1. `state` is the three-state model surfaced for
        display: this schema only ever represents a row that EXISTS
        (`mapped` or `omit`) -- the UNCONFIGURED state is the ABSENCE
        of a row, represented separately by
        `RolloverPlan.unmappedSourceSubjectOfferings`, never collapsed
        into this list.
      properties:
        id: { type: string, format: uuid }
        sourceSubjectOffering: { $ref: "#/components/schemas/RolloverSubjectOfferingRef" }
        state: { type: string, enum: [mapped, omit] }
        targetSubjectOffering: { allOf: [{ $ref: "#/components/schemas/RolloverSubjectOfferingRef" }], nullable: true }

    RolloverSubjectMappingUpsertInput:
      type: object
      required: [target_subject_offering_id]
      description: >
        `target_subject_offering_id: null` means EXPLICIT OMIT (a
        durable row recording the operator's deliberate choice not to
        carry this elective forward) -- the key must always be present
        (even when null), distinct from DELETing this resource
        (UNCONFIGURED, Phase 1G.1's three-state model).
      properties:
        target_subject_offering_id: { type: string, format: uuid, nullable: true }

    RolloverSubjectMappingMutationResult:
      type: object
      required: [sourceSubjectOffering, state, plan]
      description: >
        Returned by both the PUT and DELETE subject-mapping endpoints
        -- enough authoritative state (including the Plan's own
        versioning/validation-staleness fields) for the UI to update in
        place without a full reload (this checkpoint's brief, section
        38).
      properties:
        sourceSubjectOffering: { $ref: "#/components/schemas/RolloverSubjectOfferingRef" }
        state: { type: string, enum: [unconfigured, omit, mapped] }
        targetSubjectOffering: { allOf: [{ $ref: "#/components/schemas/RolloverSubjectOfferingRef" }], nullable: true }
        plan:
          type: object
          required: [configurationVersion, validatedConfigurationVersion, isValidatedForCurrentConfiguration]
          properties:
            configurationVersion: { type: integer }
            validatedConfigurationVersion: { type: integer, nullable: true }
            isValidatedForCurrentConfiguration: { type: boolean }

    RolloverPlan:
      allOf:
        - { $ref: "#/components/schemas/RolloverPlanSummary" }
        - type: object
          required: [isValidatedForCurrentConfiguration, mappings, subjectMappings, unmappedSourceSubjectOfferings, executionSummary]
          properties:
            isValidatedForCurrentConfiguration: { type: boolean }
            mappings: { type: array, items: { $ref: "#/components/schemas/RolloverMapping" } }
            subjectMappings: { type: array, items: { $ref: "#/components/schemas/RolloverSubjectMapping" } }
            unmappedSourceSubjectOfferings:
              type: array
              description: >
                Phase 1G.4. Bounded discovery list of elective source
                SubjectOfferings with current eligible participation in
                this Plan but NO mapping row yet -- what would trigger
                `missing_subject_mapping` in dry-run. Never implies a
                mapping row was created; purely a read-only projection
                (EnrollmentRolloverReadService::unmappedSourceSubjectOfferings()).
              items: { $ref: "#/components/schemas/RolloverSubjectOfferingRef" }
            executionSummary: { $ref: "#/components/schemas/RolloverExecutionSummary" }

    RolloverPlanInput:
      type: object
      required: [source_academic_year_id, target_academic_year_id]
      description: >
        school_id/status/configuration_version/validated_configuration_version/created_by_user_id/execution
        timestamps are never accepted -- School derives from the route,
        actor from the authenticated User, every other field is
        EnrollmentRolloverPlanService::createDraft()'s own invariant.
      properties:
        source_academic_year_id: { type: string, format: uuid }
        target_academic_year_id: { type: string, format: uuid }

    RolloverMappingInput:
      type: object
      required: [source_grade_level_id, target_grade_level_id]
      properties:
        source_grade_level_id: { type: string, format: uuid }
        source_section_id: { type: string, format: uuid, nullable: true }
        target_grade_level_id: { type: string, format: uuid }
        target_section_id: { type: string, format: uuid, nullable: true }

    RolloverMappingUpdateInput:
      type: object
      required: [target_grade_level_id]
      description: >
        Changes only WHAT an existing mapping points to -- its source
        identity is read from the resolved mapping itself, never
        accepted here (re-keying the source would address a DIFFERENT
        mapping entirely; use RolloverMappingInput/POST for that).
      properties:
        target_grade_level_id: { type: string, format: uuid }
        target_section_id: { type: string, format: uuid, nullable: true }

    RolloverItem:
      type: object
      required: [id, student, sourceEnrollment, decision, validationResult, executionStatus]
      description: >
        Deliberately excludes dateOfBirth/Guardian PII/contact values/
        lookup hashes/encrypted fields -- operational Student summary
        only (docs/security/DATA-CLASSIFICATION.md). rollNumber-shaped
        fields are always strings, never coerced to a number.
      properties:
        id: { type: string, format: uuid }
        student: { $ref: "#/components/schemas/StudentSummary" }
        sourceEnrollment:
          type: object
          properties:
            id: { type: string, format: uuid }
            section: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        decision: { type: string, enum: [undecided, promote, repeat, exclude, manual_review] }
        targetSection: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        rollNumberStrategy: { type: string, enum: [explicit, preserve_source], nullable: true }
        targetRollNumber: { type: string, nullable: true }
        validationResult: { type: string, enum: [ready, excluded, already_enrolled, review, blocked], nullable: true }
        validationReason: { type: string, nullable: true }
        executionStatus: { type: string, enum: [succeeded, reconciled, skipped, failed], nullable: true }
        targetEnrollmentId: { type: string, format: uuid, nullable: true }
        executedAt: { type: string, format: date-time, nullable: true }

    RolloverItemInput:
      type: object
      required: [decision]
      description: >
        student_id/source_enrollment_id/validation_result/validation_reason/execution_status/target_enrollment_id/snapshot
        columns/configuration_version are never accepted -- only these
        four operator-editable fields reach
        EnrollmentRolloverPlanService::setItemDecision().
      properties:
        decision: { type: string, enum: [undecided, promote, repeat, exclude, manual_review] }
        target_section_id: { type: string, format: uuid, nullable: true }
        roll_number_strategy: { type: string, enum: [explicit, preserve_source], nullable: true }
        target_roll_number: { type: string, nullable: true }

    RolloverDryRunSummary:
      type: object
      required: [total, ready, excluded, already_enrolled, review, blocked, validated, configurationVersion]
      description: EnrollmentRolloverDryRunService::run()'s own return value, passed through unchanged.
      properties:
        total: { type: integer }
        ready: { type: integer }
        excluded: { type: integer }
        already_enrolled: { type: integer }
        review: { type: integer }
        blocked: { type: integer }
        validated: { type: boolean }
        configurationVersion: { type: integer }

    RolloverExecutionSummary:
      type: object
      required: [total, succeeded, reconciled, skipped, failed, pending]
      description: >
        Recomputed from persisted Items every time -- never an
        in-memory counter. `planStatus` is present only on start()/
        resume()'s own response (EnrollmentRolloverExecutionService's
        return value), not on the Plan-detail-embedded executionSummary.
      properties:
        total: { type: integer }
        succeeded: { type: integer }
        reconciled: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        planStatus: { type: string, enum: [draft, validated, executing, completed, completed_with_errors, cancelled] }

    Document:
      type: object
      description: >
        Phase 0E.5 -- the Documents module's shared safe metadata shape
        (docs/modules/DOCUMENTS.md "Document metadata JSON shape"),
        returned by the upload, both listing, and direct-metadata
        endpoints. Never includes storage_disk/storage_path/an object
        key/uploaded_by_user_id/a signed or public URL.
      required: [document_id, owner_type, owner_id, classification_tier, status, original_filename, mime_type, size_bytes, uploaded_at]
      properties:
        document_id: { type: string, format: uuid }
        owner_type: { type: string, enum: [employee] }
        owner_id: { type: string, format: uuid }
        classification_tier: { type: string, enum: [public, internal, sensitive, highly_sensitive] }
        status: { type: string, enum: [active, archived] }
        original_filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        uploaded_at: { type: string, format: date-time }
    # --- Phase 1D.5: Admissions administrative surface

    ApplicantSummary:
      type: object
      required: [id, firstName]
      description: >
        List-row shape -- deliberately excludes dateOfBirth (Sensitive
        personal data of a minor), matching StudentSummary's identical
        precedent. See Applicant for the full single-record shape.
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }

    Applicant:
      type: object
      required: [id, firstName, dateOfBirth, createdAt, updatedAt]
      description: Full single-record shape (show/create responses only -- never the list response, see ApplicantSummary).
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        dateOfBirth: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApplicantInput:
      type: object
      required: [first_name, date_of_birth]
      description: No school_id, no contact fields, no Guardian fields -- Admissions stores no contact data of any kind (docs/modules/ADMISSIONS.md §9).
      properties:
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }
        date_of_birth: { type: string, format: date }

    AdmissionApplicationSummary:
      type: object
      required: [id, status, applicant, academicYear, campus, gradeLevel, createdAt]
      description: >
        Shared shape for directory rows AND single-record detail minus
        decisionNote/conversion provenance (see AdmissionApplication for
        the full detail-only shape) -- decisionNote is deliberately
        never hydrated for the list view (docs/admissions/PHASE-1D-4-AUTHORIZATION-READ-SERVICE.md).
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, accepted, rejected, withdrawn, converted] }
        applicant: { $ref: "#/components/schemas/ApplicantSummary" }
        academicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        campus: { $ref: "#/components/schemas/EnrollmentRef" }
        gradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        createdAt: { type: string, format: date-time }
        convertedAt: { type: string, format: date-time, nullable: true }

    AdmissionApplication:
      allOf:
        - { $ref: "#/components/schemas/AdmissionApplicationSummary" }
        - type: object
          required: [decisionNote, convertedStudentId, convertedStudentEnrollmentId, updatedAt]
          properties:
            decisionNote: { type: string, nullable: true, description: Internal, staff-only. Never searched, audited, or logged. }
            convertedStudentId: { type: string, format: uuid, nullable: true }
            convertedStudentEnrollmentId: { type: string, format: uuid, nullable: true }
            updatedAt: { type: string, format: date-time }

    AdmissionApplicationInput:
      type: object
      required: [applicant_id, academic_year_id, campus_id, grade_level_id]
      description: >
        Always creates in draft status -- no status is ever accepted.
        No section_id/roll_number/Student Number/Guardian fields --
        those are conversion-time-only inputs (docs/modules/ADMISSIONS.md
        §5/§9). Every reference must belong to the same School (422 if
        not).
      properties:
        applicant_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }

    AdmissionDecisionInput:
      type: object
      description: Used by both accept and reject -- decision_note is optional and internal (never required to accept or reject).
      properties:
        decision_note: { type: string, maxLength: 1000, nullable: true }

    AdmissionGuardianInstructionInput:
      type: object
      required: [mode, relationship_type]
      description: >
        A small, closed, two-mode shape mirroring
        GuardianConversionInstruction exactly -- omitted entirely
        (or the parent `guardian` key sent as null) is the one
        canonical "no Guardian" representation. `create` mode fields
        (first_name/middle_name/last_name/contact_type/contact_value)
        are ignored in `link_existing` mode and vice versa
        (guardian_id).
      properties:
        mode: { type: string, enum: [create, link_existing] }
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean, default: false }
        is_emergency_contact: { type: boolean, default: false }
        is_authorized_pickup: { type: boolean, default: false }
        first_name: { type: string, maxLength: 255, description: "Required when mode=create." }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }
        contact_type: { allOf: [{ $ref: "#/components/schemas/ContactType" }], nullable: true, description: "create mode only -- optional; when supplied, an existing contact-matching Guardian candidate is rejected with ADMISSION_GUARDIAN_SELECTION_REQUIRED rather than silently duplicated." }
        contact_value: { type: string, maxLength: 255, nullable: true, description: "create mode only -- required when contact_type is supplied. Transient request input only, never persisted by Admissions; flows straight into GuardianContactService's canonical encrypted storage." }
        guardian_id: { type: string, format: uuid, description: "Required when mode=link_existing. Must belong to the same School (422 otherwise)." }

    AdmissionConversionInput:
      type: object
      required: [student_number, section_id, roll_number, starts_on]
      description: >
        The Section is the sole authoritative placement input for this
        conversion -- AdmissionConversionService re-verifies it matches
        the application's own AcademicYear/Campus/GradeLevel (422
        IncompatibleConversionSectionException otherwise, never a
        partial conversion).
      properties:
        student_number: { type: string, maxLength: 255 }
        section_id: { type: string, format: uuid }
        roll_number: { type: string, maxLength: 255 }
        starts_on: { type: string, format: date }
        guardian: { allOf: [{ $ref: "#/components/schemas/AdmissionGuardianInstructionInput" }], nullable: true }

    AdmissionConversionEnrollment:
      type: object
      required: [id, academicYear, campus, gradeLevel, section, rollNumber, status, startsOn]
      description: The newly-created StudentEnrollment's summary -- deliberately excludes endsOn (always null immediately after conversion) and student (redundant with the sibling `student` field on AdmissionConversionResult).
      properties:
        id: { type: string, format: uuid }
        academicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        campus: { $ref: "#/components/schemas/EnrollmentRef" }
        gradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        section: { $ref: "#/components/schemas/EnrollmentRef" }
        rollNumber: { type: string }
        status: { type: string, enum: [active, completed, withdrawn, transferred, cancelled] }
        startsOn: { type: string, format: date }

    AdmissionConversionRelationship:
      type: object
      required: [id, relationshipType, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
      properties:
        id: { type: string, format: uuid }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        isLegalGuardian: { type: boolean }
        isEmergencyContact: { type: boolean }
        isAuthorizedPickup: { type: boolean }

    AdmissionConversionResult:
      type: object
      required: [application, student, enrollment, guardian, relationship]
      description: >
        guardian/relationship are both null together when the
        conversion request carried no `guardian` instruction
        (docs/modules/ADMISSIONS.md §11's optionality); never returns
        Guardian contact values (staff already supplied whatever they
        submitted -- echoing it back is unnecessary).
      properties:
        application: { $ref: "#/components/schemas/AdmissionApplication" }
        student: { $ref: "#/components/schemas/StudentSummary" }
        enrollment: { $ref: "#/components/schemas/AdmissionConversionEnrollment" }
        guardian: { allOf: [{ $ref: "#/components/schemas/GuardianSummary" }], nullable: true }
        relationship: { allOf: [{ $ref: "#/components/schemas/AdmissionConversionRelationship" }], nullable: true }

    # Phase 9.8: Payroll schemas.
    SalaryComponent:
      type: object
      required: [id, code, name, type, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [earning, deduction] }
        liabilityLedgerAccountId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }
    SalaryComponentInput:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        type: { type: string, enum: [earning, deduction] }
        liability_ledger_account_id: { type: string, format: uuid, nullable: true, description: Required (eventually, at posting time) for a deduction with a nonzero total. }
    SalaryStructureSummary:
      type: object
      required: [id, code, version, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        version: { type: integer }
        name: { type: string }
        status: { type: string, enum: [draft, active, superseded] }
    SalaryStructureComponent:
      type: object
      required: [id, salaryComponentId, calculationType, displayOrder]
      properties:
        id: { type: string, format: uuid }
        salaryComponentId: { type: string, format: uuid }
        calculationType: { type: string, enum: [fixed_amount, percentage_of_base] }
        baseComponentId: { type: string, format: uuid, nullable: true }
        rate: { type: string, nullable: true, description: "Decimal fraction 0-1, percentage_of_base only." }
        displayOrder: { type: integer }
    SalaryStructureDetail:
      allOf:
        - { $ref: "#/components/schemas/SalaryStructureSummary" }
        - type: object
          required: [components]
          properties:
            components: { type: array, items: { $ref: "#/components/schemas/SalaryStructureComponent" } }
    SalaryStructureInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
    SalaryStructureComponentInput:
      type: object
      required: [salary_component_id, calculation_type, display_order]
      properties:
        salary_component_id: { type: string, format: uuid }
        calculation_type: { type: string, enum: [fixed_amount, percentage_of_base] }
        base_component_id: { type: string, format: uuid, nullable: true, description: percentage_of_base only -- must reference an earlier-ordered component in the same structure. }
        rate: { type: string, nullable: true, description: "Decimal fraction 0-1, percentage_of_base only." }
        display_order: { type: integer, minimum: 1 }
    CompensationAssignmentSummary:
      type: object
      required: [id, employmentRecordId, salaryStructureId, effectiveFrom]
      description: Identity and effective dates ONLY -- never an amount (ADR 0034 "Sensitive values").
      properties:
        id: { type: string, format: uuid }
        employmentRecordId: { type: string, format: uuid }
        salaryStructureId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
    CompensationAssignmentValue:
      type: object
      required: [salaryStructureComponentId, amount]
      description: Highly Sensitive -- an Employee-specific fixed component amount.
      properties:
        salaryStructureComponentId: { type: string, format: uuid }
        amount: { type: string, description: Exact decimal string, never a JSON float. }
    CompensationAssignmentInput:
      type: object
      required: [salary_structure_id, effective_from, fixed_values]
      properties:
        salary_structure_id: { type: string, format: uuid, description: Must reference an ACTIVE structure. }
        effective_from: { type: string, format: date }
        fixed_values:
          type: array
          items:
            type: object
            required: [salary_structure_component_id, amount]
            properties:
              salary_structure_component_id: { type: string, format: uuid }
              amount: { type: string, description: "Exact decimal string (e.g. \"50000.00\"), one value per fixed_amount component -- never for percentage_of_base." }
    PayrollPeriod:
      type: object
      required: [id, periodMonth, startsOn, endsOn, status]
      properties:
        id: { type: string, format: uuid }
        periodMonth: { type: string, format: date }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        paymentDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draft, open, closed] }
    PayrollPeriodInput:
      type: object
      required: [period_month]
      properties:
        period_month: { type: string, format: date, description: Any date within the target month -- normalized to that month's first day. }
        payment_date: { type: string, format: date, nullable: true }
    PayrollRun:
      type: object
      required: [id, payrollPeriodId, runKind, status, preparedByUserId]
      description: Non-sensitive run metadata only -- payroll_runs itself carries no monetary column.
      properties:
        id: { type: string, format: uuid }
        payrollPeriodId: { type: string, format: uuid }
        runKind: { type: string, enum: [regular, correction] }
        correctsPayrollRunId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, calculated, approved, posted] }
        preparedByUserId: { type: string, format: uuid }
        approvedByUserId: { type: string, format: uuid, nullable: true }
        postedByUserId: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        resultsExpiredAt:
          type: string
          format: date-time
          nullable: true
          description: "E21.3F (E21-D9): when payroll retention first deleted a separated Employee's results from this run (8 calendar years after final separation). Non-null means the run's per-Employee results and statutory exports no longer cover the whole run; its ledger posting is unchanged."
    PayrollCalculationOutcome:
      type: object
      required: [resolvedCount, unresolvedEmploymentRecordIds, transitionedToCalculated]
      properties:
        resolvedCount: { type: integer }
        unresolvedEmploymentRecordIds: { type: array, items: { type: string, format: uuid } }
        transitionedToCalculated: { type: boolean, description: "False if any eligible EmploymentRecord remains unresolved -- the run stays draft (ADR 0034 fail-closed rule)." }
    ManualOverrideInput:
      type: object
      required: [employment_record_id, component_amounts, reason]
      properties:
        employment_record_id: { type: string, format: uuid }
        component_amounts:
          type: object
          additionalProperties: { type: string }
          description: "salary_component_id => absolute decimal-string amount, one entry per affected component."
        reason: { type: string, maxLength: 1000 }
    CorrectionDeltaInput:
      type: object
      required: [employment_record_id, lines, reason]
      properties:
        employment_record_id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [salary_component_id, amount, effect]
            properties:
              salary_component_id: { type: string, format: uuid }
              amount: { type: string, description: Always a positive magnitude -- direction is carried by effect. }
              effect: { type: string, enum: [increase, decrease] }
        reason: { type: string, maxLength: 1000 }
    PayrollRunResultLine:
      type: object
      required: [salaryComponentId, amount, effect]
      properties:
        salaryComponentId: { type: string, format: uuid }
        amount: { type: string }
        effect: { type: string, enum: [increase, decrease] }
        resolvedLedgerAccountId: { type: string, format: uuid, nullable: true, description: Informational calculation-time snapshot only -- posting re-resolves the current mapping live. }
    PayrollRunResult:
      type: object
      required: [employmentRecordId, employeeId, grossAmount, totalDeductions, netAmount, lines]
      description: Highly Sensitive -- one EmploymentRecord's authoritative result for a run.
      properties:
        employmentRecordId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        grossAmount: { type: string }
        totalDeductions: { type: string }
        netAmount: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/PayrollRunResultLine" } }
    PayslipLine:
      type: object
      required: [salaryComponentId, componentCode, componentName, componentType, amount, effect]
      properties:
        salaryComponentId: { type: string, format: uuid }
        componentCode: { type: string }
        componentName: { type: string }
        componentType: { type: string, enum: [earning, deduction] }
        amount: { type: string }
        effect: { type: string, enum: [increase, decrease] }
    Payslip:
      type: object
      required: [schoolId, schoolName, payrollRunId, runKind, runStatus, isReversed, payrollPeriodId, periodMonth, employmentRecordId, employeeId, grossAmount, totalDeductions, netAmount, lines, statutoryDeductionsIncluded]
      description: >
        Highly Sensitive -- one EmploymentRecord's on-demand payslip,
        rendered from the frozen payroll_run_results/_lines authority,
        never persisted. Excludes bank details by construction.
        Checkpoint 9.6J: statutory carries the frozen
        payroll_statutory_calculation_results figures for this exact
        result when available AND the actor also holds
        payroll.statutory.view -- null otherwise (never fabricated,
        never recalculated from current rule versions).
      properties:
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        payrollRunId: { type: string, format: uuid }
        runKind: { type: string, enum: [regular, correction] }
        correctsPayrollRunId: { type: string, format: uuid, nullable: true }
        correctsPayrollPeriodMonth: { type: string, format: date, nullable: true }
        runStatus: { type: string, enum: [approved, posted] }
        isReversed: { type: boolean, description: "Derived from payroll_run_postings -- the original result is never rewritten or deleted on reversal." }
        payrollPeriodId: { type: string, format: uuid }
        periodMonth: { type: string, format: date }
        paymentDate: { type: string, format: date, nullable: true }
        employmentRecordId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeFullName: { type: string, nullable: true }
        employeeNumber: { type: string, nullable: true }
        grossAmount: { type: string }
        totalDeductions: { type: string }
        netAmount: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/PayslipLine" } }
        statutoryDeductionsIncluded: { type: boolean, description: "True only when a frozen statutory calculation result exists for this payslip AND the actor holds payroll.statutory.view." }
        statutory: { $ref: "#/components/schemas/PayslipStatutorySection" }
    PayslipStatutorySection:
      type: object
      nullable: true
      description: >
        Checkpoint 9.6J. Identifiers are always masked here -- there is
        no reveal flow on a payslip. esiDisabilityProvisionsEvaluated
        is always false: this system collects no disability-status
        fact anywhere (the ESI disability threshold remains DEFERRED —
        ADDITIONAL LEGAL CLARIFICATION REQUIRED), so a renderer MUST
        show this as a standing notice, never omit it, and this
        payload must never be labeled a statutory-compliance document.
      required: [isPfExcludedEmployee, esiIsCovered, lwfCharged, esiDisabilityProvisionsEvaluated]
      properties:
        isPfExcludedEmployee: { type: boolean }
        employeePfMandatory: { type: string, nullable: true }
        employeePfVoluntary: { type: string, nullable: true }
        employerPfTotal: { type: string, nullable: true, description: Informational -- employer cost, not withheld from the Employee. }
        employerEps: { type: string, nullable: true }
        employerEpf: { type: string, nullable: true }
        employerEdli: { type: string, nullable: true }
        esiIsCovered: { type: boolean }
        employeeEsi: { type: string, nullable: true }
        employerEsi: { type: string, nullable: true, description: Informational. }
        professionalTax: { type: string, nullable: true }
        lwfCharged: { type: boolean }
        employeeLwf: { type: string, nullable: true }
        employerLwf: { type: string, nullable: true, description: Informational. }
        tdsMonthlyDeduction: { type: string, nullable: true }
        tdsResidualComplianceException: { type: string, nullable: true, description: "Set only on a fail-closed insufficient-salary cycle (ADR 0036 §1.10) -- never a fabricated employer-funded TDS payment." }
        maskedPan: { type: string, nullable: true }
        maskedUan: { type: string, nullable: true }
        maskedPfMemberId: { type: string, nullable: true }
        maskedEsicIpNumber: { type: string, nullable: true }
