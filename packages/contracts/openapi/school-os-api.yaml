      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenItemId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenItemDetail" } } }
        "404":
          description: Not found (including a cross-School id).
    patch:
      operationId: updateCanteenItem
      summary: Updates or (de)activates a Canteen Item, or changes its price. A price change never rewrites an already-placed Order's snapshotted unit_price/line_total. Requires canteen.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenItemId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanteenItemUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenItem" } } }

  /schools/{schoolId}/canteen-items/{canteenItemId}/recipe:
    get:
      operationId: listCanteenItemRecipe
      summary: Lists a Canteen Item's recipe (CanteenItemInventoryRequirement rows) -- how much of each InventoryItem one unit consumes. Requires canteen.directory.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenItemId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/CanteenItemInventoryRequirement" } } } }
    post:
      operationId: setCanteenItemRecipeRequirement
      summary: >
        Adds (or replaces, if one already exists for this ingredient)
        a recipe requirement. Evaluated AT FULFILLMENT time, never
        snapshotted at Order placement -- a recipe edit after an Order
        is placed but before it is fulfilled changes what that
        fulfillment consumes (docs/modules/CANTEEN.md "Recipe model").
        Requires canteen.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanteenItemInventoryRequirementInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenItemInventoryRequirement" } } }
        "422":
          description: Validation failure (e.g. inventory_item_id from a different School, non-positive quantity_required).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/canteen-items/{canteenItemId}/recipe/{requirement}:
    patch:
      operationId: updateCanteenItemRecipeRequirement
      summary: Updates one recipe requirement's quantity_required. Requires canteen.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenItemId" }
        - { $ref: "#/components/parameters/CanteenRecipeRequirementId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanteenItemInventoryRequirementUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenItemInventoryRequirement" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: deleteCanteenItemRecipeRequirement
      summary: Removes a recipe requirement -- the Item no longer consumes this ingredient at fulfillment. Requires canteen.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenItemId" }
        - { $ref: "#/components/parameters/CanteenRecipeRequirementId" }
      responses:
        "204":
          description: Deleted.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/canteen-billing-configuration:
    get:
      operationId: getCanteenBillingConfiguration
      summary: Fetch this School's Canteen billing configuration (the two LedgerAccounts fulfillment posts against). data is null when not yet configured. Requires canteen.settings.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { oneOf: [{ $ref: "#/components/schemas/CanteenBillingConfiguration" }, { type: "null" }] }
    put:
      operationId: updateCanteenBillingConfiguration
      summary: >
        Creates or replaces this School's Canteen billing configuration
        (a singleton row). Both accounts must exist for this School,
        be active, differ from each other, and match the required type
        (receivable = asset, revenue = income) -- the SAME validation
        CanteenOrderService::fulfill() re-runs authoritatively at every
        fulfillment (docs/modules/CANTEEN.md "Billing configuration").
        Requires canteen.settings.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanteenBillingConfigurationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenBillingConfiguration" } } }
        "422":
          description: CANTEEN_BILLING_ACCOUNT_INVALID (wrong type, inactive, cross-School, or identical accounts).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/canteen-orders:
    get:
      operationId: listCanteenOrders
      summary: >
        Lists Canteen Orders (Highly Sensitive summary projection --
        NEVER includes unit_price/line_total/total_amount/currency/lines,
        docs/modules/CANTEEN.md "Highly Sensitive data handling"; use
        the detail endpoint for money fields). Requires canteen.orders.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, fulfilled, cancelled] } }
        - { name: student_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: outlet_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CanteenOrderSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: placeCanteenOrder
      summary: >
        Places a new Canteen Order for one Student at one Outlet.
        Snapshots each line's unit_price/line_total from the Item's
        CURRENT price and the Outlet's CURRENT inventory_location_id at
        this moment -- neither is re-derived later (docs/modules/CANTEEN.md
        "Price/location snapshot semantics"). Touches neither Inventory
        nor Fees -- those only happen at fulfill. Idempotent
        (Idempotency-Key required). Requires canteen.orders.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceCanteenOrderInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenOrder" } } }
        "422":
          description: >
            CANTEEN_STUDENT_NOT_ELIGIBLE, CANTEEN_OUTLET_NOT_AVAILABLE,
            CANTEEN_ITEM_NOT_AVAILABLE, CANTEEN_EMPTY_ORDER, or
            CANTEEN_DUPLICATE_ITEM_LINE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CANTEEN_STUDENT_NOT_FOUND, CANTEEN_OUTLET_NOT_FOUND, or CANTEEN_ITEM_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/canteen-orders/{canteenOrderId}:
    get:
      operationId: getCanteenOrder
      summary: Fetch one Canteen Order's full detail, including every money field and every line. Requires canteen.orders.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenOrderId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenOrder" } } }
        "404":
          description: CANTEEN_ORDER_NOT_FOUND (including a cross-School id).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/canteen-orders/{canteenOrderId}/fulfill:
    post:
      operationId: fulfillCanteenOrder
      summary: >
        Fulfills a pending Order: evaluates the recipe of every line's
        Item AT THIS MOMENT (never at placement time), issues the
        aggregated Inventory requirement via InventoryStockService::issueMany()
        against the Order's snapshotted inventory_location_id, then
        assesses a Charge via ChargeService::assess() against the
        billing configuration's two LedgerAccounts -- all inside ONE
        outer transaction (docs/modules/CANTEEN.md "Fulfillment
        transaction sequence"). Idempotent (Idempotency-Key required):
        a retried request never double-issues stock or double-assesses
        a Charge. Requires canteen.orders.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenOrderId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenOrder" } } }
        "422":
          description: >
            CANTEEN_BILLING_NOT_CONFIGURED, CANTEEN_BILLING_ACCOUNT_INVALID,
            CANTEEN_NO_ACTIVE_ACADEMIC_YEAR, or an Inventory
            insufficient-stock/not-available error surfaced from
            issueMany().
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CANTEEN_ORDER_NOT_FOUND (including a cross-School id).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: CANTEEN_ORDER_ALREADY_FULFILLED or CANTEEN_ORDER_CANCELLED_CANNOT_BE_FULFILLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/canteen-orders/{canteenOrderId}/cancel:
    post:
      operationId: cancelCanteenOrder
      summary: Cancels a pending Order. Never available once fulfilled -- no financial reversal semantics exist for Canteen (a fulfilled Order's Charge follows Fees' own cancellation/adjustment rules, not this endpoint). Requires canteen.orders.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenOrderId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenOrder" } } }
        "404":
          description: CANTEEN_ORDER_NOT_FOUND (including a cross-School id).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: CANTEEN_ORDER_ALREADY_CANCELLED or CANTEEN_ORDER_FULFILLED_CANNOT_BE_CANCELLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # Phase 0H (Timetable foundation): the Period catalogue + weekly
  # schedule (Entry) administrative API, plus Timetable's own narrow
  # read-only search/helper endpoints. Mirrors the Canteen section's
  # structural style exactly. Fixed page size (Periods: 20, Entries:
  # 50) -- per_page is never accepted, only `page`. GET/search
  # endpoints carry no `throttle:` middleware in routes/api.php (unlike
  # every mutating route, which carries `throttle:school-api-mutations`),
  # so no 429 is documented on them.
  /schools/{schoolId}/timetable-periods:
    get:
      operationId: listTimetablePeriods
      summary: >
        Lists a School's TimetablePeriod catalogue (active by default,
        ordered by sort_order then code). Fixed page size of 20.
        Requires timetable.periods.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IncludeInactive" }
        - { $ref: "#/components/parameters/Page" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TimetablePeriod" } }
                  meta: { $ref: "#/components/schemas/TimetablePaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.periods.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createTimetablePeriod
      summary: >
        Creates a new active TimetablePeriod. code is unique per
        School, case-insensitively. Requires timetable.periods.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetablePeriodInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetablePeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.periods.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: TIMETABLE_PERIOD_OVERLAP -- this time range overlaps an existing active Period for this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation failure (missing/invalid field, duplicate code
            within this School), or TIMETABLE_PERIOD_INVALID when
            start_time is not strictly before end_time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/timetable-periods/{timetablePeriodId}:
    get:
      operationId: getTimetablePeriod
      summary: Fetch one TimetablePeriod. Requires timetable.periods.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/TimetablePeriodId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetablePeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.periods.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: TimetablePeriod does not exist, or belongs to a different School -- deliberately indistinguishable.
    patch:
      operationId: updateTimetablePeriod
      summary: >
        Updates a TimetablePeriod's name/code/sort_order and/or
        start_time/end_time -- status is never accepted here, use
        activate/deactivate. Changing start_time or end_time is
        rejected with a 409 (TIMETABLE_PERIOD_REFERENCED) while an
        active TimetableEntry still references this Period, and is
        re-validated against every other active Period's range exactly
        like create. Requires timetable.periods.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/TimetablePeriodId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetablePeriodUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetablePeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.periods.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: TimetablePeriod does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: TIMETABLE_PERIOD_REFERENCED (an active TimetableEntry still references this Period) or TIMETABLE_PERIOD_OVERLAP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure, or TIMETABLE_PERIOD_INVALID when start_time is not strictly before end_time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/timetable-periods/{timetablePeriodId}/activate:
    post:
      operationId: activateTimetablePeriod
      summary: >
        Reactivates an inactive TimetablePeriod, re-running the full
        overlap check against every other currently-active Period.
        Requires timetable.periods.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/TimetablePeriodId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetablePeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.periods.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: TimetablePeriod does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: TIMETABLE_PERIOD_OVERLAP -- this Period's range overlaps another currently-active Period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/timetable-periods/{timetablePeriodId}/deactivate:
    post:
      operationId: deactivateTimetablePeriod
      summary: >
        Deactivates a TimetablePeriod. Rejected with a 409
        (TIMETABLE_PERIOD_REFERENCED) while any active TimetableEntry
        still references it. Requires timetable.periods.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/TimetablePeriodId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetablePeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.periods.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: TimetablePeriod does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: TIMETABLE_PERIOD_REFERENCED -- an active TimetableEntry still references this Period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/timetable-entries:
    get:
      operationId: listTimetableEntries
      summary: >
        Lists a School's TimetableEntry schedule (active by default,
        ordered by day_of_week then period_id). Fixed page size of 50.
        Requires timetable.schedule.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IncludeInactive" }
        - { name: section_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: teacher_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: day_of_week, in: query, required: false, description: "1 (Monday) .. 7 (Sunday).", schema: { type: integer, minimum: 1, maximum: 7 } }
        - { $ref: "#/components/parameters/Page" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TimetableEntry" } }
                  meta: { $ref: "#/components/schemas/TimetablePaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.schedule.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid query parameter (e.g. section_id not a UUID, day_of_week outside 1-7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createTimetableEntry
      summary: >
        Schedules a required, active SubjectOffering to an active
        Section, taught by an active teacher (HR Employee), in an
        optional active Room, during an active TimetablePeriod, on a
        given day of week. academic_year_id/campus_id/grade_level_id
        are always derived server-side from the resolved
        subject_offering_id, never accepted as input. Requires
        timetable.schedule.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetableEntryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetableEntry" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.schedule.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: subject_offering_id/section_id/teacher_id/room_id/period_id does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            TIMETABLE_TEACHER_ALREADY_SCHEDULED,
            TIMETABLE_SECTION_ALREADY_SCHEDULED, or
            TIMETABLE_ROOM_ALREADY_SCHEDULED -- this teacher/Section/Room
            already has another active class scheduled for this day and
            Period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation failure, or one of
            TIMETABLE_ELECTIVE_OFFERING_NOT_SCHEDULABLE (SubjectOffering
            is not required), TIMETABLE_SUBJECT_OFFERING_NOT_AVAILABLE,
            TIMETABLE_SECTION_NOT_AVAILABLE,
            TIMETABLE_TEACHER_NOT_AVAILABLE,
            TIMETABLE_ROOM_NOT_AVAILABLE, or
            TIMETABLE_PERIOD_NOT_AVAILABLE when the referenced parent is
            not active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/timetable-entries/{timetableEntryId}:
    get:
      operationId: getTimetableEntry
      summary: Fetch one TimetableEntry. Requires timetable.schedule.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/TimetableEntryId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetableEntry" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.schedule.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: TimetableEntry does not exist, or belongs to a different School -- deliberately indistinguishable.
    patch:
      operationId: updateTimetableEntry
      summary: >
        Re-validates and rewrites the ENTIRE scheduling assignment
        (SubjectOffering/Section/teacher/Room/Period/day_of_week) --
        never a partial update; every field TimetableEntryInput
        accepts is required here too. Does not touch status -- use
        activate/deactivate. Requires timetable.schedule.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/TimetableEntryId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetableEntryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TimetableEntry" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking timetable.schedule.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: TimetableEntry (or a referenced SubjectOffering/Section/teacher/Room/Period) does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: TIMETABLE_TEACHER_ALREADY_SCHEDULED, TIMETABLE_SECTION_ALREADY_SCHEDULED, or TIMETABLE_ROOM_ALREADY_SCHEDULED.
