        "422":
          description: Validation error (for example a term schedule for a year without terms).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-optional-selections:
    get:
      operationId: listFeeOptionalSelections
      summary: >
        Lists optional-fee selections for one Student or one line (one of the two filters is required). Highly Sensitive; each list is read-audited. Requires finance.fee_structures.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: student_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: fee_structure_line_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, withdrawn] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/FeeOptionalSelection" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_structures.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Neither student_id nor fee_structure_line_id given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createFeeOptionalSelection
      summary: >
        Records a Student's explicit choice of an OPTIONAL line's fee for that academic year. Requires finance.fee_structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeOptionalSelectionInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeOptionalSelection" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_OPTIONAL_SELECTION_EXISTS (already an active selection for this Student, year and fee head).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error (not an optional line; unknown Student).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-optional-selections/{selectionId}/withdraw:
    post:
      operationId: withdrawFeeOptionalSelection
      summary: >
        Withdraws an active selection. Final; affects future assessment only and never an existing charge. Requires finance.fee_structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: selectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeOptionalSelection" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_OPTIONAL_SELECTION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_OPTIONAL_SELECTION_NOT_ACTIVE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # FEE.2 (ADR 0062 §9-§13): fee assessment runs. One run = one active fee
  # structure x one billing period. Preview creates no charge; execution is
  # queued, resumable, and idempotent by the fee_assessments key (at most
  # one live assessment per Student x academic year x fee head x billing
  # period). No proration exists (owner decision D1).
  /schools/{schoolId}/fee-assessment-runs:
    get:
      operationId: listFeeAssessmentRuns
      summary: >
        Lists assessment runs (newest first, at most 200). Requires finance.charges.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: fee_structure_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/FeeAssessmentRunStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/FeeAssessmentRun" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createFeeAssessmentRun
      summary: >
        Creates a DRAFT run for one active fee structure and one of its billing periods. At most one open run per structure and period. Requires finance.fee_assessments.run.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeAssessmentRunCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessmentRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_assessments.run in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_ASSESSMENT_RUN_OPEN_EXISTS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error (structure not active, period not on the structure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessment-runs/{runId}:
    get:
      operationId: getFeeAssessmentRun
      summary: >
        Fetches one run with its preview and execution totals. Requires finance.charges.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessmentRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_RUN_NOT_FOUND (nonexistent or another School -- identical response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessment-runs/{runId}/items:
    get:
      operationId: listFeeAssessmentRunItems
      summary: >
        Lists a run's items (50 per page) with preview result, reason and execution state. Requires finance.charges.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: preview_result, in: query, required: false, schema: { type: string, enum: [ready, already_assessed, excluded, blocked] } }
        - { name: execution_status, in: query, required: false, schema: { type: string, enum: [pending, succeeded, skipped_already_assessed, failed] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/FeeAssessmentRunItem" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_RUN_NOT_FOUND (nonexistent or another School -- identical response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessment-runs/{runId}/preview:
    post:
      operationId: previewFeeAssessmentRun
      summary: >
        Computes (or recomputes) every item of a draft or previewed run. Creates no charge. Staff exclusions carry over. Requires finance.fee_assessments.run.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessmentRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_assessments.run in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_RUN_NOT_FOUND (nonexistent or another School -- identical response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_ASSESSMENT_RUN_ILLEGAL_STATE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The structure is no longer active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessment-runs/{runId}/execute:
    post:
      operationId: executeFeeAssessmentRun
      summary: >
        Claims a previewed run whose preview is current and queues its execution. Each ready item becomes exactly one charge, or is skipped when the Student is already assessed for that fee head and period. Requires finance.fee_assessments.run.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessmentRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_assessments.run in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_RUN_NOT_FOUND (nonexistent or another School -- identical response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_ASSESSMENT_RUN_STALE_PREVIEW or FEE_ASSESSMENT_RUN_ILLEGAL_STATE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessment-runs/{runId}/resume:
    post:
      operationId: resumeFeeAssessmentRun
      summary: >
        Re-queues an executing run (after an interruption or a School pause). Only pending items are processed. Requires finance.fee_assessments.run.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessmentRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_assessments.run in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_RUN_NOT_FOUND (nonexistent or another School -- identical response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_ASSESSMENT_RUN_ILLEGAL_STATE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessment-runs/{runId}/cancel:
    post:
      operationId: cancelFeeAssessmentRun
      summary: >
        Cancels a draft or previewed run. Nothing was charged. Requires finance.fee_assessments.run.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessmentRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_assessments.run in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_RUN_NOT_FOUND (nonexistent or another School -- identical response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_ASSESSMENT_RUN_ILLEGAL_STATE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessment-runs/{runId}/items/{itemId}/exclude:
    post:
      operationId: excludeFeeAssessmentRunItem
      summary: >
        Excludes one READY item (reason staff_excluded, actor and time recorded). Never changes the fee structure or the amount. Returns the run to draft, so it must be previewed again. Requires finance.fee_assessments.run.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessmentRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_assessments.run in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_RUN_NOT_FOUND or FEE_ASSESSMENT_RUN_ITEM_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_ASSESSMENT_RUN_ITEM_NOT_EXCLUDABLE or FEE_ASSESSMENT_RUN_ILLEGAL_STATE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-assessments/{assessmentId}/void:
    post:
      operationId: voidFeeAssessment
      summary: >
        Voids a live fee assessment and cancels its charge in one transaction (refused when a payment is allocated). Frees the Student x year x fee head x period key for one deliberate re-assessment. No refund or credit. Requires finance.charges.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeAssessmentVoidInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeAssessment" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_ASSESSMENT_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_ASSESSMENT_ALREADY_VOIDED or CHARGE_HAS_PAYMENT_ALLOCATIONS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # FEE.3 (ADR 0062 §14, §19; owner decisions F, F2, G1, M): concessions,
  # scholarships and waivers. Highly Sensitive; every read is audited.
  # Request/approval are separate duties (the decider is never the
  # requester, database-enforced). No DELETE, no free-text note.
  /schools/{schoolId}/fee-settings:
    get:
      operationId: getFeeSettings
      summary: >
        Reads the School's Fees settings (the concession ledger account, F2). Requires finance.fee_structures.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeSettings" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_structures.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/fee-settings/concession-account:
    put:
      operationId: setFeeConcessionAccount
      summary: >
        Sets the School's concession posting account: an active INR expense account of this School. Posted adjustments keep their own debit account. Requires finance.fee_structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeConcessionAccountInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeSettings" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error (not an active expense account of this School).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-settings/receipt-numbering:
    put:
      operationId: setFeeReceiptNumbering
      summary: >
        FEE.4: sets the receipt prefix (letters, digits, hyphens; at most 16; uppercased) and the financial-year start month (1-12). The prefix cannot change while the School's current series has receipts; the start month cannot change once any receipt exists. Requires finance.fee_structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeReceiptNumberingInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeSettings" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: RECEIPT_NUMBERING_LOCKED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error (prefix format, month range).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-concessions:
    get:
      operationId: listFeeConcessions
      summary: >
        Lists concession requests, newest first, 25 per page. Audited (fee_concession.list_viewed). Requires finance.fee_concessions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected, withdrawn, revoked] } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [targeted, standing] } }
        - { name: student_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: charge_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: "#/components/schemas/FeeConcession" } }, meta: { $ref: "#/components/schemas/FeeConcessionPageMeta" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_concessions.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: requestFeeConcession
      summary: >
        Requests a concession (always pending; never a posting). Targeted = one charge, fixed amount; standing = Student x year x optional fee head x validity window, applied when assessment creates matching charges. The client-generated idempotency_key replays the same requester's identical request (200) and refuses anything else (409). Requires finance.fee_concessions.request.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeConcessionRequestInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeConcession" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_concessions.request in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CHARGE_NOT_FOUND, STUDENT_NOT_FOUND, ACADEMIC_YEAR_NOT_FOUND or FEE_HEAD_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_CONCESSION_IDEMPOTENCY_CONFLICT or CHARGE_ALREADY_CANCELLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error (closed category, value shape, window inside the year).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-concessions/{concessionId}:
    get:
      operationId: getFeeConcession
      summary: >
        One concession with its posted adjustments. Audited (fee_concession.viewed). Requires finance.fee_concessions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: concessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeConcessionDetail" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_concessions.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_CONCESSION_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/fee-concessions/{concessionId}/withdraw:
    post:
      operationId: withdrawFeeConcession
      summary: >
        The requester withdraws their own pending request. Requires finance.fee_concessions.request.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: concessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
