    LeavePolicyAssignment:
      type: object
      required: [id, employmentRecordId, leavePolicyId, leaveTypeId, effectiveFrom, ended]
      properties:
        id: { type: string, format: uuid }
        employmentRecordId: { type: string, format: uuid }
