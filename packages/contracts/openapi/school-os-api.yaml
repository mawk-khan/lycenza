        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeStructureCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeStructureDetail" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.fee_structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: FEE_STRUCTURE_CODE_TAKEN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error (including a case-insensitive duplicate code, or a closed year, inactive grade or campus).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/fee-structures/{feeStructureId}:
