    LeavePolicyCreateInput:
      type: object
      required: [leave_type_id, name, annual_allocation_units, carry_forward_allowed]
      properties:
        leave_type_id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        annual_allocation_units: { type: integer, minimum: 0 }
        carry_forward_allowed: { type: boolean }
        carry_forward_cap_units: { type: integer, minimum: 1, nullable: true }
        carry_forward_expiry_days: { type: integer, minimum: 1, nullable: true }
        supersedes_policy_id: { type: string, format: uuid, nullable: true }
    StaffWeeklyPattern:
      type: object
      required: [weeklyPattern]
      properties:
        weeklyPattern: { type: object, additionalProperties: { type: string, enum: [full, first_half, "off"] }, description: "ISO weekday (1..7) => portion." }
