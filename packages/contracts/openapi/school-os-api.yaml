  headers:
    RateLimitLimit:
      description: The caller's own request budget for the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the caller's own current window.
      schema: { type: integer }
    XRequestId:
      description: Correlates this response with server-side logs/audit entries.
      schema: { type: string, format: uuid }
    IdempotencyReplayed:
      description: >
        Present and "true" only when this response is a replay of a
        previously completed request with the same Idempotency-Key
        (docs/architecture/API.md, "Idempotency"); absent on a request's
        first, freshly-executed response.
      schema: { type: string, enum: ["true"] }
    RetryAfter:
      description: >
        Phase 8A.15 -- seconds until the caller's rate-limit window
        resets. Present on every 429 across the whole `/api/v1` surface
        (not HR-specific) since `bootstrap/app.php`'s exception
        renderer merges `ThrottleRequestsException::getHeaders()`.
      schema: { type: integer }

  schemas:
    ResponseMeta:
      type: object
      required: [apiVersion, requestId]
      properties:
        apiVersion: { type: string, example: v1 }
        requestId: { type: string, format: uuid, nullable: true }

    PaginationMeta:
      type: object
      required: [page, perPage, total]
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, status, requestId]
          properties:
            message: { type: string }
            status: { type: integer }
            code:
              type: string
              nullable: true
              description: >
                Stable machine-readable error code (e.g.
                IDEMPOTENCY_KEY_CONFLICT, API_SCOPE_INSUFFICIENT), present only for exceptions
                that define one. null otherwise -- see
                docs/architecture/API.md ("Error format").
            requestId: { type: string, format: uuid, nullable: true }
            errors:
              type: object
              nullable: true
              description: Field-level validation errors, present only on 422 responses.

    Money:
      type: object
      description: >
        Phase 0G.6: an exact decimal amount plus its explicit currency --
        NEVER a JSON number/float (docs/architecture/adr/0030). `amount`
        is a plain decimal string, at most 12 integer digits and 2
        fractional digits (matching every Phase 0G table's
        NUMERIC(14,2) columns); no scientific notation, no locale
        formatting.
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", example: "1000.00" }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: INR, description: "INR only in Phase 0G -- no multi-currency support yet." }

    LedgerAccount:
      type: object
      required: [id, code, name, type, currency, isSystem, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        currency: { type: string, example: INR }
        isSystem: { type: boolean }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # FEE.1 (ADR 0062) schemas.
    LedgerAccountCreateInput:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, maxLength: 32, description: "Normalized to uppercase; unique per School case-insensitively." }
        name: { type: string, maxLength: 120 }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
    LedgerAccountStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, inactive] }
    FeeHead:
      type: object
      required: [id, code, name, description, status, receivableLedgerAccountId, revenueLedgerAccountId, currency]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        receivableLedgerAccountId: { type: string, format: uuid }
        revenueLedgerAccountId: { type: string, format: uuid }
        currency: { type: string, example: INR }
    FeeHeadCreateInput:
      type: object
      required: [code, name, receivable_ledger_account_id, revenue_ledger_account_id]
      properties:
        code: { type: string, maxLength: 32, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$" }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500, nullable: true }
        receivable_ledger_account_id: { type: string, format: uuid, description: An active asset account of this School. }
        revenue_ledger_account_id: { type: string, format: uuid, description: A different, active income account of this School. }
    FeeHeadUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500, nullable: true }
        receivable_ledger_account_id: { type: string, format: uuid }
        revenue_ledger_account_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }
    FeeStructureStatus:
      type: string
      enum: [draft, active, retired]
    FeeStructure:
      type: object
      required: [id, academicYearId, gradeLevelId, campusId, code, name, status, supersedesFeeStructureId, activatedAt, retiredAt]
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true, description: "null = the School-wide default for this grade." }
        code: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/FeeStructureStatus" }
        supersedesFeeStructureId: { type: string, format: uuid, nullable: true }
        activatedAt: { type: string, format: date-time, nullable: true }
        retiredAt: { type: string, format: date-time, nullable: true }
    FeeStructureDetail:
      allOf:
        - { $ref: "#/components/schemas/FeeStructure" }
        - type: object
          required: [lines]
          properties:
            lines: { type: array, items: { $ref: "#/components/schemas/FeeStructureLine" } }
    FeeStructureLine:
      type: object
      required: [id, feeHeadId, isOptional, frequency, amount, currency, installments]
      properties:
        id: { type: string, format: uuid }
        feeHeadId: { type: string, format: uuid }
        isOptional: { type: boolean }
        frequency: { type: string, enum: [one_time, term, monthly, custom], description: Descriptive only; the installments are the schedule. }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", description: The yearly amount. }
        currency: { type: string, example: INR }
        installments: { type: array, items: { $ref: "#/components/schemas/FeeStructureInstallment" } }
    FeeStructureInstallment:
      type: object
      required: [id, sequence, label, billingPeriodKey, periodStartsOn, periodEndsOn, dueDate, academicTermId, amount, currency]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer }
        label: { type: string }
        billingPeriodKey: { type: string, description: "Normalized period identity (e.g. ANNUAL, T1, 2026-07)." }
        periodStartsOn: { type: string, format: date }
        periodEndsOn: { type: string, format: date }
        dueDate: { type: string, format: date }
        academicTermId: { type: string, format: uuid, nullable: true }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
    FeeStructureCreateInput:
      type: object
      required: [academic_year_id, grade_level_id, code, name]
      properties:
        academic_year_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        campus_id: { type: string, format: uuid, nullable: true }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 120 }
    FeeStructureUpdateInput:
      type: object
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 120 }
    FeeStructureSuccessorInput:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 120 }
    FeeStructureLineInput:
      type: object
      required: [fee_head_id, amount]
      properties:
        fee_head_id: { type: string, format: uuid }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        is_optional: { type: boolean }
        frequency: { type: string, enum: [one_time, term, monthly, custom] }
    FeeStructureLineUpdateInput:
      type: object
      properties:
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        is_optional: { type: boolean }
    FeeInstallmentScheduleInput:
      type: object
      required: [installments]
      properties:
        installments:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            required: [label, billing_period_key, period_starts_on, period_ends_on, due_date, amount]
            properties:
              label: { type: string, maxLength: 64 }
              billing_period_key: { type: string, maxLength: 32 }
              period_starts_on: { type: string, format: date }
              period_ends_on: { type: string, format: date }
              due_date: { type: string, format: date }
              academic_term_id: { type: string, format: uuid, nullable: true }
              amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
    FeeInstallmentGenerateInput:
      type: object
      required: [frequency]
      properties:
        frequency: { type: string, enum: [one_time, term, monthly] }
    FeeOptionalSelection:
      type: object
      required: [id, studentId, academicYearId, feeHeadId, feeStructureLineId, status, selectedAt, withdrawnAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        feeHeadId: { type: string, format: uuid }
        feeStructureLineId: { type: string, format: uuid }
        status: { type: string, enum: [active, withdrawn] }
        selectedAt: { type: string, format: date-time }
        withdrawnAt: { type: string, format: date-time, nullable: true }
    FeeOptionalSelectionInput:
      type: object
      required: [student_id, fee_structure_line_id]
      properties:
        student_id: { type: string, format: uuid }
        fee_structure_line_id: { type: string, format: uuid }

    # FEE.2 (ADR 0062) schemas.
    FeeAssessmentRunStatus:
      type: string
      enum: [draft, previewed, executing, completed, completed_with_errors, cancelled]
    FeeAssessmentRun:
      type: object
      required: [id, feeStructureId, billingPeriodKey, status, configurationVersion, previewIsCurrent, currency, preview, execution, createdAt, previewedAt, executionStartedAt, completedAt, cancelledAt]
      properties:
        id: { type: string, format: uuid }
        feeStructureId: { type: string, format: uuid }
        billingPeriodKey: { type: string }
        status: { $ref: "#/components/schemas/FeeAssessmentRunStatus" }
        configurationVersion: { type: integer }
        previewIsCurrent: { type: boolean, description: "true only when the run is previewed and nothing changed since." }
        currency: { type: string, example: INR }
        preview:
          type: object
          required: [readyCount, readyAmount, excludedCount, blockedCount, alreadyAssessedCount]
          properties:
            readyCount: { type: integer }
            readyAmount: { type: string, pattern: "^\\d{1,14}(\\.\\d{1,2})?$" }
            excludedCount: { type: integer }
            blockedCount: { type: integer }
            alreadyAssessedCount: { type: integer }
        execution:
          type: object
          required: [succeededCount, skippedCount, failedCount, assessedAmount]
          properties:
            succeededCount: { type: integer }
            skippedCount: { type: integer }
            failedCount: { type: integer }
            assessedAmount: { type: string, pattern: "^\\d{1,14}(\\.\\d{1,2})?$" }
        createdAt: { type: string, format: date-time }
        previewedAt: { type: string, format: date-time, nullable: true }
        executionStartedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
    FeeAssessmentRunItem:
      type: object
      required: [id, studentId, studentEnrollmentId, campusId, enrollmentStartsOn, feeStructureLineId, feeHeadId, billingPeriodKey, amount, currency, previewResult, reason, excludedAt, executionStatus, failureReason, feeAssessmentId, executedAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        studentEnrollmentId: { type: string, format: uuid, nullable: true }
        campusId: { type: string, format: uuid, nullable: true }
        enrollmentStartsOn: { type: string, format: date, nullable: true }
        feeStructureLineId: { type: string, format: uuid }
        feeHeadId: { type: string, format: uuid }
        billingPeriodKey: { type: string }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", description: The instalment amount -- never prorated. }
        currency: { type: string, example: INR }
        previewResult: { type: string, enum: [ready, already_assessed, excluded, blocked] }
        reason: { type: string, nullable: true, enum: [optional_not_selected, period_before_enrollment, enrollment_cancelled, student_inactive, staff_excluded, no_structure, head_inactive, account_invalid, null] }
        excludedAt: { type: string, format: date-time, nullable: true }
        executionStatus: { type: string, nullable: true, enum: [pending, succeeded, skipped_already_assessed, failed, null] }
        failureReason: { type: string, nullable: true, enum: [structure_not_active, structure_not_resolved, enrollment_not_qualifying, student_inactive, optional_not_selected, head_inactive, account_invalid, error, concession_exceeds_outstanding, concession_account_invalid, null] }
        feeAssessmentId: { type: string, format: uuid, nullable: true }
        executedAt: { type: string, format: date-time, nullable: true }
    FeeAssessment:
      type: object
      required: [id, studentId, academicYearId, feeHeadId, billingPeriodKey, chargeId, feeAssessmentRunId, voidedAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        feeHeadId: { type: string, format: uuid }
        billingPeriodKey: { type: string }
        chargeId: { type: string, format: uuid }
        feeAssessmentRunId: { type: string, format: uuid, nullable: true }
        voidedAt: { type: string, format: date-time, nullable: true }
    FeeAssessmentRunCreateInput:
      type: object
      required: [fee_structure_id, billing_period_key]
      properties:
        fee_structure_id: { type: string, format: uuid }
        billing_period_key: { type: string, maxLength: 32 }
    FeeAssessmentVoidInput:
      type: object
      properties:
        reason: { type: string, maxLength: 255, nullable: true }
    LateFeeRule:
      type: object
      description: "A late-fee rule (owner decision H). Legal: DEVELOPMENT AUTHORISED -- PROD LEGAL SIGN-OFF REQUIRED."
      required: [id, name, feeStructureId, feeHeadId, lateFeeHeadId, graceDays, kind, fixedAmount, percentage, maxAmount, currency, status, configurationVersion]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        feeStructureId: { type: string, format: uuid }
        feeHeadId: { type: string, format: uuid, nullable: true, description: Null = every line of the structure. }
        lateFeeHeadId: { type: string, format: uuid, description: The fee head whose accounts carry the late fee. }
        graceDays: { type: integer, minimum: 0 }
        kind: { type: string, enum: [fixed, percentage] }
        fixedAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", nullable: true }
        percentage: { type: string, nullable: true, description: "Of the source charge's current outstanding; 0 < p <= 100." }
        maxAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", nullable: true }
        currency: { type: string, enum: [INR] }
        status: { type: string, enum: [active, inactive] }
        configurationVersion: { type: integer }
    LateFeeRuleInput:
      allOf:
        - { $ref: "#/components/schemas/LateFeeRuleUpdateInput" }
        - type: object
          required: [fee_structure_id]
          properties:
            fee_structure_id: { type: string, format: uuid }
    LateFeeRuleUpdateInput:
      type: object
      required: [name, late_fee_head_id, grace_days, kind]
      properties:
        name: { type: string, maxLength: 120 }
        fee_head_id: { type: string, format: uuid, nullable: true }
        late_fee_head_id: { type: string, format: uuid }
        grace_days: { type: integer, minimum: 0, maximum: 3650 }
        kind: { type: string, enum: [fixed, percentage] }
        fixed_amount: { type: string, nullable: true }
        percentage: { type: string, nullable: true }
        max_amount: { type: string, nullable: true }
    LateFeeRunCreateInput:
      type: object
      required: [late_fee_rule_id]
      properties:
        late_fee_rule_id: { type: string, format: uuid }
        evaluation_date: { type: string, format: date, nullable: true, description: School-calendar date; default today; never in the future. }
    LateFeeRun:
      type: object
      required: [id, lateFeeRuleId, evaluationDate, status, currency, preview, execution, createdAt]
      properties:
        id: { type: string, format: uuid }
        lateFeeRuleId: { type: string, format: uuid }
        evaluationDate: { type: string, format: date }
        status: { type: string, enum: [draft, previewed, executing, completed, completed_with_errors, cancelled] }
        currency: { type: string, enum: [INR] }
        preview:
          type: object
          required: [readyCount, readyAmount, notEligibleCount, alreadyAssessedCount, previewedAt]
          properties:
            readyCount: { type: integer }
            readyAmount: { type: string }
            notEligibleCount: { type: integer }
            alreadyAssessedCount: { type: integer }
            previewedAt: { type: string, format: date-time, nullable: true }
        execution:
          type: object
          required: [succeededCount, skippedCount, failedCount, assessedAmount, startedAt, completedAt]
          properties:
            succeededCount: { type: integer }
            skippedCount: { type: integer }
            failedCount: { type: integer }
            assessedAmount: { type: string }
            startedAt: { type: string, format: date-time, nullable: true }
            completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    LateFeeRunItem:
      type: object
      required: [id, sourceChargeId, studentId, academicYearId, feeHeadId, billingPeriodKey, dueDate, finalGraceDate, outstandingAmount, calculatedAmount, finalAmount, capApplied, currency, previewResult, reason, executionStatus, failureReason, executedOutstandingAmount, executedAmount, executedCapApplied, lateFeeAssessmentId, executedAt]
      properties:
        id: { type: string, format: uuid }
        sourceChargeId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        feeHeadId: { type: string, format: uuid }
        billingPeriodKey: { type: string }
        dueDate: { type: string, format: date }
        finalGraceDate: { type: string, format: date, description: due_date + grace_days; nothing is assessed on or before it. }
        outstandingAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        calculatedAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        finalAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        capApplied: { type: boolean }
        currency: { type: string, enum: [INR] }
        previewResult: { type: string, enum: [ready, not_eligible, already_assessed] }
        reason: { type: string, nullable: true, enum: [grace_not_elapsed, fully_settled, zero_amount, already_assessed, null] }
        executionStatus: { type: string, nullable: true, enum: [pending, succeeded, skipped_already_assessed, failed, null] }
        failureReason: { type: string, nullable: true, enum: [rule_not_active, source_not_eligible, grace_not_elapsed, fully_settled, zero_amount, account_invalid, error, null] }
        executedOutstandingAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", nullable: true }
        executedAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", nullable: true }
        executedCapApplied: { type: boolean, nullable: true }
        lateFeeAssessmentId: { type: string, format: uuid, nullable: true }
        executedAt: { type: string, format: date-time, nullable: true }
    LateFeeAssessment:
      type: object
      required: [id, sourceChargeId, lateFeeRuleId, chargeId, lateFeeRunId, voidedAt]
      properties:
        id: { type: string, format: uuid }
        sourceChargeId: { type: string, format: uuid }
        lateFeeRuleId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid, description: The late-fee charge. }
        lateFeeRunId: { type: string, format: uuid }
        voidedAt: { type: string, format: date-time, nullable: true }
    FeeSettings:
      type: object
      required: [concessionLedgerAccountId, receiptPrefix, financialYearStartMonth]
      properties:
        concessionLedgerAccountId: { type: string, format: uuid, nullable: true }
        receiptPrefix: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{0,15}$", example: RCPT }
        financialYearStartMonth: { type: integer, minimum: 1, maximum: 12, example: 4 }
    FeeReceiptNumberingInput:
      type: object
      required: [receipt_prefix, financial_year_start_month]
      properties:
        receipt_prefix: { type: string, maxLength: 16 }
        financial_year_start_month: { type: integer, minimum: 1, maximum: 12 }
    PaymentReceipt:
      type: object
      description: A payment acknowledgement ("Payment receipt"), never a tax invoice. It carries no tax, GSTIN, HSN/SAC or taxable-value field and no Student name.
      required: [id, title, receiptNumber, seriesKey, sequenceValue, issuedAt, paymentId, source, method, manualReference, amount, currency, settledAt, studentIds, lines]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, enum: [Payment receipt] }
        receiptNumber: { type: string, example: RCPT/2026-27/000001 }
        seriesKey: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: "The School financial year of the Payment's settlement." }
        sequenceValue: { type: integer, minimum: 1 }
        issuedAt: { type: string, format: date-time }
        paymentId: { type: string, format: uuid }
        source: { type: string, enum: [provider, manual] }
        method: { type: string, nullable: true, enum: [cash, bank_transfer, cheque] }
        manualReference: { type: string, nullable: true }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, enum: [INR] }
        settledAt: { type: string, format: date-time }
        studentIds: { type: array, items: { type: string, format: uuid } }
        lines: { type: array, items: { $ref: "#/components/schemas/PaymentReceiptLine" } }
    PaymentReceiptLine:
      type: object
      required: [chargeId, amount, description, feeHeadName, billingPeriodKey, billingPeriodLabel, academicYearId]
      properties:
        chargeId: { type: string, format: uuid }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        description: { type: string, nullable: true }
        feeHeadName: { type: string, nullable: true }
        billingPeriodKey: { type: string, nullable: true }
        billingPeriodLabel: { type: string, nullable: true }
        academicYearId: { type: string, format: uuid, nullable: true }
    StudentFeeStatement:
      type: object
      required: [studentId, academicYearId, currency, lines, totals]
      properties:
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid, nullable: true }
        currency: { type: string, enum: [INR] }
        lines: { type: array, items: { $ref: "#/components/schemas/StudentFeeStatementLine" } }
        totals:
          type: object
          required: [charged, adjusted, paid, outstanding]
          properties:
            charged: { type: string }
            adjusted: { type: string }
            paid: { type: string }
            outstanding: { type: string }
    StudentFeeStatementLine:
      type: object
      required: [chargeId, academicYearId, description, feeHeadId, feeHeadName, billingPeriodKey, billingPeriodLabel, dueDate, assessedAt, cancelledAt, amount, adjustedTotal, paidTotal, outstanding, currency, adjustments, payments, lateFeeSourceChargeId, lateFeeChargeIds]
      properties:
        chargeId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        description: { type: string }
        feeHeadId: { type: string, format: uuid, nullable: true }
        feeHeadName: { type: string, nullable: true }
        billingPeriodKey: { type: string, nullable: true }
        billingPeriodLabel: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        assessedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        adjustedTotal: { type: string, description: Live (uncancelled) concession adjustments. }
        paidTotal: { type: string }
        outstanding: { type: string, description: "amount - paidTotal - adjustedTotal; 0.00 for a cancelled charge." }
        currency: { type: string, enum: [INR] }
        adjustments:
          type: array
          items:
            type: object
            required: [id, feeConcessionId, category, amount, postedAt, cancelledAt]
            properties:
              id: { type: string, format: uuid }
              feeConcessionId: { type: string, format: uuid }
              category: { type: string, enum: [concession, scholarship, waiver] }
              amount: { type: string }
              postedAt: { type: string, format: date-time }
              cancelledAt: { type: string, format: date-time, nullable: true }
        lateFeeSourceChargeId: { type: string, format: uuid, nullable: true, description: "FEE.5: set when this charge is a live late fee." }
        lateFeeChargeIds: { type: array, items: { type: string, format: uuid }, description: "FEE.5: live late fees raised on this charge." }
        payments:
          type: array
          items:
            type: object
            required: [paymentId, amount, settledAt, method, source, receiptNumber]
            properties:
              paymentId: { type: string, format: uuid }
              amount: { type: string }
              settledAt: { type: string, format: date-time, nullable: true }
              method: { type: string, nullable: true }
              source: { type: string, nullable: true }
              receiptNumber: { type: string, nullable: true }
    FeeConcessionAccountInput:
      type: object
      required: [concession_ledger_account_id]
      properties:
        concession_ledger_account_id: { type: string, format: uuid }
    FeeConcession:
      type: object
      description: A concession request. There is deliberately no note or reason field (owner decision M).
      required: [id, studentId, academicYearId, category, scope, chargeId, feeHeadId, validFrom, validTo, kind, fixedAmount, percentage, currency, status, requestedByUserId, decidedByUserId, decidedAt, withdrawnAt, revokedByUserId, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        category: { type: string, enum: [concession, scholarship, waiver] }
        scope: { type: string, enum: [targeted, standing] }
        chargeId: { type: string, format: uuid, nullable: true }
        feeHeadId: { type: string, format: uuid, nullable: true, description: Standing only; null = every fee head. }
        validFrom: { type: string, format: date, nullable: true }
        validTo: { type: string, format: date, nullable: true }
        kind: { type: string, enum: [fixed, percentage] }
        fixedAmount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", nullable: true }
        percentage: { type: string, pattern: "^\\d{1,3}(\\.\\d{1,2})?$", nullable: true }
        currency: { type: string, enum: [INR] }
        status: { type: string, enum: [pending, approved, rejected, withdrawn, revoked] }
        requestedByUserId: { type: string, format: uuid }
        decidedByUserId: { type: string, format: uuid, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
        revokedByUserId: { type: string, format: uuid, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    FeeConcessionDetail:
      allOf:
        - { $ref: "#/components/schemas/FeeConcession" }
        - type: object
          required: [adjustments]
          properties:
            adjustments: { type: array, items: { $ref: "#/components/schemas/FeeAdjustment" } }
    FeeConcessionPageMeta:
      type: object
      required: [currentPage, lastPage, perPage, total]
      properties:
        currentPage: { type: integer }
        lastPage: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
    FeeConcessionRequestInput:
      type: object
      required: [idempotency_key, scope, category, kind]
      properties:
        idempotency_key: { type: string, format: uuid }
        scope: { type: string, enum: [targeted, standing] }
        category: { type: string, enum: [concession, scholarship, waiver] }
        kind: { type: string, enum: [fixed, percentage], description: Targeted concessions are fixed only. }
        fixed_amount: { type: string, nullable: true, description: "Exact decimal string, > 0, at most two decimals." }
        percentage: { type: string, nullable: true, description: "Exact decimal string, 0 < p <= 100, at most two decimals." }
        charge_id: { type: string, format: uuid, nullable: true, description: Targeted only. }
        student_id: { type: string, format: uuid, nullable: true, description: Standing only. }
        academic_year_id: { type: string, format: uuid, nullable: true, description: Standing only. }
        fee_head_id: { type: string, format: uuid, nullable: true, description: Standing only; omit for every fee head. }
        valid_from: { type: string, format: date, nullable: true, description: Standing only; inside the academic year. }
        valid_to: { type: string, format: date, nullable: true, description: Standing only; inside the academic year. }
    FeeAdjustment:
      type: object
      required: [id, chargeId, feeConcessionId, feeAssessmentId, category, amount, currency, debitLedgerAccountId, creditLedgerAccountId, journalEntryId, postedByUserId, postedAt, cancelledAt, cancellationJournalEntryId, cancelledByUserId]
      properties:
        id: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        feeConcessionId: { type: string, format: uuid }
        feeAssessmentId: { type: string, format: uuid, nullable: true }
        category: { type: string, enum: [concession, scholarship, waiver] }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, enum: [INR] }
        debitLedgerAccountId: { type: string, format: uuid, description: The concession expense account at posting time (snapshot). }
        creditLedgerAccountId: { type: string, format: uuid, description: The charge's receivable account. }
        journalEntryId: { type: string, format: uuid }
        postedByUserId: { type: string, format: uuid, nullable: true }
        postedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancellationJournalEntryId: { type: string, format: uuid, nullable: true }
        cancelledByUserId: { type: string, format: uuid, nullable: true }
    FeeAdjustmentCancelInput:
      type: object
      properties:
        reason: { type: string, maxLength: 255, nullable: true }

    JournalLine:
      type: object
      required: [id, ledgerAccountId, accountCode, accountName, side, amount, currency]
      properties:
        id: { type: string, format: uuid }
        ledgerAccountId: { type: string, format: uuid }
        accountCode: { type: string }
        accountName: { type: string }
        side: { type: string, enum: [debit, credit] }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }

    JournalEntrySummary:
      type: object
      required: [id, currency, description, postedAt, reversalOfJournalEntryId, reversedByJournalEntryId, lineCount]
      description: Deliberately never includes posting_txid (internal PostgreSQL transaction-identity metadata, never Finance business data).
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, example: INR }
        description: { type: string }
        postedAt: { type: string, format: date-time }
        reversalOfJournalEntryId: { type: string, format: uuid, nullable: true }
        reversedByJournalEntryId: { type: string, format: uuid, nullable: true }
        lineCount: { type: integer }

    JournalEntryDetail:
      allOf:
        - $ref: "#/components/schemas/JournalEntrySummary"
        - type: object
          required: [lines]
          properties:
            lines: { type: array, items: { $ref: "#/components/schemas/JournalLine" } }

    JournalEntryResult:
      type: object
      required: [id, currency, description, postedAt, reversalOfJournalEntryId, lineCount]
      description: The result of post()/reverse() -- deliberately minimal, never the full detail's lines.
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, example: INR }
        description: { type: string }
        postedAt: { type: string, format: date-time }
        reversalOfJournalEntryId: { type: string, format: uuid, nullable: true }
        lineCount: { type: integer }

    JournalEntryInput:
      type: object
      required: [currency, description, lines]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", example: INR }
        description: { type: string, maxLength: 255 }
        lines:
          type: array
          minItems: 2
          maxItems: 50
          items:
            type: object
            required: [ledger_account_id, side, amount]
            properties:
              ledger_account_id: { type: string, format: uuid }
              side: { type: string, enum: [debit, credit] }
              amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", example: "1000.00" }

    ChargeSummary:
      type: object
      required: [id, studentId, academicYearId, description, amount, currency, dueDate, cancelledAt, createdAt]
      description: No amount_paid/remaining_balance/paid/partially_paid field -- no such settlement status could be justified without a Payment record.
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        description: { type: string }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        dueDate: { type: string, format: date, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ChargeDetail:
      allOf:
        - $ref: "#/components/schemas/ChargeSummary"
        - type: object
          required: [receivableLedgerAccountId, revenueLedgerAccountId, journalEntryId, cancellationJournalEntryId]
          properties:
            receivableLedgerAccountId: { type: string, format: uuid }
            revenueLedgerAccountId: { type: string, format: uuid }
            journalEntryId: { type: string, format: uuid }
            cancellationJournalEntryId: { type: string, format: uuid, nullable: true }

    ChargeResult:
      type: object
      required: [id, studentId, academicYearId, amount, currency, journalEntryId, cancelledAt, cancellationJournalEntryId]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        journalEntryId: { type: string, format: uuid }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancellationJournalEntryId: { type: string, format: uuid, nullable: true }

    ChargeInput:
      type: object
      required: [student_id, academic_year_id, description, amount, currency, receivable_ledger_account_id, revenue_ledger_account_id]
      properties:
        student_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        description: { type: string, maxLength: 255 }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", example: "1000.00" }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: INR }
        receivable_ledger_account_id: { type: string, format: uuid }
        revenue_ledger_account_id: { type: string, format: uuid }
        due_date: { type: string, format: date, nullable: true }

    PaymentAllocationEntry:
      type: object
      required: [chargeId, amount]
      properties:
        chargeId: { type: string, format: uuid }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }

    PaymentSummary:
      type: object
      required: [id, source, provider, method, amount, currency, settledAt, recordedAt]
      description: >
        Phase 0O.11A: `source` is `provider` (recognized from a verified
        provider event) or `manual` (an offline cash/bank transfer/cheque
        payment recorded by a School user). `provider` is null for a
        manual Payment and `method` null for a provider one. `settledAt`
        is when the money was received; `recordedAt` when Lycenza
        committed the record.
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [provider, manual] }
        provider: { type: string, nullable: true }
        method: { type: string, nullable: true, enum: [cash, bank_transfer, cheque] }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        settledAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    PaymentDetail:
      type: object
      required: [id, source, provider, providerPaymentReference, method, manualReference, recordedByUserId, amount, currency, settlementLedgerAccountId, journalEntryId, settledAt, recordedAt, allocations, receiptId, receiptNumber]
      description: >
        Never includes creation_txid, a raw provider payload, any
        provider secret/signature material, or a manual Payment's
        idempotency key -- structurally impossible, this projection
        carries only normalized, safe fields. Phase 0O.11A: provider
        fields are null for a `manual` Payment; `method`,
        `manualReference` (an optional cheque number or bank transfer
        reference -- never a card or account number) and
        `recordedByUserId` are null for a `provider` one.
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [provider, manual] }
        provider: { type: string, nullable: true }
        providerPaymentReference: { type: string, nullable: true }
        method: { type: string, nullable: true, enum: [cash, bank_transfer, cheque] }
        manualReference: { type: string, nullable: true, maxLength: 64 }
        recordedByUserId: { type: string, format: uuid, nullable: true }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        settlementLedgerAccountId: { type: string, format: uuid }
        journalEntryId: { type: string, format: uuid }
        settledAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        allocations: { type: array, items: { $ref: "#/components/schemas/PaymentAllocationEntry" } }
        receiptId: { type: string, format: uuid, nullable: true, description: "FEE.4: null only for a Payment settled before receipts existed and not yet backfilled." }
        receiptNumber: { type: string, nullable: true, example: RCPT/2026-27/000001 }

    WebhookEndpoint:
      type: object
      required: [id, name, url, status, createdAt]
      description: Never includes the signing secret (see the create/rotate-secret responses for the one-time exception).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: string, format: date-time, nullable: true }

    WebhookSubscription:
      type: object
      required: [id, webhookEndpointId, eventType, enabled]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventType: { type: string }
        enabled: { type: boolean }

    WebhookDelivery:
      type: object
      required: [id, webhookEndpointId, eventId, eventType, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivering, delivered, retrying, failed, abandoned] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lastAttempt:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WebhookDeliveryAttempt" }]

    WebhookDeliveryAttempt:
      type: object
      required: [attemptNumber, outcome]
      description: Never includes the raw response body (section 72).
      properties:
        attemptNumber: { type: integer }
        outcome: { type: string, enum: [success, transient_failure, permanent_failure, timeout, network_error] }
        responseStatus: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        errorClass: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    EducationBoard:
      type: object
      required: [id, code, name]
      description: Platform reference catalog (Phase 0D section 11) -- not School-owned.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    School:
      type: object
      required: [id, name, status, timezone, defaultLocale, countryCode]
      description: >
        `status` is the platform tenant-lifecycle field (Phase 0B) --
        read-only through this API; see SchoolProfileInput.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        legalName: { type: string, nullable: true }
        code: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, archived] }
        timezone: { type: string }
        defaultLocale: { type: string }
        website: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        addressLine2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateRegion: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        educationBoardId: { type: string, format: uuid, nullable: true }

    SchoolProfileInput:
      type: object
      description: Every field is optional (partial update) -- `status` is never accepted here.
      properties:
        name: { type: string, maxLength: 255 }
        legal_name: { type: string, maxLength: 255, nullable: true }
        code: { type: string, maxLength: 32, nullable: true }
        website: { type: string, maxLength: 255, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
        address_line1: { type: string, maxLength: 255, nullable: true }
        address_line2: { type: string, maxLength: 255, nullable: true }
        city: { type: string, maxLength: 120, nullable: true }
        state_region: { type: string, maxLength: 120, nullable: true }
        postal_code: { type: string, maxLength: 20, nullable: true }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        education_board_id: { type: string, format: uuid, nullable: true }

    Campus:
      type: object
      required: [id, name, code, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, description: "Case-insensitively unique within the School (section 65)." }
        status: { type: string, enum: [active, inactive] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }

    CampusInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        phone: { type: string, maxLength: 32, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }

    Room:
      type: object
      required: [id, campusId, name, code, roomType, status]
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        roomType: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    RoomInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        room_type: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }

    LibraryTitle:
      type: object
      required: [id, title, status]
      description: A bibliographic/catalogue record (see docs/modules/LIBRARY.md "Catalogue vs. copy modeling decision"). Never carries a copy count or availability -- see LibraryCopy for that.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    LibraryTitleInput:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        author: { type: string, maxLength: 255, nullable: true }
        isbn: { type: string, maxLength: 32, nullable: true }
        status: { type: string, enum: [active, inactive] }

    LibraryCopy:
      type: object
      required: [id, libraryTitleId, code, status, available]
      description: One individually loanable physical object. `available` is DERIVED (status active AND no active Loan), never a stored/mirrored value.
      properties:
        id: { type: string, format: uuid }
        libraryTitleId: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true, description: "Optional -- a multi-campus School may track which Campus physically holds this Copy." }
        code: { type: string, description: "The Copy's own accession identifier, case-insensitively unique within the School." }
        status: { type: string, enum: [active, inactive] }
        available: { type: boolean }

    LibraryCopyInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    LibraryLoan:
      type: object
      required: [id, status, checkedOutAt, dueAt, copy, student]
      description: One circulation/loan record. A Copy may have at most one Loan with status=active at a time (database-enforced, docs/modules/LIBRARY.md "Concurrency/database invariants").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, returned] }
        checkedOutAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        checkedInAt: { type: string, format: date-time, nullable: true }
        isOverdue: { type: boolean }
        copy:
          type: object
          required: [id, code, title]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            title: { type: string }
        student:
          type: object
          required: [id, studentNumber, firstName]
          properties:
            id: { type: string, format: uuid }
            studentNumber: { type: string }
            firstName: { type: string }
            lastName: { type: string, nullable: true }

    LibraryLoanInput:
      type: object
      required: [library_copy_id, student_id, due_at]
      properties:
        library_copy_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }

    TransportRoute:
      type: object
      required: [id, code, name, status]
      description: A Transport route (docs/modules/TRANSPORT.md "Campus ownership decision"). `campusId` null means School-wide shared Transport, not an error.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportRouteInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportStop:
      type: object
      required: [id, routeId, name, sequence, status]
      description: An ordered pickup/drop-off point belonging to exactly one Route (docs/modules/TRANSPORT.md "Stop integrity").
      properties:
        id: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        name: { type: string }
        sequence: { type: integer, minimum: 1 }
        address: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportStopInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        sequence: { type: integer, minimum: 1 }
        address: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportVehicle:
      type: object
      required: [id, code, registrationNumber, status]
      description: A School Transport vehicle. `capacity` is informational-only in this checkpoint (docs/modules/TRANSPORT.md "Vehicle capacity invariant") -- no seat-count enforcement.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        registrationNumber: { type: string }
        capacity: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportVehicleInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        registration_number: { type: string, maxLength: 64 }
        capacity: { type: integer, minimum: 1, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportRouteAssignment:
      type: object
      required: [id, routeId, status, startsOn, vehicle, driver]
      description: The historical Route <-> Vehicle <-> Driver operational configuration. At most one assignment per Route has status=active at a time (database-enforced, docs/modules/TRANSPORT.md "Route operational assignment decision").
      properties:
        id: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startsOn: { type: string, format: date-time }
        endsOn: { type: string, format: date-time, nullable: true }
        vehicle:
          type: object
          required: [id, code, registrationNumber]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            registrationNumber: { type: string }
        driver:
          type: object
          required: [id, employeeNumber, fullName]
          properties:
            id: { type: string, format: uuid }
            employeeNumber: { type: string }
            fullName: { type: string }

    TransportRouteAssignmentInput:
      type: object
      required: [vehicle_id, driver_employee_id]
      properties:
        vehicle_id: { type: string, format: uuid }
        driver_employee_id: { type: string, format: uuid }

    TransportStudentAssignment:
      type: object
      required: [id, status, startsOn, student, route]
      description: One Student's Transport assignment. At most one assignment per Student has status=active at a time (database-enforced, docs/modules/TRANSPORT.md "Student assignment model").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startsOn: { type: string, format: date-time }
        endsOn: { type: string, format: date-time, nullable: true }
        student:
          type: object
          required: [id, studentNumber, firstName]
          properties:
            id: { type: string, format: uuid }
            studentNumber: { type: string }
            firstName: { type: string }
            lastName: { type: string, nullable: true }
        route:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        pickupStop:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        dropoffStop:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    TransportStudentAssignmentInput:
      type: object
      required: [student_id, route_id]
      properties:
        student_id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        pickup_stop_id: { type: string, format: uuid, nullable: true }
        dropoff_stop_id: { type: string, format: uuid, nullable: true }

    Visitor:
      type: object
      required: [id, fullName, status]
      description: A School's Visitor directory record (docs/modules/VISITOR.md "Visitor directory model"). School-scoped, not Campus-scoped.
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    VisitorInput:
      type: object
      properties:
        full_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 32, nullable: true }
        status: { type: string, enum: [active, inactive] }

    VisitorVisit:
      type: object
      required: [id, status, purpose, checkedInAt, visitor, campus]
      description: A Visitor's check-in/check-out visit to a Campus. At most one Visit per Visitor has status=checked_in at a time (database-enforced, docs/modules/VISITOR.md "One-active-visit invariant").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [checked_in, checked_out] }
        purpose: { type: string }
        gatePassNumber: { type: string, nullable: true }
        checkedInAt: { type: string, format: date-time }
        checkedOutAt: { type: string, format: date-time, nullable: true }
        visitor:
          type: object
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            phone: { type: string, nullable: true }
        campus:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        hostEmployee:
          type: object
          nullable: true
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }

    VisitorVisitInput:
      type: object
      required: [visitor_id, campus_id, purpose]
      properties:
        visitor_id: { type: string, format: uuid }
        campus_id: { type: string, format: uuid }
        host_employee_id: { type: string, format: uuid, nullable: true }
        purpose: { type: string, maxLength: 500 }
        gate_pass_number: { type: string, maxLength: 64, nullable: true }

    Hostel:
      type: object
      required: [id, campusId, code, name, status]
      description: A School's Hostel (docs/modules/HOSTEL.md "Hostel model"). Belongs to exactly one Campus.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }

    HostelInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        campus_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }

    HostelRoom:
      type: object
      required: [id, hostelId, code, status]
      description: A Room belonging to exactly one Hostel (docs/modules/HOSTEL.md "HostelRoom model"). No stored capacity -- derive it from active HostelBed rows.
      properties:
        id: { type: string, format: uuid }
        hostelId: { type: string, format: uuid }
        code: { type: string }
        floorOrBlock: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    HostelRoomInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        floor_or_block: { type: string, maxLength: 64, nullable: true }
        status: { type: string, enum: [active, inactive] }

    HostelBed:
      type: object
      required: [id, hostelRoomId, code, status]
      description: One independently assignable physical Bed belonging to exactly one Room (docs/modules/HOSTEL.md "HostelBed model"). No stored occupant -- current occupancy is derived from the active HostelResidencyAssignment referencing this Bed.
      properties:
        id: { type: string, format: uuid }
        hostelRoomId: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }

    HostelBedInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, inactive] }

    HostelResidencyAssignment:
      type: object
      required: [id, status, startsOn, student, bed]
      description: A Student's Hostel residency assignment to a Bed. At most one assignment per Bed AND one per Student has status=active at a time (database-enforced, docs/modules/HOSTEL.md "ResidencyAssignment lifecycle").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startsOn: { type: string, format: date-time }
        endsOn: { type: string, format: date-time, nullable: true }
        student:
          type: object
          required: [id, studentNumber, firstName]
          properties:
            id: { type: string, format: uuid }
            studentNumber: { type: string }
            firstName: { type: string }
            lastName: { type: string, nullable: true }
        bed:
          type: object
          required: [id, code, room]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            room:
              type: object
              required: [id, code, hostel]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                hostel:
                  type: object
                  required: [id, code, name]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    name: { type: string }

    HostelResidencyAssignmentInput:
      type: object
      required: [student_id, hostel_bed_id]
      properties:
        student_id: { type: string, format: uuid }
        hostel_bed_id: { type: string, format: uuid }

    InventoryItem:
      type: object
      required: [id, code, name, unitOfMeasure, allowsFractionalQuantity, status]
      description: A School-wide catalogue definition of what is stocked (docs/modules/INVENTORY.md "InventoryItem model"). Carries no quantity/cost of its own.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        unitOfMeasure: { type: string, enum: [each, box, packet, kg, litre] }
        allowsFractionalQuantity: { type: boolean, description: "Derived from unitOfMeasure, never a separately stored flag." }
        status: { type: string, enum: [active, inactive] }

    InventoryItemInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        unit_of_measure: { type: string, enum: [each, box, packet, kg, litre] }
        status: { type: string, enum: [active, inactive] }

    InventoryLocation:
      type: object
      required: [id, code, name, status]
      description: A physical stock-holding location (docs/modules/INVENTORY.md "InventoryLocation model"). School-owned; campusId is optional -- a Location may be School-wide.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }

    InventoryLocationInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    InventoryStockBalance:
      type: object
      required: [id, quantityOnHand, item, location]
      description: The AUTHORITATIVE current quantity for one (Item, Location) pair (docs/modules/INVENTORY.md "Stock truth architecture"). Mathematically reconstructible from StockMovement history at any time.
      properties:
        id: { type: string, format: uuid }
        quantityOnHand: { type: string, description: "Exact decimal string, NUMERIC(14,3) -- never a float." }
        item:
          type: object
          required: [id, code, name, unitOfMeasure]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            unitOfMeasure: { type: string }
        location:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }

    StockMovement:
      type: object
      required: [id, movementType, quantity, occurredAt, item]
      description: An immutable, append-only historical stock transaction (docs/modules/INVENTORY.md "Movement history role"). No update/delete endpoint exists.
      properties:
        id: { type: string, format: uuid }
        movementType: { type: string, enum: [receipt, issue, transfer] }
        quantity: { type: string, description: "Exact decimal string, NUMERIC(14,3) -- never a float." }
        occurredAt: { type: string, format: date-time }
        item:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        fromLocation:
          type: object
          nullable: true
          required: [id, code]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
        toLocation:
          type: object
          nullable: true
          required: [id, code]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }

    StockMutationInput:
      type: object
      required: [inventory_item_id, inventory_location_id, quantity]
      properties:
        inventory_item_id: { type: string, format: uuid }
        inventory_location_id: { type: string, format: uuid }
        quantity: { type: string, description: "Exact decimal string, at most 3 decimal places (e.g. \"10\" or \"1.250\"). Whole-unit Items (each/box/packet) reject a fractional value." }

    TransferStockInput:
      type: object
      required: [inventory_item_id, from_location_id, to_location_id, quantity]
      properties:
        inventory_item_id: { type: string, format: uuid }
        from_location_id: { type: string, format: uuid }
        to_location_id: { type: string, format: uuid }
        quantity: { type: string, description: "Exact decimal string, at most 3 decimal places. from_location_id and to_location_id must differ." }

    CanteenOutlet:
      type: object
      required: [id, code, name, inventoryLocationId, status]
      description: A physical/logical canteen counter, backed by exactly one InventoryLocation it issues stock from at fulfillment time (docs/modules/CANTEEN.md "Outlet model").
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        campusId: { type: string, format: uuid, nullable: true }
        inventoryLocationId: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }

    CanteenOutletInput:
      type: object
      required: [code, name, inventory_location_id]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        campus_id: { type: string, format: uuid, nullable: true, description: "Optional -- a canteen may be School-wide. If set, inventory_location_id must belong to this SAME Campus." }
        inventory_location_id: { type: string, format: uuid }

    CanteenOutletUpdateInput:
      type: object
      description: name/status only -- inventory_location_id/campus_id are immutable after creation.
      properties:
        name: { type: string, maxLength: 255 }
        status: { type: string, enum: [active, inactive] }

    CanteenItem:
      type: object
      required: [id, code, name, price, currency, status]
      description: A School-wide canteen menu Item. price is the CURRENT sellable price -- an Order line snapshots it at placement time (docs/modules/CANTEEN.md "Price/location snapshot semantics").
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        price: { type: string, description: "Exact decimal string, NUMERIC(14,2) -- never a float." }
        currency: { type: string, example: INR }
        status: { type: string, enum: [active, inactive] }

    CanteenItemDetail:
      description: CanteenItem plus its current recipe.
      allOf:
        - { $ref: "#/components/schemas/CanteenItem" }
        - type: object
          required: [recipe]
          properties:
            recipe: { type: array, items: { $ref: "#/components/schemas/CanteenItemInventoryRequirement" } }

    CanteenItemInput:
      type: object
      required: [code, name, price]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        price: { type: string, description: "Exact decimal string, at most 2 decimal places, non-negative." }

    CanteenItemUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        price: { type: string, description: "Exact decimal string, at most 2 decimal places, non-negative." }
        status: { type: string, enum: [active, inactive] }

    CanteenItemInventoryRequirement:
      type: object
      required: [id, inventoryItemId, inventoryItemCode, inventoryItemName, quantityRequired]
      description: The recipe -- how much of one InventoryItem one unit of a CanteenItem consumes. Evaluated AT FULFILLMENT time, never snapshotted at placement (docs/modules/CANTEEN.md "Recipe model").
      properties:
        id: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        inventoryItemCode: { type: string }
        inventoryItemName: { type: string }
        quantityRequired: { type: string, description: "Exact decimal string, NUMERIC(14,3) -- never a float." }

    CanteenItemInventoryRequirementInput:
      type: object
      required: [inventory_item_id, quantity_required]
      properties:
        inventory_item_id: { type: string, format: uuid }
        quantity_required: { type: string, description: "Exact decimal string, at most 3 decimal places, positive." }

    CanteenItemInventoryRequirementUpdateInput:
      type: object
      required: [quantity_required]
      properties:
        quantity_required: { type: string, description: "Exact decimal string, at most 3 decimal places, positive." }

    CanteenBillingConfiguration:
      type: object
      required: [id, receivableLedgerAccountId, revenueLedgerAccountId, currency]
      description: A School-wide singleton naming the two LedgerAccounts (asset receivable, income revenue) Canteen order fulfillment posts a Charge against (docs/modules/CANTEEN.md "Billing configuration").
      properties:
        id: { type: string, format: uuid }
        receivableLedgerAccountId: { type: string, format: uuid }
        revenueLedgerAccountId: { type: string, format: uuid }
        currency: { type: string, example: INR }

    CanteenBillingConfigurationInput:
      type: object
      required: [receivable_ledger_account_id, revenue_ledger_account_id]
      properties:
        receivable_ledger_account_id: { type: string, format: uuid, description: "Must be an active LedgerAccount of type asset, owned by this School." }
        revenue_ledger_account_id: { type: string, format: uuid, description: "Must be an active LedgerAccount of type income, owned by this School. Must differ from receivable_ledger_account_id." }

    CanteenOrderSummary:
      type: object
      required: [id, status, studentId, outletId, placedAt]
      description: Highly Sensitive list/summary projection -- deliberately excludes every money field and the line array (docs/modules/CANTEEN.md "Highly Sensitive data handling"). Use the detail endpoint for money.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, fulfilled, cancelled] }
        studentId: { type: string, format: uuid }
        outletId: { type: string, format: uuid }
        placedAt: { type: string, format: date-time }
        fulfilledAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }

    CanteenOrderLine:
      type: object
      required: [id, canteenItemId, quantity, unitPrice, lineTotal, currency]
      description: unit_price/line_total are SNAPSHOTS taken at placement time -- immutable afterward (no update/delete endpoint exists for this resource, docs/modules/CANTEEN.md "Order money authority").
      properties:
        id: { type: string, format: uuid }
        canteenItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: string, description: "Exact decimal string, NUMERIC(14,2) -- never a float." }
        lineTotal: { type: string, description: "Exact decimal string; database CHECK proves lineTotal = unitPrice * quantity." }
        currency: { type: string, example: INR }

    CanteenOrder:
      description: Full Order detail (Highly Sensitive) -- CanteenOrderSummary plus every money field and every line.
      allOf:
        - { $ref: "#/components/schemas/CanteenOrderSummary" }
        - type: object
          required: [totalAmount, currency, inventoryLocationId, lines]
          properties:
            totalAmount: { type: string, description: "Exact decimal string; equals the sum of every line's lineTotal (defensively re-checked at placement time)." }
            currency: { type: string, example: INR }
            chargeId: { type: string, format: uuid, nullable: true, description: "Set only once, at fulfillment (canteen_orders_charge_id_unique partial index proves one Charge belongs to at most one Order)." }
            inventoryLocationId: { type: string, format: uuid, description: "Snapshotted from the Outlet at placement time -- never re-derived at fulfillment." }
            lines: { type: array, items: { $ref: "#/components/schemas/CanteenOrderLine" } }

    PlaceCanteenOrderInput:
      type: object
      required: [student_id, outlet_id, lines]
      properties:
        student_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [canteen_item_id, quantity]
            properties:
              canteen_item_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
          description: No two lines may repeat the same canteen_item_id -- combine quantities into a single line instead (CANTEEN_DUPLICATE_ITEM_LINE).

    AcademicYear:
      type: object
      required: [id, name, code, startsOn, endsOn, status]
      description: Only one Academic Year per School may be `active` (section 16, database-enforced).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [draft, active, closed, archived] }

    AcademicYearInput:
      type: object
      required: [name, code, starts_on, ends_on]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: "Must be after starts_on." }

    AcademicTerm:
      type: object
      required: [id, academicYearId, name, code, startsOn, endsOn, sequence]
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        sequence: { type: integer }

    AcademicTermInput:
      type: object
      required: [name, code, starts_on, ends_on, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        sequence: { type: integer, minimum: 1 }

    GradeLevel:
      type: object
      required: [id, name, code, sequence, status]
      description: School-wide reference data (not Campus/Year-scoped, section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        sequence: { type: integer, description: "Explicit pedagogical ordering -- never inferred from name/code." }
        educationStage: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    GradeLevelInput:
      type: object
      required: [name, code, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        sequence: { type: integer, minimum: 0 }
        education_stage: { type: string, nullable: true }

    Section:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, name, code, status]
      description: Belongs to exactly one Academic Year (section 28 -- never reused across years).
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        capacity: { type: integer, nullable: true, description: "Advisory only (section 27) -- not admission-enforced." }
        status: { type: string, enum: [active, inactive] }

    SectionInput:
      type: object
      required: [campus_id, grade_level_id, name, code]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        capacity: { type: integer, nullable: true }

    Subject:
      type: object
      required: [id, name, code, subjectType, status]
      description: School-wide reference data (section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        shortName: { type: string, nullable: true }
        subjectType: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academicDepartmentId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        short_name: { type: string, maxLength: 32, nullable: true }
        subject_type: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academic_department_id: { type: string, format: uuid, nullable: true }

    AcademicDepartment:
      type: object
      required: [id, name, code, status]
      description: Deliberately distinct from a future HR organizational Department (section 32).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }

    AcademicDepartmentInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }

    SubjectOffering:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, subjectId, isRequired, status]
      description: >
        The academic-offering layer (sections 37-40) -- AcademicYear-
        specific by construction, never a global Grade->Subject map.
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        isRequired: { type: boolean }
        sequence: { type: integer, nullable: true }
        weeklyPeriodsTarget: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectOfferingInput:
      type: object
      required: [campus_id, grade_level_id, subject_id]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        is_required: { type: boolean, default: true }
        sequence: { type: integer, nullable: true }
        weekly_periods_target: { type: integer, nullable: true }

    # --- Phase 1A.5: Student & Guardian Identity administrative surface

    StudentSummary:
      type: object
      required: [id, studentNumber, firstName, status]
      description: >
        List-row shape -- deliberately excludes dateOfBirth (Highly
        Sensitive children's data, docs/security/DATA-CLASSIFICATION.md:
        minimized default visibility in broad list views). See Student
        for the full single-record shape.
      properties:
        id: { type: string, format: uuid }
        studentNumber: { type: string }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Student:
      type: object
      required: [id, studentNumber, firstName, status, dateOfBirth, createdAt, updatedAt]
      description: >
        Full single-record shape (show/create/update responses only --
        never the list response, see StudentSummary).
      properties:
        id: { type: string, format: uuid }
        studentNumber: { type: string }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        dateOfBirth: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StudentInput:
      type: object
      required: [student_number, first_name, date_of_birth]
      description: >
        student_number uniqueness is enforced by StudentService/the
        database (school_id, student_number), not by this contract --
        a duplicate is a 422 with code DUPLICATE_STUDENT_NUMBER.
      properties:
        student_number: { type: string, maxLength: 255 }
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }
        date_of_birth: { type: string, format: date }

    GuardianSummary:
      type: object
      required: [id, firstName, status]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Guardian:
      type: object
      required: [id, firstName, status, contacts, students]
      description: Full single-record shape (show response only).
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        contacts: { type: array, items: { $ref: "#/components/schemas/GuardianContact" } }
        students:
          type: array
          items:
            type: object
            required: [relationshipId, student, relationshipType, isPrimary, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
            properties:
              relationshipId: { type: string, format: uuid }
              student:
                type: object
                required: [id, studentNumber, firstName]
                properties:
                  id: { type: string, format: uuid }
                  studentNumber: { type: string }
                  firstName: { type: string }
                  lastName: { type: string, nullable: true }
              relationshipType: { $ref: "#/components/schemas/RelationshipType" }
              isPrimary: { type: boolean }
              isLegalGuardian: { type: boolean }
              isEmergencyContact: { type: boolean }
              isAuthorizedPickup: { type: boolean }

    GuardianInput:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }

    ContactType:
      type: string
      enum: [email, mobile]

    RelationshipType:
      type: string
      enum: [mother, father, parent, step_parent, grandparent, legal_guardian, foster_guardian, sibling, relative, other]

    GuardianContact:
      type: object
      required: [id, type, value, isPrimary, isActive]
      description: >
        Approved fields only -- never encrypted_value, lookup_hash, or
        lookup_key_version (docs/modules/STUDENT-GUARDIAN-IDENTITY.md,
        "Sensitive response exclusions"). `value` is the decrypted
        plaintext, returned only to an actor already holding
        guardians.view.
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string }
        label: { type: string, nullable: true }
        isPrimary: { type: boolean }
        isActive: { type: boolean }
        verifiedAt: { type: string, format: date-time, nullable: true }

    GuardianContactInput:
      type: object
      required: [type, value]
      description: >
        `value` for type=mobile must already be E.164
        (docs/modules/STUDENT-GUARDIAN-IDENTITY.md, "Guardian contact
        mutation") -- a local number is rejected, never silently
        converted.
      properties:
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string, maxLength: 255 }
        label: { type: string, maxLength: 255, nullable: true }
        is_primary: { type: boolean, default: false }

    GuardianCandidateLookupInput:
      type: object
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string, maxLength: 255 }

    StudentGuardianRelationship:
      type: object
      required: [id, studentId, guardian, relationshipType, isPrimary, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        guardian: { $ref: "#/components/schemas/GuardianSummary" }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        isPrimary: { type: boolean }
        isLegalGuardian: { type: boolean }
        isEmergencyContact: { type: boolean }
        isAuthorizedPickup: { type: boolean }

    StudentGuardianRelationshipLinkInput:
      type: object
      required: [guardian_id, relationship_type]
      description: >
        Deliberately excludes is_primary -- see the .../primary action
        (StudentGuardianRelationshipService.link() never auto-promotes).
      properties:
        guardian_id: { type: string, format: uuid }
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean, default: false }
        is_emergency_contact: { type: boolean, default: false }
        is_authorized_pickup: { type: boolean, default: false }

    StudentGuardianRelationshipUpdateInput:
      type: object
      properties:
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean }
        is_emergency_contact: { type: boolean }
        is_authorized_pickup: { type: boolean }

    # --- Phase 1B.5: Student Enrollment administrative surface

    EnrollmentRef:
      type: object
      required: [id, name, code]
      description: A minimal AcademicYear/Campus/GradeLevel/Section reference embedded in an Enrollment row.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }

    EnrollmentSummary:
      type: object
      required: [id, student, academicYear, campus, gradeLevel, section, rollNumber, status, startsOn]
      description: >
        Shared shape for directory rows AND single-record detail (there
        is no broader "full" shape) -- deliberately excludes Student
        dateOfBirth and all Guardian data
        (docs/security/DATA-CLASSIFICATION.md, "minimized default
        visibility"). rollNumber is always a string, never coerced to
        a number (e.g. "007" stays "007").
      properties:
        id: { type: string, format: uuid }
        student: { $ref: "#/components/schemas/StudentSummary" }
        academicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        campus: { $ref: "#/components/schemas/EnrollmentRef" }
        gradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        section: { $ref: "#/components/schemas/EnrollmentRef" }
        rollNumber: { type: string }
        status: { type: string, enum: [active, completed, withdrawn, transferred, cancelled] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, nullable: true }

    Enrollment:
      allOf:
        - { $ref: "#/components/schemas/EnrollmentSummary" }
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    EnrollmentInput:
      type: object
      required: [section_id, roll_number, starts_on]
      description: >
        The Section is the sole authoritative placement input --
        academic_year_id/campus_id/grade_level_id/school_id/student_id
        are never accepted here and are always derived server-side from
        section_id (StudentEnrollmentService::enroll()).
      properties:
        section_id: { type: string, format: uuid }
        roll_number: { type: string, maxLength: 255 }
        starts_on: { type: string, format: date }

    # Phase 8A.14 -- HR read-only transport schemas. Deliberately
    # snake_case property names, UNLIKE every schema above this line --
    # this accurately reflects the REAL, already-committed JSON shape
    # every App\Domain\HR\Application\*::toArray() DTO has produced
    # since 8A.8/8A.9/8A.10/8A.11 (this file is the source of truth for
    # the SHAPE the implementation already has, not a license to
    # rename it to match an unrelated module's casing convention).

    LeaveSettings:
      type: object
      required: [leaveYearStartMonth, baseStartMonth, startChanges, yearsExist]
      properties:
        leaveYearStartMonth: { type: integer, minimum: 1, maximum: 12, description: "The start month for leave years after the latest scheduled change (the base month when none)." }
        baseStartMonth: { type: integer, minimum: 1, maximum: 12 }
        startChanges: { type: array, items: { $ref: "#/components/schemas/LeaveYearStartChange" } }
        yearsExist: { type: boolean }
    LeaveYearStartChange:
      type: object
      required: [id, previousStartMonth, startMonth, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        previousStartMonth: { type: integer, minimum: 1, maximum: 12 }
        startMonth: { type: integer, minimum: 1, maximum: 12 }
        effectiveFrom: { type: string, format: date }
        createdAt: { type: string, format: date-time, nullable: true }
    LeaveYearStartChangeInput:
      type: object
      required: [start_month, effective_from]
      properties:
        start_month: { type: integer, minimum: 1, maximum: 12 }
        effective_from: { type: string, format: date, description: "The first day of start_month, in the future." }
    LeaveSettingsInput:
      type: object
      required: [leave_year_start_month]
      properties:
        leave_year_start_month: { type: integer, minimum: 1, maximum: 12 }
    LeaveYear:
      type: object
      required: [id, label, startsOn, endsOn, startMonth, isTransition]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        startMonth: { type: integer }
        isTransition: { type: boolean, description: "An explicit, shorter year bridging to a scheduled start-month change." }
    LeaveYearOpenInput:
      type: object
      required: ["on"]
      properties:
        "on": { type: string, format: date }
    LeaveType:
      type: object
      required: [id, code, name, isPaid, tracksBalance, allowsHalfDay, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isPaid: { type: boolean }
        tracksBalance: { type: boolean }
        allowsHalfDay: { type: boolean }
        status: { type: string, enum: [active, inactive] }
    LeaveTypeCreateInput:
      type: object
      required: [code, name, is_paid, tracks_balance, allows_half_day]
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 120 }
        is_paid: { type: boolean }
        tracks_balance: { type: boolean }
        allows_half_day: { type: boolean }
    LeaveTypeUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        is_paid: { type: boolean }
        tracks_balance: { type: boolean }
        allows_half_day: { type: boolean }
    LeaveTypeStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, inactive] }
    LeavePolicy:
      type: object
      required: [id, leaveTypeId, name, annualAllocationUnits, carryForwardAllowed, status]
      properties:
        id: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        name: { type: string }
        annualAllocationUnits: { type: integer, minimum: 0 }
        carryForwardAllowed: { type: boolean }
        carryForwardCapUnits: { type: integer, nullable: true }
        carryForwardExpiryDays: { type: integer, nullable: true }
        status: { type: string, enum: [active, retired] }
