    TimetablePeriod:
      type: object
      required: [id, code, name, startTime, endTime, status]
      description: >
        A School-owned, reusable named time slot ("Period 1",
        09:00:00-09:45:00) that a TimetableEntry schedules against. No
        two ACTIVE Periods for the same School may have overlapping
        [startTime, endTime) ranges.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$", example: "09:00:00", description: "H:i:s (24-hour, with seconds)." }
        endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$", example: "09:45:00", description: "H:i:s (24-hour, with seconds). Always strictly after startTime." }
        sortOrder: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TimetablePeriodInput:
      type: object
      required: [code, name, start_time, end_time]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        start_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$", example: "09:00:00", description: "H:i:s (24-hour, with seconds). Must be strictly before end_time." }
        end_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$", example: "09:45:00" }
        sort_order: { type: integer, nullable: true }

    TimetablePeriodUpdateInput:
      type: object
      description: All fields optional -- only supplied fields are changed. status is never accepted here; use activate/deactivate.
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        start_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$", example: "09:00:00" }
        end_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$", example: "09:45:00" }
        sort_order: { type: integer, nullable: true }

    TimetablePaginationMeta:
      type: object
      required: [currentPage, lastPage, total]
      description: >
        The actual pagination envelope every Timetable list endpoint
        returns (Laravel's LengthAwarePaginator currentPage()/
        lastPage()/total()) -- distinct in shape from this contract's
        general `PaginationMeta` schema (page/perPage/total). per_page
        is not caller-configurable for these two endpoints (fixed
        server-side page size: 20 for Periods, 50 for Entries).
      properties:
        currentPage: { type: integer }
        lastPage: { type: integer }
        total: { type: integer }

    AttendanceStatus:
      type: string
      description: >
        The complete, closed Attendance status vocabulary. `excused`
        records the generic status ONLY and never why -- there is no
        reason, note, medical explanation or evidence field anywhere in
        this module.
      enum: [present, absent, late, excused]
    AttendanceRosterMember:
      type: object
      description: >
        One member of an as-of-date Section roster, projected
        deliberately minimally. Sensitive tier: no date of birth, no
        Guardian data, no contact details, no address.
      required: [studentEnrollmentId, studentId, rollNumber, fullName]
      properties:
        studentEnrollmentId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        rollNumber: { type: string }
        fullName: { type: string, description: "Composed server-side from the Student's name parts." }
    AttendanceScheduledClass:
      type: object
      description: >
        A CURRENTLY scheduled class, for pre-submission selection only.
        These values come from the live TimetableEntry and are NOT a
        historical register's identity.
      required: [timetableEntryId, sectionId, subjectOfferingId, teacherId, periodId, alreadySubmitted]
      properties:
        timetableEntryId: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        sectionCode: { type: string, nullable: true }
        sectionName: { type: string, nullable: true }
        subjectOfferingId: { type: string, format: uuid }
        subjectCode: { type: string, nullable: true }
        subjectName: { type: string, nullable: true }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string, nullable: true, description: "Display name only -- never work_email/work_phone." }
        periodId: { type: string, format: uuid }
        periodCode: { type: string, nullable: true }
        periodName: { type: string, nullable: true }
        periodStartTime: { type: string, nullable: true }
        periodEndTime: { type: string, nullable: true }
        alreadySubmitted: { type: boolean }
    AttendanceRecord:
      type: object
      description: >
        One Student's status on a submitted register. Student identity is
        derived THROUGH the StudentEnrollment -- there is no student_id
        column on the underlying table. The record's structural context
        columns (academic_year_id/campus_id/grade_level_id/section_id)
        exist only to carry the database's dual composite foreign keys
        and are deliberately never serialized here.
      required: [id, studentEnrollmentId, status]
      properties:
        id: { type: string, format: uuid }
        studentEnrollmentId:
          type: string
          format: uuid
          description: >
            PROVENANCE: the placement that qualified this Student for
            this register AT SUBMISSION TIME. A later transfer,
            withdrawal, completion, cancellation or rollover -- including
            a BACKDATED one -- never rewrites Attendance, so this does
            NOT assert that the Enrollment's current interval still
            contains the register's attendance_date.
        studentId: { type: string, format: uuid, nullable: true }
        rollNumber: { type: string, nullable: true }
        fullName: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
        correctedAt: { type: string, format: date-time, nullable: true, description: "Null until the record is corrected." }
    AttendanceSessionSummary:
      type: object
      description: A submitted register's header, without its record set.
      required: [id, attendanceDate, sectionId, periodStartTime, periodEndTime]
      properties:
        id: { type: string, format: uuid }
        attendanceDate: { type: string, format: date }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: "DERIVED from attendance_date -- never stored, never read from the TimetableEntry." }
        academicYearId: { type: string, format: uuid }
        academicYearName: { type: string, nullable: true }
        academicYearCode: { type: string, nullable: true }
        campusId: { type: string, format: uuid }
        campusName: { type: string, nullable: true }
        campusCode: { type: string, nullable: true }
        gradeLevelId: { type: string, format: uuid }
        gradeLevelName: { type: string, nullable: true }
        gradeLevelCode: { type: string, nullable: true }
        sectionId: { type: string, format: uuid }
        sectionCode: { type: string, nullable: true }
        sectionName: { type: string, nullable: true }
        subjectOfferingId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, nullable: true }
        subjectCode: { type: string, nullable: true }
        subjectName: { type: string, nullable: true }
        teacherId:
          type: string
          format: uuid
          description: >
            The teacher SCHEDULED to take this class at submission time.
            Not an actual substitute (v1 has no substitution model) and
            not the submitter -- that is submittedByUserId.
        teacherName: { type: string, nullable: true, description: "Display name only -- never work_email/work_phone or any other HR field." }
        periodId: { type: string, format: uuid }
        periodCode: { type: string, nullable: true, description: "CURRENT human-facing label, resolved through periodId. May legitimately disagree with the frozen times below after a Period is renamed or retimed." }
        periodName: { type: string, nullable: true, description: "CURRENT human-facing label -- see periodCode." }
        periodStartTime: { type: string, description: "IMMUTABLE historical wall-clock start, snapshotted at submission. Never the current TimetablePeriod's start_time, which can legitimately be changed later." }
        periodEndTime: { type: string, description: "IMMUTABLE historical wall-clock end -- see periodStartTime." }
        timetableEntryId:
          type: string
          format: uuid
          description: >
            PROVENANCE ONLY: the TimetableEntry from which this register
            was instantiated at submission time. That entry is fully
            mutable afterwards, so its CURRENT Section, SubjectOffering,
            teacher, Period, day-of-week and context values carry NO
            historical authority here. Never dereference it to render,
            filter, group or authorize a historical register.
        submittedByUserId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
    AttendanceSession:
      allOf:
        - { $ref: "#/components/schemas/AttendanceSessionSummary" }
        - type: object
          required: [records]
          properties:
            records: { type: array, items: { $ref: "#/components/schemas/AttendanceRecord" } }
    AttendanceRegisterInput:
      type: object
      description: >
        The ONLY client-supplied input. Note what is deliberately absent:
        section_id, academic_year_id, campus_id, grade_level_id,
        subject_offering_id, teacher_id, period_id, period_start_time and
        period_end_time are ALL server-derived from the locked
        TimetableEntry and are never accepted from a client.
      required: [timetable_entry_id, attendance_date, records]
      properties:
        timetable_entry_id: { type: string, format: uuid }
        attendance_date: { type: string, format: date, description: "Must not be in the future, must fall inside the AcademicYear, and its ISO weekday must match the TimetableEntry's day_of_week." }
        records:
          type: array
          minItems: 1
          description: "Must be EXACTLY the authoritative as-of-date roster -- no omission, no extra, no duplicate."
          items:
            type: object
            required: [student_enrollment_id, status]
            properties:
              student_enrollment_id: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/AttendanceStatus" }
    AttendanceCorrectionInput:
      type: object
      description: >
        Expected-status compare-and-swap. expected_status is the status
        the caller believes the record currently holds; new_status must
        differ from it.
      required: [expected_status, new_status]
      properties:
        expected_status: { $ref: "#/components/schemas/AttendanceStatus" }
        new_status: { $ref: "#/components/schemas/AttendanceStatus" }
    SyllabusUnitStatus:
      type: string
      description: >
        The complete, closed SyllabusUnit lifecycle vocabulary, mirrored
        by the database's own `syllabus_units_status_check` CHECK
        constraint. A retired unit is marked `inactive` and kept -- there
        is no delete operation, because a future Curriculum Delivery or
        Examinations row may reference it.
      enum: [active, inactive]
    SyllabusUnit:
      type: object
      description: >
        One ordered unit of instructional content that a SubjectOffering
        is EXPECTED to cover. It records nothing about what was actually
        taught (a future Curriculum Delivery checkpoint), nothing about
        an individual lesson (future Lesson Planning), and nothing about
        any Student. Grading/marks/grade scales belong to Examinations;
        assignments and submissions belong to LMS.
      required: [id, subjectOfferingId, code, title, sequence, status]
      properties:
        id: { type: string, format: uuid }
        subjectOfferingId:
          type: string
          format: uuid
          description: >
            The single owning SubjectOffering, which already pins
            AcademicYear, Campus, GradeLevel and Subject -- none of which
            is duplicated onto this resource.
        code: { type: string, maxLength: 64, description: "Uppercased on write; case-insensitively unique within the owning SubjectOffering." }
        title: { type: string, maxLength: 255 }
        sequence: { type: integer, minimum: 0, description: "Teaching order within the Offering. Deliberately NOT unique -- two units may share a position mid-reorder." }
        status: { $ref: "#/components/schemas/SyllabusUnitStatus" }
    SyllabusUnitCreateInput:
      type: object
      required: [code, title, sequence]
      properties:
        code: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 255 }
        sequence: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/SyllabusUnitStatus" }
    SyllabusUnitUpdateInput:
      type: object
      description: Partial update; every field is optional.
      properties:
        code: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 255 }
        sequence: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/SyllabusUnitStatus" }
    LearningContentStatus:
      type: string
      description: >
        The complete, closed LearningContent state vocabulary, mirrored
        by the database's own `learning_content_status_check` CHECK
        constraint. Exactly three legal transitions:
        draft->published, published->archived, archived->published --
        never set directly via the update operation, only through the
        dedicated publish/archive operations.
      enum: [draft, published, archived]
    LearningContent:
      type: object
      description: >
        A School-authored instructional resource (a reading, a link, a
        note, or an attached file via the Documents `learning_content`
        owner arm) belonging to one SubjectOffering. It records nothing
        about any Student, Assignment or Submission -- those belong to
        future, separately-gated LMS checkpoints (ADR 0039).
      required: [id, subjectOfferingId, title, sequence, status]
      properties:
        id: { type: string, format: uuid }
        subjectOfferingId:
          type: string
          format: uuid
          description: >
            The single owning SubjectOffering, which already pins
            AcademicYear, Campus, GradeLevel and Subject -- none of which
            is duplicated onto this resource.
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 20000 }
        sequence: { type: integer, minimum: 0, description: "Display order within the Offering. Deliberately NOT unique -- two resources may share a position mid-reorder." }
        status: { $ref: "#/components/schemas/LearningContentStatus" }
    LearningContentCreateInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 20000 }
        sequence: { type: integer, minimum: 0, description: "Defaults to 0 if omitted." }
    LearningContentUpdateInput:
      type: object
      description: >
        Partial update; every field is optional. Deliberately does NOT
        accept `status` -- a lifecycle change always goes through the
        dedicated publish/archive operations, never this one.
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 20000 }
        sequence: { type: integer, minimum: 0 }
    AssignmentStatus:
      type: string
      description: >
        The complete, closed Assignment state vocabulary, mirrored by
        the database's own `assignments_status_check` CHECK constraint.
        Exactly three legal transitions: draft->published,
        published->closed, closed->published -- never set directly via
        the update operation, only through the dedicated publish/close
        operations.
      enum: [draft, published, closed]
    Assignment:
      type: object
      description: >
        A staff-authored unit of work -- title, instructions, an
        optional due date, and a lifecycle -- that a SubjectOffering's
        roster is expected to complete. Never itself grade-bearing --
        no mark, score or grade field exists here or anywhere in LMS's
        contract (ADR 0039). Submission (a Student's response to an
        Assignment) remains a future, separately legal-review-gated
        checkpoint.
      required: [id, subjectOfferingId, title, status]
      properties:
        id: { type: string, format: uuid }
        subjectOfferingId:
          type: string
          format: uuid
          description: >
            The single owning SubjectOffering, which already pins
            AcademicYear, Campus, GradeLevel and Subject -- none of which
            is duplicated onto this resource.
        title: { type: string, maxLength: 255 }
        instructions: { type: string, nullable: true, maxLength: 20000 }
        dueOn:
          type: string
          format: date
          nullable: true
          description: >
            School-local calendar date. Nullable while `draft`; required
            before `publish()`. Informational/display-only in v1 -- not
            a structural acceptance boundary for any future Submission
            behavior.
        status: { $ref: "#/components/schemas/AssignmentStatus" }
    AssignmentCreateInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        instructions: { type: string, nullable: true, maxLength: 20000 }
        due_on: { type: string, format: date, nullable: true }
    AssignmentUpdateInput:
      type: object
      description: >
        Partial update; every field is optional. Deliberately does NOT
        accept `status` -- a lifecycle change always goes through the
        dedicated publish/close operations, never this one.
      properties:
        title: { type: string, maxLength: 255 }
        instructions: { type: string, nullable: true, maxLength: 20000 }
        due_on: { type: string, format: date, nullable: true }
    CurriculumDeliveryStatus:
      type: string
      description: >
        The complete, closed CurriculumDelivery state vocabulary,
        mirrored by the database's own
        `curriculum_deliveries_status_check` CHECK constraint.
        `not_started` is deliberately NOT a member: the ABSENCE of a
        record is what "not started" means, so nothing is ever
        pre-seeded and a client showing every unit must start from the
        Syllabus list.
      enum: [in_progress, completed]
    CurriculumDelivery:
      type: object
      description: >
        The record that one Section has covered one SyllabusUnit -- when
        that Section began it, and when, if yet, it finished. ACTUAL
        instructional coverage by a cohort, the counterpart to
        SyllabusUnit's catalogue of EXPECTED content. It records nothing
        about an individual lesson (future Lesson Planning), nothing
        about who taught it (there is no teacher identity anywhere in
        this resource, which is what keeps it non-personal), and nothing
        about any Student. Grading/marks/grade scales belong to
        Examinations; assignments, submissions and learning content
        belong to LMS. Section-specific and required-SubjectOffering-only
        in v1.
      required: [id, sectionId, subjectOfferingId, syllabusUnitId, startedOn, status]
      properties:
        id: { type: string, format: uuid }
        sectionId:
          type: string
          format: uuid
          description: The cohort that covered the unit. A Section is an organisational unit, never an individual.
        subjectOfferingId:
          type: string
          format: uuid
          description: >
            The Offering that owns the SyllabusUnit. The
            AcademicYear/Campus/GradeLevel pins that structurally bind
            the Section and the Offering to one context are database
            correctness machinery and are deliberately not exposed.
        syllabusUnitId: { type: string, format: uuid }
        startedOn: { type: string, format: date, description: "School-LOCAL calendar date the Section began this unit. Never in the future; always inside the AcademicYear." }
        completedOn: { type: string, format: date, nullable: true, description: "School-local calendar date coverage finished. NULL if and only if status is in_progress." }
        status: { $ref: "#/components/schemas/CurriculumDeliveryStatus" }
    CurriculumDeliveryCreateInput:
      type: object
      description: >
        Only the three facts a user actually chooses. Every structural
        context pin is derived server-side from the resolved parents.
      required: [section_id, syllabus_unit_id, started_on]
      properties:
        section_id: { type: string, format: uuid }
        syllabus_unit_id: { type: string, format: uuid, description: "Must belong to the SubjectOffering in the path." }
        started_on: { type: string, format: date }
    CurriculumDeliveryUpdateInput:
      type: object
      description: >
        Clerical date correction; both fields are optional. `status` is
        deliberately absent -- state changes go through the transition
        operation. `completed_on` is accepted only for an
        already-completed record.
      properties:
        started_on: { type: string, format: date }
        completed_on: { type: string, format: date }
    CurriculumDeliveryTransitionInput:
      type: object
      description: >
        Expected-status compare-and-swap. `expected_status` is the status
        the caller believes the record currently holds; `new_status` must
        differ from it and form a legal edge. `completed_on` is required
        when completing and ignored when reopening.
      required: [expected_status, new_status]
      properties:
        expected_status: { $ref: "#/components/schemas/CurriculumDeliveryStatus" }
        new_status: { $ref: "#/components/schemas/CurriculumDeliveryStatus" }
        completed_on: { type: string, format: date }
    ExaminationStatus:
      type: string
      description: >
        The complete, closed Examination lifecycle vocabulary, mirrored
        by the database's own `examinations_status_check` CHECK
        constraint. Deliberately NOT a draft/active/closed state machine:
        a retired or cancelled Examination is marked `inactive` and kept,
        and an inactive Examination continues to reserve its code, which
        is why there is no activate/deactivate operation and no delete.
      enum: [active, inactive]
    Examination:
      type: object
      description: >
        One named assessment WINDOW that a School holds within one
        AcademicYear -- "Mid-Term Examination 2026-27, 10 to 20
        September". A container, NOT an individual paper: it owns only
        its identity and the date range it spans, and owns no Subject,
        SubjectOffering, Section, paper, per-paper sitting date/time or
        max marks, no Student, enrollment, teacher or invigilator, and no
        mark, grade, result, publication state, report card or
        transcript. The per-Subject entity is a future ExaminationPaper.
      required: [id, academicYearId, code, name, startsOn, endsOn, status]
      properties:
        id: { type: string, format: uuid }
        academicYearId:
          type: string
          format: uuid
          description: The single owning AcademicYear, fixed at creation and never reassignable.
        code: { type: string, maxLength: 64, description: "Uppercased on write; case-insensitively unique within the owning AcademicYear." }
        name: { type: string, maxLength: 255, description: "Human label. Deliberately NOT unique." }
        startsOn: { type: string, format: date, description: "School calendar date the window opens. Future dates are permitted and expected." }
        endsOn: { type: string, format: date, description: "School calendar date the window closes; >= startsOn. Windows may overlap one another." }
        status: { $ref: "#/components/schemas/ExaminationStatus" }
    ExaminationCreateInput:
      type: object
      description: >
        The AcademicYear comes from the path and is never accepted here;
        neither is schoolId.
      required: [code, name, starts_on, ends_on]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        status: { $ref: "#/components/schemas/ExaminationStatus" }
    ExaminationUpdateInput:
      type: object
      description: >
        Partial update; every field is optional. The owning AcademicYear
        and School can never be changed.
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        status: { $ref: "#/components/schemas/ExaminationStatus" }
    ExaminationPaperStatus:
      type: string
      description: >
        The complete, closed ExaminationPaper lifecycle vocabulary,
        mirrored by the database's own
        `examination_papers_status_check` CHECK constraint. Deliberately
        NOT a draft/scheduled/completed/closed/cancelled/published state
        machine: a withdrawn Paper is marked `inactive` and kept, and an
        inactive Paper continues to reserve its (Examination,
        SubjectOffering) pair, which is why there is no
        activate/deactivate operation and no delete.
      enum: [active, inactive]
    ExaminationPaper:
      type: object
      description: >
        One SubjectOffering assessed within one Examination, with its
        scheduled sitting (date and time range) and maximum obtainable
        marks. Offering-wide, NOT Section-specific -- there is no
        section_id. Not a physical uploaded question-paper file, not a
        Student attempt, and carries no mark/result/grade-scale data.
        Internal integrity pins (schoolId, academicYearId, campusId,
        gradeLevelId) are server-derived and deliberately never exposed
        here.
      required: [id, examinationId, subjectOfferingId, scheduledOn, startsAt, endsAt, maxMarks, status]
      properties:
        id: { type: string, format: uuid }
        examinationId:
          type: string
          format: uuid
          description: The owning Examination, fixed at creation and never reassignable.
        subjectOfferingId:
          type: string
          format: uuid
          description: The assessed SubjectOffering, fixed at creation and never reassignable.
        scheduledOn: { type: string, format: date, description: "School calendar date the Paper is sat; inside the owning Examination's inclusive window." }
        startsAt: { type: string, description: "School-local wall-clock start time, HH:MM:SS." }
        endsAt: { type: string, description: "School-local wall-clock end time, HH:MM:SS; strictly after startsAt. Same day only." }
        maxMarks: { type: string, description: "Maximum obtainable marks, a positive decimal string." }
        status: { $ref: "#/components/schemas/ExaminationPaperStatus" }
    ExaminationPaperCreateInput:
      type: object
      description: >
        The Examination comes from the path and is never accepted here;
        neither is schoolId nor any integrity pin.
      required: [subject_offering_id, scheduled_on, starts_at, ends_at, max_marks]
      properties:
        subject_offering_id: { type: string, format: uuid }
        scheduled_on: { type: string, format: date }
        starts_at: { type: string }
        ends_at: { type: string }
        max_marks: { type: string }
        status: { $ref: "#/components/schemas/ExaminationPaperStatus" }
    ExaminationPaperUpdateInput:
      type: object
      description: >
        Partial update; every field is optional. The owning Examination
        and SubjectOffering can never be changed.
      properties:
        scheduled_on: { type: string, format: date }
        starts_at: { type: string }
        ends_at: { type: string }
        max_marks: { type: string }
        status: { $ref: "#/components/schemas/ExaminationPaperStatus" }
    GradeScaleStatus:
      type: string
      description: >
        The complete, closed GradeScale lifecycle vocabulary, mirrored
        by the database's own `grade_scales_status_check` CHECK
        constraint. Exactly three transitions are legal:
        draft -> active, active -> inactive, inactive -> active; every
        other transition, including every no-op, is rejected.
        `inactive` is reachable ONLY via `active`, so it structurally
        means "was previously active; GradeBands permanently frozen."
      enum: [draft, active, inactive]
    GradeBand:
      type: object
      description: >
        One lower-bound percentage threshold belonging to a GradeScale.
        Deliberately carries no upper bound and no sequence -- a
        percentage P maps to the band with the greatest
        `minPercentage <= P`. Mutable only while the parent GradeScale
        is `draft`; frozen forever once the parent has ever been
        `active`.
      required: [id, minPercentage, label]
      properties:
        id: { type: string, format: uuid }
        minPercentage: { type: string, description: "Decimal string, 0.00-100.00, inclusive lower bound." }
        label: { type: string, maxLength: 32, description: "Human grade label, e.g. \"A\", \"Pass\". Never included by value in audit metadata." }
    GradeScale:
      type: object
      description: >
        One named, School-owned reference mapping that converts a
        normalized percentage (0.00-100.00) into a discrete grade
        outcome through its ordered GradeBands. School-only --
        independent of the Examination chain: no Examination,
        ExaminationPaper, AcademicYear, GradeLevel or Subject
        relationship of any kind.
      required: [id, code, name, status, bands]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64, description: "Uppercased on write; case-insensitively unique within the School, unconditionally." }
        name: { type: string, maxLength: 255, description: "Human label. Deliberately NOT unique. Mutable at any lifecycle stage." }
        status: { $ref: "#/components/schemas/GradeScaleStatus" }
        bands:
          type: array
          items: { $ref: "#/components/schemas/GradeBand" }
          description: Ordered by minPercentage descending.
    GradeScaleCreateInput:
      type: object
      description: >
        `schoolId` is never accepted here. A new GradeScale is always
        created as `draft` -- there is no `status` field on create.
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        bands:
          type: array
          description: Optional initial GradeBands, created atomically with the scale.
          items:
            type: object
            required: [min_percentage, label]
            properties:
              min_percentage: { type: string }
              label: { type: string, maxLength: 32 }
    GradeScaleUpdateInput:
      type: object
      description: >
        Partial update; every field is optional. `code` can never be
        changed. `status`, when present, is always interpreted as a
        guarded lifecycle transition request, never a raw field write.
      properties:
        name: { type: string, maxLength: 255 }
        status: { $ref: "#/components/schemas/GradeScaleStatus" }
    GradeBandCreateInput:
      type: object
      required: [min_percentage, label]
      properties:
        min_percentage: { type: string }
        label: { type: string, maxLength: 32 }
    GradeBandUpdateInput:
      type: object
      description: Partial update; every field is optional.
      properties:
        min_percentage: { type: string }
        label: { type: string, maxLength: 32 }
    TimetableEntry:
      type: object
      required: [id, status, dayOfWeek, subjectOfferingId, sectionId, teacherId, periodId]
      description: >
        A single scheduled slot: a required SubjectOffering taught to a
        Section by a teacher (HR Employee) in an optional Room during a
        TimetablePeriod on a given day of week. The teacher
        representation is data-minimized to id/teacherName ONLY
        (Sensitive-tier, docs/security/DATA-CLASSIFICATION.md) -- never
        work_email/work_phone/any other HR field.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: "1 (Monday) .. 7 (Sunday)." }
        subjectOfferingId: { type: string, format: uuid }
        subjectCode: { type: string, nullable: true }
        subjectName: { type: string, nullable: true }
        sectionId: { type: string, format: uuid }
        sectionCode: { type: string, nullable: true }
        sectionName: { type: string, nullable: true }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string, nullable: true, description: "Employee.full_name only -- never work_email/work_phone." }
        roomId: { type: string, format: uuid, nullable: true }
        roomCode: { type: string, nullable: true }
        roomName: { type: string, nullable: true }
        periodId: { type: string, format: uuid }
        periodCode: { type: string, nullable: true }
        periodName: { type: string, nullable: true }
        periodStartTime: { type: string, nullable: true, example: "09:00:00" }
        periodEndTime: { type: string, nullable: true, example: "09:45:00" }

    TimetableEntryInput:
      type: object
      required: [subject_offering_id, section_id, teacher_id, period_id, day_of_week]
      description: >
        Used identically for both create and update -- update
        re-validates and rewrites the entire assignment, so every field
        is required there too (never a partial update).
        academic_year_id/campus_id/grade_level_id are never accepted --
        always derived server-side from the resolved
        subject_offering_id.
      properties:
        subject_offering_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        teacher_id: { type: string, format: uuid, description: "HR Employee id." }
        room_id: { type: string, format: uuid, nullable: true }
        period_id: { type: string, format: uuid }
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: "1 (Monday) .. 7 (Sunday)." }

    TimetableSubjectOfferingSummary:
      type: object
      required: [id, subjectCode, subjectName, gradeLevelName, campusName, academicYearName]
      description: Timetable-owned narrow projection for the Schedule form's SubjectOffering picker -- never the full SubjectOffering schema.
      properties:
        id: { type: string, format: uuid }
        subjectCode: { type: string }
        subjectName: { type: string }
        gradeLevelName: { type: string }
        campusName: { type: string }
        academicYearName: { type: string }

    TimetableSectionSummary:
      type: object
      required: [id, code, name]
      description: Timetable-owned narrow projection for the Schedule form's Section picker -- never the full Section schema.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    TimetableTeacherSummary:
      type: object
      required: [id, fullName]
      description: >
        Data-minimized (Sensitive-tier) Employee projection for the
        Schedule form's teacher picker -- ONLY id/fullName. Never
        work_email/work_phone/any other HR field, and never the
        broader Employee/EmployeeDirectoryEntry schema.
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }

    TimetableRoomSummary:
      type: object
      required: [id, code, name]
      description: Timetable-owned narrow projection for the Schedule form's Room picker -- never the full Room schema.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    TimetablePeriodSummary:
      type: object
      required: [id, code, name, startTime, endTime]
      description: Narrow projection for the Schedule form's Period picker.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        startTime: { type: string, example: "09:00:00" }
        endTime: { type: string, example: "09:45:00" }

  responses:
    TooManyRequests:
      description: >
        The caller's own rate limit has been exceeded. Every `/api/v1`
        route is limited per principal (School + user, or partner client;
        never IP alone once authenticated) -- by default `api-read`
        120/min, `api-mutation` 60/min, `api-sensitive-read` 20/min, or a
        stricter route limiter (`hr-api-*`, `documents-*`,
        `webhook-admin`); 20 failed authentications per minute for one
        credential id and client IP are refused before authentication.
        An idempotent replay consumes quota. The same global error
        envelope as every other error; describes only the caller's own
        bucket.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: >
        Missing, malformed, unknown, expired or revoked credential, or a
        disabled account. One generic body ("Unauthenticated."); never says
        which.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ScopeInsufficient:
      description: >
        Authenticated, but the credential's scope does not cover this
        operation (`code: API_SCOPE_INSUFFICIENT`), or the user lacks the
        route's capability (`code: null`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFoundNonDisclosing:
      description: >
        No such School, no active membership in it, or the School is not
        active -- indistinguishable from nonexistence.
