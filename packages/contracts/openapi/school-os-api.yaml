              schema: { $ref: "#/components/schemas/Error" }

  # Phase 0G.6: thin HTTP transport over the already-authorized 0G.2-0G.5
  # Application boundary (LedgerReadService/LedgerAdministrationService,
  # ChargeReadService/ChargeAdministrationService, PaymentReadService) --
  # never the trusted cores (LedgerService/ChargeService/
  # PaymentProviderEventService) or a raw Eloquent model. Money is
  # always an exact decimal STRING (never a JSON number) -- see the
  # `Money` schema below. No Payment mutation path exists in this API (no
  # `finance.payments.manage` capability, ADR 0031; Phase 0O.11A offline
  # recording is a School browser action only) and no provider
  # callback/webhook path is documented -- that HTTP adapter remains
  # explicitly deferred (docs/modules/FINANCE.md "0G.6 as-built").
  /schools/{schoolId}/ledger-accounts:
    get:
      operationId: listLedgerAccounts
      summary: Lists a School's chart-of-accounts entries. Requires finance.ledger.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/LedgerAccount" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.ledger.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/journal-entries:
    get:
      operationId: listJournalEntries
      summary: Lists a School's posted journal history. Requires finance.ledger.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: posted_from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: posted_to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: ledger_account_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: reversed_only, in: query, required: false, description: "true = only entries that are themselves a reversal; false = only original entries; omitted = no filter.", schema: { type: boolean } }
        - { name: search, in: query, required: false, description: Substring match on description., schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/JournalEntrySummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.ledger.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: postJournalEntry
      summary: >
        Posts a new, balanced journal entry via LedgerAdministrationService
        (never a direct journal_entries/journal_lines write). Requires
        finance.ledger.post. NOT idempotent -- 0G.2 explicitly deferred
        generic ledger-posting HTTP idempotency; no Idempotency-Key is
        accepted or required, and a retried request creates a second,
        independent journal entry.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/JournalEntryResult" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.ledger.post in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: LEDGER_ACCOUNT_NOT_FOUND -- a line names a nonexistent or cross-School ledger account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure (malformed decimal, fewer than 2 lines, unbalanced entry, non-INR currency).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/journal-entries/{journalEntryId}:
    get:
      operationId: getJournalEntry
      summary: Fetch one journal entry with its lines. Requires finance.ledger.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/JournalEntryId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/JournalEntryDetail" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.ledger.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: JOURNAL_ENTRY_NOT_FOUND -- nonexistent or belongs to a different School (identical response either way -- no cross-School oracle).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/journal-entries/{journalEntryId}/reverse:
    post:
      operationId: reverseJournalEntry
      summary: >
        Reverses a posted journal entry via
        LedgerAdministrationService::reverse() (a new, inverse journal
        entry -- the original is never mutated). Requires
        finance.ledger.reverse (a separate capability from
        finance.ledger.post). NOT a generic HTTP-idempotent endpoint --
        reversal has its own structural at-most-once semantics
        (JOURNAL_ENTRY_ALREADY_REVERSED, 409, on a repeat). Phase 0O.11A:
        a Payment's settlement journal entry is refused with
        JOURNAL_ENTRY_NOT_REVERSIBLE (409) -- reversing it directly would
        leave the Payment posted against a reversed entry.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/JournalEntryId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255, nullable: true }
      responses:
        "201":
          description: Created (the new reversing journal entry).
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/JournalEntryResult" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.ledger.reverse in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: JOURNAL_ENTRY_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: JOURNAL_ENTRY_ALREADY_REVERSED or JOURNAL_ENTRY_NOT_REVERSIBLE (a Payment-owned entry).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/charges:
    get:
      operationId: listCharges
      summary: Lists a School's Fees Charges. Requires finance.charges.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: student_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: include_cancelled, in: query, required: false, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ChargeSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: assessCharge
      summary: >
        Assesses (recognizes) a new Charge via
        ChargeAdministrationService::assess() -- immediate ledger
        recognition, no draft state. Requires finance.charges.manage.
        NOT idempotent -- 0G.4 explicitly deferred generic
        Charge-assessment HTTP idempotency; a retried request creates a
        second, independent Charge.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ChargeResult" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: STUDENT_NOT_FOUND, ACADEMIC_YEAR_NOT_FOUND, or LEDGER_ACCOUNT_NOT_FOUND (nonexistent or cross-School reference).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure (malformed decimal, non-positive amount, non-INR currency, identical receivable/revenue accounts).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/charges/{chargeId}:
    get:
      operationId: getCharge
      summary: Fetch one Charge's full detail. Requires finance.charges.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ChargeId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ChargeDetail" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CHARGE_NOT_FOUND -- nonexistent or belongs to a different School (identical response either way).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/charges/{chargeId}/cancel:
    post:
      operationId: cancelCharge
      summary: >
        Cancels an active Charge via ChargeAdministrationService::cancel()
        (reverses the recognition journal entry -- the original is never
        mutated). Requires finance.charges.manage. Rejected with
        CHARGE_HAS_PAYMENT_ALLOCATIONS (409) if any Payment has already
        been allocated to this Charge (ADR 0031) -- Refund/compensation
        is a future, separate checkpoint. NOT a generic HTTP-idempotent
        endpoint -- cancellation has its own at-most-once semantics
        (CHARGE_ALREADY_CANCELLED, 409, on a repeat).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ChargeId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ChargeResult" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.charges.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CHARGE_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: CHARGE_ALREADY_CANCELLED or CHARGE_HAS_PAYMENT_ALLOCATIONS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payments:
    get:
      operationId: listPayments
      summary: >
        Lists a School's recognized Payments (READ ONLY -- there is no
        finance.payments.manage capability and no Payment mutation in
        this API; provider settlement belongs to the trusted,
        not-yet-HTTP-exposed PaymentProviderEventService boundary, and
        Phase 0O.11A offline recording (finance.payments.record) is a
        School browser action only). Requires finance.payments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: provider_payment_reference, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PaymentSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.payments.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Fetch one Payment's full detail, including its Charge allocations. Requires finance.payments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PaymentDetail" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking finance.payments.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: PAYMENT_NOT_FOUND -- nonexistent or belongs to a different School (identical response either way).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # Phase 9.8: Payroll HTTP transport, mirroring the Finance section's
  # exact style. Every path below is authorized through the 9.7
  # Administration/Read boundary (App\Domain\Payroll\Application\*AdministrationService /
  # *ReadService) -- never a trusted core service or raw Eloquent model
  # directly. `payroll.compensation.sensitive.*`/`payroll.statutory.manage`
  # are Highly Sensitive/reserved and granted to no default role (see
  # docs/modules/PAYROLL.md "Authorization").
  /schools/{schoolId}/salary-components:
    get:
      operationId: listSalaryComponents
      summary: Lists a School's salary components (policy shape only, never an amount). Requires payroll.structures.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/SalaryComponent" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createSalaryComponent
      summary: Creates a salary component (semantic identity only, no monetary value). Requires payroll.structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
