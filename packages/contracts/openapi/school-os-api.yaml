        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollPeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.periods.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure (duplicate period_month).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-periods/{payrollPeriodId}/open:
    post:
      operationId: openPayrollPeriod
      summary: Opens a draft payroll period for run creation. Requires payroll.periods.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollPeriodId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollPeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.periods.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School id.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-periods/{payrollPeriodId}/close:
    post:
      operationId: closePayrollPeriod
      summary: Closes a payroll period. Requires payroll.periods.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollPeriodId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollPeriod" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.periods.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School id.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-periods/{payrollPeriodId}/payroll-runs:
    get:
      operationId: listPayrollRuns
      summary: Lists a period's payroll runs (non-sensitive metadata only). Requires payroll.runs.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollPeriodId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PayrollRun" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createPayrollRun
      summary: >
        Creates a regular payroll run for this period (at most one
        regular run per period). Requires payroll.runs.prepare.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollPeriodId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.prepare in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School period id.
        "409":
          description: DUPLICATE_REGULAR_RUN -- this period already has a regular run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The period is not open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}:
    get:
      operationId: getPayrollRun
      summary: Fetch one payroll run's non-sensitive metadata (status, kind, prepared/approved/posted-by). Requires payroll.runs.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: PAYROLL_RUN_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/correction:
    post:
      operationId: createCorrectionRun
      summary: >
        Creates a correction run against an original, posted regular
        run that has not been reversed (ADR 0034 -- no correction-of-
        correction chains). Requires payroll.runs.prepare.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payroll_period_id]
              properties:
                payroll_period_id: { type: string, format: uuid, description: The OPEN period the correction itself belongs to (may differ from the original run's period). }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.prepare in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School run/period id.
        "422":
          description: >
            PAYROLL_INVALID_CORRECTION_TARGET (not a posted regular
            run) or PAYROLL_CORRECTION_TARGET_ALREADY_REVERSED, or the
            correction's own period is not open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/manual-overrides:
    post:
      operationId: recordManualOverride
      summary: >
        Records the authoritative, complete result for a partial-period
        EmploymentRecord in a REGULAR run (append-only). Requires
        payroll.runs.prepare.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualOverrideInput" }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [recorded], properties: { recorded: { type: boolean } } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.prepare in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School run/EmploymentRecord id.
        "422":
          description: RUN_NOT_EDITABLE -- the run is approved or posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/correction-deltas:
    post:
      operationId: recordCorrectionDelta
      summary: >
        Records a signed delta (increase|decrease) against one salary
        component for a CORRECTION run (append-only). Requires
        payroll.runs.prepare.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionDeltaInput" }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [recorded], properties: { recorded: { type: boolean } } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.prepare in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School run/EmploymentRecord id.
        "422":
          description: RUN_NOT_EDITABLE -- the run is approved or posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/calculate:
    post:
      operationId: calculatePayrollRun
      summary: >
        (Re)calculates a run's entire result set (whole-set replacement,
        never a partial patch). Requires payroll.runs.prepare.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
      responses:
        "200":
          description: >
            OK. transitionedToCalculated is false, and the run stays
            draft, if any eligible EmploymentRecord remains unresolved
            (ADR 0034 fail-closed partial-period rule).
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollCalculationOutcome" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.prepare in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School run id.
        "422":
          description: RUN_NOT_EDITABLE, NEGATIVE_NET_PAY, or PAYROLL_ZERO_EFFECT_CORRECTION.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/approve:
    post:
      operationId: approvePayrollRun
      summary: >
        Approves a calculated run -- the sole immutability boundary
        (ADR 0034). Requires payroll.runs.approve (a SEPARATE
        capability from payroll.runs.prepare -- an actor is never
        authorized to approve merely because they can prepare payroll).
        The preparer of this run may never approve it, enforced at the
        actor level regardless of capability grants. Idempotency-Key
        required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollRun" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.approve in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School run id.
        "409":
          description: PAYROLL_SELF_APPROVAL_NOT_ALLOWED or a concurrent approval already won.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: PAYROLL_INVALID_RUN_TRANSITION -- the run is not calculated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/results:
    get:
      operationId: getPayrollRunResults
      summary: >
        Fetch a run's per-EmploymentRecord results (gross/deductions/net
        and lines) -- Highly Sensitive. Requires
        payroll.compensation.sensitive.view (granted to no default
        role).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PayrollRunResult" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.compensation.sensitive.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: PAYROLL_RUN_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/payslips/{employmentRecordId}:
    get:
      operationId: getPayrollPayslip
      summary: >
        Renders one EmploymentRecord's on-demand payslip for this run --
        Highly Sensitive, never persisted (Phase 9.10; ADR 0034 v1 scope
        is render-on-demand from payroll_run_results/_lines only, no
        payslips table, no stored Document, no email delivery). Requires
        payroll.compensation.sensitive.view (payroll.runs.view alone
        never suffices). Only renders once the run has crossed
        PayrollRun.isApprovedOrLater() (approved or posted, regular or
        correction) -- a draft/calculated run's editable "Calculation
        preview" is a separate, non-authoritative surface. Excludes
        bank details, statutory identifiers, and any PF/ESI/TDS claim
        while Checkpoint 9.6 remains LEGAL REVIEW REQUIRED.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
        - { $ref: "#/components/parameters/EmploymentRecordId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Payslip" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.compensation.sensitive.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: PAYROLL_RUN_NOT_FOUND or PAYROLL_PAYSLIP_NOT_FOUND (no result for this EmploymentRecord on this run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: PAYROLL_RUN_NOT_ELIGIBLE_FOR_PAYSLIP -- the run is still draft/calculated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/post:
    post:
      operationId: postPayrollRun
      summary: >
        Posts an approved run to Finance via PayrollPostingService ->
        LedgerService::post() (never a direct journal_entries write).
        Requires payroll.runs.post. Idempotency-Key required -- a row
        lock closes the concurrent-posting race window structurally
        (proven by a real two-process concurrency test), and the
        Idempotency-Key contract additionally guarantees that a lost
        response can be safely retried without a second JournalEntry
        (Phase 9.8 correction; completed inside the same transaction as
        the posting itself via IdempotencyGuard::completeWithin()).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollRunPosting" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.post in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School run id.
        "422":
          description: >
            PAYROLL_INVALID_RUN_TRANSITION (not approved),
            PAYROLL_ACCOUNTING_NOT_CONFIGURED,
            PAYROLL_ACCOUNTING_ACCOUNT_INVALID, or
            PAYROLL_DEDUCTION_MISSING_LEDGER_MAPPING.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-runs/{payrollRunId}/reverse:
    post:
      operationId: reversePayrollRun
      summary: >
        Reverses a posted run's original posting via
        PayrollPostingService -> LedgerService::reverse() (a new,
        inverse journal entry -- the original is never mutated).
        Requires payroll.runs.reverse (a separate capability from
        payroll.runs.post). Idempotency-Key required -- structural
        at-most-once is still enforced independently
        (PAYROLL_RUN_ALREADY_REVERSED, 409, on a genuine repeat), and
        the Idempotency-Key contract additionally guarantees a lost
        response can be safely retried without a second reversal
        JournalEntry (Phase 9.8 correction). Posting and reversal never
        share a replay namespace even if the identical literal key
        string is reused, since route_action is part of the
        idempotency scope. Reversing an original that already has a
        correction run is still allowed (ADR 0034 -- deliberately
        unrestricted).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/PayrollRunId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255, nullable: true }
      responses:
        "201":
          description: Created (the reversal posting).
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PayrollRunPosting" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.runs.reverse in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School run id.
        "409":
          description: PAYROLL_RUN_ALREADY_REVERSED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: PAYROLL_RUN_NOT_POSTED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/payroll-accounting-configuration:
