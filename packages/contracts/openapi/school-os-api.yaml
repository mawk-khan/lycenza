components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: >
        Opaque personal-access token (web/mobile) or partner API key
        (third-party integrations). See docs/architecture/API.md
        ("Authentication").

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Required on all unsafe (POST/PATCH/DELETE) mutating requests that
        are not naturally idempotent, e.g. payment callbacks. See
        docs/architecture/API.md ("Idempotency").
      schema: { type: string }
    SchoolId:
      name: schoolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampusId:
      name: campusId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AcademicYearId:
      name: academicYearId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      description: When true, includes inactive/archived reference rows (default excludes them).
      schema: { type: boolean, default: false }

  headers:
    XRequestId:
      description: Correlates this response with server-side logs/audit entries.
      schema: { type: string, format: uuid }
    IdempotencyReplayed:
      description: >
        Present and "true" only when this response is a replay of a
        previously completed request with the same Idempotency-Key
        (docs/architecture/API.md, "Idempotency"); absent on a request's
        first, freshly-executed response.
      schema: { type: string, enum: ["true"] }

  schemas:
    ResponseMeta:
      type: object
      required: [apiVersion, requestId]
      properties:
        apiVersion: { type: string, example: v1 }
        requestId: { type: string, format: uuid, nullable: true }

    PaginationMeta:
      type: object
      required: [page, perPage, total]
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, status, requestId]
          properties:
            message: { type: string }
            status: { type: integer }
            code:
              type: string
              nullable: true
              description: >
                Stable machine-readable error code (e.g.
                IDEMPOTENCY_KEY_CONFLICT), present only for exceptions
                that define one. null otherwise -- see
                docs/architecture/API.md ("Error format").
            requestId: { type: string, format: uuid, nullable: true }
            errors:
              type: object
              nullable: true
              description: Field-level validation errors, present only on 422 responses.

    WebhookEndpoint:
      type: object
      required: [id, name, url, status, createdAt]
      description: Never includes the signing secret (see the create/rotate-secret responses for the one-time exception).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: string, format: date-time, nullable: true }

    WebhookSubscription:
      type: object
      required: [id, webhookEndpointId, eventType, enabled]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventType: { type: string }
        enabled: { type: boolean }

    WebhookDelivery:
      type: object
      required: [id, webhookEndpointId, eventId, eventType, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivering, delivered, retrying, failed, abandoned] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lastAttempt:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WebhookDeliveryAttempt" }]

    WebhookDeliveryAttempt:
      type: object
      required: [attemptNumber, outcome]
      description: Never includes the raw response body (section 72).
      properties:
        attemptNumber: { type: integer }
        outcome: { type: string, enum: [success, transient_failure, permanent_failure, timeout, network_error] }
        responseStatus: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        errorClass: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    EducationBoard:
      type: object
      required: [id, code, name]
      description: Platform reference catalog (Phase 0D section 11) -- not School-owned.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    School:
      type: object
      required: [id, name, status, timezone, defaultLocale, countryCode]
      description: >
        `status` is the platform tenant-lifecycle field (Phase 0B) --
        read-only through this API; see SchoolProfileInput.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        legalName: { type: string, nullable: true }
        code: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, archived] }
        timezone: { type: string }
        defaultLocale: { type: string }
        website: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        addressLine2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateRegion: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        educationBoardId: { type: string, format: uuid, nullable: true }

    SchoolProfileInput:
      type: object
      description: Every field is optional (partial update) -- `status` is never accepted here.
      properties:
        name: { type: string, maxLength: 255 }
        legal_name: { type: string, maxLength: 255, nullable: true }
        code: { type: string, maxLength: 32, nullable: true }
        website: { type: string, maxLength: 255, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
        address_line1: { type: string, maxLength: 255, nullable: true }
        address_line2: { type: string, maxLength: 255, nullable: true }
        city: { type: string, maxLength: 120, nullable: true }
        state_region: { type: string, maxLength: 120, nullable: true }
        postal_code: { type: string, maxLength: 20, nullable: true }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        education_board_id: { type: string, format: uuid, nullable: true }

    Campus:
      type: object
      required: [id, name, code, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, description: "Case-insensitively unique within the School (section 65)." }
        status: { type: string, enum: [active, inactive] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }

    CampusInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        phone: { type: string, maxLength: 32, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }

    Room:
      type: object
      required: [id, campusId, name, code, roomType, status]
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        roomType: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    RoomInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        room_type: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }

    AcademicYear:
      type: object
      required: [id, name, code, startsOn, endsOn, status]
      description: Only one Academic Year per School may be `active` (section 16, database-enforced).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [draft, active, closed, archived] }

    AcademicYearInput:
      type: object
      required: [name, code, starts_on, ends_on]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: "Must be after starts_on." }

    AcademicTerm:
      type: object
      required: [id, academicYearId, name, code, startsOn, endsOn, sequence]
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        sequence: { type: integer }

    AcademicTermInput:
      type: object
      required: [name, code, starts_on, ends_on, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        sequence: { type: integer, minimum: 1 }

    GradeLevel:
      type: object
      required: [id, name, code, sequence, status]
      description: School-wide reference data (not Campus/Year-scoped, section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        sequence: { type: integer, description: "Explicit pedagogical ordering -- never inferred from name/code." }
        educationStage: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    GradeLevelInput:
      type: object
      required: [name, code, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        sequence: { type: integer, minimum: 0 }
        education_stage: { type: string, nullable: true }

    Section:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, name, code, status]
      description: Belongs to exactly one Academic Year (section 28 -- never reused across years).
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        capacity: { type: integer, nullable: true, description: "Advisory only (section 27) -- not admission-enforced." }
        status: { type: string, enum: [active, inactive] }

    SectionInput:
      type: object
      required: [campus_id, grade_level_id, name, code]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        capacity: { type: integer, nullable: true }

    Subject:
      type: object
      required: [id, name, code, subjectType, status]
      description: School-wide reference data (section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        shortName: { type: string, nullable: true }
        subjectType: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academicDepartmentId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        short_name: { type: string, maxLength: 32, nullable: true }
        subject_type: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academic_department_id: { type: string, format: uuid, nullable: true }

    AcademicDepartment:
      type: object
      required: [id, name, code, status]
      description: Deliberately distinct from a future HR organizational Department (section 32).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }

    AcademicDepartmentInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }

    SubjectOffering:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, subjectId, isRequired, status]
      description: >
        The academic-offering layer (sections 37-40) -- AcademicYear-
        specific by construction, never a global Grade->Subject map.
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        isRequired: { type: boolean }
        sequence: { type: integer, nullable: true }
        weeklyPeriodsTarget: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectOfferingInput:
      type: object
      required: [campus_id, grade_level_id, subject_id]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        is_required: { type: boolean, default: true }
        sequence: { type: integer, nullable: true }
        weekly_periods_target: { type: integer, nullable: true }
