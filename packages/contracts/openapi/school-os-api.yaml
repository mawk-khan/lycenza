        "404":
          description: No such CurriculumDelivery in this School.
    patch:
      operationId: correctCurriculumDeliveryDates
      summary: >
        Corrects a clerical mistake in either date. `status` is
        deliberately NOT an accepted field -- completing and reopening
        are guarded state transitions, not date edits. A completion date
        may only be corrected on an already-completed record. Every
        applicable date invariant is re-run, so an existing row is not a
        back door around them. Remains available after the AcademicYear
        closes. Requires curriculum.delivery.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: curriculumDeliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurriculumDeliveryUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CurriculumDelivery" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking curriculum.delivery.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such CurriculumDelivery in this School.
        "422":
          description: >
            Validation or domain failure -- a malformed date, a future
            date in the School's own timezone, a date outside the
            AcademicYear, a completion date earlier than the start date,
            or a completion date supplied for an in-progress record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/curriculum-deliveries/{curriculumDeliveryId}/transition:
    post:
      operationId: transitionCurriculumDelivery
      summary: >
        Expected-status compare-and-swap between the two stored states.
        `expected_status` is the status the caller believes the record
        currently holds; if it no longer matches, the transition is
        refused with 409 rather than silently overwriting a colleague's
        change. Completing requires `completed_on`; reopening clears it.
        The only legal edges are in_progress -> completed and completed
        -> in_progress. Remains available after the AcademicYear closes.
        Requires curriculum.delivery.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: curriculumDeliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurriculumDeliveryTransitionInput" }
      responses:
        "200":
          description: Transitioned.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CurriculumDelivery" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking curriculum.delivery.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such CurriculumDelivery in this School.
        "409":
          description: >
            The record's current status is not the supplied
            expected_status -- another transition landed first. Reload
            before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation or domain failure -- a no-op transition, an
            illegal state pair, a missing completion date when
            completing, a future or out-of-year completion date, or a
            completion date earlier than the start date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/academic-years/{academicYearId}/examinations:
    get:
      operationId: listExaminations
      summary: >
        Lists an AcademicYear's Examination windows in chronological
        order (starts_on, then case-insensitive code as a deterministic
        tie-break), optionally filtered by status. An Examination is a
        named assessment WINDOW, not an individual paper. Requires
        examinations.definitions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: academicYearId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/ExaminationStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Examination" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.definitions.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such AcademicYear in this School.
    post:
      operationId: createExamination
      summary: >
        Defines one Examination window inside an AcademicYear. `code` is
        normalized to uppercase before validation and is
        case-insensitively unique WITHIN that AcademicYear -- the same
        normalized code legitimately recurs in a different year. The
        window must fall inside the AcademicYear's inclusive date range;
        the AcademicYear is NOT required to be active, so planning a
        future examination inside a draft year is supported. FUTURE dates
        are permitted and expected, and overlapping windows are
        permitted. Requires examinations.definitions.manage. No
        Idempotency-Key is needed: duplicate semantic creation is already
        prevented by the database's own unique index.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: academicYearId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExaminationCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Examination" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.definitions.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such AcademicYear in this School.
        "422":
          description: >
            Validation or domain failure -- missing/oversized code or
            name, a malformed date, an end date before the start date, a
            window falling outside the AcademicYear, an
            out-of-vocabulary status, or a case-insensitive duplicate
            code within this AcademicYear.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/examinations/{examinationId}:
    get:
      operationId: getExamination
      summary: One Examination window. Requires examinations.definitions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: examinationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Examination" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.definitions.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such Examination in this School.
    patch:
      operationId: updateExamination
      summary: >
        Updates an Examination's code, name, dates and/or status. This is
        ALSO how an Examination is retired or reinstated -- `status` is
        an ordinary field here, and there is deliberately no separate
        activate/deactivate operation. The owning AcademicYear is fixed
        at creation and can never be reassigned. Every date invariant is
        re-run. Requires examinations.definitions.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: examinationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExaminationUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Examination" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.definitions.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such Examination in this School.
        "422":
          description: >
            Validation or domain failure -- oversized code/name, a
            malformed date, an end date before the start date, a window
            falling outside the AcademicYear, an out-of-vocabulary
            status, or a case-insensitive duplicate code within this
            AcademicYear.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/examinations/{examinationId}/examination-papers:
    get:
      operationId: listExaminationPapers
      summary: >
        Lists one Examination's Papers in chronological order
        (scheduled_on, then starts_at). An ExaminationPaper is one
        SubjectOffering assessed within this Examination, Offering-wide
        and never Section-specific. Requires examinations.papers.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: examinationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ExaminationPaper" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.papers.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such Examination in this School.
    post:
      operationId: createExaminationPaper
      summary: >
        Schedules one SubjectOffering's Paper within this Examination.
        Both the Examination and the SubjectOffering must be active, and
        both required AND elective SubjectOfferings are supported
        identically. `scheduled_on` must fall inside the Examination's
        inclusive date window; `ends_at` must fall after `starts_at`
        (same day only); `max_marks` must be positive. Exactly one Paper
        may exist per (Examination, SubjectOffering) pair -- the
        constraint is unconditional, so an inactive Paper continues to
        reserve the pair. Overlapping sittings across DIFFERENT
        SubjectOfferings are permitted. Requires
        examinations.papers.manage. No Idempotency-Key is needed:
        duplicate semantic creation is already prevented by the
        database's own unique index.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: examinationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExaminationPaperCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ExaminationPaper" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.papers.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such Examination in this School.
        "422":
          description: >
            Validation or domain failure -- missing/malformed input, an
            inactive Examination or SubjectOffering, an AcademicYear
            mismatch between the Examination and the SubjectOffering, a
            scheduled date outside the Examination's window, an end time
            not after the start time, a non-positive max_marks, an
            out-of-vocabulary status, or a duplicate Paper for this
            Examination and SubjectOffering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/examination-papers/{examinationPaperId}:
    get:
      operationId: getExaminationPaper
      summary: One ExaminationPaper. Requires examinations.papers.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: examinationPaperId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ExaminationPaper" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.papers.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such ExaminationPaper in this School.
    patch:
      operationId: updateExaminationPaper
      summary: >
        Updates an ExaminationPaper's schedule, maximum marks and/or
        status. This is ALSO how a Paper is withdrawn or reinstated --
        `status` is an ordinary field here, and there is deliberately no
        separate activate/deactivate operation. The owning Examination
        and SubjectOffering are fixed at creation and can never be
        reassigned. An ordinary correction does NOT require either
        parent to be currently active (historical correction remains
        possible), but reactivating a Paper (inactive -> active) DOES
        require both the Examination and the SubjectOffering to be
        currently active. Every date/time/marks invariant is re-run.
        Requires examinations.papers.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: examinationPaperId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExaminationPaperUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ExaminationPaper" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.papers.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such ExaminationPaper in this School.
        "422":
          description: >
            Validation or domain failure -- a malformed date/time, an end
            time not after the start time, a scheduled date outside the
            Examination's window, a non-positive max_marks, an
            out-of-vocabulary status, or a reactivation (inactive ->
            active) while the Examination or SubjectOffering is
            currently inactive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/grade-scales:
    get:
      operationId: listGradeScales
      summary: >
        Lists this School's GradeScales, each with its ordered
        GradeBands. School-only -- independent of the Examination
        chain. Requires examinations.grade_scales.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GradeScale" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.grade_scales.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createGradeScale
      summary: >
        Creates a new GradeScale, always as `draft`, optionally with an
        initial set of GradeBands in the same request. `code` is
        normalized to uppercase before validation and is
        case-insensitively unique within the School, unconditionally
        (an inactive scale still reserves its code). Requires
        examinations.grade_scales.manage. No Idempotency-Key is needed:
        duplicate semantic creation is already prevented by the
        database's own unique index.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeScaleCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GradeScale" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.grade_scales.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation or domain failure -- missing/oversized code or
            name, a case-insensitive duplicate code within this School,
            an out-of-domain or duplicate initial band threshold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/grade-scales/{gradeScaleId}:
    get:
      operationId: getGradeScale
      summary: One GradeScale with its bands. Requires examinations.grade_scales.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: gradeScaleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GradeScale" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.grade_scales.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such GradeScale in this School.
    patch:
      operationId: updateGradeScale
      summary: >
        Updates a GradeScale's name and/or requests a lifecycle
        transition. `status`, when present, is ALWAYS interpreted as a
        guarded transition request -- never a raw field write. Exactly
        three transitions are legal: draft -> active (requires a
        GradeBand at the 0.00 threshold), active -> inactive, and
        inactive -> active (re-verifies the 0.00 threshold
        defensively). Every other transition, including every no-op, is
        rejected. `code` can never be changed. Requires
        examinations.grade_scales.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: gradeScaleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeScaleUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GradeScale" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.grade_scales.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such GradeScale in this School.
        "422":
          description: >
            Validation or domain failure -- an illegal or no-op status
            transition, or activation attempted without a GradeBand at
            the 0.00 threshold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/grade-scales/{gradeScaleId}/bands:
    post:
      operationId: createGradeBand
      summary: >
        Adds one GradeBand to a GradeScale. Permitted ONLY while the
        scale is `draft` -- once the scale has ever been `active`, its
        bands are frozen forever. Only `min_percentage` is stored
        (no upper bound); duplicate thresholds within one scale are
        rejected by the database's own unique index. Requires
        examinations.grade_scales.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: gradeScaleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeBandCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GradeBand" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.grade_scales.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such GradeScale in this School.
        "422":
          description: >
            Validation or domain failure -- an out-of-domain or
            duplicate threshold, or the parent GradeScale is not
            `draft`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/grade-scales/{gradeScaleId}/bands/{gradeBandId}:
    patch:
      operationId: updateGradeBand
      summary: >
        Updates one GradeBand's threshold and/or label. Permitted ONLY
        while the parent GradeScale is `draft`. Requires
        examinations.grade_scales.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: gradeScaleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: gradeBandId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeBandUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GradeBand" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.grade_scales.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such GradeScale or GradeBand in this School.
        "422":
          description: >
            Validation or domain failure -- an out-of-domain or
            duplicate threshold, or the parent GradeScale is not
            `draft`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteGradeBand
      summary: >
        Removes one GradeBand. Permitted ONLY while the parent
        GradeScale is `draft` -- this is the sole delete route
        anywhere in the GradeScale surface; GradeScale itself is never
        deleted. Requires examinations.grade_scales.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: gradeScaleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: gradeBandId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking examinations.grade_scales.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such GradeScale or GradeBand in this School.
        "422":
          description: The parent GradeScale is not `draft`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "<id>|lyc_pat_<random>"
      description: >
        Human API token (Laravel Sanctum personal access token), issued by
        the person themselves under Account > API tokens with a fresh MFA
        code and shown once. Scopes `api.read` / `api.write`
        (x-api-scopes.human); always expires -- 30 days by default, at
        most 90; revocable, effective on the next request. It acts as its
        user: every request re-checks the enabled account, active
        membership, active School and the route's capability. It never
        exercises platform or School Group authority. See
        docs/architecture/API.md ("Authentication") and ADR 0049.
    partnerKey:
      type: http
      scheme: bearer
      bearerFormat: "lyc_pk_<key_id>.<secret>"
      description: >
        Partner API credential of a non-human integration bound to exactly
        one School (immutable). Used only on `/api/v1/partner/*` routes,
        which take no School parameter -- the School is the credential's
        binding. 90 days by default, at most 365; rotation keeps the
        previous credential for at most 24 hours; revocation is immediate.
        No partner route or scope is enabled in production yet (ADR 0049
        section 6.4).

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Required on all unsafe (POST/PATCH/DELETE) mutating requests that
        are not naturally idempotent, e.g. payment callbacks. See
        docs/architecture/API.md ("Idempotency").
      schema: { type: string }
    SchoolId:
      name: schoolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampusId:
      name: campusId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AcademicYearId:
      name: academicYearId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      description: When true, includes inactive/archived reference rows (default excludes them).
      schema: { type: boolean, default: false }
    LibraryTitleId:
      name: libraryTitleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LibraryCopyId:
      name: libraryCopyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LibraryLoanId:
      name: libraryLoanId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuardianId:
      name: guardianId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: >
        Employee UUID (not User id, not EmploymentRecord id, not the
        display employee_number) -- Phase 8A.14 section 57.
      schema: { type: string, format: uuid }
    EmployeeIncludeArchived:
      name: include_archived
      in: query
      required: false
      description: When true, includes Employees whose record_status is archived (default excludes them).
      schema: { type: boolean, default: false }
    EmployeeCategory:
      name: category
      in: query
      required: false
      description: >
        Activity Timeline category filter. An unrecognized value is
        treated as no filter, never an error -- rejecting it would
        itself be an authorization side channel (section 30).
      schema: { type: string, enum: [employee, personal, employment, professional, document, sensitive_access] }
    EmployeeOccurredFrom:
      name: occurred_from
      in: query
      required: false
      description: Inclusive lower bound on SchoolAuditEvent.occurred_at (not a domain effective date).
      schema: { type: string, format: date }
    EmployeeOccurredTo:
      name: occurred_to
      in: query
      required: false
      description: Inclusive upper bound on SchoolAuditEvent.occurred_at (not a domain effective date).
      schema: { type: string, format: date }
    RolloverId:
      name: rollover
      in: path
      required: true
      schema: { type: string, format: uuid }
    RolloverMappingId:
      name: mapping
      in: path
      required: true
      schema: { type: string, format: uuid }
    RolloverItemId:
      name: item
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubjectOfferingId:
      name: subjectOffering
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicantId:
      name: applicantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdmissionApplicationId:
      name: admissionApplicationId
      in: path
      required: true
      schema: { type: string, format: uuid }

    DocumentId:
      name: documentId
      in: path
      required: true
      description: Document UUID -- Phase 0E.5. Never sufficient by itself to access metadata/content (see the direct Document endpoints' own 404 policy).
      schema: { type: string, format: uuid }
    TransportRouteId:
      name: transportRouteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransportStopId:
      name: transportStopId
      in: path
