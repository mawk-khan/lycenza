                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/inventory-stock/receive:
    post:
      operationId: receiveInventoryStock
      summary: >
        Receives stock into a Location via InventoryStockService::receive()
        -- the sole authoritative stock writer. Idempotent (Idempotency-Key
        required): a retried request never double-applies its stock
        effect. Requires inventory.stock.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockMutationInput" }
      responses:
        "201":
          description: Created (the new receipt StockMovement).
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StockMovement" } } }
        "422":
          description: INVENTORY_ITEM_NOT_AVAILABLE, INVENTORY_LOCATION_NOT_AVAILABLE, or INVENTORY_INVALID_QUANTITY.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/inventory-stock/issue:
    post:
      operationId: issueInventoryStock
      summary: >
        Issues stock from a Location via InventoryStockService::issue().
        quantity_on_hand can never go negative (database-enforced CHECK
        constraint backstops the service's own row-locked check).
        Idempotent (Idempotency-Key required). Requires
        inventory.stock.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockMutationInput" }
      responses:
        "201":
          description: Created (the new issue StockMovement).
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StockMovement" } } }
        "422":
          description: INVENTORY_INSUFFICIENT_STOCK (or the same not-available/invalid-quantity codes as receive).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/inventory-stock/transfer:
    post:
      operationId: transferInventoryStock
      summary: >
        Transfers stock between two Locations for one Item, as ONE atomic
        transaction via InventoryStockService::transfer() -- never an
        issue+receipt pair. Locks both balance rows in deterministic
        ascending-id order (never a fixed source-then-destination role
        order) to remain deadlock-safe against opposing concurrent
        transfers. Idempotent (Idempotency-Key required). Requires
        inventory.stock.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferStockInput" }
      responses:
        "201":
          description: Created (the new transfer StockMovement).
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StockMovement" } } }
        "422":
          description: INVENTORY_SAME_LOCATION_TRANSFER, INVENTORY_INSUFFICIENT_STOCK, or the same not-available/invalid-quantity codes as receive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # Phase 10F -- Canteen. Outlet/Item/recipe directory mirrors
  # Inventory's own directory shape exactly; canteen-orders is the
  # Highly Sensitive Order lifecycle (list/summary NEVER includes
  # unit_price/line_total/total_amount -- only show() does, docs/modules/CANTEEN.md
  # "Highly Sensitive data handling"). The live-search picker endpoints
  # under canteen-orders/search/* and canteen-billing-configuration/
  # ledger-accounts are deliberately NOT documented here -- they are
  # UI-support lookups for the admin picker widgets, the same
  # undocumented status every other module's equivalent picker endpoint
  # already has across this contract (no module documents its own
  # search/* helper).
  /schools/{schoolId}/canteen-outlets:
    get:
      operationId: listCanteenOutlets
      summary: Lists a School's Canteen Outlets (active by default). Requires canteen.directory.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IncludeInactive" }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CanteenOutlet" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createCanteenOutlet
      summary: >
        Registers a new Canteen Outlet, backed by exactly one
        InventoryLocation it issues stock from at fulfillment time. If
        campus_id is set, the named InventoryLocation must belong to
        the SAME Campus (database-enforced composite foreign key, docs/modules/CANTEEN.md
        "Outlet model"). Requires canteen.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanteenOutletInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenOutlet" } } }
        "422":
          description: Validation failure (e.g. duplicate code within this School, inventory_location_id from a different School or Campus).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/canteen-outlets/{canteenOutletId}:
    get:
      operationId: getCanteenOutlet
      summary: Fetch one Canteen Outlet. Requires canteen.directory.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenOutletId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenOutlet" } } }
        "404":
          description: Not found (including a cross-School id).
    patch:
      operationId: updateCanteenOutlet
      summary: >
        Updates or (de)activates a Canteen Outlet -- name/status only.
        inventory_location_id/campus_id are immutable after creation
        (no field for either is accepted here); CanteenOrder snapshots
        inventory_location_id at placement time regardless. Requires
        canteen.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CanteenOutletId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanteenOutletUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CanteenOutlet" } } }

