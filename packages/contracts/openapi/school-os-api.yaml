          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/TransportStudentAssignment" } } } }
    post:
      operationId: assignTransportStudent
      summary: >
        Assigns a Student to a Route (and optional pickup/drop-off
        Stops on that Route). Requires transport.assignments.manage.
        Idempotency-Key required -- a network retry must never risk a
        duplicate assignment attempt.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransportStudentAssignmentInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/TransportStudentAssignment" } } }
        "422":
          description: >
            Student not eligible/already assigned, Route not available,
            or the pickup/drop-off Stop does not belong to this Route
            (TRANSPORT_STUDENT_NOT_ELIGIBLE / TRANSPORT_STUDENT_ALREADY_ASSIGNED
            / TRANSPORT_ROUTE_NOT_AVAILABLE / TRANSPORT_STOP_NOT_ON_ROUTE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A genuinely concurrent assignment attempt lost the race, or an Idempotency-Key conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/transport-student-assignments/{transportStudentAssignmentId}:
