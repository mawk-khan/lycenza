  /schools/{schoolId}/subject-offerings/{subjectOfferingId}/curriculum-deliveries:
    get:
      operationId: listCurriculumDeliveries
      summary: >
        Lists the CurriculumDelivery records for a SubjectOffering, in
        the syllabus catalogue's own teaching order (the SyllabusUnit's
        sequence, then its case-insensitive code). Optionally filtered
        by Section and/or status. A SyllabusUnit with NO row here has
        simply not been started -- `not_started` is never a stored
        value, so a client showing every unit must start from the
        Syllabus list and join these in. Requires
        curriculum.delivery.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subjectOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: section_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/CurriculumDeliveryStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CurriculumDelivery" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking curriculum.delivery.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SubjectOffering in this School.
    post:
      operationId: startCurriculumDelivery
      summary: >
        Starts recording delivery of one SyllabusUnit to one Section.
        Always creates an `in_progress` record -- a delivery is never
        born completed. Only the three caller-chosen facts are accepted;
        the SubjectOffering, AcademicYear, Campus and GradeLevel pins are
        derived server-side from the resolved parents and are never
        taken from the request. Only a REQUIRED SubjectOffering is
        eligible: an elective is a Student-level enrollment choice, not
        a Section-wide cohort. Requires curriculum.delivery.manage. No
        Idempotency-Key is needed: duplicate creation is already
        prevented by the database's own
        `curriculum_deliveries_section_unit_unique` index.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subjectOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurriculumDeliveryCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CurriculumDelivery" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking curriculum.delivery.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SubjectOffering, Section or SyllabusUnit in this School.
        "409":
          description: >
            The AcademicYear is not active, so no NEW delivery may be
            started. Correcting or transitioning an EXISTING delivery
            remains possible after the year closes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation or domain failure -- an elective SubjectOffering,
            a SyllabusUnit belonging to a different Offering, a Section
            in a different AcademicYear/Campus/GradeLevel, a future
            started_on in the School's own timezone, a date outside the
            AcademicYear, or an existing delivery for this
            Section/SyllabusUnit pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/curriculum-deliveries/{curriculumDeliveryId}:
