  # --- Phase 1A.5: Student & Guardian Identity administrative surface
  # (docs/modules/STUDENT-GUARDIAN-IDENTITY.md, "Administrative HTTP
  # boundary"). Same authenticated/capability-gated administrative
  # architecture as every path above -- not a separate public API.

  /schools/{schoolId}/students:
    get:
      operationId: listStudents
      summary: List a School's Students. Requires students.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: student_number, in: query, required: false, schema: { type: string }, description: Exact match. }
        - { name: name, in: query, required: false, schema: { type: string }, description: Matches first or last name. }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/StudentSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      operationId: createStudent
      summary: Creates a Student. Requires students.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }
        "422":
          description: Validation failure (e.g. duplicate Student Number within this School).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/students/{studentId}:
    get:
      operationId: getStudent
      summary: Fetch one Student. Requires students.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).
    patch:
      operationId: updateStudent
      summary: Updates Student identity fields. Requires students.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }

  /schools/{schoolId}/students/{studentId}/status:
    post:
      operationId: changeStudentStatus
      summary: Changes a Student's status (active/inactive). Requires students.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }

  /schools/{schoolId}/students/{studentId}/guardians:
    get:
      operationId: listStudentGuardianRelationships
      summary: List a Student's Guardian relationships. Requires students.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/StudentGuardianRelationship" } } } }
    post:
      operationId: linkGuardianToStudent
      summary: >
        Links a Guardian to a Student. Requires BOTH students.manage AND
        guardians.manage (the operation mutates both domain identities'
        relationship at once). Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentGuardianRelationshipLinkInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StudentGuardianRelationship" } } }
        "422":
          description: >
            Validation failure -- a nonexistent/cross-School guardianId
            (indistinguishable message either way), a duplicate
            relationship for this (Student, Guardian) pair, or an
            invalid relationshipType.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/student-guardian-relationships/{relationshipId}:
    patch:
      operationId: updateStudentGuardianRelationship
      summary: >
        Updates relationshipType/authority flags (never isPrimary --
        see the .../primary action). Requires BOTH students.manage AND
        guardians.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RelationshipId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentGuardianRelationshipUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StudentGuardianRelationship" } } }
    delete:
      operationId: unlinkGuardianFromStudent
      summary: >
        Unlinks (hard-deletes the relationship row -- there is no
        soft-deactivation column). Preserves both the Student and
        Guardian identity rows, and any other relationship. Requires
        BOTH students.manage AND guardians.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RelationshipId" }
      responses:
        "204":
          description: Unlinked. No content.

  /schools/{schoolId}/student-guardian-relationships/{relationshipId}/primary:
    post:
      operationId: setPrimaryGuardian
      summary: >
        Promotes this relationship to primary for its Student, demoting
        whichever relationship was previously primary in the same
        transaction. Requires BOTH students.manage AND
        guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RelationshipId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StudentGuardianRelationship" } } }

  /schools/{schoolId}/guardians:
    get:
      operationId: listGuardians
      summary: List a School's Guardians. Requires guardians.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: name, in: query, required: false, schema: { type: string }, description: Matches first or last name. }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GuardianSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      operationId: createGuardian
      summary: >
        Creates a Guardian (identity only -- contact information is a
        separate call, see .../contacts below). Requires
        guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianSummary" } } }

  /schools/{schoolId}/guardian-candidates:
    post:
      operationId: findGuardianCandidates
      summary: >
        Exact-match, same-School-only, HMAC-keyed candidate lookup by
        contact value -- "does a Guardian with this email/mobile
        already exist here." Never decrypts every contact row, never
        crosses Schools, never auto-merges; may return multiple
        candidates (household-shared contact). Requires guardians.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianCandidateLookupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/GuardianSummary" } } } }
        "422":
          description: Malformed email/mobile input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/guardians/{guardianId}:
    get:
      operationId: getGuardian
      summary: >
        Fetch one Guardian, including its contacts and linked Students.
        Requires guardians.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Guardian" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).
    patch:
      operationId: updateGuardian
      summary: Updates Guardian identity fields. Requires guardians.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianSummary" } } }

  /schools/{schoolId}/guardians/{guardianId}/status:
    post:
      operationId: changeGuardianStatus
      summary: Changes a Guardian's status (active/inactive). Requires guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianSummary" } } }

  /schools/{schoolId}/guardians/{guardianId}/contacts:
    post:
      operationId: addGuardianContact
      summary: >
        Adds a Guardian contact (email/mobile) -- encrypted at rest
        with a keyed exact-match lookup digest (ADR 0041), never
        stored as plaintext. Requires guardians.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianContactInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianContact" } } }
        "422":
          description: Malformed email/mobile, or conflicts with an existing contact/primary for this Guardian.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/guardian-contacts/{contactId}/primary:
    post:
      operationId: setPrimaryGuardianContact
      summary: >
        Promotes this contact to primary for its type, demoting
        whichever contact was previously primary in the same
        transaction. Requires guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ContactId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianContact" } } }

  /schools/{schoolId}/guardian-contacts/{contactId}/deactivate:
    post:
      operationId: deactivateGuardianContact
      summary: Deactivates a contact (not deleted). Requires guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ContactId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianContact" } } }

  # --- Phase 1B.5: Student Enrollment administrative surface

  /schools/{schoolId}/enrollments:
    get:
      operationId: listEnrollments
      summary: >
        Administrative Enrollment directory across the School. Requires
        enrollments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: campus_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: grade_level_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: section_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, completed, withdrawn, transferred, cancelled] } }
        - { name: student_number, in: query, required: false, schema: { type: string } }
        - { name: student_name, in: query, required: false, schema: { type: string } }
        - { name: roll_number, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EnrollmentSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

  /schools/{schoolId}/enrollments/{enrollmentId}:
    get:
      operationId: getEnrollment
      summary: Fetch one Enrollment's detail. Requires enrollments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).

  /schools/{schoolId}/enrollments/{enrollmentId}/complete:
    post:
      operationId: completeEnrollment
      summary: >
        Normal completion of an Enrollment. Requires enrollments.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ends_on], properties: { ends_on: { type: string, format: date } } }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: Invalid transition (e.g. already terminal) or invalid date range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollments/{enrollmentId}/withdraw:
    post:
      operationId: withdrawEnrollment
      summary: Mid-course withdrawal. Requires enrollments.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ends_on], properties: { ends_on: { type: string, format: date } } }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: Invalid transition or invalid date range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollments/{enrollmentId}/cancel:
    post:
      operationId: cancelEnrollment
      summary: Administrative cancellation. Requires enrollments.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ends_on], properties: { ends_on: { type: string, format: date } } }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: Invalid transition or invalid date range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollments/{enrollmentId}/transfer:
    post:
      operationId: transferEnrollment
      summary: >
        Atomic same-Academic-Year placement move to another Section.
        Requires enrollments.manage. Idempotency-Key required. Returns
        the newly created (target) Enrollment, not the source.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_section_id, roll_number, effective_date]
              properties:
                target_section_id: { type: string, format: uuid }
                roll_number: { type: string, maxLength: 255 }
                effective_date: { type: string, format: date }
      responses:
        "201":
          description: Created (the new target Enrollment).
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: >
            Cross-School/cross-Academic-Year/cross-GradeLevel target, a
            duplicate roll number in the target Section, or an invalid
            source transition -- fully atomic (the source Enrollment is
            left untouched on any failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/students/{studentId}/enrollments:
    get:
      operationId: listStudentEnrollmentHistory
      summary: Full historical Enrollment record for one Student. Requires enrollments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Enrollment" } } } }
        "404":
          description: Not found (including a cross-School Student id -- indistinguishable from nonexistent).
    post:
      operationId: createStudentEnrollment
      summary: >
        Enrolls a Student into a Section. AcademicYear/Campus/GradeLevel
        are always derived from the given Section -- never accepted
        independently. Requires enrollments.manage. Idempotency-Key
        required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: >
            A second active Enrollment for this Student+Year, a
            duplicate roll number in this Section+Year, or a blank
            roll number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/students/{studentId}/enrollments/current:
    get:
      operationId: getCurrentStudentEnrollment
      summary: >
        The active Enrollment for this Student in the given (or the
        School's currently active) Academic Year. Requires
        enrollments.view. `data` is `null` when no active Enrollment
        exists for the resolved year -- never a historical/terminal row
        substituted for "current".
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { name: academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/Enrollment" }]
        "404":
          description: Not found (cross-School Student id, or an explicit but foreign/nonexistent academic_year_id filter).


  # Phase 8A.14 -- read-only HR transport (docs/modules/HR.md "API &
  # Mobile-Ready Read Layer (8A.14, implemented)"). Every operation
  # here is a GET adapting an already-authoritative 8A.8/8A.9/8A.10/
  # 8A.11 Application service -- no HR mutation/import/lifecycle
  # endpoint exists at this version. None of these paths declare a
  # `capability:` route requirement in this spec's sense because the
  # underlying service performs its own capability check against the
  # real authenticated actor (see each operation's summary for the
  # capability actually enforced).
  /schools/{schoolId}/employees:
    get:
      operationId: listEmployees
      summary: >
        Employee Directory search (Directory-tier only). Requires
        hr.employees.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: search, in: query, required: false, description: "Matches employee_number prefix or full_name substring.", schema: { type: string } }
        - { name: campus_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: department_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: position_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: sort, in: query, required: false, description: "Allow-listed server-side; an unrecognized value falls back to the default rather than erroring.", schema: { type: string, enum: [full_name, employee_number], default: full_name } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: "#/components/parameters/EmployeeIncludeArchived" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmployeeDirectoryEntry" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid query parameter (e.g. page < 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employees/{employeeId}:
    get:
      operationId: getEmployeeProfile
      summary: >
        Employee Profile Workspace (Restricted-tier, section-authorized).
        Requires hr.employees.personal.view as the entry gate; each
        section additionally requires its own 8A.10 capability, exactly
        as the interactive Profile Workspace already does.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmployeeProfile" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.personal.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >
            Employee does not exist, or belongs to a different School --
            deliberately indistinguishable (section 20/51/83's
            cross-tenant-probing convention).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employees/{employeeId}/activity:
    get:
      operationId: getEmployeeActivity
      summary: >
        Employee Activity Timeline (capability-category-filtered,
        event-time-sensitivity-aware). Requires
        hr.employees.personal.view as the entry gate.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
        - { $ref: "#/components/parameters/EmployeeCategory" }
        - { $ref: "#/components/parameters/EmployeeOccurredFrom" }
        - { $ref: "#/components/parameters/EmployeeOccurredTo" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: >
            OK. meta.total reflects only events the caller's
            capabilities permit -- a hidden Highly Sensitive event is
            never counted (no side-channel, section 18/40).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmployeeActivityEntry" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.personal.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Employee does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid query parameter (e.g. occurred_from not a real date).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employees/{employeeId}/sensitive-documents:
    get:
      operationId: getEmployeeSensitiveDocuments
      summary: >
        Highly Sensitive EmployeeDocument metadata -- a SEPARATE,
        narrowly-authorized read path from the general Profile
        endpoint (section 12/14/59). Requires hr.employees.sensitive.view.
        Never returns a storage path/disk or a file URL; a successful
        non-empty read is audited exactly once
        (hr.employee_document.sensitive_viewed) by the underlying
        service, not by this endpoint itself. Phase 8A.15: rate-limited
        by the stricter `hr-api-sensitive-reads` policy (20/min,
        School+actor-keyed) rather than the 120/min policy the other
        three HR endpoints share.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
      responses:
        "200":
          description: OK (an empty array is a valid, unaudited result -- no sensitive document exists for this Employee).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmployeeSensitiveDocument" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: >
            Authenticated but lacking hr.employees.sensitive.view in
            this School -- identical response whether or not sensitive
            documents actually exist (no existence oracle, section 60).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Employee does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/enrollment-rollovers:
    get:
      operationId: listEnrollmentRollovers
      summary: >
        Administrative rollover Plan directory. Requires
        enrollments.view AND enrollments.rollovers.view (both,
        independent -- CapabilityResolver has no inheritance).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: source_academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: target_academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, validated, executing, completed, completed_with_errors, cancelled] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RolloverPlanSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      operationId: createEnrollmentRollover
      summary: >
        Creates a draft rollover Plan. Requires enrollments.manage AND
        enrollments.rollovers.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloverPlanInput" }
      responses:
        "201":
          description: Created
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverPlanSummary" } } }
        "422":
          description: >
            Validation failure (including a foreign-School or
            nonexistent Academic Year id -- indistinguishable), same
            source/target year, or an open Plan already exists for this
            year pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}:
    get:
      operationId: getEnrollmentRollover
      summary: >
        Rollover Plan detail -- metadata, Mappings, and a durable
        execution summary. Requires enrollments.view AND
        enrollments.rollovers.view. Never embeds the (potentially very
        large) Item collection; see the separate paginated Items
        endpoint.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverPlan" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).

  /schools/{schoolId}/enrollment-rollovers/{rollover}/items:
    get:
      operationId: listEnrollmentRolloverItems
      summary: >
        Paginated rollover Item results for one Plan. Requires
        enrollments.view AND enrollments.rollovers.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { name: validation_result, in: query, required: false, schema: { type: string, enum: [ready, excluded, already_enrolled, review, blocked] } }
        - { name: execution_status, in: query, required: false, schema: { type: string, enum: [succeeded, reconciled, skipped, failed] } }
        - { name: decision, in: query, required: false, schema: { type: string, enum: [undecided, promote, repeat, exclude, manual_review] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RolloverItem" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}/items/{item}:
    patch:
      operationId: updateEnrollmentRolloverItem
      summary: >
        Sets one Item's operator-controlled configuration (decision/
        target Section override/Roll Number strategy/value). Requires
        enrollments.manage AND enrollments.rollovers.manage.
        Idempotency-Key required. Rejected once the Item has already
        produced a target Enrollment, or while the Plan is executing/
        terminal -- delegates entirely to
        EnrollmentRolloverPlanService::setItemDecision().
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/RolloverItemId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloverItemInput" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverItem" } } }
        "404":
          description: Not found (including an Item belonging to a DIFFERENT Plan than the route's -- indistinguishable from nonexistent).
        "422":
          description: Invalid decision/strategy, already-executed Item, or non-configurable Plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}/mappings:
    post:
      operationId: createEnrollmentRolloverMapping
      summary: >
        Creates/upserts a Grade-default (source_section_id omitted) or
        Section-specific mapping. Requires enrollments.manage AND
        enrollments.rollovers.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloverMappingInput" }
      responses:
        "201":
          description: Created
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverMapping" } } }
        "422":
          description: Non-configurable Plan (executing/terminal), or a cross-School Grade/Section reference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}/mappings/{mapping}:
    patch:
      operationId: updateEnrollmentRolloverMapping
      summary: >
        Changes an existing Mapping's target Grade/Section only.
        Requires enrollments.manage AND enrollments.rollovers.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/RolloverMappingId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloverMappingUpdateInput" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverMapping" } } }
        "404":
          description: Not found (including a Mapping belonging to a DIFFERENT Plan than the route's -- indistinguishable from nonexistent).
        "422":
          description: Non-configurable Plan (executing/terminal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}/subject-mappings/{subjectOffering}:
    put:
      operationId: upsertEnrollmentRolloverSubjectMapping
      summary: >
        Phase 1G.4. Creates/updates the explicit elective carry-forward
        mapping for one SOURCE SubjectOffering -- addressed by the
        source Offering's own id (the natural (Plan, source Offering)
        identity, Phase 1G.1's own uniqueness), never an internal
        mapping row UUID. `target_subject_offering_id: null` is a
        valid, DISTINCT state (EXPLICIT OMIT) from DELETING this
        resource (UNCONFIGURED) -- the two are never conflated.
        Delegates entirely to
        EnrollmentRolloverPlanService::upsertSubjectMapping(). Requires
        enrollments.manage AND enrollments.rollovers.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/SubjectOfferingId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloverSubjectMappingUpsertInput" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverSubjectMappingMutationResult" } } }
        "404":
          description: Not found (including a source SubjectOffering belonging to a DIFFERENT School than the route's -- indistinguishable from nonexistent).
        "422":
          description: Non-configurable Plan, cross-School reference, wrong source/target Academic Year, or a required SubjectOffering used as source/target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: removeEnrollmentRolloverSubjectMapping
      summary: >
        Phase 1G.4. Returns one SOURCE SubjectOffering's mapping to
        UNCONFIGURED (deletes the mapping row entirely) -- distinct
        from PUTting `target_subject_offering_id: null` (EXPLICIT
        OMIT). Delegates entirely to
        EnrollmentRolloverPlanService::removeSubjectMapping(), which is
        ITSELF idempotent against an already-unconfigured source
        Offering (no Idempotency-Key required for that reason -- same
        rationale as
        DELETE /student-guardian-relationships/{relationship}). Requires
        enrollments.manage AND enrollments.rollovers.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/SubjectOfferingId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverSubjectMappingMutationResult" } } }
        "404":
          description: Not found (including a source SubjectOffering belonging to a DIFFERENT School than the route's -- indistinguishable from nonexistent).
        "422":
          description: Non-configurable Plan (executing/terminal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}/validate:
    post:
      operationId: validateEnrollmentRollover
      summary: >
        Runs the dry-run/eligibility/conflict engine
        (EnrollmentRolloverDryRunService::run()) -- persists ONLY
        rollover planning state, zero StudentEnrollment/Student/
        AcademicYear/GradeLevel/Section/Campus writes. Requires
        enrollments.manage AND enrollments.rollovers.manage
        (mutation-tier -- persists Plan/Item validation state; the
        read-only capability pair cannot trigger it). Idempotency-Key
        required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverDryRunSummary" } } }
        "422":
          description: Non-configurable Plan (executing/terminal), or invalid chronology.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}/start:
    post:
      operationId: startEnrollmentRollover
      summary: >
        Claims a validated Plan and executes it (delegates entirely to
        EnrollmentRolloverExecutionService::start() -- no Item loop, no
        Enrollment-creation call, in this controller). OPERATIONAL
        LIMITATION: no queue exists yet -- this ONE synchronous request
        processes at most 100 Items (server-owned, never
        caller-controlled); a larger Plan requires additional calls to
        /resume. The response always reflects the Plan's ACTUAL
        persisted state, never a fabricated "completed". Requires
        enrollments.manage AND enrollments.rollovers.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverExecutionSummary" } } }
        "409":
          description: Plan is already executing -- use /resume instead; never an automatic silent resume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Plan is not currently validated for its present configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollment-rollovers/{rollover}/resume:
    post:
      operationId: resumeEnrollmentRollover
      summary: >
        Continues an already-executing Plan (delegates to
        EnrollmentRolloverExecutionService::resume()). Same 100-Item
        per-request cap as /start. Requires enrollments.manage AND
        enrollments.rollovers.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RolloverId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/RolloverExecutionSummary" } } }
        "422":
          description: Plan is not currently executing -- nothing to resume (including an already-completed Plan; calling resume again is a clean no-op rejection, never a silent re-run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/employees/{employeeId}/documents:
    post:
      operationId: uploadEmployeeDocument
      summary: >
        Phase 0E.5 -- uploads a generic Document owned by an Employee
        (ADR 0012, docs/modules/DOCUMENTS.md). Requires
        hr.employees.documents.manage, or hr.employees.sensitive.manage
        for classification_tier=highly_sensitive. A thin transport over
        DocumentService::create() -- authorization, MIME/size policy,
        and audit all remain in the Application service.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, classification_tier]
              properties:
                file: { type: string, format: binary }
                classification_tier: { type: string, enum: [public, internal, sensitive, highly_sensitive] }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking the required Employee-document capability for this classification tier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Employee does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Missing/invalid file, missing/invalid classification_tier, disallowed file type, or file too large.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: listEmployeeDocuments
      summary: >
        Phase 0E.5 -- owner-scoped ordinary Document listing
        (public/internal/sensitive tiers only). Requires
        hr.employees.documents.view. highly_sensitive rows are excluded
        at the SQL level -- never counted in meta.total, never
        occupying a page slot (docs/modules/DOCUMENTS.md "Visible-total-only
        pagination").
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.documents.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Employee does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employees/{employeeId}/documents/sensitive:
    get:
      operationId: listEmployeeSensitiveDocuments
      summary: >
        Phase 0E.5 -- Highly Sensitive-only Document listing, a
        SEPARATE operation from the ordinary listing above (never a
        classification query filter on it). Requires
        hr.employees.sensitive.view. A successful non-empty read is
        audited exactly once (document.sensitive_list_viewed) by the
        underlying service, never per row.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK (an empty result is valid and unaudited).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.sensitive.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Employee does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/documents/{documentId}:
    get:
      operationId: getDocument
      summary: >
        Phase 0E.5 -- direct by-id Document metadata (any classification
        tier). Requires hr.employees.documents.view, or
        hr.employees.sensitive.view for a highly_sensitive Document.
        Knowing a Document UUID is never sufficient by itself --
        404 is used identically for "does not exist", "belongs to a
        different School", and (via the underlying service) an owner
        type this checkpoint does not activate for reads
        (docs/modules/DOCUMENTS.md "404 vs 403").
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/DocumentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Document" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking the required capability for this Document's classification tier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Document does not exist, belongs to a different School, or has an owner type not yet activated for reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/documents/{documentId}/content:
    get:
      operationId: getDocumentContent
      summary: >
        Phase 0E.5 -- streams the Document's bytes. Same authorization
        boundary as the metadata endpoint above. A successful
        highly_sensitive access is audited exactly once
        (document.sensitive_content_accessed) meaning an authorized
        stream was opened -- not that transport-level delivery to the
        client completed (docs/modules/DOCUMENTS.md "Content audit
        semantics"). No Range/206 support. Cache-Control is always
        private, no-store; Content-Disposition is always attachment.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/DocumentId" }
      responses:
        "200":
          description: OK -- binary content.
          headers:
            Content-Disposition: { schema: { type: string }, description: "attachment; filename=... (the sanitized original filename)." }
            Content-Length: { schema: { type: integer }, description: "The persisted size_bytes recorded at upload time." }
            Cache-Control: { schema: { type: string, example: "private, no-store" } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking the required capability for this Document's classification tier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Document does not exist, belongs to a different School, or has an owner type not yet activated for reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: The stored object could not be read (safe, generic -- never a raw storage-provider error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/documents/{documentId}/archive:
    post:
      operationId: archiveDocument
      summary: >
        Phase 0E.5 -- archives a Document (status only -- never a hard
        delete, never an object delete, never a classification/owner
        change). A thin transport over DocumentService::archive().
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/DocumentId" }
      responses:
        "204":
          description: Archived. No body -- avoids an unintended Highly Sensitive metadata-read audit merely to build a response.
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking the required capability for this Document's classification tier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Document does not exist, belongs to a different School, or has an owner type not yet activated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  # --- Phase 1D.5: Admissions administrative surface
  # (docs/admissions/PHASE-1D-5-ADMINISTRATIVE-API.md). Exposes the
  # already-built Admissions domain (Phase 1D.1-1D.4); admissions.manage
  # gates every write including conversion, mirroring enrollments.manage
  # covering its whole Enrollment lifecycle as one capability.

  /schools/{schoolId}/applicants:
    get:
      operationId: listApplicants
      summary: List/search a School's Applicants. Requires admissions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: name, in: query, required: false, schema: { type: string }, description: Matches first or last name. }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApplicantSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      operationId: createApplicant
      summary: Creates an Applicant. Requires admissions.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicantInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Applicant" } } }

  /schools/{schoolId}/applicants/{applicantId}:
    get:
      operationId: getApplicant
      summary: Fetch one Applicant. Requires admissions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ApplicantId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Applicant" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).

  /schools/{schoolId}/applicants/{applicantId}/applications:
    get:
      operationId: listApplicantApplications
      summary: >
        Full reapplication history for one Applicant, newest first --
        never collapsed (docs/modules/ADMISSIONS.md §3). Requires
        admissions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ApplicantId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AdmissionApplicationSummary" } } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).

  /schools/{schoolId}/admission-applications:
    get:
      operationId: listAdmissionApplications
      summary: List/filter a School's AdmissionApplications. Requires admissions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, submitted, accepted, rejected, withdrawn, converted] } }
        - { name: academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: campus_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: grade_level_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: applicant_name, in: query, required: false, schema: { type: string }, description: Matches the Applicant's first or last name. }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdmissionApplicationSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      operationId: createAdmissionApplication
      summary: >
        Creates a draft AdmissionApplication. Always begins as `draft`
        -- no `status` is ever accepted. Requires admissions.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionApplicationInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdmissionApplication" } } }
        "422":
          description: Cross-School reference, or an open (draft/submitted/accepted) application already exists for this Applicant/AcademicYear/Campus/GradeLevel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/admission-applications/{admissionApplicationId}:
    get:
      operationId: getAdmissionApplication
      summary: >
        Fetch one AdmissionApplication, including decisionNote and
        conversion provenance. Requires admissions.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AdmissionApplicationId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdmissionApplication" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).

  /schools/{schoolId}/admission-applications/{admissionApplicationId}/submit:
    post:
      operationId: submitAdmissionApplication
      summary: draft -> submitted. Requires admissions.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AdmissionApplicationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdmissionApplication" } } }
        "422":
          description: Not currently draft -- an illegal lifecycle transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/admission-applications/{admissionApplicationId}/accept:
    post:
      operationId: acceptAdmissionApplication
      summary: >
        submitted -> accepted. Never triggers conversion -- accept and
        convert remain distinct commands. Requires admissions.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AdmissionApplicationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionDecisionInput" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdmissionApplication" } } }
        "422":
          description: Not currently submitted -- an illegal lifecycle transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/admission-applications/{admissionApplicationId}/reject:
    post:
      operationId: rejectAdmissionApplication
      summary: submitted -> rejected. No hard delete. Requires admissions.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AdmissionApplicationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionDecisionInput" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdmissionApplication" } } }
        "422":
          description: Not currently submitted -- an illegal lifecycle transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/admission-applications/{admissionApplicationId}/withdraw:
    post:
      operationId: withdrawAdmissionApplication
      summary: >
        submitted -> withdrawn, or accepted -> withdrawn. Never touches
        decisionNote. Requires admissions.manage. Idempotency-Key
        required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AdmissionApplicationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdmissionApplication" } } }
        "422":
          description: Not currently submitted/accepted -- an illegal lifecycle transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/admission-applications/{admissionApplicationId}/convert:
    post:
      operationId: convertAdmissionApplication
      summary: >
        accepted -> converted. Composes StudentService/GuardianService/
        GuardianContactService/StudentGuardianRelationshipService/
        StudentEnrollmentService inside one outer transaction
        (docs/admissions/PHASE-1D-3-ADMISSION-CONVERSION.md). Omitting
        `guardian`, or sending it as null, is the one canonical "no
        Guardian" representation. Requires admissions.manage.
        Idempotency-Key required (defense-in-depth on top of this
        endpoint's own domain-level conversion idempotency).
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AdmissionApplicationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionConversionInput" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdmissionConversionResult" } } }
        "422":
          description: >
            Not currently accepted (including already converted --
            AdmissionApplicationAlreadyConvertedException), an
            incompatible Section, a duplicate Student Number, a
            duplicate roll number, or a Guardian create-vs-link
            candidate conflict (AdmissionGuardianSelectionRequiredException
            -- never returns candidate ids/names/contact values).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

