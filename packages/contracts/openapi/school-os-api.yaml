        employerEpf: { type: string, nullable: true }
        employerEdli: { type: string, nullable: true }
        esiIsCovered: { type: boolean }
        employeeEsi: { type: string, nullable: true }
        employerEsi: { type: string, nullable: true, description: Informational. }
        professionalTax: { type: string, nullable: true }
        lwfCharged: { type: boolean }
        employeeLwf: { type: string, nullable: true }
        employerLwf: { type: string, nullable: true, description: Informational. }
        tdsMonthlyDeduction: { type: string, nullable: true }
        tdsResidualComplianceException: { type: string, nullable: true, description: "Set only on a fail-closed insufficient-salary cycle (ADR 0036 §1.10) -- never a fabricated employer-funded TDS payment." }
        maskedPan: { type: string, nullable: true }
        maskedUan: { type: string, nullable: true }
        maskedPfMemberId: { type: string, nullable: true }
        maskedEsicIpNumber: { type: string, nullable: true }
