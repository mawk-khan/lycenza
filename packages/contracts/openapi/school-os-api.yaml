      schema: { type: string, format: uuid }
    TransportStudentAssignmentId:
      name: transportStudentAssignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VisitorId:
      name: visitorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VisitorVisitId:
      name: visitorVisitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JournalEntryId:
      name: journalEntryId
      in: path
      required: true
      description: Phase 0G.6. Nonexistent or cross-School ids both resolve to JOURNAL_ENTRY_NOT_FOUND -- no existence oracle.
      schema: { type: string, format: uuid }
    ChargeId:
      name: chargeId
      in: path
      required: true
      description: Phase 0G.6. Nonexistent or cross-School ids both resolve to CHARGE_NOT_FOUND -- no existence oracle.
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Phase 0G.6. Nonexistent or cross-School ids both resolve to PAYMENT_NOT_FOUND -- no existence oracle.
      schema: { type: string, format: uuid }
    SalaryComponentId:
      name: salaryComponentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SalaryStructureId:
      name: salaryStructureId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmploymentRecordId:
      name: employmentRecordId
      in: path
      required: true
      description: An HR EmploymentRecord id (read-only cross-module reference).
      schema: { type: string, format: uuid }
    CompensationAssignmentId:
      name: compensationAssignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PayrollPeriodId:
      name: payrollPeriodId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PayrollRunId:
      name: payrollRunId
      in: path
      required: true
      description: Phase 9.8. Nonexistent or cross-School ids both resolve to PAYROLL_RUN_NOT_FOUND -- no existence oracle.
      schema: { type: string, format: uuid }
    StatutoryIdentifierType:
      name: identifierType
      in: path
      required: true
      description: Checkpoint 9.6I.
      schema: { type: string, enum: [pan, uan, pf_member_id, esic_ip_number] }
    HostelId:
      name: hostelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HostelRoomId:
      name: hostelRoomId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HostelBedId:
      name: hostelBedId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HostelResidencyAssignmentId:
      name: hostelResidencyAssignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InventoryItemId:
      name: inventoryItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InventoryLocationId:
      name: inventoryLocationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CanteenOutletId:
      name: canteenOutletId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CanteenItemId:
      name: canteenItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CanteenRecipeRequirementId:
      name: requirement
      in: path
      required: true
      description: CanteenItemInventoryRequirement id.
      schema: { type: string, format: uuid }
    CanteenOrderId:
      name: canteenOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TimetablePeriodId:
      name: timetablePeriodId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TimetableEntryId:
      name: timetableEntryId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    RateLimitLimit:
      description: The caller's own request budget for the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the caller's own current window.
      schema: { type: integer }
    XRequestId:
      description: Correlates this response with server-side logs/audit entries.
      schema: { type: string, format: uuid }
    IdempotencyReplayed:
      description: >
        Present and "true" only when this response is a replay of a
        previously completed request with the same Idempotency-Key
        (docs/architecture/API.md, "Idempotency"); absent on a request's
        first, freshly-executed response.
      schema: { type: string, enum: ["true"] }
    RetryAfter:
      description: >
        Phase 8A.15 -- seconds until the caller's rate-limit window
        resets. Present on every 429 across the whole `/api/v1` surface
        (not HR-specific) since `bootstrap/app.php`'s exception
        renderer merges `ThrottleRequestsException::getHeaders()`.
      schema: { type: integer }

  schemas:
    ResponseMeta:
      type: object
      required: [apiVersion, requestId]
      properties:
        apiVersion: { type: string, example: v1 }
        requestId: { type: string, format: uuid, nullable: true }

    PaginationMeta:
      type: object
      required: [page, perPage, total]
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, status, requestId]
          properties:
            message: { type: string }
            status: { type: integer }
            code:
              type: string
              nullable: true
              description: >
                Stable machine-readable error code (e.g.
                IDEMPOTENCY_KEY_CONFLICT, API_SCOPE_INSUFFICIENT), present only for exceptions
                that define one. null otherwise -- see
                docs/architecture/API.md ("Error format").
            requestId: { type: string, format: uuid, nullable: true }
            errors:
              type: object
              nullable: true
              description: Field-level validation errors, present only on 422 responses.

    Money:
      type: object
      description: >
        Phase 0G.6: an exact decimal amount plus its explicit currency --
        NEVER a JSON number/float (docs/architecture/adr/0030). `amount`
        is a plain decimal string, at most 12 integer digits and 2
        fractional digits (matching every Phase 0G table's
        NUMERIC(14,2) columns); no scientific notation, no locale
        formatting.
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", example: "1000.00" }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: INR, description: "INR only in Phase 0G -- no multi-currency support yet." }

    LedgerAccount:
      type: object
      required: [id, code, name, type, currency, isSystem, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [asset, liability, equity, income, expense] }
        currency: { type: string, example: INR }
        isSystem: { type: boolean }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JournalLine:
      type: object
      required: [id, ledgerAccountId, accountCode, accountName, side, amount, currency]
      properties:
        id: { type: string, format: uuid }
        ledgerAccountId: { type: string, format: uuid }
        accountCode: { type: string }
        accountName: { type: string }
        side: { type: string, enum: [debit, credit] }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }

    JournalEntrySummary:
      type: object
      required: [id, currency, description, postedAt, reversalOfJournalEntryId, reversedByJournalEntryId, lineCount]
      description: Deliberately never includes posting_txid (internal PostgreSQL transaction-identity metadata, never Finance business data).
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, example: INR }
        description: { type: string }
        postedAt: { type: string, format: date-time }
        reversalOfJournalEntryId: { type: string, format: uuid, nullable: true }
        reversedByJournalEntryId: { type: string, format: uuid, nullable: true }
        lineCount: { type: integer }

    JournalEntryDetail:
      allOf:
        - $ref: "#/components/schemas/JournalEntrySummary"
        - type: object
          required: [lines]
          properties:
            lines: { type: array, items: { $ref: "#/components/schemas/JournalLine" } }

    JournalEntryResult:
      type: object
      required: [id, currency, description, postedAt, reversalOfJournalEntryId, lineCount]
      description: The result of post()/reverse() -- deliberately minimal, never the full detail's lines.
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, example: INR }
        description: { type: string }
        postedAt: { type: string, format: date-time }
        reversalOfJournalEntryId: { type: string, format: uuid, nullable: true }
        lineCount: { type: integer }

    JournalEntryInput:
      type: object
      required: [currency, description, lines]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", example: INR }
        description: { type: string, maxLength: 255 }
        lines:
          type: array
          minItems: 2
          maxItems: 50
          items:
            type: object
            required: [ledger_account_id, side, amount]
            properties:
              ledger_account_id: { type: string, format: uuid }
              side: { type: string, enum: [debit, credit] }
              amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", example: "1000.00" }

    ChargeSummary:
      type: object
      required: [id, studentId, academicYearId, description, amount, currency, dueDate, cancelledAt, createdAt]
      description: No amount_paid/remaining_balance/paid/partially_paid field -- no such settlement status could be justified without a Payment record.
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        description: { type: string }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        dueDate: { type: string, format: date, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ChargeDetail:
      allOf:
        - $ref: "#/components/schemas/ChargeSummary"
        - type: object
          required: [receivableLedgerAccountId, revenueLedgerAccountId, journalEntryId, cancellationJournalEntryId]
          properties:
            receivableLedgerAccountId: { type: string, format: uuid }
            revenueLedgerAccountId: { type: string, format: uuid }
            journalEntryId: { type: string, format: uuid }
            cancellationJournalEntryId: { type: string, format: uuid, nullable: true }

    ChargeResult:
      type: object
      required: [id, studentId, academicYearId, amount, currency, journalEntryId, cancelledAt, cancellationJournalEntryId]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        journalEntryId: { type: string, format: uuid }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancellationJournalEntryId: { type: string, format: uuid, nullable: true }

    ChargeInput:
      type: object
      required: [student_id, academic_year_id, description, amount, currency, receivable_ledger_account_id, revenue_ledger_account_id]
      properties:
        student_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        description: { type: string, maxLength: 255 }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$", example: "1000.00" }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: INR }
        receivable_ledger_account_id: { type: string, format: uuid }
        revenue_ledger_account_id: { type: string, format: uuid }
        due_date: { type: string, format: date, nullable: true }

    PaymentAllocationEntry:
      type: object
      required: [chargeId, amount]
      properties:
        chargeId: { type: string, format: uuid }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }

    PaymentSummary:
      type: object
      required: [id, source, provider, method, amount, currency, settledAt, recordedAt]
      description: >
        Phase 0O.11A: `source` is `provider` (recognized from a verified
        provider event) or `manual` (an offline cash/bank transfer/cheque
        payment recorded by a School user). `provider` is null for a
        manual Payment and `method` null for a provider one. `settledAt`
        is when the money was received; `recordedAt` when Lycenza
        committed the record.
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [provider, manual] }
        provider: { type: string, nullable: true }
        method: { type: string, nullable: true, enum: [cash, bank_transfer, cheque] }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        settledAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    PaymentDetail:
      type: object
      required: [id, source, provider, providerPaymentReference, method, manualReference, recordedByUserId, amount, currency, settlementLedgerAccountId, journalEntryId, settledAt, recordedAt, allocations]
      description: >
        Never includes creation_txid, a raw provider payload, any
        provider secret/signature material, or a manual Payment's
        idempotency key -- structurally impossible, this projection
        carries only normalized, safe fields. Phase 0O.11A: provider
        fields are null for a `manual` Payment; `method`,
        `manualReference` (an optional cheque number or bank transfer
        reference -- never a card or account number) and
        `recordedByUserId` are null for a `provider` one.
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [provider, manual] }
        provider: { type: string, nullable: true }
        providerPaymentReference: { type: string, nullable: true }
        method: { type: string, nullable: true, enum: [cash, bank_transfer, cheque] }
        manualReference: { type: string, nullable: true, maxLength: 64 }
        recordedByUserId: { type: string, format: uuid, nullable: true }
        amount: { type: string, pattern: "^\\d{1,12}(\\.\\d{1,2})?$" }
        currency: { type: string, example: INR }
        settlementLedgerAccountId: { type: string, format: uuid }
        journalEntryId: { type: string, format: uuid }
        settledAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        allocations: { type: array, items: { $ref: "#/components/schemas/PaymentAllocationEntry" } }

    WebhookEndpoint:
      type: object
      required: [id, name, url, status, createdAt]
      description: Never includes the signing secret (see the create/rotate-secret responses for the one-time exception).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: string, format: date-time, nullable: true }

    WebhookSubscription:
      type: object
      required: [id, webhookEndpointId, eventType, enabled]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventType: { type: string }
        enabled: { type: boolean }

    WebhookDelivery:
      type: object
      required: [id, webhookEndpointId, eventId, eventType, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivering, delivered, retrying, failed, abandoned] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lastAttempt:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WebhookDeliveryAttempt" }]

    WebhookDeliveryAttempt:
      type: object
      required: [attemptNumber, outcome]
      description: Never includes the raw response body (section 72).
      properties:
        attemptNumber: { type: integer }
        outcome: { type: string, enum: [success, transient_failure, permanent_failure, timeout, network_error] }
        responseStatus: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        errorClass: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    EducationBoard:
      type: object
      required: [id, code, name]
      description: Platform reference catalog (Phase 0D section 11) -- not School-owned.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    School:
      type: object
      required: [id, name, status, timezone, defaultLocale, countryCode]
      description: >
        `status` is the platform tenant-lifecycle field (Phase 0B) --
        read-only through this API; see SchoolProfileInput.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        legalName: { type: string, nullable: true }
        code: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, archived] }
        timezone: { type: string }
        defaultLocale: { type: string }
        website: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        addressLine2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateRegion: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        educationBoardId: { type: string, format: uuid, nullable: true }

    SchoolProfileInput:
      type: object
      description: Every field is optional (partial update) -- `status` is never accepted here.
      properties:
        name: { type: string, maxLength: 255 }
        legal_name: { type: string, maxLength: 255, nullable: true }
        code: { type: string, maxLength: 32, nullable: true }
        website: { type: string, maxLength: 255, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
        address_line1: { type: string, maxLength: 255, nullable: true }
        address_line2: { type: string, maxLength: 255, nullable: true }
        city: { type: string, maxLength: 120, nullable: true }
        state_region: { type: string, maxLength: 120, nullable: true }
        postal_code: { type: string, maxLength: 20, nullable: true }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        education_board_id: { type: string, format: uuid, nullable: true }

    Campus:
      type: object
      required: [id, name, code, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, description: "Case-insensitively unique within the School (section 65)." }
        status: { type: string, enum: [active, inactive] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }

    CampusInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        phone: { type: string, maxLength: 32, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }

    Room:
      type: object
      required: [id, campusId, name, code, roomType, status]
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        roomType: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    RoomInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        room_type: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }

    LibraryTitle:
      type: object
      required: [id, title, status]
      description: A bibliographic/catalogue record (see docs/modules/LIBRARY.md "Catalogue vs. copy modeling decision"). Never carries a copy count or availability -- see LibraryCopy for that.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    LibraryTitleInput:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        author: { type: string, maxLength: 255, nullable: true }
        isbn: { type: string, maxLength: 32, nullable: true }
        status: { type: string, enum: [active, inactive] }

    LibraryCopy:
      type: object
      required: [id, libraryTitleId, code, status, available]
      description: One individually loanable physical object. `available` is DERIVED (status active AND no active Loan), never a stored/mirrored value.
      properties:
        id: { type: string, format: uuid }
        libraryTitleId: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true, description: "Optional -- a multi-campus School may track which Campus physically holds this Copy." }
        code: { type: string, description: "The Copy's own accession identifier, case-insensitively unique within the School." }
        status: { type: string, enum: [active, inactive] }
        available: { type: boolean }

    LibraryCopyInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    LibraryLoan:
      type: object
      required: [id, status, checkedOutAt, dueAt, copy, student]
      description: One circulation/loan record. A Copy may have at most one Loan with status=active at a time (database-enforced, docs/modules/LIBRARY.md "Concurrency/database invariants").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, returned] }
        checkedOutAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        checkedInAt: { type: string, format: date-time, nullable: true }
        isOverdue: { type: boolean }
        copy:
          type: object
          required: [id, code, title]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            title: { type: string }
        student:
          type: object
          required: [id, studentNumber, firstName]
          properties:
            id: { type: string, format: uuid }
            studentNumber: { type: string }
            firstName: { type: string }
            lastName: { type: string, nullable: true }

    LibraryLoanInput:
      type: object
      required: [library_copy_id, student_id, due_at]
      properties:
        library_copy_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }

    TransportRoute:
      type: object
      required: [id, code, name, status]
      description: A Transport route (docs/modules/TRANSPORT.md "Campus ownership decision"). `campusId` null means School-wide shared Transport, not an error.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportRouteInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportStop:
      type: object
      required: [id, routeId, name, sequence, status]
      description: An ordered pickup/drop-off point belonging to exactly one Route (docs/modules/TRANSPORT.md "Stop integrity").
      properties:
        id: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        name: { type: string }
        sequence: { type: integer, minimum: 1 }
        address: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportStopInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        sequence: { type: integer, minimum: 1 }
        address: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportVehicle:
      type: object
      required: [id, code, registrationNumber, status]
      description: A School Transport vehicle. `capacity` is informational-only in this checkpoint (docs/modules/TRANSPORT.md "Vehicle capacity invariant") -- no seat-count enforcement.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        registrationNumber: { type: string }
        capacity: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportVehicleInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        registration_number: { type: string, maxLength: 64 }
        capacity: { type: integer, minimum: 1, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    TransportRouteAssignment:
      type: object
      required: [id, routeId, status, startsOn, vehicle, driver]
      description: The historical Route <-> Vehicle <-> Driver operational configuration. At most one assignment per Route has status=active at a time (database-enforced, docs/modules/TRANSPORT.md "Route operational assignment decision").
      properties:
        id: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startsOn: { type: string, format: date-time }
        endsOn: { type: string, format: date-time, nullable: true }
        vehicle:
          type: object
          required: [id, code, registrationNumber]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            registrationNumber: { type: string }
        driver:
          type: object
          required: [id, employeeNumber, fullName]
          properties:
            id: { type: string, format: uuid }
            employeeNumber: { type: string }
            fullName: { type: string }

    TransportRouteAssignmentInput:
      type: object
      required: [vehicle_id, driver_employee_id]
      properties:
        vehicle_id: { type: string, format: uuid }
        driver_employee_id: { type: string, format: uuid }

    TransportStudentAssignment:
      type: object
      required: [id, status, startsOn, student, route]
      description: One Student's Transport assignment. At most one assignment per Student has status=active at a time (database-enforced, docs/modules/TRANSPORT.md "Student assignment model").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startsOn: { type: string, format: date-time }
        endsOn: { type: string, format: date-time, nullable: true }
        student:
          type: object
          required: [id, studentNumber, firstName]
          properties:
            id: { type: string, format: uuid }
            studentNumber: { type: string }
            firstName: { type: string }
            lastName: { type: string, nullable: true }
        route:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        pickupStop:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        dropoffStop:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    TransportStudentAssignmentInput:
      type: object
      required: [student_id, route_id]
      properties:
        student_id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        pickup_stop_id: { type: string, format: uuid, nullable: true }
        dropoff_stop_id: { type: string, format: uuid, nullable: true }

    Visitor:
      type: object
      required: [id, fullName, status]
      description: A School's Visitor directory record (docs/modules/VISITOR.md "Visitor directory model"). School-scoped, not Campus-scoped.
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    VisitorInput:
      type: object
      properties:
        full_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 32, nullable: true }
        status: { type: string, enum: [active, inactive] }

    VisitorVisit:
      type: object
      required: [id, status, purpose, checkedInAt, visitor, campus]
      description: A Visitor's check-in/check-out visit to a Campus. At most one Visit per Visitor has status=checked_in at a time (database-enforced, docs/modules/VISITOR.md "One-active-visit invariant").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [checked_in, checked_out] }
        purpose: { type: string }
        gatePassNumber: { type: string, nullable: true }
        checkedInAt: { type: string, format: date-time }
        checkedOutAt: { type: string, format: date-time, nullable: true }
        visitor:
          type: object
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            phone: { type: string, nullable: true }
        campus:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        hostEmployee:
          type: object
          nullable: true
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }

    VisitorVisitInput:
      type: object
      required: [visitor_id, campus_id, purpose]
      properties:
        visitor_id: { type: string, format: uuid }
        campus_id: { type: string, format: uuid }
        host_employee_id: { type: string, format: uuid, nullable: true }
        purpose: { type: string, maxLength: 500 }
        gate_pass_number: { type: string, maxLength: 64, nullable: true }

    Hostel:
      type: object
      required: [id, campusId, code, name, status]
      description: A School's Hostel (docs/modules/HOSTEL.md "Hostel model"). Belongs to exactly one Campus.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }

    HostelInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        campus_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }

    HostelRoom:
      type: object
      required: [id, hostelId, code, status]
      description: A Room belonging to exactly one Hostel (docs/modules/HOSTEL.md "HostelRoom model"). No stored capacity -- derive it from active HostelBed rows.
      properties:
        id: { type: string, format: uuid }
        hostelId: { type: string, format: uuid }
        code: { type: string }
        floorOrBlock: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    HostelRoomInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        floor_or_block: { type: string, maxLength: 64, nullable: true }
        status: { type: string, enum: [active, inactive] }

    HostelBed:
      type: object
      required: [id, hostelRoomId, code, status]
      description: One independently assignable physical Bed belonging to exactly one Room (docs/modules/HOSTEL.md "HostelBed model"). No stored occupant -- current occupancy is derived from the active HostelResidencyAssignment referencing this Bed.
      properties:
        id: { type: string, format: uuid }
        hostelRoomId: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }

    HostelBedInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, inactive] }

    HostelResidencyAssignment:
      type: object
      required: [id, status, startsOn, student, bed]
      description: A Student's Hostel residency assignment to a Bed. At most one assignment per Bed AND one per Student has status=active at a time (database-enforced, docs/modules/HOSTEL.md "ResidencyAssignment lifecycle").
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startsOn: { type: string, format: date-time }
        endsOn: { type: string, format: date-time, nullable: true }
        student:
          type: object
          required: [id, studentNumber, firstName]
          properties:
            id: { type: string, format: uuid }
            studentNumber: { type: string }
            firstName: { type: string }
            lastName: { type: string, nullable: true }
        bed:
          type: object
          required: [id, code, room]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            room:
              type: object
              required: [id, code, hostel]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                hostel:
                  type: object
                  required: [id, code, name]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    name: { type: string }

    HostelResidencyAssignmentInput:
      type: object
      required: [student_id, hostel_bed_id]
      properties:
        student_id: { type: string, format: uuid }
        hostel_bed_id: { type: string, format: uuid }

    InventoryItem:
      type: object
      required: [id, code, name, unitOfMeasure, allowsFractionalQuantity, status]
      description: A School-wide catalogue definition of what is stocked (docs/modules/INVENTORY.md "InventoryItem model"). Carries no quantity/cost of its own.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        unitOfMeasure: { type: string, enum: [each, box, packet, kg, litre] }
        allowsFractionalQuantity: { type: boolean, description: "Derived from unitOfMeasure, never a separately stored flag." }
        status: { type: string, enum: [active, inactive] }

    InventoryItemInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        unit_of_measure: { type: string, enum: [each, box, packet, kg, litre] }
        status: { type: string, enum: [active, inactive] }

    InventoryLocation:
      type: object
      required: [id, code, name, status]
      description: A physical stock-holding location (docs/modules/INVENTORY.md "InventoryLocation model"). School-owned; campusId is optional -- a Location may be School-wide.
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }

    InventoryLocationInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        campus_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    InventoryStockBalance:
      type: object
      required: [id, quantityOnHand, item, location]
      description: The AUTHORITATIVE current quantity for one (Item, Location) pair (docs/modules/INVENTORY.md "Stock truth architecture"). Mathematically reconstructible from StockMovement history at any time.
      properties:
        id: { type: string, format: uuid }
        quantityOnHand: { type: string, description: "Exact decimal string, NUMERIC(14,3) -- never a float." }
        item:
          type: object
          required: [id, code, name, unitOfMeasure]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            unitOfMeasure: { type: string }
        location:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }

    StockMovement:
      type: object
      required: [id, movementType, quantity, occurredAt, item]
      description: An immutable, append-only historical stock transaction (docs/modules/INVENTORY.md "Movement history role"). No update/delete endpoint exists.
      properties:
        id: { type: string, format: uuid }
        movementType: { type: string, enum: [receipt, issue, transfer] }
        quantity: { type: string, description: "Exact decimal string, NUMERIC(14,3) -- never a float." }
        occurredAt: { type: string, format: date-time }
        item:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        fromLocation:
          type: object
          nullable: true
          required: [id, code]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
        toLocation:
          type: object
          nullable: true
          required: [id, code]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }

    StockMutationInput:
      type: object
      required: [inventory_item_id, inventory_location_id, quantity]
      properties:
        inventory_item_id: { type: string, format: uuid }
        inventory_location_id: { type: string, format: uuid }
        quantity: { type: string, description: "Exact decimal string, at most 3 decimal places (e.g. \"10\" or \"1.250\"). Whole-unit Items (each/box/packet) reject a fractional value." }

    TransferStockInput:
      type: object
      required: [inventory_item_id, from_location_id, to_location_id, quantity]
      properties:
        inventory_item_id: { type: string, format: uuid }
        from_location_id: { type: string, format: uuid }
        to_location_id: { type: string, format: uuid }
        quantity: { type: string, description: "Exact decimal string, at most 3 decimal places. from_location_id and to_location_id must differ." }

    CanteenOutlet:
      type: object
      required: [id, code, name, inventoryLocationId, status]
      description: A physical/logical canteen counter, backed by exactly one InventoryLocation it issues stock from at fulfillment time (docs/modules/CANTEEN.md "Outlet model").
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        campusId: { type: string, format: uuid, nullable: true }
        inventoryLocationId: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }

    CanteenOutletInput:
      type: object
      required: [code, name, inventory_location_id]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        campus_id: { type: string, format: uuid, nullable: true, description: "Optional -- a canteen may be School-wide. If set, inventory_location_id must belong to this SAME Campus." }
        inventory_location_id: { type: string, format: uuid }

    CanteenOutletUpdateInput:
      type: object
      description: name/status only -- inventory_location_id/campus_id are immutable after creation.
      properties:
        name: { type: string, maxLength: 255 }
        status: { type: string, enum: [active, inactive] }

    CanteenItem:
      type: object
      required: [id, code, name, price, currency, status]
      description: A School-wide canteen menu Item. price is the CURRENT sellable price -- an Order line snapshots it at placement time (docs/modules/CANTEEN.md "Price/location snapshot semantics").
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        price: { type: string, description: "Exact decimal string, NUMERIC(14,2) -- never a float." }
        currency: { type: string, example: INR }
        status: { type: string, enum: [active, inactive] }

    CanteenItemDetail:
      description: CanteenItem plus its current recipe.
      allOf:
        - { $ref: "#/components/schemas/CanteenItem" }
        - type: object
          required: [recipe]
          properties:
            recipe: { type: array, items: { $ref: "#/components/schemas/CanteenItemInventoryRequirement" } }

    CanteenItemInput:
      type: object
      required: [code, name, price]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        price: { type: string, description: "Exact decimal string, at most 2 decimal places, non-negative." }

    CanteenItemUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        price: { type: string, description: "Exact decimal string, at most 2 decimal places, non-negative." }
        status: { type: string, enum: [active, inactive] }

    CanteenItemInventoryRequirement:
      type: object
      required: [id, inventoryItemId, inventoryItemCode, inventoryItemName, quantityRequired]
      description: The recipe -- how much of one InventoryItem one unit of a CanteenItem consumes. Evaluated AT FULFILLMENT time, never snapshotted at placement (docs/modules/CANTEEN.md "Recipe model").
      properties:
        id: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        inventoryItemCode: { type: string }
        inventoryItemName: { type: string }
        quantityRequired: { type: string, description: "Exact decimal string, NUMERIC(14,3) -- never a float." }

    CanteenItemInventoryRequirementInput:
      type: object
      required: [inventory_item_id, quantity_required]
      properties:
        inventory_item_id: { type: string, format: uuid }
        quantity_required: { type: string, description: "Exact decimal string, at most 3 decimal places, positive." }

    CanteenItemInventoryRequirementUpdateInput:
      type: object
      required: [quantity_required]
      properties:
        quantity_required: { type: string, description: "Exact decimal string, at most 3 decimal places, positive." }

    CanteenBillingConfiguration:
      type: object
      required: [id, receivableLedgerAccountId, revenueLedgerAccountId, currency]
      description: A School-wide singleton naming the two LedgerAccounts (asset receivable, income revenue) Canteen order fulfillment posts a Charge against (docs/modules/CANTEEN.md "Billing configuration").
      properties:
        id: { type: string, format: uuid }
        receivableLedgerAccountId: { type: string, format: uuid }
        revenueLedgerAccountId: { type: string, format: uuid }
        currency: { type: string, example: INR }

    CanteenBillingConfigurationInput:
      type: object
      required: [receivable_ledger_account_id, revenue_ledger_account_id]
      properties:
        receivable_ledger_account_id: { type: string, format: uuid, description: "Must be an active LedgerAccount of type asset, owned by this School." }
        revenue_ledger_account_id: { type: string, format: uuid, description: "Must be an active LedgerAccount of type income, owned by this School. Must differ from receivable_ledger_account_id." }

    CanteenOrderSummary:
      type: object
      required: [id, status, studentId, outletId, placedAt]
      description: Highly Sensitive list/summary projection -- deliberately excludes every money field and the line array (docs/modules/CANTEEN.md "Highly Sensitive data handling"). Use the detail endpoint for money.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, fulfilled, cancelled] }
        studentId: { type: string, format: uuid }
        outletId: { type: string, format: uuid }
        placedAt: { type: string, format: date-time }
        fulfilledAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }

    CanteenOrderLine:
      type: object
      required: [id, canteenItemId, quantity, unitPrice, lineTotal, currency]
      description: unit_price/line_total are SNAPSHOTS taken at placement time -- immutable afterward (no update/delete endpoint exists for this resource, docs/modules/CANTEEN.md "Order money authority").
      properties:
        id: { type: string, format: uuid }
        canteenItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: string, description: "Exact decimal string, NUMERIC(14,2) -- never a float." }
        lineTotal: { type: string, description: "Exact decimal string; database CHECK proves lineTotal = unitPrice * quantity." }
        currency: { type: string, example: INR }

    CanteenOrder:
      description: Full Order detail (Highly Sensitive) -- CanteenOrderSummary plus every money field and every line.
      allOf:
        - { $ref: "#/components/schemas/CanteenOrderSummary" }
        - type: object
          required: [totalAmount, currency, inventoryLocationId, lines]
          properties:
            totalAmount: { type: string, description: "Exact decimal string; equals the sum of every line's lineTotal (defensively re-checked at placement time)." }
            currency: { type: string, example: INR }
            chargeId: { type: string, format: uuid, nullable: true, description: "Set only once, at fulfillment (canteen_orders_charge_id_unique partial index proves one Charge belongs to at most one Order)." }
            inventoryLocationId: { type: string, format: uuid, description: "Snapshotted from the Outlet at placement time -- never re-derived at fulfillment." }
            lines: { type: array, items: { $ref: "#/components/schemas/CanteenOrderLine" } }

    PlaceCanteenOrderInput:
      type: object
      required: [student_id, outlet_id, lines]
      properties:
        student_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [canteen_item_id, quantity]
            properties:
              canteen_item_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
          description: No two lines may repeat the same canteen_item_id -- combine quantities into a single line instead (CANTEEN_DUPLICATE_ITEM_LINE).

    AcademicYear:
      type: object
      required: [id, name, code, startsOn, endsOn, status]
      description: Only one Academic Year per School may be `active` (section 16, database-enforced).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [draft, active, closed, archived] }

    AcademicYearInput:
      type: object
      required: [name, code, starts_on, ends_on]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: "Must be after starts_on." }

    AcademicTerm:
      type: object
      required: [id, academicYearId, name, code, startsOn, endsOn, sequence]
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        sequence: { type: integer }

    AcademicTermInput:
      type: object
      required: [name, code, starts_on, ends_on, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        sequence: { type: integer, minimum: 1 }

    GradeLevel:
      type: object
      required: [id, name, code, sequence, status]
      description: School-wide reference data (not Campus/Year-scoped, section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        sequence: { type: integer, description: "Explicit pedagogical ordering -- never inferred from name/code." }
        educationStage: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    GradeLevelInput:
      type: object
      required: [name, code, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        sequence: { type: integer, minimum: 0 }
        education_stage: { type: string, nullable: true }

    Section:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, name, code, status]
      description: Belongs to exactly one Academic Year (section 28 -- never reused across years).
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        capacity: { type: integer, nullable: true, description: "Advisory only (section 27) -- not admission-enforced." }
        status: { type: string, enum: [active, inactive] }

    SectionInput:
      type: object
      required: [campus_id, grade_level_id, name, code]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        capacity: { type: integer, nullable: true }

    Subject:
      type: object
      required: [id, name, code, subjectType, status]
      description: School-wide reference data (section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        shortName: { type: string, nullable: true }
        subjectType: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academicDepartmentId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        short_name: { type: string, maxLength: 32, nullable: true }
        subject_type: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academic_department_id: { type: string, format: uuid, nullable: true }

    AcademicDepartment:
      type: object
      required: [id, name, code, status]
      description: Deliberately distinct from a future HR organizational Department (section 32).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }

    AcademicDepartmentInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }

    SubjectOffering:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, subjectId, isRequired, status]
      description: >
        The academic-offering layer (sections 37-40) -- AcademicYear-
        specific by construction, never a global Grade->Subject map.
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        isRequired: { type: boolean }
        sequence: { type: integer, nullable: true }
        weeklyPeriodsTarget: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectOfferingInput:
      type: object
      required: [campus_id, grade_level_id, subject_id]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        is_required: { type: boolean, default: true }
        sequence: { type: integer, nullable: true }
        weekly_periods_target: { type: integer, nullable: true }

    # --- Phase 1A.5: Student & Guardian Identity administrative surface

    StudentSummary:
      type: object
      required: [id, studentNumber, firstName, status]
      description: >
        List-row shape -- deliberately excludes dateOfBirth (Highly
        Sensitive children's data, docs/security/DATA-CLASSIFICATION.md:
        minimized default visibility in broad list views). See Student
        for the full single-record shape.
      properties:
        id: { type: string, format: uuid }
        studentNumber: { type: string }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Student:
      type: object
      required: [id, studentNumber, firstName, status, dateOfBirth, createdAt, updatedAt]
      description: >
        Full single-record shape (show/create/update responses only --
        never the list response, see StudentSummary).
      properties:
        id: { type: string, format: uuid }
        studentNumber: { type: string }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        dateOfBirth: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StudentInput:
      type: object
      required: [student_number, first_name, date_of_birth]
      description: >
        student_number uniqueness is enforced by StudentService/the
        database (school_id, student_number), not by this contract --
        a duplicate is a 422 with code DUPLICATE_STUDENT_NUMBER.
      properties:
        student_number: { type: string, maxLength: 255 }
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }
        date_of_birth: { type: string, format: date }

    GuardianSummary:
      type: object
      required: [id, firstName, status]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Guardian:
      type: object
      required: [id, firstName, status, contacts, students]
      description: Full single-record shape (show response only).
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        contacts: { type: array, items: { $ref: "#/components/schemas/GuardianContact" } }
        students:
          type: array
          items:
            type: object
            required: [relationshipId, student, relationshipType, isPrimary, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
            properties:
              relationshipId: { type: string, format: uuid }
              student:
                type: object
                required: [id, studentNumber, firstName]
                properties:
                  id: { type: string, format: uuid }
                  studentNumber: { type: string }
                  firstName: { type: string }
                  lastName: { type: string, nullable: true }
              relationshipType: { $ref: "#/components/schemas/RelationshipType" }
              isPrimary: { type: boolean }
              isLegalGuardian: { type: boolean }
              isEmergencyContact: { type: boolean }
              isAuthorizedPickup: { type: boolean }

    GuardianInput:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }

    ContactType:
      type: string
      enum: [email, mobile]

    RelationshipType:
      type: string
      enum: [mother, father, parent, step_parent, grandparent, legal_guardian, foster_guardian, sibling, relative, other]

    GuardianContact:
      type: object
      required: [id, type, value, isPrimary, isActive]
      description: >
        Approved fields only -- never encrypted_value, lookup_hash, or
        lookup_key_version (docs/modules/STUDENT-GUARDIAN-IDENTITY.md,
        "Sensitive response exclusions"). `value` is the decrypted
        plaintext, returned only to an actor already holding
        guardians.view.
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string }
        label: { type: string, nullable: true }
        isPrimary: { type: boolean }
        isActive: { type: boolean }
        verifiedAt: { type: string, format: date-time, nullable: true }

    GuardianContactInput:
      type: object
      required: [type, value]
      description: >
        `value` for type=mobile must already be E.164
        (docs/modules/STUDENT-GUARDIAN-IDENTITY.md, "Guardian contact
        mutation") -- a local number is rejected, never silently
        converted.
      properties:
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string, maxLength: 255 }
        label: { type: string, maxLength: 255, nullable: true }
        is_primary: { type: boolean, default: false }

    GuardianCandidateLookupInput:
      type: object
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string, maxLength: 255 }

    StudentGuardianRelationship:
      type: object
      required: [id, studentId, guardian, relationshipType, isPrimary, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        guardian: { $ref: "#/components/schemas/GuardianSummary" }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        isPrimary: { type: boolean }
        isLegalGuardian: { type: boolean }
        isEmergencyContact: { type: boolean }
        isAuthorizedPickup: { type: boolean }

    StudentGuardianRelationshipLinkInput:
      type: object
      required: [guardian_id, relationship_type]
      description: >
        Deliberately excludes is_primary -- see the .../primary action
        (StudentGuardianRelationshipService.link() never auto-promotes).
      properties:
        guardian_id: { type: string, format: uuid }
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean, default: false }
        is_emergency_contact: { type: boolean, default: false }
        is_authorized_pickup: { type: boolean, default: false }

    StudentGuardianRelationshipUpdateInput:
      type: object
      properties:
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean }
        is_emergency_contact: { type: boolean }
        is_authorized_pickup: { type: boolean }

    # --- Phase 1B.5: Student Enrollment administrative surface

    EnrollmentRef:
      type: object
      required: [id, name, code]
      description: A minimal AcademicYear/Campus/GradeLevel/Section reference embedded in an Enrollment row.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }

    EnrollmentSummary:
      type: object
      required: [id, student, academicYear, campus, gradeLevel, section, rollNumber, status, startsOn]
      description: >
        Shared shape for directory rows AND single-record detail (there
        is no broader "full" shape) -- deliberately excludes Student
        dateOfBirth and all Guardian data
        (docs/security/DATA-CLASSIFICATION.md, "minimized default
        visibility"). rollNumber is always a string, never coerced to
        a number (e.g. "007" stays "007").
      properties:
        id: { type: string, format: uuid }
        student: { $ref: "#/components/schemas/StudentSummary" }
        academicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        campus: { $ref: "#/components/schemas/EnrollmentRef" }
        gradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        section: { $ref: "#/components/schemas/EnrollmentRef" }
        rollNumber: { type: string }
        status: { type: string, enum: [active, completed, withdrawn, transferred, cancelled] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, nullable: true }

    Enrollment:
      allOf:
        - { $ref: "#/components/schemas/EnrollmentSummary" }
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    EnrollmentInput:
      type: object
      required: [section_id, roll_number, starts_on]
      description: >
        The Section is the sole authoritative placement input --
        academic_year_id/campus_id/grade_level_id/school_id/student_id
        are never accepted here and are always derived server-side from
        section_id (StudentEnrollmentService::enroll()).
      properties:
        section_id: { type: string, format: uuid }
        roll_number: { type: string, maxLength: 255 }
        starts_on: { type: string, format: date }

    # Phase 8A.14 -- HR read-only transport schemas. Deliberately
    # snake_case property names, UNLIKE every schema above this line --
    # this accurately reflects the REAL, already-committed JSON shape
    # every App\Domain\HR\Application\*::toArray() DTO has produced
    # since 8A.8/8A.9/8A.10/8A.11 (this file is the source of truth for
    # the SHAPE the implementation already has, not a license to
    # rename it to match an unrelated module's casing convention).

    EmployeeDirectoryEntry:
      type: object
      description: Directory-tier only (docs/modules/HR.md "Employee Directory (8A.8)") -- no personal/Restricted/Highly Sensitive field exists on this schema.
      required: [employee_id, employee_number, display_name, position_id, position_name, department_id, department_name, campus_id, campus_name, manager_employee_id, manager_employee_number, manager_display_name]
      properties:
        employee_id: { type: string, format: uuid }
        employee_number: { type: string }
        display_name: { type: string }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }
        manager_employee_id: { type: string, format: uuid, nullable: true }
        manager_employee_number: { type: string, nullable: true }
        manager_display_name: { type: string, nullable: true }

    EmployeeProfileSummary:
      type: object
      required: [employee_id, employee_number, display_name, employee_record_status, user_linked, current_employment_status, position_id, position_name, department_id, department_name, campus_id, campus_name, manager_employee_id, manager_employee_number, manager_display_name]
      properties:
        employee_id: { type: string, format: uuid }
        employee_number: { type: string }
        display_name: { type: string }
        employee_record_status: { type: string, enum: [active, archived] }
        user_linked: { type: boolean }
        current_employment_status: { type: string, nullable: true, enum: [draft, pre_joining, active, notice_period, separated, terminated, retired, deceased] }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }
        manager_employee_id: { type: string, format: uuid, nullable: true }
        manager_employee_number: { type: string, nullable: true }
        manager_display_name: { type: string, nullable: true }

    EmployeeProfilePersonalDetails:
      type: object
      nullable: true
      description: null when the Employee has no EmployeePersonalDetail row -- never an empty object.
      required: [date_of_birth, nationality, marital_status, preferred_language]
      properties:
        date_of_birth: { type: string, format: date, nullable: true }
        nationality: { type: string, nullable: true }
        marital_status: { type: string, nullable: true }
        preferred_language: { type: string, nullable: true }

    EmployeeProfileContact:
      type: object
      nullable: true
      required: [personal_email, personal_phone, alternate_phone]
      properties:
        personal_email: { type: string, nullable: true }
        personal_phone: { type: string, nullable: true }
        alternate_phone: { type: string, nullable: true }

    EmployeeProfileAddress:
      type: object
      required: [id, address_type, address_line1, address_line2, city, state_region, postal_code, country_code]
      properties:
        id: { type: string, format: uuid }
        address_type: { type: string }
        address_line1: { type: string, nullable: true }
        address_line2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state_region: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        country_code: { type: string, nullable: true }

    EmployeeProfileEmergencyContact:
      type: object
      required: [id, name, relationship, phone, alternate_phone, email, is_primary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        relationship: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        alternate_phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        is_primary: { type: boolean }

    EmployeeProfileEmployment:
      type: object
      required: [id, employment_type, starts_on, ends_on, probation_ends_on, status, is_current]
      properties:
        id: { type: string, format: uuid }
        employment_type: { type: string, enum: [permanent, probationary, fixed_term, part_time, temporary, contract, consultant] }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        probation_ends_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draft, pre_joining, active, notice_period, separated, terminated, retired, deceased] }
        is_current: { type: boolean }

    EmployeeProfileAssignment:
      type: object
      required: [id, employment_record_id, is_primary, starts_on, ends_on, is_current, position_id, position_name, department_id, department_name, campus_id, campus_name]
      properties:
        id: { type: string, format: uuid }
        employment_record_id: { type: string, format: uuid }
        is_primary: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        is_current: { type: boolean }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }

    EmployeeProfileQualification:
      type: object
      required: [id, qualification_type, qualification_name, specialization, institution, awarding_body, country_code, starts_on, completed_on, grade_or_result, verification_status, verified_at]
      properties:
        id: { type: string, format: uuid }
        qualification_type: { type: string }
        qualification_name: { type: string }
        specialization: { type: string, nullable: true }
        institution: { type: string, nullable: true }
        awarding_body: { type: string, nullable: true }
        country_code: { type: string, nullable: true }
        starts_on: { type: string, format: date, nullable: true }
        completed_on: { type: string, format: date, nullable: true }
        grade_or_result: { type: string, nullable: true }
        verification_status: { type: string, enum: [unverified, verified, rejected] }
        verified_at: { type: string, format: date-time, nullable: true }

    EmployeeProfileExperience:
      type: object
      required: [id, organization, job_title, starts_on, ends_on, description, location, country_code]
      properties:
        id: { type: string, format: uuid }
        organization: { type: string }
        job_title: { type: string, nullable: true }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        country_code: { type: string, nullable: true }

    EmployeeProfileCertification:
      type: object
      required: [id, name, issuer, credential_number, issued_on, expires_on, verification_status, verified_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        issuer: { type: string, nullable: true }
        credential_number: { type: string, nullable: true }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        verification_status: { type: string, enum: [unverified, verified, rejected] }
        verified_at: { type: string, format: date-time, nullable: true }

    EmployeeProfileDocument:
      type: object
      description: >
        Restricted-tier only -- classification_tier is always
        "restricted" on this schema; highly_sensitive documents never
        appear here (see the dedicated sensitive-documents endpoint).
        Deliberately excludes original_filename/mime_type/size_bytes/
        storage_disk/storage_path/uploaded_by_user_id permanently.
      required: [id, category, classification_tier, issued_on, expires_on, status]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        classification_tier: { type: string, enum: [restricted] }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, archived] }

    EmployeeSensitiveDocument:
      type: object
      description: Identical safe shape to EmployeeProfileDocument, but classification_tier is always "highly_sensitive" -- reachable only through the dedicated sensitive-documents endpoint.
      required: [id, category, classification_tier, issued_on, expires_on, status]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        classification_tier: { type: string, enum: [highly_sensitive] }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, archived] }

    EmployeeProfile:
      type: object
      description: >
        The complete Employee Profile Workspace (docs/modules/HR.md
        "Employee Profile Workspace (8A.9)"). Section-level 8A.10
        authorization is enforced server-side before this response is
        built -- an unauthorized section is [] (repeatable) or the
        section is simply not populated beyond what the actor's
        capabilities allow; this schema itself describes the maximal
        shape, not a per-actor guarantee that every field is present.
      required: [summary, personal_details, contact, addresses, emergency_contacts, employment_history, assignments, qualifications, experience, certifications, documents]
      properties:
        summary: { $ref: "#/components/schemas/EmployeeProfileSummary" }
        personal_details: { $ref: "#/components/schemas/EmployeeProfilePersonalDetails" }
        contact: { $ref: "#/components/schemas/EmployeeProfileContact" }
        addresses: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileAddress" } }
        emergency_contacts: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileEmergencyContact" } }
        employment_history: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileEmployment" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileAssignment" } }
        qualifications: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileQualification" } }
        experience: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileExperience" } }
        certifications: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileCertification" } }
        documents: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileDocument" } }

    EmployeeActivityEntry:
      type: object
      description: A disclosure projection over SchoolAuditEvent (docs/modules/HR.md "Audit & Activity Timeline (8A.11)") -- raw audit metadata never appears here.
      required: [id, event_type, category, occurred_at, actor_user_id, actor_display_name, changed_fields]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        category: { type: string, enum: [employee, personal, employment, professional, document, sensitive_access] }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_display_name: { type: string, nullable: true }
        changed_fields: { type: array, items: { type: string } }

    RolloverPlanSummary:
      type: object
      required: [id, sourceAcademicYear, targetAcademicYear, status, configurationVersion, createdAt]
      description: >
        Phase 1B.7E. Directory-row shape -- deliberately omits mappings
        and executionSummary (only present on RolloverPlan detail) to
        keep the directory listing cheap regardless of Plan count.
      properties:
        id: { type: string, format: uuid }
        sourceAcademicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        targetAcademicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        status: { type: string, enum: [draft, validated, executing, completed, completed_with_errors, cancelled] }
        configurationVersion: { type: integer }
        validatedConfigurationVersion: { type: integer, nullable: true }
        createdBy: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time, nullable: true }
        executionStartedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    RolloverMapping:
      type: object
      required: [id, sourceGradeLevel, targetGradeLevel, isRepeat]
      properties:
        id: { type: string, format: uuid }
        sourceGradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        sourceSection: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        targetGradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        targetSection: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        isRepeat: { type: boolean }

    RolloverSubjectOfferingRef:
      type: object
      required: [id, status]
      description: >
        Phase 1G.4. A minimal, PII-free SubjectOffering reference for
        the subject-mapping workspace -- Subject name/code and academic
        dimensions (GradeLevel/Campus/ElectiveGroup) are non-PII School
        reference/configuration data. `status` is always present so a
        durable mapping's target can be displayed (with an inactive
        warning) even after the Offering itself later became inactive
        (docs/students/PHASE-1G-4-SUBJECT-ROLLOVER-API-UI.md).
      properties:
        id: { type: string, format: uuid }
        subject: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        gradeLevel: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        campus: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        status: { type: string, enum: [active, inactive] }
        electiveGroup: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }

    RolloverSubjectMapping:
      type: object
      required: [id, sourceSubjectOffering, state]
      description: >
        Phase 1G.4/1G.1. `state` is the three-state model surfaced for
        display: this schema only ever represents a row that EXISTS
        (`mapped` or `omit`) -- the UNCONFIGURED state is the ABSENCE
        of a row, represented separately by
        `RolloverPlan.unmappedSourceSubjectOfferings`, never collapsed
        into this list.
      properties:
        id: { type: string, format: uuid }
        sourceSubjectOffering: { $ref: "#/components/schemas/RolloverSubjectOfferingRef" }
        state: { type: string, enum: [mapped, omit] }
        targetSubjectOffering: { allOf: [{ $ref: "#/components/schemas/RolloverSubjectOfferingRef" }], nullable: true }

    RolloverSubjectMappingUpsertInput:
      type: object
      required: [target_subject_offering_id]
      description: >
        `target_subject_offering_id: null` means EXPLICIT OMIT (a
        durable row recording the operator's deliberate choice not to
        carry this elective forward) -- the key must always be present
        (even when null), distinct from DELETing this resource
        (UNCONFIGURED, Phase 1G.1's three-state model).
      properties:
        target_subject_offering_id: { type: string, format: uuid, nullable: true }

    RolloverSubjectMappingMutationResult:
      type: object
      required: [sourceSubjectOffering, state, plan]
      description: >
        Returned by both the PUT and DELETE subject-mapping endpoints
        -- enough authoritative state (including the Plan's own
        versioning/validation-staleness fields) for the UI to update in
        place without a full reload (this checkpoint's brief, section
        38).
      properties:
        sourceSubjectOffering: { $ref: "#/components/schemas/RolloverSubjectOfferingRef" }
        state: { type: string, enum: [unconfigured, omit, mapped] }
        targetSubjectOffering: { allOf: [{ $ref: "#/components/schemas/RolloverSubjectOfferingRef" }], nullable: true }
        plan:
          type: object
          required: [configurationVersion, validatedConfigurationVersion, isValidatedForCurrentConfiguration]
          properties:
            configurationVersion: { type: integer }
            validatedConfigurationVersion: { type: integer, nullable: true }
            isValidatedForCurrentConfiguration: { type: boolean }

    RolloverPlan:
      allOf:
        - { $ref: "#/components/schemas/RolloverPlanSummary" }
        - type: object
          required: [isValidatedForCurrentConfiguration, mappings, subjectMappings, unmappedSourceSubjectOfferings, executionSummary]
          properties:
            isValidatedForCurrentConfiguration: { type: boolean }
            mappings: { type: array, items: { $ref: "#/components/schemas/RolloverMapping" } }
            subjectMappings: { type: array, items: { $ref: "#/components/schemas/RolloverSubjectMapping" } }
            unmappedSourceSubjectOfferings:
              type: array
              description: >
                Phase 1G.4. Bounded discovery list of elective source
                SubjectOfferings with current eligible participation in
                this Plan but NO mapping row yet -- what would trigger
                `missing_subject_mapping` in dry-run. Never implies a
                mapping row was created; purely a read-only projection
                (EnrollmentRolloverReadService::unmappedSourceSubjectOfferings()).
              items: { $ref: "#/components/schemas/RolloverSubjectOfferingRef" }
            executionSummary: { $ref: "#/components/schemas/RolloverExecutionSummary" }

    RolloverPlanInput:
      type: object
      required: [source_academic_year_id, target_academic_year_id]
      description: >
        school_id/status/configuration_version/validated_configuration_version/created_by_user_id/execution
        timestamps are never accepted -- School derives from the route,
        actor from the authenticated User, every other field is
        EnrollmentRolloverPlanService::createDraft()'s own invariant.
      properties:
        source_academic_year_id: { type: string, format: uuid }
        target_academic_year_id: { type: string, format: uuid }

    RolloverMappingInput:
      type: object
      required: [source_grade_level_id, target_grade_level_id]
      properties:
        source_grade_level_id: { type: string, format: uuid }
        source_section_id: { type: string, format: uuid, nullable: true }
        target_grade_level_id: { type: string, format: uuid }
        target_section_id: { type: string, format: uuid, nullable: true }

    RolloverMappingUpdateInput:
      type: object
      required: [target_grade_level_id]
      description: >
        Changes only WHAT an existing mapping points to -- its source
        identity is read from the resolved mapping itself, never
        accepted here (re-keying the source would address a DIFFERENT
        mapping entirely; use RolloverMappingInput/POST for that).
      properties:
        target_grade_level_id: { type: string, format: uuid }
        target_section_id: { type: string, format: uuid, nullable: true }

    RolloverItem:
      type: object
      required: [id, student, sourceEnrollment, decision, validationResult, executionStatus]
      description: >
        Deliberately excludes dateOfBirth/Guardian PII/contact values/
        lookup hashes/encrypted fields -- operational Student summary
        only (docs/security/DATA-CLASSIFICATION.md). rollNumber-shaped
        fields are always strings, never coerced to a number.
      properties:
        id: { type: string, format: uuid }
        student: { $ref: "#/components/schemas/StudentSummary" }
        sourceEnrollment:
          type: object
          properties:
            id: { type: string, format: uuid }
            section: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        decision: { type: string, enum: [undecided, promote, repeat, exclude, manual_review] }
        targetSection: { allOf: [{ $ref: "#/components/schemas/EnrollmentRef" }], nullable: true }
        rollNumberStrategy: { type: string, enum: [explicit, preserve_source], nullable: true }
        targetRollNumber: { type: string, nullable: true }
        validationResult: { type: string, enum: [ready, excluded, already_enrolled, review, blocked], nullable: true }
        validationReason: { type: string, nullable: true }
        executionStatus: { type: string, enum: [succeeded, reconciled, skipped, failed], nullable: true }
        targetEnrollmentId: { type: string, format: uuid, nullable: true }
        executedAt: { type: string, format: date-time, nullable: true }

    RolloverItemInput:
      type: object
      required: [decision]
      description: >
        student_id/source_enrollment_id/validation_result/validation_reason/execution_status/target_enrollment_id/snapshot
        columns/configuration_version are never accepted -- only these
        four operator-editable fields reach
        EnrollmentRolloverPlanService::setItemDecision().
      properties:
        decision: { type: string, enum: [undecided, promote, repeat, exclude, manual_review] }
        target_section_id: { type: string, format: uuid, nullable: true }
        roll_number_strategy: { type: string, enum: [explicit, preserve_source], nullable: true }
        target_roll_number: { type: string, nullable: true }

    RolloverDryRunSummary:
      type: object
      required: [total, ready, excluded, already_enrolled, review, blocked, validated, configurationVersion]
      description: EnrollmentRolloverDryRunService::run()'s own return value, passed through unchanged.
      properties:
        total: { type: integer }
        ready: { type: integer }
        excluded: { type: integer }
        already_enrolled: { type: integer }
        review: { type: integer }
        blocked: { type: integer }
        validated: { type: boolean }
        configurationVersion: { type: integer }

    RolloverExecutionSummary:
      type: object
      required: [total, succeeded, reconciled, skipped, failed, pending]
      description: >
        Recomputed from persisted Items every time -- never an
        in-memory counter. `planStatus` is present only on start()/
        resume()'s own response (EnrollmentRolloverExecutionService's
        return value), not on the Plan-detail-embedded executionSummary.
      properties:
        total: { type: integer }
        succeeded: { type: integer }
        reconciled: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        planStatus: { type: string, enum: [draft, validated, executing, completed, completed_with_errors, cancelled] }

    Document:
      type: object
      description: >
        Phase 0E.5 -- the Documents module's shared safe metadata shape
        (docs/modules/DOCUMENTS.md "Document metadata JSON shape"),
        returned by the upload, both listing, and direct-metadata
        endpoints. Never includes storage_disk/storage_path/an object
        key/uploaded_by_user_id/a signed or public URL.
      required: [document_id, owner_type, owner_id, classification_tier, status, original_filename, mime_type, size_bytes, uploaded_at]
      properties:
        document_id: { type: string, format: uuid }
        owner_type: { type: string, enum: [employee] }
        owner_id: { type: string, format: uuid }
        classification_tier: { type: string, enum: [public, internal, sensitive, highly_sensitive] }
        status: { type: string, enum: [active, archived] }
        original_filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        uploaded_at: { type: string, format: date-time }
    # --- Phase 1D.5: Admissions administrative surface

    ApplicantSummary:
      type: object
      required: [id, firstName]
      description: >
        List-row shape -- deliberately excludes dateOfBirth (Sensitive
        personal data of a minor), matching StudentSummary's identical
        precedent. See Applicant for the full single-record shape.
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }

    Applicant:
      type: object
      required: [id, firstName, dateOfBirth, createdAt, updatedAt]
      description: Full single-record shape (show/create responses only -- never the list response, see ApplicantSummary).
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        dateOfBirth: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApplicantInput:
      type: object
      required: [first_name, date_of_birth]
      description: No school_id, no contact fields, no Guardian fields -- Admissions stores no contact data of any kind (docs/modules/ADMISSIONS.md §9).
      properties:
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }
        date_of_birth: { type: string, format: date }

    AdmissionApplicationSummary:
      type: object
      required: [id, status, applicant, academicYear, campus, gradeLevel, createdAt]
      description: >
        Shared shape for directory rows AND single-record detail minus
        decisionNote/conversion provenance (see AdmissionApplication for
        the full detail-only shape) -- decisionNote is deliberately
        never hydrated for the list view (docs/admissions/PHASE-1D-4-AUTHORIZATION-READ-SERVICE.md).
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, accepted, rejected, withdrawn, converted] }
        applicant: { $ref: "#/components/schemas/ApplicantSummary" }
        academicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        campus: { $ref: "#/components/schemas/EnrollmentRef" }
        gradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        createdAt: { type: string, format: date-time }
        convertedAt: { type: string, format: date-time, nullable: true }

    AdmissionApplication:
      allOf:
        - { $ref: "#/components/schemas/AdmissionApplicationSummary" }
        - type: object
          required: [decisionNote, convertedStudentId, convertedStudentEnrollmentId, updatedAt]
          properties:
            decisionNote: { type: string, nullable: true, description: Internal, staff-only. Never searched, audited, or logged. }
            convertedStudentId: { type: string, format: uuid, nullable: true }
            convertedStudentEnrollmentId: { type: string, format: uuid, nullable: true }
            updatedAt: { type: string, format: date-time }

    AdmissionApplicationInput:
      type: object
      required: [applicant_id, academic_year_id, campus_id, grade_level_id]
      description: >
        Always creates in draft status -- no status is ever accepted.
        No section_id/roll_number/Student Number/Guardian fields --
        those are conversion-time-only inputs (docs/modules/ADMISSIONS.md
        §5/§9). Every reference must belong to the same School (422 if
        not).
      properties:
        applicant_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }

    AdmissionDecisionInput:
      type: object
      description: Used by both accept and reject -- decision_note is optional and internal (never required to accept or reject).
      properties:
        decision_note: { type: string, maxLength: 1000, nullable: true }

    AdmissionGuardianInstructionInput:
      type: object
      required: [mode, relationship_type]
      description: >
        A small, closed, two-mode shape mirroring
        GuardianConversionInstruction exactly -- omitted entirely
        (or the parent `guardian` key sent as null) is the one
        canonical "no Guardian" representation. `create` mode fields
        (first_name/middle_name/last_name/contact_type/contact_value)
        are ignored in `link_existing` mode and vice versa
        (guardian_id).
      properties:
        mode: { type: string, enum: [create, link_existing] }
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean, default: false }
        is_emergency_contact: { type: boolean, default: false }
        is_authorized_pickup: { type: boolean, default: false }
        first_name: { type: string, maxLength: 255, description: "Required when mode=create." }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }
        contact_type: { allOf: [{ $ref: "#/components/schemas/ContactType" }], nullable: true, description: "create mode only -- optional; when supplied, an existing contact-matching Guardian candidate is rejected with ADMISSION_GUARDIAN_SELECTION_REQUIRED rather than silently duplicated." }
        contact_value: { type: string, maxLength: 255, nullable: true, description: "create mode only -- required when contact_type is supplied. Transient request input only, never persisted by Admissions; flows straight into GuardianContactService's canonical encrypted storage." }
        guardian_id: { type: string, format: uuid, description: "Required when mode=link_existing. Must belong to the same School (422 otherwise)." }

    AdmissionConversionInput:
      type: object
      required: [student_number, section_id, roll_number, starts_on]
      description: >
        The Section is the sole authoritative placement input for this
        conversion -- AdmissionConversionService re-verifies it matches
        the application's own AcademicYear/Campus/GradeLevel (422
        IncompatibleConversionSectionException otherwise, never a
        partial conversion).
      properties:
        student_number: { type: string, maxLength: 255 }
        section_id: { type: string, format: uuid }
        roll_number: { type: string, maxLength: 255 }
        starts_on: { type: string, format: date }
        guardian: { allOf: [{ $ref: "#/components/schemas/AdmissionGuardianInstructionInput" }], nullable: true }

    AdmissionConversionEnrollment:
      type: object
      required: [id, academicYear, campus, gradeLevel, section, rollNumber, status, startsOn]
      description: The newly-created StudentEnrollment's summary -- deliberately excludes endsOn (always null immediately after conversion) and student (redundant with the sibling `student` field on AdmissionConversionResult).
      properties:
        id: { type: string, format: uuid }
        academicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        campus: { $ref: "#/components/schemas/EnrollmentRef" }
        gradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        section: { $ref: "#/components/schemas/EnrollmentRef" }
        rollNumber: { type: string }
        status: { type: string, enum: [active, completed, withdrawn, transferred, cancelled] }
        startsOn: { type: string, format: date }

    AdmissionConversionRelationship:
      type: object
      required: [id, relationshipType, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
      properties:
        id: { type: string, format: uuid }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        isLegalGuardian: { type: boolean }
        isEmergencyContact: { type: boolean }
        isAuthorizedPickup: { type: boolean }

    AdmissionConversionResult:
      type: object
      required: [application, student, enrollment, guardian, relationship]
      description: >
        guardian/relationship are both null together when the
        conversion request carried no `guardian` instruction
        (docs/modules/ADMISSIONS.md §11's optionality); never returns
        Guardian contact values (staff already supplied whatever they
        submitted -- echoing it back is unnecessary).
      properties:
        application: { $ref: "#/components/schemas/AdmissionApplication" }
        student: { $ref: "#/components/schemas/StudentSummary" }
        enrollment: { $ref: "#/components/schemas/AdmissionConversionEnrollment" }
        guardian: { allOf: [{ $ref: "#/components/schemas/GuardianSummary" }], nullable: true }
        relationship: { allOf: [{ $ref: "#/components/schemas/AdmissionConversionRelationship" }], nullable: true }

    # Phase 9.8: Payroll schemas.
    SalaryComponent:
      type: object
      required: [id, code, name, type, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [earning, deduction] }
        liabilityLedgerAccountId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }
    SalaryComponentInput:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        type: { type: string, enum: [earning, deduction] }
        liability_ledger_account_id: { type: string, format: uuid, nullable: true, description: Required (eventually, at posting time) for a deduction with a nonzero total. }
    SalaryStructureSummary:
      type: object
      required: [id, code, version, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        version: { type: integer }
        name: { type: string }
        status: { type: string, enum: [draft, active, superseded] }
    SalaryStructureComponent:
      type: object
      required: [id, salaryComponentId, calculationType, displayOrder]
      properties:
        id: { type: string, format: uuid }
        salaryComponentId: { type: string, format: uuid }
        calculationType: { type: string, enum: [fixed_amount, percentage_of_base] }
        baseComponentId: { type: string, format: uuid, nullable: true }
        rate: { type: string, nullable: true, description: "Decimal fraction 0-1, percentage_of_base only." }
        displayOrder: { type: integer }
    SalaryStructureDetail:
      allOf:
        - { $ref: "#/components/schemas/SalaryStructureSummary" }
        - type: object
          required: [components]
          properties:
            components: { type: array, items: { $ref: "#/components/schemas/SalaryStructureComponent" } }
    SalaryStructureInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
    SalaryStructureComponentInput:
      type: object
      required: [salary_component_id, calculation_type, display_order]
      properties:
        salary_component_id: { type: string, format: uuid }
        calculation_type: { type: string, enum: [fixed_amount, percentage_of_base] }
        base_component_id: { type: string, format: uuid, nullable: true, description: percentage_of_base only -- must reference an earlier-ordered component in the same structure. }
        rate: { type: string, nullable: true, description: "Decimal fraction 0-1, percentage_of_base only." }
        display_order: { type: integer, minimum: 1 }
    CompensationAssignmentSummary:
      type: object
      required: [id, employmentRecordId, salaryStructureId, effectiveFrom]
      description: Identity and effective dates ONLY -- never an amount (ADR 0034 "Sensitive values").
      properties:
        id: { type: string, format: uuid }
        employmentRecordId: { type: string, format: uuid }
        salaryStructureId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
    CompensationAssignmentValue:
      type: object
      required: [salaryStructureComponentId, amount]
      description: Highly Sensitive -- an Employee-specific fixed component amount.
      properties:
        salaryStructureComponentId: { type: string, format: uuid }
        amount: { type: string, description: Exact decimal string, never a JSON float. }
    CompensationAssignmentInput:
      type: object
      required: [salary_structure_id, effective_from, fixed_values]
      properties:
        salary_structure_id: { type: string, format: uuid, description: Must reference an ACTIVE structure. }
        effective_from: { type: string, format: date }
        fixed_values:
          type: array
          items:
            type: object
            required: [salary_structure_component_id, amount]
            properties:
              salary_structure_component_id: { type: string, format: uuid }
              amount: { type: string, description: "Exact decimal string (e.g. \"50000.00\"), one value per fixed_amount component -- never for percentage_of_base." }
    PayrollPeriod:
      type: object
      required: [id, periodMonth, startsOn, endsOn, status]
      properties:
        id: { type: string, format: uuid }
        periodMonth: { type: string, format: date }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        paymentDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draft, open, closed] }
    PayrollPeriodInput:
      type: object
      required: [period_month]
      properties:
        period_month: { type: string, format: date, description: Any date within the target month -- normalized to that month's first day. }
        payment_date: { type: string, format: date, nullable: true }
    PayrollRun:
      type: object
      required: [id, payrollPeriodId, runKind, status, preparedByUserId]
      description: Non-sensitive run metadata only -- payroll_runs itself carries no monetary column.
      properties:
        id: { type: string, format: uuid }
        payrollPeriodId: { type: string, format: uuid }
        runKind: { type: string, enum: [regular, correction] }
        correctsPayrollRunId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, calculated, approved, posted] }
        preparedByUserId: { type: string, format: uuid }
        approvedByUserId: { type: string, format: uuid, nullable: true }
        postedByUserId: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
    PayrollCalculationOutcome:
      type: object
      required: [resolvedCount, unresolvedEmploymentRecordIds, transitionedToCalculated]
      properties:
        resolvedCount: { type: integer }
        unresolvedEmploymentRecordIds: { type: array, items: { type: string, format: uuid } }
        transitionedToCalculated: { type: boolean, description: "False if any eligible EmploymentRecord remains unresolved -- the run stays draft (ADR 0034 fail-closed rule)." }
    ManualOverrideInput:
      type: object
      required: [employment_record_id, component_amounts, reason]
      properties:
        employment_record_id: { type: string, format: uuid }
        component_amounts:
          type: object
          additionalProperties: { type: string }
          description: "salary_component_id => absolute decimal-string amount, one entry per affected component."
        reason: { type: string, maxLength: 1000 }
    CorrectionDeltaInput:
      type: object
      required: [employment_record_id, lines, reason]
      properties:
        employment_record_id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [salary_component_id, amount, effect]
            properties:
              salary_component_id: { type: string, format: uuid }
              amount: { type: string, description: Always a positive magnitude -- direction is carried by effect. }
              effect: { type: string, enum: [increase, decrease] }
        reason: { type: string, maxLength: 1000 }
    PayrollRunResultLine:
