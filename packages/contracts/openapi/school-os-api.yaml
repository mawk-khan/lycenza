      summary: Updates or (de)activates a Bed. Requires hostel.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/HostelBedId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostelBedInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/HostelBed" } } }

  /schools/{schoolId}/hostel-residency-assignments:
    get:
      operationId: listHostelResidencyAssignments
      summary: List Student Hostel residency assignments (active by default). Requires hostel.residency.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, ended] } }
        - { $ref: "#/components/parameters/StudentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/HostelResidencyAssignment" } } } }
    post:
      operationId: assignHostelResidency
      summary: >
        Assigns a Student to a Hostel Bed. Requires hostel.residency.manage.
        Idempotency-Key required -- a network retry must never risk a
        duplicate assignment attempt.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostelResidencyAssignmentInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/HostelResidencyAssignment" } } }
        "422":
          description: >
            Student not eligible/already resident, or the Bed is not
            available/already occupied (HOSTEL_STUDENT_NOT_ELIGIBLE /
            HOSTEL_STUDENT_ALREADY_RESIDENT / HOSTEL_BED_NOT_AVAILABLE /
            HOSTEL_BED_ALREADY_OCCUPIED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A genuinely concurrent assignment attempt lost the race, or an Idempotency-Key conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/hostel-residency-assignments/{hostelResidencyAssignmentId}:
    get:
      operationId: getHostelResidencyAssignment
      summary: Fetch one Hostel residency assignment. Requires hostel.residency.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/HostelResidencyAssignmentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/HostelResidencyAssignment" } } }

  /schools/{schoolId}/hostel-residency-assignments/{hostelResidencyAssignmentId}/end:
    post:
      operationId: endHostelResidencyAssignment
      summary: Ends an active Hostel residency assignment. Requires hostel.residency.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/HostelResidencyAssignmentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/HostelResidencyAssignment" } } }
        "422":
          description: This residency assignment already ended (HOSTEL_RESIDENCY_ALREADY_ENDED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/inventory-items:
    get:
      operationId: listInventoryItems
      summary: Lists a School's Inventory Item catalogue (active by default). Requires inventory.directory.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IncludeInactive" }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/InventoryItem" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking inventory.directory.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createInventoryItem
      summary: Registers a new Inventory Item. Requires inventory.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/InventoryItem" } } }
        "422":
          description: Validation failure (e.g. duplicate code within this School, unrecognized unit_of_measure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/inventory-items/{inventoryItemId}:
    get:
      operationId: getInventoryItem
      summary: Fetch one Inventory Item. Requires inventory.directory.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/InventoryItemId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/InventoryItem" } } }
        "404":
          description: Not found (including a cross-School id).
    patch:
      operationId: updateInventoryItem
      summary: Updates or (de)activates an Inventory Item. Requires inventory.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/InventoryItemId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/InventoryItem" } } }

  /schools/{schoolId}/inventory-locations:
    get:
      operationId: listInventoryLocations
      summary: Lists a School's Inventory Locations (active by default). Requires inventory.directory.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IncludeInactive" }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
