openapi: 3.1.0
info:
  title: School OS API
  version: "1.0"
  description: >
    Versioned public/partner-facing surface of the School OS platform.
    Authoritative implementation lives in apps/platform (Laravel);
    this file is the source of truth for its shape and is consumed by
    packages/shared-types to generate TypeScript bindings. See
    docs/architecture/API.md for the full architecture (auth, pagination,
    idempotency, rate limiting, webhooks, error format).

servers:
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - bearerAuth: []

paths:
  /system/status:
    get:
      operationId: getSystemStatus
      summary: Unauthenticated liveness/version probe (Phase 0A primitive).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [status, phase, environment]
                    properties:
                      status:
                        type: string
                        example: ok
                      phase:
                        type: string
                      environment:
                        type: string
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"

  /schools/{schoolId}/context:
    get:
      operationId: getSchoolContext
      summary: >
        Phase 0B primitive proving the mobile/API chain: Sanctum
        identity -> membership -> School context -> capabilities ->
        response. Not a general School resource endpoint.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK -- caller has an active membership in this School.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [school, capabilities]
                    properties:
                      school:
                        type: object
                        required: [id, name]
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                      capabilities:
                        type: array
                        items: { type: string }
                        description: Effective capability keys for the caller in this School.
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "401":
          description: Missing/invalid bearer token.
        "404":
          description: >
            No active membership in this School (or the School doesn't
            exist) -- deliberately indistinguishable from "doesn't
            exist" to avoid leaking School existence to a non-member
            (docs/architecture/API.md, "API error behavior").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schools/{schoolId}/idempotency-demo/increment:
    post:
      operationId: incrementIdempotencyDemoCounter
      summary: >
        Phase 0C.2 infrastructure-only demonstration mutation (local/
        testing only -- not a production route, not a real ERP business
        module). Proves the `idempotent` middleware's claim/replay/
        conflict/in-progress/concurrency behavior against a real,
        durable, School-scoped state change (a counter). See
        docs/architecture/RELIABILITY.md ("API idempotency").
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Required on this endpoint specifically (unlike the general,
            optional components.parameters.IdempotencyKey convention) --
            see docs/architecture/API.md ("Idempotency").
          schema: { type: string, minLength: 8, maxLength: 255 }
      responses:
        "200":
          description: >
            The counter was incremented (first execution of this
            logical request), OR this is a replay of an already-
            completed identical request -- distinguish via the
            `Idempotency-Replayed` response header.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [value]
                    properties:
                      value: { type: integer }
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          description: Idempotency-Key missing or invalid (IDEMPOTENCY_KEY_REQUIRED / IDEMPOTENCY_KEY_INVALID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacks the school.settings.manage capability in this School.
        "404":
          description: No active membership in this School.
        "409":
          description: >
            IDEMPOTENCY_KEY_CONFLICT (same key reused with a different
            request) or IDEMPOTENCY_REQUEST_IN_PROGRESS (a request with
            this key is still being processed) -- distinguish via
            `error.code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schools/{schoolId}/webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      summary: List a School's registered webhook endpoints (Phase 0C.3).
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK -- caller holds integrations.webhooks.view.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
        "403":
          description: Lacks integrations.webhooks.view in this School.
    post:
      operationId: createWebhookEndpoint
      summary: >
        Registers a new webhook endpoint. The plaintext signing secret
        is returned ONCE, in this response only (section 7) -- it is
        never retrievable again afterward. Requires
        integrations.webhooks.manage.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 255 }
                url: { type: string, maxLength: 2048, description: "https:// only in production -- see docs/security/INTEGRATION-SECURITY.md (SSRF policy)." }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WebhookEndpoint"
                      - type: object
                        required: [secret]
                        properties:
                          secret: { type: string, description: "Plaintext HMAC signing secret -- shown once." }
        "422":
          description: URL rejected by SSRF validation, or otherwise invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Lacks integrations.webhooks.manage in this School.
        "409":
          description: IDEMPOTENCY_KEY_CONFLICT or IDEMPOTENCY_REQUEST_IN_PROGRESS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/webhook-endpoints/{webhookEndpointId}:
    get:
      operationId: getWebhookEndpoint
      summary: Fetch one webhook endpoint. Never returns the signing secret.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookEndpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WebhookEndpoint" }
        "404":
          description: Endpoint doesn't exist, or belongs to a different School.

  /schools/{schoolId}/webhook-endpoints/{webhookEndpointId}/rotate-secret:
    post:
      operationId: rotateWebhookEndpointSecret
      summary: >
        Rotates the signing secret with a documented overlap window
        (section 9) -- the new plaintext secret is returned ONCE, here
        only. Requires integrations.webhooks.manage.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookEndpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Rotated.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WebhookEndpoint"
                      - type: object
                        required: [secret]
                        properties:
                          secret: { type: string }

  /schools/{schoolId}/webhook-endpoints/{webhookEndpointId}/disable:
    post:
      operationId: disableWebhookEndpoint
      summary: Disables an endpoint -- no new deliveries are created for it (section 10).
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookEndpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WebhookEndpoint" }

  /schools/{schoolId}/webhook-endpoints/{webhookEndpointId}/enable:
    post:
      operationId: enableWebhookEndpoint
      summary: Re-enables a disabled endpoint.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookEndpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WebhookEndpoint" }

  /schools/{schoolId}/webhook-endpoints/{webhookEndpointId}/subscriptions:
    post:
      operationId: createWebhookSubscription
      summary: >
        Subscribes an endpoint to one event type. The event type must
        be in the externally-publishable catalog (section 12) or this
        is rejected with 422.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookEndpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type: { type: string, example: school.setting.changed.v1 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WebhookSubscription" }
        "422":
          description: Event type is not externally subscribable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/webhook-endpoints/{webhookEndpointId}/subscriptions/{webhookSubscriptionId}:
    delete:
      operationId: deleteWebhookSubscription
      summary: Removes a subscription. Does not affect deliveries already created.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookEndpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookSubscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.

  /schools/{schoolId}/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: >
        Delivery history (section 47). Never exposes the signing
        secret, a full response body, or an internal stack trace.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, delivering, delivered, retrying, failed, abandoned] }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }

  /schools/{schoolId}/webhook-deliveries/{webhookDeliveryId}:
    get:
      operationId: getWebhookDelivery
      summary: One delivery's full attempt history.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookDeliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WebhookDelivery"
                      - type: object
                        properties:
                          attemptHistory:
                            type: array
                            items: { $ref: "#/components/schemas/WebhookDeliveryAttempt" }

  /schools/{schoolId}/webhook-deliveries/{webhookDeliveryId}/redeliver:
    post:
      operationId: redeliverWebhookDelivery
      summary: >
        Manually re-attempts a TERMINAL (delivered/failed/abandoned)
        delivery (section 48). Reuses the same logical delivery
        identity -- prior attempt history is preserved, never mutated.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: webhookDeliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Redelivery queued.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WebhookDelivery" }
        "422":
          description: Delivery is not in a terminal state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /education-boards:
    get:
      operationId: listEducationBoards
      summary: Platform reference catalog of Education Boards (Phase 0D). No capability gate.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EducationBoard" }

  /schools/{schoolId}:
    get:
      operationId: getSchoolProfile
      summary: School operational profile (Phase 0D). Requires school.profile.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/School" }
    patch:
      operationId: updateSchoolProfile
      summary: >
        Updates School profile fields. Requires school.profile.manage.
        Never accepts `status` (the platform tenant-lifecycle field) --
        see docs/modules/ORGANIZATION.md.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/School" }
        "422":
          description: Validation failure (e.g. an inactive Education Board).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/campuses:
    get:
      operationId: listCampuses
      summary: List a School's Campuses. Requires school.campuses.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IncludeInactive" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Campus" } }
    post:
      operationId: createCampus
      summary: Creates a Campus. Requires school.campuses.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampusInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campus" }
        "422":
          description: Validation failure (e.g. duplicate code within this School).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/campuses/{campusId}:
    get:
      operationId: getCampus
      summary: Fetch one Campus. Requires school.campuses.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CampusId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Campus" } } }
        "404":
          description: Not found (including a cross-School id -- section 51/83).
    patch:
      operationId: updateCampus
      summary: Updates a Campus. Requires school.campuses.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CampusId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Campus" } } }

  /schools/{schoolId}/campuses/{campusId}/rooms:
    get:
      operationId: listRooms
      summary: List Rooms for one Campus. Requires academics.structure.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CampusId" }
        - { $ref: "#/components/parameters/IncludeInactive" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Room" } } } }
    post:
      operationId: createRoom
      summary: Creates a Room under this Campus. Requires academics.structure.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/CampusId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Room" } } }

  /schools/{schoolId}/rooms/{roomId}:
    get:
      operationId: getRoom
      summary: Fetch one Room. Requires academics.structure.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Room" } } }
    patch:
      operationId: updateRoom
      summary: Updates a Room. Requires academics.structure.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Room" } } }

  /schools/{schoolId}/academic-years:
    get:
      operationId: listAcademicYears
      summary: List a School's Academic Years. Requires academics.years.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AcademicYear" } } } }
    post:
      operationId: createAcademicYear
      summary: >
        Creates an Academic Year (status starts as `draft`). Requires
        academics.years.manage. Rejected with ACADEMIC_YEAR_OVERLAP if
        the date range overlaps an existing year (section 15).
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicYearInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AcademicYear" } } }
        "422":
          description: ACADEMIC_YEAR_OVERLAP or date-range validation failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/academic-years/{academicYearId}:
    get:
      operationId: getAcademicYear
      summary: Fetch one Academic Year. Requires academics.years.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AcademicYearId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AcademicYear" } } }
    patch:
      operationId: updateAcademicYear
      summary: Renames an Academic Year (name/code only). Requires academics.years.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AcademicYearId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AcademicYear" } } }

  /schools/{schoolId}/academic-years/{academicYearId}/activate:
    post:
      operationId: activateAcademicYear
      summary: >
        Activates a draft Academic Year, closing whatever year was
        previously active for this School in the same transaction
        (section 16/17). Concurrency-safe: a genuine race against
        another activation is rejected with
        ACADEMIC_YEAR_ACTIVATION_CONFLICT (409), never a double-active
        state (section 80's real-concurrency proof). Requires
        academics.years.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/AcademicYearId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AcademicYear" } } }
        "409":
          description: ACADEMIC_YEAR_ACTIVATION_CONFLICT -- another activation won the race.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: INVALID_ACADEMIC_YEAR_TRANSITION -- the year is not currently `draft`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/academic-years/{academicYearId}/close:
    post:
      operationId: closeAcademicYear
      summary: Closes an active Academic Year. Requires academics.years.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
