            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: FEE_STRUCTURE_NOT_FOUND (nonexistent or another School -- identical response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      operationId: updateFeeStructure
      summary: >
        Renames or re-codes a DRAFT structure. Requires finance.fee_structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: feeStructureId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeStructureUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FeeStructureDetail" } } }
