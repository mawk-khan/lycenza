  # --- Phase 1A.5: Student & Guardian Identity administrative surface
  # (docs/modules/STUDENT-GUARDIAN-IDENTITY.md, "Administrative HTTP
  # boundary"). Same authenticated/capability-gated administrative
  # architecture as every path above -- not a separate public API.

  /schools/{schoolId}/students:
    get:
      operationId: listStudents
      summary: List a School's Students. Requires students.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: student_number, in: query, required: false, schema: { type: string }, description: Exact match. }
        - { name: name, in: query, required: false, schema: { type: string }, description: Matches first or last name. }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/StudentSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      operationId: createStudent
      summary: Creates a Student. Requires students.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }
        "422":
          description: Validation failure (e.g. duplicate Student Number within this School).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/students/{studentId}:
    get:
      operationId: getStudent
      summary: Fetch one Student. Requires students.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).
    patch:
      operationId: updateStudent
      summary: Updates Student identity fields. Requires students.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }

  /schools/{schoolId}/students/{studentId}/status:
    post:
      operationId: changeStudentStatus
      summary: Changes a Student's status (active/inactive). Requires students.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Student" } } }

  /schools/{schoolId}/students/{studentId}/guardians:
    get:
      operationId: listStudentGuardianRelationships
      summary: List a Student's Guardian relationships. Requires students.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/StudentGuardianRelationship" } } } }
    post:
      operationId: linkGuardianToStudent
      summary: >
        Links a Guardian to a Student. Requires BOTH students.manage AND
        guardians.manage (the operation mutates both domain identities'
        relationship at once). Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentGuardianRelationshipLinkInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StudentGuardianRelationship" } } }
        "422":
          description: >
            Validation failure -- a nonexistent/cross-School guardianId
            (indistinguishable message either way), a duplicate
            relationship for this (Student, Guardian) pair, or an
            invalid relationshipType.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/student-guardian-relationships/{relationshipId}:
    patch:
      operationId: updateStudentGuardianRelationship
      summary: >
        Updates relationshipType/authority flags (never isPrimary --
        see the .../primary action). Requires BOTH students.manage AND
        guardians.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RelationshipId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentGuardianRelationshipUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StudentGuardianRelationship" } } }
    delete:
      operationId: unlinkGuardianFromStudent
      summary: >
        Unlinks (hard-deletes the relationship row -- there is no
        soft-deactivation column). Preserves both the Student and
        Guardian identity rows, and any other relationship. Requires
        BOTH students.manage AND guardians.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RelationshipId" }
      responses:
        "204":
          description: Unlinked. No content.

  /schools/{schoolId}/student-guardian-relationships/{relationshipId}/primary:
    post:
      operationId: setPrimaryGuardian
      summary: >
        Promotes this relationship to primary for its Student, demoting
        whichever relationship was previously primary in the same
        transaction. Requires BOTH students.manage AND
        guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/RelationshipId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/StudentGuardianRelationship" } } }

  /schools/{schoolId}/guardians:
    get:
      operationId: listGuardians
      summary: List a School's Guardians. Requires guardians.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: name, in: query, required: false, schema: { type: string }, description: Matches first or last name. }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GuardianSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      operationId: createGuardian
      summary: >
        Creates a Guardian (identity only -- contact information is a
        separate call, see .../contacts below). Requires
        guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianSummary" } } }

  /schools/{schoolId}/guardian-candidates:
    post:
      operationId: findGuardianCandidates
      summary: >
        Exact-match, same-School-only, HMAC-keyed candidate lookup by
        contact value -- "does a Guardian with this email/mobile
        already exist here." Never decrypts every contact row, never
        crosses Schools, never auto-merges; may return multiple
        candidates (household-shared contact). Requires guardians.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianCandidateLookupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/GuardianSummary" } } } }
        "422":
          description: Malformed email/mobile input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/guardians/{guardianId}:
    get:
      operationId: getGuardian
      summary: >
        Fetch one Guardian, including its contacts and linked Students.
        Requires guardians.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Guardian" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).
    patch:
      operationId: updateGuardian
      summary: Updates Guardian identity fields. Requires guardians.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianSummary" } } }

  /schools/{schoolId}/guardians/{guardianId}/status:
    post:
      operationId: changeGuardianStatus
      summary: Changes a Guardian's status (active/inactive). Requires guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianSummary" } } }

  /schools/{schoolId}/guardians/{guardianId}/contacts:
    post:
      operationId: addGuardianContact
      summary: >
        Adds a Guardian contact (email/mobile) -- encrypted at rest
        with a keyed exact-match lookup digest (ADR 0028), never
        stored as plaintext. Requires guardians.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/GuardianId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianContactInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianContact" } } }
        "422":
          description: Malformed email/mobile, or conflicts with an existing contact/primary for this Guardian.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/guardian-contacts/{contactId}/primary:
    post:
      operationId: setPrimaryGuardianContact
      summary: >
        Promotes this contact to primary for its type, demoting
        whichever contact was previously primary in the same
        transaction. Requires guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ContactId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianContact" } } }

  /schools/{schoolId}/guardian-contacts/{contactId}/deactivate:
    post:
      operationId: deactivateGuardianContact
      summary: Deactivates a contact (not deleted). Requires guardians.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/ContactId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/GuardianContact" } } }

  # --- Phase 1B.5: Student Enrollment administrative surface

  /schools/{schoolId}/enrollments:
    get:
      operationId: listEnrollments
      summary: >
        Administrative Enrollment directory across the School. Requires
        enrollments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: campus_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: grade_level_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: section_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, completed, withdrawn, transferred, cancelled] } }
        - { name: student_number, in: query, required: false, schema: { type: string } }
        - { name: student_name, in: query, required: false, schema: { type: string } }
        - { name: roll_number, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EnrollmentSummary" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

  /schools/{schoolId}/enrollments/{enrollmentId}:
    get:
      operationId: getEnrollment
      summary: Fetch one Enrollment's detail. Requires enrollments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "404":
          description: Not found (including a cross-School id -- indistinguishable from nonexistent).

  /schools/{schoolId}/enrollments/{enrollmentId}/complete:
    post:
      operationId: completeEnrollment
      summary: >
        Normal completion of an Enrollment. Requires enrollments.manage.
        Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ends_on], properties: { ends_on: { type: string, format: date } } }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: Invalid transition (e.g. already terminal) or invalid date range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollments/{enrollmentId}/withdraw:
    post:
      operationId: withdrawEnrollment
      summary: Mid-course withdrawal. Requires enrollments.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ends_on], properties: { ends_on: { type: string, format: date } } }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: Invalid transition or invalid date range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollments/{enrollmentId}/cancel:
    post:
      operationId: cancelEnrollment
      summary: Administrative cancellation. Requires enrollments.manage. Idempotency-Key required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ends_on], properties: { ends_on: { type: string, format: date } } }
      responses:
        "200":
          description: OK
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: Invalid transition or invalid date range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/enrollments/{enrollmentId}/transfer:
    post:
      operationId: transferEnrollment
      summary: >
        Atomic same-Academic-Year placement move to another Section.
        Requires enrollments.manage. Idempotency-Key required. Returns
        the newly created (target) Enrollment, not the source.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EnrollmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_section_id, roll_number, effective_date]
              properties:
                target_section_id: { type: string, format: uuid }
                roll_number: { type: string, maxLength: 255 }
                effective_date: { type: string, format: date }
      responses:
        "201":
          description: Created (the new target Enrollment).
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: >
            Cross-School/cross-Academic-Year/cross-GradeLevel target, a
            duplicate roll number in the target Section, or an invalid
            source transition -- fully atomic (the source Enrollment is
            left untouched on any failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/students/{studentId}/enrollments:
    get:
      operationId: listStudentEnrollmentHistory
      summary: Full historical Enrollment record for one Student. Requires enrollments.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Enrollment" } } } }
        "404":
          description: Not found (including a cross-School Student id -- indistinguishable from nonexistent).
    post:
      operationId: createStudentEnrollment
      summary: >
        Enrolls a Student into a Section. AcademicYear/Campus/GradeLevel
        are always derived from the given Section -- never accepted
        independently. Requires enrollments.manage. Idempotency-Key
        required.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Enrollment" } } }
        "422":
          description: >
            A second active Enrollment for this Student+Year, a
            duplicate roll number in this Section+Year, or a blank
            roll number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/students/{studentId}/enrollments/current:
    get:
      operationId: getCurrentStudentEnrollment
      summary: >
        The active Enrollment for this Student in the given (or the
        School's currently active) Academic Year. Requires
        enrollments.view. `data` is `null` when no active Enrollment
        exists for the resolved year -- never a historical/terminal row
        substituted for "current".
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/StudentId" }
        - { name: academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/Enrollment" }]
        "404":
          description: Not found (cross-School Student id, or an explicit but foreign/nonexistent academic_year_id filter).


  # Phase 8A.14 -- read-only HR transport (docs/modules/HR.md "API &
  # Mobile-Ready Read Layer (8A.14, implemented)"). Every operation
  # here is a GET adapting an already-authoritative 8A.8/8A.9/8A.10/
  # 8A.11 Application service -- no HR mutation/import/lifecycle
  # endpoint exists at this version. None of these paths declare a
  # `capability:` route requirement in this spec's sense because the
  # underlying service performs its own capability check against the
  # real authenticated actor (see each operation's summary for the
  # capability actually enforced).
  /schools/{schoolId}/employees:
    get:
      operationId: listEmployees
      summary: >
        Employee Directory search (Directory-tier only). Requires
        hr.employees.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: search, in: query, required: false, description: "Matches employee_number prefix or full_name substring.", schema: { type: string } }
        - { name: campus_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: department_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: position_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: sort, in: query, required: false, description: "Allow-listed server-side; an unrecognized value falls back to the default rather than erroring.", schema: { type: string, enum: [full_name, employee_number], default: full_name } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: "#/components/parameters/EmployeeIncludeArchived" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmployeeDirectoryEntry" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid query parameter (e.g. page < 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employees/{employeeId}:
    get:
      operationId: getEmployeeProfile
      summary: >
        Employee Profile Workspace (Restricted-tier, section-authorized).
        Requires hr.employees.personal.view as the entry gate; each
        section additionally requires its own 8A.10 capability, exactly
        as the interactive Profile Workspace already does.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmployeeProfile" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.personal.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >
            Employee does not exist, or belongs to a different School --
            deliberately indistinguishable (section 20/51/83's
            cross-tenant-probing convention).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employees/{employeeId}/activity:
    get:
      operationId: getEmployeeActivity
      summary: >
        Employee Activity Timeline (capability-category-filtered,
        event-time-sensitivity-aware). Requires
        hr.employees.personal.view as the entry gate.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
        - { $ref: "#/components/parameters/EmployeeCategory" }
        - { $ref: "#/components/parameters/EmployeeOccurredFrom" }
        - { $ref: "#/components/parameters/EmployeeOccurredTo" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: >
            OK. meta.total reflects only events the caller's
            capabilities permit -- a hidden Highly Sensitive event is
            never counted (no side-channel, section 18/40).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmployeeActivityEntry" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking hr.employees.personal.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Employee does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid query parameter (e.g. occurred_from not a real date).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/employees/{employeeId}/sensitive-documents:
    get:
      operationId: getEmployeeSensitiveDocuments
      summary: >
        Highly Sensitive EmployeeDocument metadata -- a SEPARATE,
        narrowly-authorized read path from the general Profile
        endpoint (section 12/14/59). Requires hr.employees.sensitive.view.
        Never returns a storage path/disk or a file URL; a successful
        non-empty read is audited exactly once
        (hr.employee_document.sensitive_viewed) by the underlying
        service, not by this endpoint itself. Phase 8A.15: rate-limited
        by the stricter `hr-api-sensitive-reads` policy (20/min,
        School+actor-keyed) rather than the 120/min policy the other
        three HR endpoints share.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/EmployeeId" }
      responses:
        "200":
          description: OK (an empty array is a valid, unaudited result -- no sensitive document exists for this Employee).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmployeeSensitiveDocument" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: >
            Authenticated but lacking hr.employees.sensitive.view in
            this School -- identical response whether or not sensitive
            documents actually exist (no existence oracle, section 60).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Employee does not exist, or belongs to a different School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: >
        Opaque personal-access token (web/mobile) or partner API key
        (third-party integrations). See docs/architecture/API.md
        ("Authentication").

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Required on all unsafe (POST/PATCH/DELETE) mutating requests that
        are not naturally idempotent, e.g. payment callbacks. See
        docs/architecture/API.md ("Idempotency").
      schema: { type: string }
    SchoolId:
      name: schoolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampusId:
      name: campusId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AcademicYearId:
      name: academicYearId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      description: When true, includes inactive/archived reference rows (default excludes them).
      schema: { type: boolean, default: false }
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuardianId:
      name: guardianId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: >
        Employee UUID (not User id, not EmploymentRecord id, not the
        display employee_number) -- Phase 8A.14 section 57.
      schema: { type: string, format: uuid }
    EmployeeIncludeArchived:
      name: include_archived
      in: query
      required: false
      description: When true, includes Employees whose record_status is archived (default excludes them).
      schema: { type: boolean, default: false }
    EmployeeCategory:
      name: category
      in: query
      required: false
      description: >
        Activity Timeline category filter. An unrecognized value is
        treated as no filter, never an error -- rejecting it would
        itself be an authorization side channel (section 30).
      schema: { type: string, enum: [employee, personal, employment, professional, document, sensitive_access] }
    EmployeeOccurredFrom:
      name: occurred_from
      in: query
      required: false
      description: Inclusive lower bound on SchoolAuditEvent.occurred_at (not a domain effective date).
      schema: { type: string, format: date }
    EmployeeOccurredTo:
      name: occurred_to
      in: query
      required: false
      description: Inclusive upper bound on SchoolAuditEvent.occurred_at (not a domain effective date).
      schema: { type: string, format: date }

  headers:
    XRequestId:
      description: Correlates this response with server-side logs/audit entries.
      schema: { type: string, format: uuid }
    IdempotencyReplayed:
      description: >
        Present and "true" only when this response is a replay of a
        previously completed request with the same Idempotency-Key
        (docs/architecture/API.md, "Idempotency"); absent on a request's
        first, freshly-executed response.
      schema: { type: string, enum: ["true"] }
    RetryAfter:
      description: >
        Phase 8A.15 -- seconds until the caller's rate-limit window
        resets. Present on every 429 across the whole `/api/v1` surface
        (not HR-specific) since `bootstrap/app.php`'s exception
        renderer merges `ThrottleRequestsException::getHeaders()`.
      schema: { type: integer }

  schemas:
    ResponseMeta:
      type: object
      required: [apiVersion, requestId]
      properties:
        apiVersion: { type: string, example: v1 }
        requestId: { type: string, format: uuid, nullable: true }

    PaginationMeta:
      type: object
      required: [page, perPage, total]
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, status, requestId]
          properties:
            message: { type: string }
            status: { type: integer }
            code:
              type: string
              nullable: true
              description: >
                Stable machine-readable error code (e.g.
                IDEMPOTENCY_KEY_CONFLICT), present only for exceptions
                that define one. null otherwise -- see
                docs/architecture/API.md ("Error format").
            requestId: { type: string, format: uuid, nullable: true }
            errors:
              type: object
              nullable: true
              description: Field-level validation errors, present only on 422 responses.

    WebhookEndpoint:
      type: object
      required: [id, name, url, status, createdAt]
      description: Never includes the signing secret (see the create/rotate-secret responses for the one-time exception).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: string, format: date-time, nullable: true }

    WebhookSubscription:
      type: object
      required: [id, webhookEndpointId, eventType, enabled]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventType: { type: string }
        enabled: { type: boolean }

    WebhookDelivery:
      type: object
      required: [id, webhookEndpointId, eventId, eventType, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        webhookEndpointId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivering, delivered, retrying, failed, abandoned] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lastAttempt:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WebhookDeliveryAttempt" }]

    WebhookDeliveryAttempt:
      type: object
      required: [attemptNumber, outcome]
      description: Never includes the raw response body (section 72).
      properties:
        attemptNumber: { type: integer }
        outcome: { type: string, enum: [success, transient_failure, permanent_failure, timeout, network_error] }
        responseStatus: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        errorClass: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    EducationBoard:
      type: object
      required: [id, code, name]
      description: Platform reference catalog (Phase 0D section 11) -- not School-owned.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    School:
      type: object
      required: [id, name, status, timezone, defaultLocale, countryCode]
      description: >
        `status` is the platform tenant-lifecycle field (Phase 0B) --
        read-only through this API; see SchoolProfileInput.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        legalName: { type: string, nullable: true }
        code: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, archived] }
        timezone: { type: string }
        defaultLocale: { type: string }
        website: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        addressLine2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateRegion: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        educationBoardId: { type: string, format: uuid, nullable: true }

    SchoolProfileInput:
      type: object
      description: Every field is optional (partial update) -- `status` is never accepted here.
      properties:
        name: { type: string, maxLength: 255 }
        legal_name: { type: string, maxLength: 255, nullable: true }
        code: { type: string, maxLength: 32, nullable: true }
        website: { type: string, maxLength: 255, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
        address_line1: { type: string, maxLength: 255, nullable: true }
        address_line2: { type: string, maxLength: 255, nullable: true }
        city: { type: string, maxLength: 120, nullable: true }
        state_region: { type: string, maxLength: 120, nullable: true }
        postal_code: { type: string, maxLength: 20, nullable: true }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        education_board_id: { type: string, format: uuid, nullable: true }

    Campus:
      type: object
      required: [id, name, code, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, description: "Case-insensitively unique within the School (section 65)." }
        status: { type: string, enum: [active, inactive] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }

    CampusInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        phone: { type: string, maxLength: 32, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }

    Room:
      type: object
      required: [id, campusId, name, code, roomType, status]
      properties:
        id: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        roomType: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    RoomInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        room_type: { type: string, enum: [classroom, laboratory, auditorium, library, sports, other] }
        capacity: { type: integer, nullable: true }

    AcademicYear:
      type: object
      required: [id, name, code, startsOn, endsOn, status]
      description: Only one Academic Year per School may be `active` (section 16, database-enforced).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [draft, active, closed, archived] }

    AcademicYearInput:
      type: object
      required: [name, code, starts_on, ends_on]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: "Must be after starts_on." }

    AcademicTerm:
      type: object
      required: [id, academicYearId, name, code, startsOn, endsOn, sequence]
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        sequence: { type: integer }

    AcademicTermInput:
      type: object
      required: [name, code, starts_on, ends_on, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        sequence: { type: integer, minimum: 1 }

    GradeLevel:
      type: object
      required: [id, name, code, sequence, status]
      description: School-wide reference data (not Campus/Year-scoped, section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        sequence: { type: integer, description: "Explicit pedagogical ordering -- never inferred from name/code." }
        educationStage: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    GradeLevelInput:
      type: object
      required: [name, code, sequence]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        sequence: { type: integer, minimum: 0 }
        education_stage: { type: string, nullable: true }

    Section:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, name, code, status]
      description: Belongs to exactly one Academic Year (section 28 -- never reused across years).
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        capacity: { type: integer, nullable: true, description: "Advisory only (section 27) -- not admission-enforced." }
        status: { type: string, enum: [active, inactive] }

    SectionInput:
      type: object
      required: [campus_id, grade_level_id, name, code]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        capacity: { type: integer, nullable: true }

    Subject:
      type: object
      required: [id, name, code, subjectType, status]
      description: School-wide reference data (section 62).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        shortName: { type: string, nullable: true }
        subjectType: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academicDepartmentId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        short_name: { type: string, maxLength: 32, nullable: true }
        subject_type: { type: string, enum: [core, elective, co_scholastic, language, other] }
        academic_department_id: { type: string, format: uuid, nullable: true }

    AcademicDepartment:
      type: object
      required: [id, name, code, status]
      description: Deliberately distinct from a future HR organizational Department (section 32).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }

    AcademicDepartmentInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }

    SubjectOffering:
      type: object
      required: [id, academicYearId, campusId, gradeLevelId, subjectId, isRequired, status]
      description: >
        The academic-offering layer (sections 37-40) -- AcademicYear-
        specific by construction, never a global Grade->Subject map.
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        campusId: { type: string, format: uuid }
        gradeLevelId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        isRequired: { type: boolean }
        sequence: { type: integer, nullable: true }
        weeklyPeriodsTarget: { type: integer, nullable: true }
        status: { type: string, enum: [active, inactive] }

    SubjectOfferingInput:
      type: object
      required: [campus_id, grade_level_id, subject_id]
      properties:
        campus_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        is_required: { type: boolean, default: true }
        sequence: { type: integer, nullable: true }
        weekly_periods_target: { type: integer, nullable: true }

    # --- Phase 1A.5: Student & Guardian Identity administrative surface

    StudentSummary:
      type: object
      required: [id, studentNumber, firstName, status]
      description: >
        List-row shape -- deliberately excludes dateOfBirth (Highly
        Sensitive children's data, docs/security/DATA-CLASSIFICATION.md:
        minimized default visibility in broad list views). See Student
        for the full single-record shape.
      properties:
        id: { type: string, format: uuid }
        studentNumber: { type: string }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Student:
      type: object
      required: [id, studentNumber, firstName, status, dateOfBirth, createdAt, updatedAt]
      description: >
        Full single-record shape (show/create/update responses only --
        never the list response, see StudentSummary).
      properties:
        id: { type: string, format: uuid }
        studentNumber: { type: string }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        dateOfBirth: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StudentInput:
      type: object
      required: [student_number, first_name, date_of_birth]
      description: >
        student_number uniqueness is enforced by StudentService/the
        database (school_id, student_number), not by this contract --
        a duplicate is a 422 with code DUPLICATE_STUDENT_NUMBER.
      properties:
        student_number: { type: string, maxLength: 255 }
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }
        date_of_birth: { type: string, format: date }

    GuardianSummary:
      type: object
      required: [id, firstName, status]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    Guardian:
      type: object
      required: [id, firstName, status, contacts, students]
      description: Full single-record shape (show response only).
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        contacts: { type: array, items: { $ref: "#/components/schemas/GuardianContact" } }
        students:
          type: array
          items:
            type: object
            required: [relationshipId, student, relationshipType, isPrimary, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
            properties:
              relationshipId: { type: string, format: uuid }
              student:
                type: object
                required: [id, studentNumber, firstName]
                properties:
                  id: { type: string, format: uuid }
                  studentNumber: { type: string }
                  firstName: { type: string }
                  lastName: { type: string, nullable: true }
              relationshipType: { $ref: "#/components/schemas/RelationshipType" }
              isPrimary: { type: boolean }
              isLegalGuardian: { type: boolean }
              isEmergencyContact: { type: boolean }
              isAuthorizedPickup: { type: boolean }

    GuardianInput:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string, maxLength: 255 }
        middle_name: { type: string, maxLength: 255, nullable: true }
        last_name: { type: string, maxLength: 255, nullable: true }

    ContactType:
      type: string
      enum: [email, mobile]

    RelationshipType:
      type: string
      enum: [mother, father, parent, step_parent, grandparent, legal_guardian, foster_guardian, sibling, relative, other]

    GuardianContact:
      type: object
      required: [id, type, value, isPrimary, isActive]
      description: >
        Approved fields only -- never encrypted_value, lookup_hash, or
        lookup_key_version (docs/modules/STUDENT-GUARDIAN-IDENTITY.md,
        "Sensitive response exclusions"). `value` is the decrypted
        plaintext, returned only to an actor already holding
        guardians.view.
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string }
        label: { type: string, nullable: true }
        isPrimary: { type: boolean }
        isActive: { type: boolean }
        verifiedAt: { type: string, format: date-time, nullable: true }

    GuardianContactInput:
      type: object
      required: [type, value]
      description: >
        `value` for type=mobile must already be E.164
        (docs/modules/STUDENT-GUARDIAN-IDENTITY.md, "Guardian contact
        mutation") -- a local number is rejected, never silently
        converted.
      properties:
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string, maxLength: 255 }
        label: { type: string, maxLength: 255, nullable: true }
        is_primary: { type: boolean, default: false }

    GuardianCandidateLookupInput:
      type: object
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/ContactType" }
        value: { type: string, maxLength: 255 }

    StudentGuardianRelationship:
      type: object
      required: [id, studentId, guardian, relationshipType, isPrimary, isLegalGuardian, isEmergencyContact, isAuthorizedPickup]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        guardian: { $ref: "#/components/schemas/GuardianSummary" }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        isPrimary: { type: boolean }
        isLegalGuardian: { type: boolean }
        isEmergencyContact: { type: boolean }
        isAuthorizedPickup: { type: boolean }

    StudentGuardianRelationshipLinkInput:
      type: object
      required: [guardian_id, relationship_type]
      description: >
        Deliberately excludes is_primary -- see the .../primary action
        (StudentGuardianRelationshipService.link() never auto-promotes).
      properties:
        guardian_id: { type: string, format: uuid }
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean, default: false }
        is_emergency_contact: { type: boolean, default: false }
        is_authorized_pickup: { type: boolean, default: false }

    StudentGuardianRelationshipUpdateInput:
      type: object
      properties:
        relationship_type: { $ref: "#/components/schemas/RelationshipType" }
        is_legal_guardian: { type: boolean }
        is_emergency_contact: { type: boolean }
        is_authorized_pickup: { type: boolean }

    # --- Phase 1B.5: Student Enrollment administrative surface

    EnrollmentRef:
      type: object
      required: [id, name, code]
      description: A minimal AcademicYear/Campus/GradeLevel/Section reference embedded in an Enrollment row.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }

    EnrollmentSummary:
      type: object
      required: [id, student, academicYear, campus, gradeLevel, section, rollNumber, status, startsOn]
      description: >
        Shared shape for directory rows AND single-record detail (there
        is no broader "full" shape) -- deliberately excludes Student
        dateOfBirth and all Guardian data
        (docs/security/DATA-CLASSIFICATION.md, "minimized default
        visibility"). rollNumber is always a string, never coerced to
        a number (e.g. "007" stays "007").
      properties:
        id: { type: string, format: uuid }
        student: { $ref: "#/components/schemas/StudentSummary" }
        academicYear: { $ref: "#/components/schemas/EnrollmentRef" }
        campus: { $ref: "#/components/schemas/EnrollmentRef" }
        gradeLevel: { $ref: "#/components/schemas/EnrollmentRef" }
        section: { $ref: "#/components/schemas/EnrollmentRef" }
        rollNumber: { type: string }
        status: { type: string, enum: [active, completed, withdrawn, transferred, cancelled] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date, nullable: true }

    Enrollment:
      allOf:
        - { $ref: "#/components/schemas/EnrollmentSummary" }
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    EnrollmentInput:
      type: object
      required: [section_id, roll_number, starts_on]
      description: >
        The Section is the sole authoritative placement input --
        academic_year_id/campus_id/grade_level_id/school_id/student_id
        are never accepted here and are always derived server-side from
        section_id (StudentEnrollmentService::enroll()).
      properties:
        section_id: { type: string, format: uuid }
        roll_number: { type: string, maxLength: 255 }
        starts_on: { type: string, format: date }

    # Phase 8A.14 -- HR read-only transport schemas. Deliberately
    # snake_case property names, UNLIKE every schema above this line --
    # this accurately reflects the REAL, already-committed JSON shape
    # every App\Domain\HR\Application\*::toArray() DTO has produced
    # since 8A.8/8A.9/8A.10/8A.11 (this file is the source of truth for
    # the SHAPE the implementation already has, not a license to
    # rename it to match an unrelated module's casing convention).

    EmployeeDirectoryEntry:
      type: object
      description: Directory-tier only (docs/modules/HR.md "Employee Directory (8A.8)") -- no personal/Restricted/Highly Sensitive field exists on this schema.
      required: [employee_id, employee_number, display_name, position_id, position_name, department_id, department_name, campus_id, campus_name, manager_employee_id, manager_employee_number, manager_display_name]
      properties:
        employee_id: { type: string, format: uuid }
        employee_number: { type: string }
        display_name: { type: string }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }
        manager_employee_id: { type: string, format: uuid, nullable: true }
        manager_employee_number: { type: string, nullable: true }
        manager_display_name: { type: string, nullable: true }

    EmployeeProfileSummary:
      type: object
      required: [employee_id, employee_number, display_name, employee_record_status, user_linked, current_employment_status, position_id, position_name, department_id, department_name, campus_id, campus_name, manager_employee_id, manager_employee_number, manager_display_name]
      properties:
        employee_id: { type: string, format: uuid }
        employee_number: { type: string }
        display_name: { type: string }
        employee_record_status: { type: string, enum: [active, archived] }
        user_linked: { type: boolean }
        current_employment_status: { type: string, nullable: true, enum: [draft, pre_joining, active, notice_period, separated, terminated, retired, deceased] }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }
        manager_employee_id: { type: string, format: uuid, nullable: true }
        manager_employee_number: { type: string, nullable: true }
        manager_display_name: { type: string, nullable: true }

    EmployeeProfilePersonalDetails:
      type: object
      nullable: true
      description: null when the Employee has no EmployeePersonalDetail row -- never an empty object.
      required: [date_of_birth, nationality, marital_status, preferred_language]
      properties:
        date_of_birth: { type: string, format: date, nullable: true }
        nationality: { type: string, nullable: true }
        marital_status: { type: string, nullable: true }
        preferred_language: { type: string, nullable: true }

    EmployeeProfileContact:
      type: object
      nullable: true
      required: [personal_email, personal_phone, alternate_phone]
      properties:
        personal_email: { type: string, nullable: true }
        personal_phone: { type: string, nullable: true }
        alternate_phone: { type: string, nullable: true }

    EmployeeProfileAddress:
      type: object
      required: [id, address_type, address_line1, address_line2, city, state_region, postal_code, country_code]
      properties:
        id: { type: string, format: uuid }
        address_type: { type: string }
        address_line1: { type: string, nullable: true }
        address_line2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state_region: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        country_code: { type: string, nullable: true }

    EmployeeProfileEmergencyContact:
      type: object
      required: [id, name, relationship, phone, alternate_phone, email, is_primary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        relationship: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        alternate_phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        is_primary: { type: boolean }

    EmployeeProfileEmployment:
      type: object
      required: [id, employment_type, starts_on, ends_on, probation_ends_on, status, is_current]
      properties:
        id: { type: string, format: uuid }
        employment_type: { type: string, enum: [permanent, probationary, fixed_term, part_time, temporary, contract, consultant] }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        probation_ends_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draft, pre_joining, active, notice_period, separated, terminated, retired, deceased] }
        is_current: { type: boolean }

    EmployeeProfileAssignment:
      type: object
      required: [id, employment_record_id, is_primary, starts_on, ends_on, is_current, position_id, position_name, department_id, department_name, campus_id, campus_name]
      properties:
        id: { type: string, format: uuid }
        employment_record_id: { type: string, format: uuid }
        is_primary: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        is_current: { type: boolean }
        position_id: { type: string, format: uuid, nullable: true }
        position_name: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        department_name: { type: string, nullable: true }
        campus_id: { type: string, format: uuid, nullable: true }
        campus_name: { type: string, nullable: true }

    EmployeeProfileQualification:
      type: object
      required: [id, qualification_type, qualification_name, specialization, institution, awarding_body, country_code, starts_on, completed_on, grade_or_result, verification_status, verified_at]
      properties:
        id: { type: string, format: uuid }
        qualification_type: { type: string }
        qualification_name: { type: string }
        specialization: { type: string, nullable: true }
        institution: { type: string, nullable: true }
        awarding_body: { type: string, nullable: true }
        country_code: { type: string, nullable: true }
        starts_on: { type: string, format: date, nullable: true }
        completed_on: { type: string, format: date, nullable: true }
        grade_or_result: { type: string, nullable: true }
        verification_status: { type: string, enum: [unverified, verified, rejected] }
        verified_at: { type: string, format: date-time, nullable: true }

    EmployeeProfileExperience:
      type: object
      required: [id, organization, job_title, starts_on, ends_on, description, location, country_code]
      properties:
        id: { type: string, format: uuid }
        organization: { type: string }
        job_title: { type: string, nullable: true }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        country_code: { type: string, nullable: true }

    EmployeeProfileCertification:
      type: object
      required: [id, name, issuer, credential_number, issued_on, expires_on, verification_status, verified_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        issuer: { type: string, nullable: true }
        credential_number: { type: string, nullable: true }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        verification_status: { type: string, enum: [unverified, verified, rejected] }
        verified_at: { type: string, format: date-time, nullable: true }

    EmployeeProfileDocument:
      type: object
      description: >
        Restricted-tier only -- classification_tier is always
        "restricted" on this schema; highly_sensitive documents never
        appear here (see the dedicated sensitive-documents endpoint).
        Deliberately excludes original_filename/mime_type/size_bytes/
        storage_disk/storage_path/uploaded_by_user_id permanently.
      required: [id, category, classification_tier, issued_on, expires_on, status]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        classification_tier: { type: string, enum: [restricted] }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, archived] }

    EmployeeSensitiveDocument:
      type: object
      description: Identical safe shape to EmployeeProfileDocument, but classification_tier is always "highly_sensitive" -- reachable only through the dedicated sensitive-documents endpoint.
      required: [id, category, classification_tier, issued_on, expires_on, status]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        classification_tier: { type: string, enum: [highly_sensitive] }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, archived] }

    EmployeeProfile:
      type: object
      description: >
        The complete Employee Profile Workspace (docs/modules/HR.md
        "Employee Profile Workspace (8A.9)"). Section-level 8A.10
        authorization is enforced server-side before this response is
        built -- an unauthorized section is [] (repeatable) or the
        section is simply not populated beyond what the actor's
        capabilities allow; this schema itself describes the maximal
        shape, not a per-actor guarantee that every field is present.
      required: [summary, personal_details, contact, addresses, emergency_contacts, employment_history, assignments, qualifications, experience, certifications, documents]
      properties:
        summary: { $ref: "#/components/schemas/EmployeeProfileSummary" }
        personal_details: { $ref: "#/components/schemas/EmployeeProfilePersonalDetails" }
        contact: { $ref: "#/components/schemas/EmployeeProfileContact" }
        addresses: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileAddress" } }
        emergency_contacts: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileEmergencyContact" } }
        employment_history: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileEmployment" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileAssignment" } }
        qualifications: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileQualification" } }
        experience: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileExperience" } }
        certifications: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileCertification" } }
        documents: { type: array, items: { $ref: "#/components/schemas/EmployeeProfileDocument" } }

    EmployeeActivityEntry:
      type: object
      description: A disclosure projection over SchoolAuditEvent (docs/modules/HR.md "Audit & Activity Timeline (8A.11)") -- raw audit metadata never appears here.
      required: [id, event_type, category, occurred_at, actor_user_id, actor_display_name, changed_fields]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        category: { type: string, enum: [employee, personal, employment, professional, document, sensitive_access] }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_display_name: { type: string, nullable: true }
        changed_fields: { type: array, items: { type: string } }

  responses:
    TooManyRequests:
      description: >
        Phase 8A.15 -- the caller's School+actor-scoped rate limit
        (`hr-api-reads` 120/min, or `hr-api-sensitive-reads` 20/min for
        the sensitive-documents endpoint) has been exceeded. The same
        global error envelope as every other `/api/v1` error; never a
        cross-School/Highly-Sensitive existence signal.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
