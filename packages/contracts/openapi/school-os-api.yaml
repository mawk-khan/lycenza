      description: >
        Activity Timeline category filter. An unrecognized value is
        treated as no filter, never an error -- rejecting it would
        itself be an authorization side channel (section 30).
      schema: { type: string, enum: [employee, personal, employment, professional, document, sensitive_access] }
    EmployeeOccurredFrom:
      name: occurred_from
      in: query
      required: false
      description: Inclusive lower bound on SchoolAuditEvent.occurred_at (not a domain effective date).
      schema: { type: string, format: date }
    EmployeeOccurredTo:
      name: occurred_to
      in: query
      required: false
      description: Inclusive upper bound on SchoolAuditEvent.occurred_at (not a domain effective date).
      schema: { type: string, format: date }
    RolloverId:
      name: rollover
      in: path
      required: true
      schema: { type: string, format: uuid }
    RolloverMappingId:
      name: mapping
      in: path
      required: true
