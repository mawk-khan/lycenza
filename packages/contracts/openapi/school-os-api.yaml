  /schools/{schoolId}/curriculum-deliveries/{curriculumDeliveryId}/transition:
    post:
      operationId: transitionCurriculumDelivery
      summary: >
        Expected-status compare-and-swap between the two stored states.
        `expected_status` is the status the caller believes the record
        currently holds; if it no longer matches, the transition is
        refused with 409 rather than silently overwriting a colleague's
        change. Completing requires `completed_on`; reopening clears it.
        The only legal edges are in_progress -> completed and completed
        -> in_progress. Remains available after the AcademicYear closes.
        Requires curriculum.delivery.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: curriculumDeliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurriculumDeliveryTransitionInput" }
      responses:
        "200":
          description: Transitioned.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CurriculumDelivery" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking curriculum.delivery.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such CurriculumDelivery in this School.
        "409":
          description: >
            The record's current status is not the supplied
            expected_status -- another transition landed first. Reload
            before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation or domain failure -- a no-op transition, an
            illegal state pair, a missing completion date when
            completing, a future or out-of-year completion date, or a
            completion date earlier than the start date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
