      description: >
        Highly Sensitive -- one EmploymentRecord's on-demand payslip,
        rendered from the frozen payroll_run_results/_lines authority,
        never persisted. Excludes bank details by construction.
        Checkpoint 9.6J: statutory carries the frozen
        payroll_statutory_calculation_results figures for this exact
