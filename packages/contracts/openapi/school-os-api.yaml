      operationId: updateVisitor
      summary: Updates or (de)activates a Visitor directory record. Requires visitor.directory.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/VisitorId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitorInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Visitor" } } }

  /schools/{schoolId}/visitor-visits:
    get:
      operationId: listVisitorVisits
      summary: List Visitor Visits (checked_in by default). Requires visitor.visits.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [checked_in, checked_out] } }
        - { name: visitor_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/VisitorVisit" } } } }
    post:
      operationId: checkInVisitor
      summary: >
        Checks a Visitor into a Campus, with an optional Employee host.
        Requires visitor.visits.manage. Idempotency-Key required -- a
        network retry must never risk a duplicate check-in.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitorVisitInput" }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/VisitorVisit" } } }
        "422":
          description: >
            Visitor not eligible/already checked in, or the host
            Employee is not eligible (VISITOR_NOT_ELIGIBLE /
            VISITOR_ALREADY_CHECKED_IN / VISITOR_HOST_EMPLOYEE_NOT_ELIGIBLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A genuinely concurrent check-in attempt lost the race, or an Idempotency-Key conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /schools/{schoolId}/visitor-visits/{visitorVisitId}:
    get:
      operationId: getVisitorVisit
      summary: Fetch one Visitor Visit. Requires visitor.visits.view.
