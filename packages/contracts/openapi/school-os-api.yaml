    CanteenRecipeRequirementId:
      name: requirement
      in: path
      required: true
      description: CanteenItemInventoryRequirement id.
      schema: { type: string, format: uuid }
    CanteenOrderId:
      name: canteenOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TimetablePeriodId:
      name: timetablePeriodId
