      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/LeaveSettings" } } }
