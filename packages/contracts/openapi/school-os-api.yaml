          description: LATE_FEE_ASSESSMENT_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: LATE_FEE_ASSESSMENT_ALREADY_VOIDED or CHARGE_HAS_PAYMENT_ALLOCATIONS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # Phase 9.8: Payroll HTTP transport, mirroring the Finance section's
  # exact style. Every path below is authorized through the 9.7
  # Administration/Read boundary (App\Domain\Payroll\Application\*AdministrationService /
  # *ReadService) -- never a trusted core service or raw Eloquent model
  # directly. `payroll.compensation.sensitive.*`/`payroll.statutory.manage`
  # are Highly Sensitive/reserved and granted to no default role (see
  # docs/modules/PAYROLL.md "Authorization").
  /schools/{schoolId}/salary-components:
    get:
      operationId: listSalaryComponents
      summary: Lists a School's salary components (policy shape only, never an amount). Requires payroll.structures.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/SalaryComponent" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createSalaryComponent
      summary: Creates a salary component (semantic identity only, no monetary value). Requires payroll.structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalaryComponentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SalaryComponent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/salary-components/{salaryComponentId}/deactivate:
    post:
      operationId: deactivateSalaryComponent
      summary: Deactivates a salary component. Requires payroll.structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/SalaryComponentId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SalaryComponent" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Nonexistent or cross-School id.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/salary-structures:
    get:
      operationId: listSalaryStructures
      summary: Lists a School's salary structure revisions. Requires payroll.structures.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/SalaryStructureSummary" } } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createSalaryStructure
      summary: Creates a new draft salary structure revision. Requires payroll.structures.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalaryStructureInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SalaryStructureSummary" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking payroll.structures.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /schools/{schoolId}/salary-structures/{salaryStructureId}:
    get:
      operationId: getSalaryStructure
      summary: Fetch one salary structure revision with its ordered formula lines. Requires payroll.structures.view.
      parameters:
