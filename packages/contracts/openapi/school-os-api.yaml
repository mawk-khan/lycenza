        units: { type: integer, minimum: 1 }
        reasonCode: { type: string, nullable: true }
        allocationRunId: { type: string, format: uuid, nullable: true }
        reversesEntryId: { type: string, format: uuid, nullable: true }
        leaveRequestId: { type: string, format: uuid, nullable: true }
        yearCloseId: { type: string, format: uuid, nullable: true }
