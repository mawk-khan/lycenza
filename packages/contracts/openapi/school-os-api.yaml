      summary: Lists the immutable historical StockMovement ledger. Requires inventory.stock.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: inventory_item_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: inventory_location_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: movement_type, in: query, required: false, schema: { type: string, enum: [receipt, issue, transfer] } }
