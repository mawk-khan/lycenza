  # --- Phase 0H.2: Student Attendance -------------------------------
  #
  # A deliberately narrow COMMAND surface, never generic CRUD: a
  # register is submitted once, complete, and thereafter only individual
  # records are corrected. There is no Session update/replace/delete
  # operation and no generic AttendanceRecord update operation, by
  # design (docs/modules/ATTENDANCE.md).
  #
  # Attendance is Sensitive-tier (docs/security/DATA-CLASSIFICATION.md).
  # Every schema below is minimised accordingly: a Student is id + roll
  # number + display name ONLY (never date of birth, Guardian data,
  # contact details or address); a teacher is id + fullName ONLY (never
  # work_email/work_phone). No record carries a reason, note, remark,
  # minutes-late, medical explanation or evidence reference of any kind
  # -- `excused` records the generic status and never why.
  /schools/{schoolId}/attendance-sessions:
    get:
      operationId: listAttendanceSessions
      summary: >
        Lists submitted Attendance registers, newest attendance_date
        first then by the register's own immutable period_start_time.
        Fixed page size of 50. Requires attendance.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: section_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: academic_year_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: attendance_date, in: query, required: false, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Page" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AttendanceSessionSummary" } }
                  meta: { $ref: "#/components/schemas/TimetablePaginationMeta" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking attendance.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid query parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: submitAttendanceRegister
      summary: >
        Submits ONE complete class register. The client supplies only
        timetable_entry_id, attendance_date and the record set; the
        entire historical class context (AcademicYear, Campus,
        GradeLevel, Section, SubjectOffering, teacher, Period and the
        Period's wall-clock times) is derived server-side from the
        TimetableEntry while it is held under SELECT ... FOR UPDATE, and
        is immutable thereafter. The submitted record set must match the
        authoritative as-of-date Section roster EXACTLY -- no omission,
        no extra, no partial save, and never an implicit
        default-to-present. Requires attendance.manage, which is
        re-evaluated before any idempotency replay. Idempotency-Key is
        REQUIRED.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceRegisterInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AttendanceSession" } } }
        "400":
          description: Missing or malformed Idempotency-Key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking attendance.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            A register already exists for this TimetableEntry + date
            (ATTENDANCE_SESSION_ALREADY_SUBMITTED), for this Section +
            Period + date (ATTENDANCE_SECTION_SLOT_ALREADY_SUBMITTED),
            or overlapping this Section's wall-clock interval on this
            date (ATTENDANCE_SESSION_TIME_OVERLAP); the AcademicYear is
            not active (ATTENDANCE_ACADEMIC_YEAR_NOT_ACTIVE); or one
            Student has more than one qualifying historical placement
            (STUDENT_ENROLLMENT_AMBIGUOUS_HISTORICAL_PLACEMENT). There
            is no replace-register operation -- correct individual
            records instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation or domain rejection: the TimetableEntry is not
            active, the date's weekday does not match it, the date is in
            the future or outside the AcademicYear, the roster is empty,
            an enrollment id is duplicated, or the register does not
            exactly match the roster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/attendance-sessions/scheduled-classes:
    get:
      operationId: listAttendanceScheduledClasses
      summary: >
        Pre-submission SELECTION helper: the classes scheduled on a
        given date according to the CURRENT weekly Timetable (active
        entries only). Reading current Timetable state is correct here
        and only here -- a historical register is never rendered from
        it. Requires attendance.manage, checked before any query runs.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: attendance_date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AttendanceScheduledClass" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking attendance.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Missing or malformed attendance_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/attendance-sessions/roster-preview:
    get:
      operationId: previewAttendanceRoster
      summary: >
        Non-authoritative roster preview for the marking screen, using
        the SAME Students/SIS as-of-date placement predicate the
        authoritative submission uses. Takes no locks and may go stale;
        submission always re-derives the roster under the Section lock
        and validates the payload against that set. Requires
        attendance.manage, checked before any query runs.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: timetable_entry_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: attendance_date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AttendanceRosterMember" } }
                  meta:
                    type: object
                    required: [timetableEntryId, sectionId, attendanceDate, authoritative]
                    properties:
                      timetableEntryId: { type: string, format: uuid }
                      sectionId: { type: string, format: uuid }
                      attendanceDate: { type: string, format: date }
                      authoritative: { type: boolean, description: "Always false -- this preview may be stale." }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking attendance.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such TimetableEntry in this School.
        "409":
          description: One Student has more than one qualifying historical placement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Missing or malformed query parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/attendance-sessions/{attendanceSessionId}:
    get:
      operationId: getAttendanceSession
      summary: >
        One submitted register, with its complete record set. Every
        class-identity field is rendered from the Session's own
        immutable snapshot; names/codes resolve through those
        snapshotted identities to the referenced entity's CURRENT row.
        Requires attendance.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: attendanceSessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AttendanceSession" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking attendance.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such register in this School.
  /schools/{schoolId}/attendance-records/{attendanceRecordId}/correct:
    post:
      operationId: correctAttendanceRecord
      summary: >
        Corrects ONE already-submitted attendance record using
        expected-status compare-and-swap: the caller states the status
        it believes the record currently holds, and the correction is
        refused if the record has moved since. Deliberately its own
        named command rather than a generic record update. Historical
        corrections stay possible after the AcademicYear closes, after
        the source TimetableEntry is deactivated, and after the Student
        is withdrawn. Requires attendance.manage. No Idempotency-Key is
        needed -- a duplicate delivery fails closed with 409 by
        construction.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: attendanceRecordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceCorrectionInput" }
      responses:
        "200":
          description: Corrected.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AttendanceRecord" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking attendance.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such attendance record in this School.
        "409":
          description: >
            ATTENDANCE_RECORD_STATUS_CHANGED -- the record is no longer
            in expected_status; reload before correcting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Invalid status value, or ATTENDANCE_CORRECTION_NO_OP when
            new_status equals the current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- Phase 0H.3A: Syllabus (Academics) ----------------------------
  #
  # Exactly FOUR operations: list/create nested under the owning
  # SubjectOffering, show/update flat. There is deliberately no delete,
  # no activate and no deactivate operation -- `status` moves through
  # the ordinary PATCH, exactly like every other Academic Structure
  # reference entity (Section, SubjectOffering, Room, Subject,
  # GradeLevel). The entities that DO carry activate/deactivate
  # commands in this API (AcademicYear, TimetablePeriod,
  # TimetableEntry) each re-validate a real invariant on activation; a
  # SyllabusUnit cannot conflict with anything on reactivation because
  # its unique code index is unconditional, so an inactive unit already
  # reserves its code.
  #
  # Capabilities are rooted at `syllabus.*`, NOT `academics.*` -- that
  # root belongs to Academic Structure. See docs/modules/ACADEMICS.md
  # for the Academics -> Syllabus -> `syllabus.*` mapping.
  #
  # A SyllabusUnit is Confidential (docs/security/DATA-CLASSIFICATION.md):
  # School instructional-planning content containing NO personal data.
  # No Student, Guardian, Employee or teacher identity appears in any
  # schema below, and no grading, marks, assignment or submission field
  # exists anywhere -- those belong to Examinations and LMS.
  /schools/{schoolId}/subject-offerings/{subjectOfferingId}/syllabus-units:
    get:
      operationId: listSyllabusUnits
      summary: >
        Lists a SubjectOffering's SyllabusUnits in teaching order
        (sequence, then case-insensitive code as a deterministic
        tie-break). Both required and elective Offerings are supported.
        Requires syllabus.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subjectOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SyllabusUnit" } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking syllabus.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SubjectOffering in this School.
    post:
      operationId: createSyllabusUnit
      summary: >
        Adds one SyllabusUnit to a SubjectOffering. `code` is
        normalized to uppercase before validation and is
        case-insensitively unique WITHIN that Offering -- the same
        normalized code may legitimately exist under a different
        Offering. Requires syllabus.manage. No Idempotency-Key is
        needed: duplicate semantic creation is already prevented by the
        database's own unique index.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: subjectOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyllabusUnitCreateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SyllabusUnit" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking syllabus.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SubjectOffering in this School.
        "422":
          description: >
            Validation failure -- missing/oversized code or title, a
            negative sequence, an out-of-vocabulary status, or a
            case-insensitive duplicate code within this Offering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /schools/{schoolId}/syllabus-units/{syllabusUnitId}:
    get:
      operationId: getSyllabusUnit
      summary: One SyllabusUnit. Requires syllabus.view.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: syllabusUnitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SyllabusUnit" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking syllabus.view in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SyllabusUnit in this School.
    patch:
      operationId: updateSyllabusUnit
      summary: >
        Updates a SyllabusUnit's code, title, sequence and/or status.
        This is ALSO how a unit is retired or reinstated -- `status` is
        an ordinary field here, and there is deliberately no separate
        activate/deactivate operation. A syntactically valid no-op
        returns the current representation. Requires syllabus.manage.
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { name: syllabusUnitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyllabusUnitUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SyllabusUnit" } } }
        "401":
          description: Missing/invalid bearer token.
        "403":
          description: Authenticated but lacking syllabus.manage in this School.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such SyllabusUnit in this School.
        "422":
          description: >
            Validation failure -- oversized code/title, negative
            sequence, out-of-vocabulary status, or a case-insensitive
            duplicate code within this unit's Offering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  # Phase 0I.2 (Learning Content Foundation -- the first concrete LMS
  # fact, ADR 0039). Exactly SIX operations: list/create nested under
  # the owning SubjectOffering, show/update flat, publish/archive as
  # dedicated action routes -- `status` moves ONLY through those two,
  # never through the ordinary PATCH (the CurriculumDelivery-style
  # split, not SyllabusUnit's plain-status-field one).
  #
  # No delete, no Assignment or Submission operation of any kind --
  # those remain future, separately-gated checkpoints.
  #
  # Capabilities are rooted at `lms.content.*`, NOT `academics.*` -- see
  # docs/modules/LMS.md for the module boundary.
  #
  # LearningContent is Confidential (docs/security/DATA-CLASSIFICATION.md):
  # School instructional-resource content containing NO personal data.
  # No Student, Guardian, Employee or teacher identity appears in any
  # schema below, and no grading, marks, assignment or submission field
  # exists anywhere.
  /schools/{schoolId}/subject-offerings/{subjectOfferingId}/learning-content:
    get:
      operationId: listLearningContent
