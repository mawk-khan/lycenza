# Phase 0O.6A (ADR 0052 section 3.9): source secret scan configuration.
# gitleaks' default rules apply unchanged. The allowlist is EXACT-MATCH only:
# every entry names ONE file path and the exact flagged value(s) in it --
# never a directory, a glob, a disabled rule or a production value. Every
# entry is a test literal, a fake canary or prose that the generic rule
# mistakes for a key. Adding an entry is a reviewed change.
# Used by CI (.github/workflows/ci.yml, full git history) and by release
# qualification (infrastructure/release/qualify, the committed tree at /repo).

[extend]
useDefault = true

# Allowlists are scoped to the ONE default rule that raised these false
# positives (generic-api-key). A global [[allowlists]] path would exempt the
# whole file in gitleaks 8.28 even with condition = "AND" -- proven by
# infrastructure/release/tests/test_canary_proof.py -- so none is used.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "apps/platform/app/Models/ApiClient.php: a trait name, not a credential"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/app/Models/ApiClient\.php$''']
regexTarget = "secret"
regexes = ['''^GeneratesUuidV7$''']

[[rules.allowlists]]
description = "apps/platform/tests/Feature/Canteen/CanteenOrderApiTest.php: a test Idempotency-Key literal"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/tests/Feature/Canteen/CanteenOrderApiTest\.php$''']
regexTarget = "secret"
regexes = ['''^place-for-deny-fulfill-001$''']

[[rules.allowlists]]
description = "apps/platform/tests/Feature/HR/EmployeeCertificationTest.php: a test certification number"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/tests/Feature/HR/EmployeeCertificationTest\.php$''']
regexTarget = "secret"
regexes = ['''^DUPLICATE-123$''']

[[rules.allowlists]]
description = "apps/platform/tests/Feature/Inventory/InventoryLifecycleTest.php: a test Idempotency-Key literal"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/tests/Feature/Inventory/InventoryLifecycleTest\.php$''']
regexTarget = "secret"
regexes = ['''^deactivate-no-drain-001$''']

[[rules.allowlists]]
description = "apps/platform/tests/Feature/Hostel/HostelApiTest.php: a test Idempotency-Key literal"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/tests/Feature/Hostel/HostelApiTest\.php$''']
regexTarget = "secret"
regexes = ['''^revoked-assign-001$''']

[[rules.allowlists]]
description = "apps/platform/tests/Feature/Transport/TransportApiTest.php: test Idempotency-Key literals"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/tests/Feature/Transport/TransportApiTest\.php$''']
regexTarget = "secret"
regexes = ['''^denied-route-assign-001$''', '''^revoked-student-assign-001$''']

[[rules.allowlists]]
description = "apps/platform/tests/Unit/Configuration/ProductionConfigurationGuardTest.php: fake canary values the guard test proves are refused and never printed"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/tests/Unit/Configuration/ProductionConfigurationGuardTest\.php$''']
regexTarget = "secret"
regexes = ['''^canary-signing-key-7f3a9c1e5b2d4f6a8c0e$''', '''^scrape-canary-2f6b9d1e4a7c0b3d5e8f1a2c4b6d8e0f$''']

[[rules.allowlists]]
description = "apps/platform/tests/Feature/StudentEnrollment/StudentEnrollmentApiTest.php: test Idempotency-Key literals"
condition = "AND"
paths = ['''^(?:/repo/)?apps/platform/tests/Feature/StudentEnrollment/StudentEnrollmentApiTest\.php$''']
regexTarget = "secret"
regexes = ['''^enroll-malicious-001$''', '''^enroll-duplicate-roll-001$''']

[[rules.allowlists]]
description = "docs/architecture/adr/0048-group-cross-school-reporting-contract.md: prose"
condition = "AND"
paths = ['''^(?:/repo/)?docs/architecture/adr/0048-group-cross-school-reporting-contract\.md$''']
regexTarget = "secret"
regexes = ['''^contributing/unavailable$''']

[[rules.allowlists]]
description = "docs/architecture/DOMAIN-MAP.md: prose"
condition = "AND"
paths = ['''^(?:/repo/)?docs/architecture/DOMAIN-MAP\.md$''']
regexTarget = "secret"
regexes = ['''^capability/permission$''']

[[rules.allowlists]]
description = "docs/operations/README.md: prose"
condition = "AND"
paths = ['''^(?:/repo/)?docs/operations/README\.md$''']
regexTarget = "secret"
regexes = ['''^malicious/incorrect$''']

[[rules.allowlists]]
description = "services/ai/tests/test_structured_logging.py: base64 of the letters A-P, a redaction-test canary"
condition = "AND"
paths = ['''^(?:/repo/)?services/ai/tests/test_structured_logging\.py$''']
regexTarget = "secret"
regexes = ['''^QUJDREVGR0hJSktMTU5PUA==$''', '''^QUJDREVGR0hJSktMTU5PUA$''']
