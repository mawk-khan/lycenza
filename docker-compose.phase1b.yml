# Phase 1B (Student Enrollment & Academic Placement) isolated dev/test
# stack. Local development only. NOT the shared `school-os` project
# (repo-root docker-compose.yml) -- deliberately separate project name,
# host ports, and volumes so this worktree's destructive migration/test
# operations can never collide with the shared stack (already used by
# the primary repo, the Phase 8A HR worktree, and any other concurrent
# phase) or with each other.
#
# Usage:
#   docker compose -f docker-compose.phase1b.yml up -d postgres redis
#   docker compose -f docker-compose.phase1b.yml down          # stop, keep volumes
#   docker compose -f docker-compose.phase1b.yml down -v       # stop + delete this phase's data only
#
# No `minio` service -- Phase 1B.1 touches no file/object storage.

name: school-os-phase1b

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_os
      POSTGRES_USER: school_os
      POSTGRES_PASSWORD: school_os
    ports:
      - "15432:5432"
    volumes:
      - postgres_phase1b_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_os -d school_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_phase1b_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_phase1b_data:
  redis_phase1b_data:
