# Phase 0I.2 (Learning Content Foundation) isolated dev/test stack.
# Local development only. NOT the shared `school-os` project
# (repo-root docker-compose.yml) -- deliberately separate project name,
# host ports, and volumes so this worktree's destructive migration/test
# operations can never collide with the shared stack or any other
# concurrent phase worktree's infrastructure (CLAUDE.md: "Do not
# modify or interfere with ... any other active worktree").
#
# Usage:
#   docker compose -f docker-compose.phase0i2.yml up -d postgres redis
#   docker compose -f docker-compose.phase0i2.yml down          # stop, keep volumes
#   docker compose -f docker-compose.phase0i2.yml down -v       # stop + delete this phase's data only

name: school-os-phase0i2

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: school_os
      MINIO_ROOT_PASSWORD: school_os_secret
    ports:
      - "63900:9000"
      - "63901:9001"
    volumes:
      - minio_phase0i2_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_os
      POSTGRES_USER: school_os
      POSTGRES_PASSWORD: school_os
    ports:
      - "63432:5432"
    volumes:
      - postgres_phase0i2_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_os -d school_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "63379:6379"
    volumes:
      - redis_phase0i2_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_phase0i2_data:
  redis_phase0i2_data:
  minio_phase0i2_data:
