# Phase 0O.4A (ADR 0050 sections 1, 12): the web role's HTTP server --
# serves the built static assets and hands every other request to PHP-FPM
# on loopback. Runs as the image's non-root user on port 8080, behind the
# deployment's TLS-terminating proxy (the only public entry). Security
# headers come from the application (ApplySecurityHeaders), not from here;
# the client address nginx passes on is the proxy's, and Laravel believes
# X-Forwarded-* only from TRUSTED_PROXIES.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    # Phase 0O.8A (ADR 0054): the access log records the requested PATH only
    # (the original request URI up to '?'), never the query string -- a
    # cross-host sign-in ticket travels in one (/session/handoff?ticket=), and
    # nothing an access log needs does. ($uri would show the internal
    # /index.php rewrite instead of the path.)
    map $request_uri $lycenza_request_path {
        "~^(?<path>[^?]*)" $path;
        default "-";
    }
    log_format lycenza '$remote_addr - [$time_local] "$request_method $lycenza_request_path $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /dev/stdout lycenza;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        root /var/www/app/public;
        index index.php;

        # Hashed, immutable Vite assets.
        location /build/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Only the front controller executes PHP.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 60s;
        }

        location ~ \.php$ {
            return 404;
        }

        # Phase 0O.8A (ADR 0054 section 6.2): the custom-domain TLS readiness
        # probe is the one dot-path handed to the application, which answers it
        # only for an eligible custom-domain Host (421/404 otherwise).
        location = /.well-known/lycenza-domain-probe {
            try_files $uri /index.php$is_args$args;
        }

        location ~ /\. {
            deny all;
        }
    }

    # Phase 0O.5A (ADR 0051 §9): the PRIVATE metrics listener. Never routed
    # by the public TLS proxy; the deployment exposes port 9102 only to its
    # metrics collector. It executes exactly one script, which lives outside
    # public/ and has no Laravel route, and marks the request with a
    # FastCGI parameter a client cannot set. The application still requires
    # the bearer scrape token.
    server {
        listen 9102;
        access_log off;

        location = /metrics {
            fastcgi_pass 127.0.0.1:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/app/metrics/index.php;
            fastcgi_param SCRIPT_NAME /metrics;
            fastcgi_param DOCUMENT_ROOT /var/www/app/metrics;
            fastcgi_param LYCENZA_METRICS_LISTENER 1;
            fastcgi_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
