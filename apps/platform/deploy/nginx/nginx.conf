# Phase 0O.4A (ADR 0050 sections 1, 12): the web role's HTTP server --
# serves the built static assets and hands every other request to PHP-FPM
# on loopback. Runs as the image's non-root user on port 8080, behind the
# deployment's TLS-terminating proxy (the only public entry). Security
# headers come from the application (ApplySecurityHeaders), not from here;
# the client address nginx passes on is the proxy's, and Laravel believes
# X-Forwarded-* only from TRUSTED_PROXIES.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        root /var/www/app/public;
        index index.php;

        # Hashed, immutable Vite assets.
        location /build/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Only the front controller executes PHP.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 60s;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
