; Phase 0O.4A (ADR 0050 section 12): production PHP settings for the
; application image. OPcache on with timestamp validation off (the image is
; immutable); errors logged, never displayed.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
session.use_strict_mode = 1
; Phase 0O.5A (ADR 0051 §6.3): stack traces never carry argument values
; (the log pipeline also never renders them -- defence in depth).
zend.exception_ignore_args = On
