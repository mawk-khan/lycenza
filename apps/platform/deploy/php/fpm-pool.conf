; Phase 0O.4A: the PHP-FPM pool of the production web role. The master runs
; as the image's non-root user (www-data), so no user/group directives.
; Listens on loopback only -- nginx in the same container is its only
; client. Environment variables stay visible to PHP (clear_env = no, as the
; official image sets) because configuration is injected that way.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
ping.path = /fpm-ping
