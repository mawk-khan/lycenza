name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default; individual jobs can widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Phase 0O.6A (ADR 0052 section 3.9): the pinned gitleaks image (the
      # same digest release qualification uses) with the repository's
      # exact-match allowlist (.gitleaks.toml); no third-party action and no
      # token.
      - name: gitleaks (pinned image, repository allowlist)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  # Phase 0O.6A (ADR 0052 section 3.15, "PR CI subset"): lockfile integrity,
  # language audits (reported, never auto-fixed), the release tooling's own
  # tests -- no release or registry credential exists anywhere in CI.
  supply-chain:
    name: Supply chain (lockfiles, audits, release tooling)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Release tooling tests (policy, exceptions, evaluator, scans, provenance, verify-artifact)
        working-directory: infrastructure/release
        run: python3 -B -m unittest discover -s tests -v
      - name: Lockfile integrity (composer validate --strict, npm ci --dry-run, pip-compile freshness)
        run: |
          infrastructure/release/qualify init --out "$RUNNER_TEMP/supply-chain"
          infrastructure/release/qualify inputs --out "$RUNNER_TEMP/supply-chain"
      - name: Language audits (composer audit, npm audit, pip-audit; report only)
        run: infrastructure/release/qualify audit --out "$RUNNER_TEMP/supply-chain"

  production-images:
    name: Production images (build + verify-images.sh; never pushed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: infrastructure/docker/production/verify-images.sh --build

  platform:
    name: Laravel (apps/platform)
    runs-on: ubuntu-24.04
    services:
      # Bootstrap superuser only -- the school_os_app runtime role
      # (ADR 0021) is created by the "Provision database roles" step
      # below, mirroring infrastructure/docker/postgres/init/*.sql
      # exactly, so CI re-verifies the same role separation local dev
      # runs under, not a weaker CI-only shortcut.
      # Same bootstrap database as docker-compose (school_os); the test
      # database is created by 02-create-test-database.sh below, in the
      # same order the local init scripts run (Phase 0O.1: 01-roles.sql
      # grants on school_os, which previously did not exist here).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_os
          POSTGRES_USER: school_os
          POSTGRES_PASSWORD: school_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school_os -d school_os"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, bcmath, zip, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/platform/vendor
          key: composer-${{ hashFiles('apps/platform/composer.lock') }}

      # From composer.lock only; no Composer plugin runs (ADR 0052 section 3.5).
      - run: composer install --no-interaction --prefer-dist --no-plugins

      - run: cp .env.example .env
      - run: php artisan key:generate

      - name: Provision database roles and the test database (ADR 0021, ADR 0024)
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: school_os
          POSTGRES_USER: school_os
          POSTGRES_DB: school_os
        run: |
          psql -U school_os -d school_os -v ON_ERROR_STOP=1 \
            -f ../../infrastructure/docker/postgres/init/01-roles.sql
          bash ../../infrastructure/docker/postgres/init/02-create-test-database.sh
          psql -U school_os -d school_os -v ON_ERROR_STOP=1 \
            -f ../../infrastructure/docker/postgres/init/03-test-database-roles.sql

      - name: Migrate test database via the admin connection
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: school_os_test
          DB_USERNAME: school_os_app
          DB_PASSWORD: school_os_app_local_only_password
          DB_ADMIN_USERNAME: school_os
          DB_ADMIN_PASSWORD: school_os
        run: php artisan migrate --database=pgsql_admin --force

      - name: Seed capability/role catalog
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: school_os_test
          DB_USERNAME: school_os_app
          DB_PASSWORD: school_os_app_local_only_password
          # SR.1 (ADR 0071 §11): the catalogue is written through pgsql_admin.
          DB_ADMIN_USERNAME: school_os
          DB_ADMIN_PASSWORD: school_os
        run: php artisan db:seed --class=CapabilityAndRoleSeeder --force

      - name: Pint (formatting)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - run: npm ci
      - name: TypeScript type-check
        run: npm run type-check
      - name: ESLint
        run: npm run lint
      - name: Prettier (formatting)
        run: npm run format:check
      - name: Frontend build (produces Vite manifest for Inertia tests)
        run: npm run build

      - name: PHPUnit
        env:
          # Runtime connection deliberately uses school_os_app (ADR
          # 0021), never the school_os superuser -- see ADR 0024.
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: school_os_test
          DB_USERNAME: school_os_app
          DB_PASSWORD: school_os_app_local_only_password
          DB_ADMIN_USERNAME: school_os
          DB_ADMIN_PASSWORD: school_os
          # E21-RH.2 (ADR 0066): the dedicated retention identity, created by
          # 01-roles.sql above (phpunit.xml forces the same local-only values).
          DB_RETENTION_USERNAME: school_os_retention
          DB_RETENTION_PASSWORD: school_os_retention_local_only_password
          REDIS_HOST: 127.0.0.1
          # phpunit.xml force="true"s DB_HOST to the docker-compose
          # service alias; CI's service container is on 127.0.0.1, so it
          # redirects the connection target explicitly (tests/bootstrap.php).
          PHPUNIT_DB_HOST: 127.0.0.1
        run: php artisan test

  ai-service:
    name: AI Gateway (services/ai)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (type-check)
        run: mypy app

      - name: pytest
        run: pytest -q

  mobile:
    name: Flutter (apps/mobile)
    runs-on: ubuntu-24.04
    # NOTE: this job's correctness has NOT been verified locally — the
    # Flutter SDK was unavailable in the environment this repo was
    # scaffolded in. Verify on first real change to apps/mobile.
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  shared-types:
    name: Contracts -> shared TypeScript types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/shared-types/package-lock.json

      - run: npm ci
      - name: Regenerate types and fail on drift
        run: |
          npm run generate
          git diff --exit-code -- src/generated
      - run: npm run type-check
