name: CI

# E03.1 (ADR 0072): a candidate is pushed to integration/** and validated on
# its exact SHA; only that SHA is then fast-forwarded to main. The required
# context for main (E03.2) is the aggregate `CI gate` job at the end of this
# file -- individual jobs are never branch-rule requirements.
on:
  push:
    branches: [main, "integration/**"]
  pull_request:

# Least-privilege by default; individual jobs can widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ONE central path classifier (infrastructure/ci/lycenza_ci/classify.py):
  # it alone decides which lanes this candidate requires. Unknown paths, the
  # CI definition and this tooling require every lane (fail closed).
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      lanes: ${{ steps.classify.outputs.lanes }}
      base: ${{ steps.classify.outputs.base }}
      strict: ${{ steps.classify.outputs.strict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          infrastructure/ci/lycenza-ci classify --event "$EVENT" --ref "$REF"
          --before "$BEFORE" --pr-base "$PR_BASE" --main-ref origin/main

  secrets-scan:
    name: Secrets scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Phase 0O.6A (ADR 0052 section 3.9): the pinned gitleaks image (the
      # same digest release qualification uses) with the repository's
      # exact-match allowlist (.gitleaks.toml); no third-party action and no
      # token.
      - name: gitleaks (pinned image, repository allowlist)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  # Phase 0O.6A (ADR 0052 section 3.15, "PR CI subset"): lockfile integrity,
  # language audits (never auto-fixed), the release tooling's own tests -- no
  # release or registry credential exists anywhere in CI. E03.1 (ADR 0072
  # section 13): the audits are decided by the release policy evaluator, so a
  # Critical, a High with a fix, or an invalid/expired exception decision
  # fails this job and therefore the `CI gate`.
  supply-chain:
    name: Supply chain (lockfiles, audits, release tooling)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the gitleaks history-allowlist guard reads commit 2c92af358.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release tooling tests (policy, exceptions, evaluator, scans, provenance, verify-artifact)
        working-directory: infrastructure/release
        run: python3 -B -m unittest discover -s tests -v
      - name: Lockfile integrity (composer validate --strict, npm ci --dry-run, pip-compile freshness)
        run: |
          infrastructure/release/qualify init --out "$RUNNER_TEMP/supply-chain"
          infrastructure/release/qualify inputs --out "$RUNNER_TEMP/supply-chain"
      - name: Language audits (composer audit, npm audit, pip-audit; blocking findings fail)
        run: infrastructure/release/qualify audit --fail-on-blocking --out "$RUNNER_TEMP/supply-chain"

  integrity:
    name: Repository integrity (whitespace, CI tooling tests)
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI tooling tests (classifier, gate, publication check, drift check)
        run: python3 -B -m unittest discover -s infrastructure/ci/tests -v
      # The candidate's own changes, as /publish-gate checks them; with no
      # usable base, the newest commit.
      - name: Whitespace (git diff --check)
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: git diff --check "${BASE:-HEAD^}" HEAD

  production-images:
    name: Production images (build + verify-images.sh; never pushed)
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.lanes), 'images')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: infrastructure/docker/production/verify-images.sh --build

  # The `platform` lane is three jobs (CI sharding Option A, owner-selected
  # 2026-10-13; ADR 0072 section 31): the static checks, the canonical suite in
  # parallel shards, and the cross-shard coverage proof. The gate requires all
  # three. Shard membership is deterministic (lycenza_ci/shard.py) and the
  # shard count is the matrix below -- nothing else.
  platform-static:
    name: Laravel static checks (frontend, Pint, Larastan)
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.lanes), 'platform')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAFE_TEST_COMPOSE_OVERRIDE: ${{ github.workspace }}/infrastructure/ci/compose.s3-versitygw.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Environment files first (the inert committed examples; ADR 0016)
        run: |
          cp apps/platform/.env.example apps/platform/.env
          cp services/ai/.env.example services/ai/.env
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/platform/vendor
          key: platform-vendor-${{ hashFiles('apps/platform/composer.lock') }}
      - name: Build the canonical platform image
        run: docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" build platform
      - name: Composer install, package discovery, application key
        run: |
          compose_run() { docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" run --rm --no-deps -T platform "$@"; }
          compose_run composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          compose_run php artisan package:discover --ansi
          compose_run php artisan key:generate --ansi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Frontend (npm ci, type-check, ESLint, Prettier, build)
        working-directory: apps/platform
        run: |
          npm ci
          npm run type-check
          npm run lint
          npm run format:check
          npm run build
      - name: Pint (formatting)
        run: docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" run --rm --no-deps -T platform vendor/bin/pint --test
      # ORG.7D-3 (ADR 0076 §39.9): 768M, CI only, owner-authorized after a
      # second parallel-worker crash at 512M (ORG.7D-1, ORG.7D-3). The local
      # documented gate stays 512M.
      - name: Larastan (static analysis)
        run: docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" run --rm --no-deps -T platform vendor/bin/phpstan analyse --memory-limit=768M --no-progress

  # E03.1 (ADR 0072 sections 9, 11): the canonical runner itself. The suite
  # runs exactly as a developer's `bin/safe-test` runs it -- the same Compose
  # stack (docker-compose.yml), the same platform image
  # (infrastructure/docker/platform.Dockerfile), the same fail-closed
  # environment overrides, `platform:test-db-reset` with the full seed set,
  # and the full PHPUnit configuration -- with one declared difference: the
  # S3-compatible server is versitygw, because MinIO's public images are gone
  # (infrastructure/ci/compose.s3-versitygw.yml).
  #
  # Option A (ADR 0072 section 31): every shard runs on its OWN runner, with
  # its own Compose stack, PostgreSQL volume (reset + full seed set), Valkey,
  # S3 server and filesystem -- nothing mutable is shared between shards.
  # `bin/safe-test --shard N/TOTAL` plans from the canonical inventory and the
  # shard's JUnit report must equal its plan exactly. fail-fast is off so every
  # shard reports; any red, cancelled or timed-out leg makes the matrix result
  # (needs.platform.result) non-success, which fails the `CI gate`.
  platform:
    name: Laravel (apps/platform) shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.lanes), 'platform')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SAFE_TEST_COMPOSE_OVERRIDE: ${{ github.workspace }}/infrastructure/ci/compose.s3-versitygw.yml
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The environment files exist BEFORE anything can boot Laravel (Compose
      # also requires every env_file docker-compose.yml names). Composer
      # used to run `artisan package:discover` before .env existed, so the
      # application booted with no APP_ENV, treated itself as production, and
      # ProductionConfigurationGuard (correctly) refused to start.
      - name: Environment files first (the inert committed examples; ADR 0016)
        run: |
          cp apps/platform/.env.example apps/platform/.env
          cp services/ai/.env.example services/ai/.env

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/platform/vendor
          key: platform-vendor-${{ hashFiles('apps/platform/composer.lock') }}

      - name: Build the canonical platform image
        run: docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" build platform

      # From composer.lock only, no plugin and no script (ADR 0052 section
      # 3.5, rule 87); package discovery then runs explicitly, as the
      # production image does.
      - name: Composer install, package discovery, application key
        run: |
          compose_run() { docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" run --rm --no-deps -T platform "$@"; }
          compose_run composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          compose_run php artisan package:discover --ansi
          compose_run php artisan key:generate --ansi

      # The suite reads the Vite manifest; the frontend checks themselves run
      # once, in platform-static.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Frontend build (npm ci, build -> Vite manifest)
        working-directory: apps/platform
        run: |
          npm ci
          npm run build

      - name: Reset the test database (platform:test-db-reset, full seed set)
        run: apps/platform/bin/safe-test --reset-db

      # Parity evidence (ADR 0072 section 11), readable through the public
      # check-run annotations API.
      - name: Runtime identity
        run: |
          dc() { docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" "$@"; }
          php="$(dc exec -T platform php -r 'echo PHP_VERSION, " ", implode(",", get_loaded_extensions()), " tz=", date_default_timezone_get(), " locale=", setlocale(LC_ALL, 0);')"
          pg="$(dc exec -T postgres postgres --version)"
          kv="$(dc exec -T redis valkey-server --version | cut -d' ' -f1-3)"
          s3="$(docker inspect --format '{{.Config.Image}}' "$(dc ps -q minio)")"
          echo "::notice title=Runtime identity::php ${php} | ${pg} | ${kv} | s3 ${s3}"

      # Reproduce locally: apps/platform/bin/safe-test --shard <N>/<TOTAL>.
      - name: PHPUnit -- the canonical suite, this shard (bin/safe-test --shard)
        run: |
          set -o pipefail
          apps/platform/bin/safe-test --shard "$SHARD" --log-junit storage/logs/phpunit-junit.xml 2>&1 | tee "$RUNNER_TEMP/phpunit.log"

      # The counts and peak memory, readable through the public check-run
      # annotations API.
      - name: PHPUnit summary
        if: always()
        run: |
          summary="$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/phpunit.log" 2>/dev/null | grep -E '^(OK \(|Tests: |FAILURES!|ERRORS!|Time: )' | tr '\n' ' ' || true)"
          echo "::notice title=PHPUnit summary (shard ${SHARD})::${summary:-no PHPUnit summary (the shard did not finish)}"
          failed="$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/phpunit.log" 2>/dev/null | grep -E '^[0-9]+\) Tests\\' | head -40 | tr '\n' ' ' || true)"
          if [ -n "$failed" ]; then echo "::error title=PHPUnit failed tests (shard ${SHARD}; reproduce: apps/platform/bin/safe-test --shard ${SHARD})::${failed}"; fi

      - name: Shard executed exactly its plan
        run: |
          out="$RUNNER_TEMP/shard-out"
          mkdir -p "$out"
          infrastructure/ci/lycenza-ci shard verify --plan apps/platform/storage/logs/phpunit-shard-plan.json \
            --junit apps/platform/storage/logs/phpunit-junit.xml --report-out "$out/shard-report.json"
          cp apps/platform/storage/logs/phpunit-list.xml apps/platform/storage/logs/phpunit-junit.xml "$out/"

      - name: Upload the shard's plan, inventory and JUnit report (for platform-coverage)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phpunit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-out
          if-no-files-found: error
          retention-days: 7

  # Option A (ADR 0072 section 31): the union of the shards is the canonical
  # suite, proven per run -- every shard 1..TOTAL reported, all planned from
  # one identical inventory, each ran exactly its deterministic membership,
  # and together every inventory test case ran exactly once. Missing shard
  # output fails it. Its union digest is comparable with an unsharded run's.
  platform-coverage:
    name: Laravel shard coverage (union = canonical suite)
    needs: [classify, platform]
    if: contains(fromJSON(needs.classify.outputs.lanes), 'platform')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: infrastructure/ci
      - name: Download every shard's output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: phpunit-shard-*
          path: ${{ runner.temp }}/shards
      - name: The shards cover the canonical inventory exactly once
        run: infrastructure/ci/lycenza-ci shard coverage --dir "$RUNNER_TEMP/shards"

  # E03.1 (ADR 0072 section 12): the docs lane is never "run nothing". It
  # runs the PHPUnit tests that read docs/** (group `repository-documents`;
  # infrastructure/ci/tests keeps the group exhaustive) on the same canonical
  # stack. gitleaks, whitespace and the release tooling tests (whose decision
  # records live in docs/security) run for every candidate anyway.
  docs-guards:
    name: Documentation guards (PHPUnit repository-documents)
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.lanes), 'docs')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAFE_TEST_COMPOSE_OVERRIDE: ${{ github.workspace }}/infrastructure/ci/compose.s3-versitygw.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Environment files first (the inert committed examples; ADR 0016)
        run: |
          cp apps/platform/.env.example apps/platform/.env
          cp services/ai/.env.example services/ai/.env
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/platform/vendor
          key: platform-vendor-${{ hashFiles('apps/platform/composer.lock') }}
      - name: Build the canonical platform image
        run: docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" build platform
      - name: Composer install, package discovery, application key
        run: |
          compose_run() { docker compose -p school-os -f docker-compose.yml -f "$SAFE_TEST_COMPOSE_OVERRIDE" run --rm --no-deps -T platform "$@"; }
          compose_run composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          compose_run php artisan package:discover --ansi
          compose_run php artisan key:generate --ansi
      - name: Reset the test database (platform:test-db-reset, full seed set)
        run: apps/platform/bin/safe-test --reset-db
      - name: PHPUnit -- documentation guards
        run: |
          set -o pipefail
          apps/platform/bin/safe-test --group repository-documents 2>&1 | tee "$RUNNER_TEMP/phpunit.log"
          summary="$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/phpunit.log" | grep -E '^(OK \(|Tests: )' | tr '\n' ' ' || true)"
          echo "::notice title=PHPUnit summary (repository-documents)::${summary}"

  ai-service:
    name: AI Gateway (services/ai)
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.lanes), 'gateway')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (type-check)
        run: mypy app

      - name: pytest
        run: pytest -q

  # E03.1 (ADR 0072 section 8): verified with Flutter 3.44.0 (analyze: no
  # issues; the widget test passes). The mobile lane runs for apps/mobile/**
  # changes and strict candidates; it is skipped, by the classifier only, for
  # unrelated changes. The SDK version is pinned so a new stable release
  # cannot silently change the analyzer under an unchanged candidate.
  mobile:
    name: Flutter (apps/mobile)
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.lanes), 'mobile')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  shared-types:
    name: Contracts -> shared TypeScript types
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.lanes), 'shared_types')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/shared-types/package-lock.json

      - run: npm ci
      - name: Regenerate types and fail on drift
        run: |
          npm run generate
          git diff --exit-code -- src/generated
      - run: npm run type-check

  # E03.1 (ADR 0072 sections 4-6): the ONE required context for main (E03.2).
  # Its name is unchanged by sharding (ADR 0072 section 31): the shard legs are
  # never required contexts. It always runs, depends on every job above, and passes only when every
  # lane the classifier requires succeeded and every other lane was skipped --
  # nothing else (gate.py). A cancelled, failed or unexpectedly skipped job,
  # or a classifier failure, fails it.
  gate:
    name: CI gate
    if: always()
    needs:
      - classify
      - secrets-scan
      - supply-chain
      - integrity
      - production-images
      - platform-static
      - platform
      - platform-coverage
      - docs-guards
      - ai-service
      - shared-types
      - mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: infrastructure/ci
      - name: Every required lane succeeded; only classifier-sanctioned skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: infrastructure/ci/lycenza-ci gate
